all:
  children:
    # `firefly` is ff-pi1 ONLY, and must stay that way. A dozen playbooks target
    # `hosts: firefly` to manage docker, pihole, nginx, pivpn and so on — widening
    # this group would silently run every one of them against the k3s agents too.
    firefly:
      hosts:
        192.168.19.10:
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_user: caleb
        ansible_ssh_private_key_file: ~/.ssh/id_rsa

    # The whole k3s fleet, added 2026-08-07. Previously only the control plane was
    # in the inventory at all, which is why `firefly-node-labels.yaml` could reapply
    # labels through the API but could not touch the agents' own k3s config — the
    # durability gap cleanup.md flags. A separate group rather than children of
    # `firefly`, for the reason above.
    #
    # Split server/agents because the k3s SERVER is the only host with a kubeconfig
    # at /etc/rancher/k3s/k3s.yaml, so anything invoking `k3s kubectl` has to target
    # firefly_cluster_server.
    #
    # The OCI pair is reached over the site-to-site link on 192.168.223.0/24 and runs
    # the stock Ubuntu cloud image, so it logs in as `ubuntu`, not `caleb`.
    firefly_cluster:
      children:
        firefly_cluster_server:
        firefly_cluster_agents:
      vars:
        ansible_python_interpreter: /usr/bin/python3

    firefly_cluster_server:
      hosts:
        192.168.19.10: # ff-pi1 — arm64 control plane + etcd
          k3s_node_name: ff-pi1
          k3s_role: system
          k3s_tier: on-prem
          ansible_ssh_user: caleb

    firefly_cluster_agents:
      vars:
        ansible_ssh_private_key_file: ~/.ssh/id_rsa
      hosts:
        192.168.19.13: # ff-vm1 — amd64 on-prem worker (Proxmox guest)
          k3s_node_name: ff-vm1
          k3s_role: worker
          k3s_tier: on-prem
          ansible_ssh_user: caleb
        192.168.223.71: # ff-oci1 — arm64 OCI Ampere
          k3s_node_name: ff-oci1
          k3s_role: worker
          k3s_tier: native-cloud
          ansible_ssh_user: ubuntu
        192.168.223.72: # ff-oci2 — arm64 OCI Ampere
          k3s_node_name: ff-oci2
          k3s_role: worker
          k3s_tier: native-cloud
          ansible_ssh_user: ubuntu

    mikrotik:
      hosts:
        192.168.19.1:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: community.routeros.routeros
        ansible_ssh_user: admin
        ansible_ssh_private_key_file: ~/.ssh/id_rsa

    # Legacy single-host group, kept as-is because server-k3s-bootstrap.yaml and
    # server-k3s-fluxcd-reconcile.yaml target it. Note 192.168.69.112 is
    # fh-system-vm2, one of the three control-plane VMs — see the
    # franklinhouse_* groups below for the full cluster.
    franklin:
      hosts:
        192.168.69.112:
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_user: caleb
        ansible_ssh_private_key_file: ~/.ssh/id_rsa

    # --- franklinhouse k3s cluster (folded in from calebsargeant/infra-v2) ---
    # Full topology, including which Proxmox host each VM lives on, is in
    # docs/reference/franklinhouse.md. One control-plane VM per Proxmox host, so
    # losing a host loses a control-plane node.
    franklinhouse_control_plane:
      hosts:
        192.168.69.111:   # fh-system-vm1 (VM 100, Proxmox node1)
        192.168.69.112:   # fh-system-vm2 (VM 101, Proxmox node2)
        192.168.69.113:   # fh-system-vm3 (VM 102, Proxmox node3)
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_user: caleb
        ansible_ssh_private_key_file: ~/.ssh/id_rsa

    franklinhouse_workers:
      hosts:
        192.168.69.121:   # fh-worker-vm1 (VM 103, Proxmox node1)
        192.168.69.122:   # fh-worker-vm2 (VM 104, Proxmox node2)
        192.168.69.123:   # fh-worker-vm3 (VM 105, Proxmox node3)
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_user: caleb
        ansible_ssh_private_key_file: ~/.ssh/id_rsa

    franklinhouse:
      children:
        franklinhouse_control_plane:
        franklinhouse_workers:

    # Proxmox hypervisors. No playbook targets these today — they are recorded
    # here so the inventory reflects reality. They authenticate as root with a
    # PASSWORD (1Password item "Proxmox", Firefly vault); SSH keys are not
    # authorised on them, so ansible_ssh_private_key_file is deliberately absent.
    franklinhouse_proxmox:
      hosts:
        192.168.69.211:   # node1
        192.168.69.212:   # node2
        192.168.69.213:   # node3
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_user: root
