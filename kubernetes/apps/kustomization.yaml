apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # automation
  - ./atlantis
  - ./browserless
  - ./github-runner
  - ./hermes
  - ./homeassistant
  - ./homebridge
  # git-pull-request-dashboard removed 2026-08-07 per cleanup.md — GitHub's own PR
  # views cover it. Its Flux Kustomization owned six objects, all in `automation`:
  # the dashboard Deployment/Service, its github-oauth ExternalSecret, AND the
  # oauth2-proxy Deployment/Service/ExternalSecret that fronted it. So this single
  # removal also retires the `automation/oauth2-proxy` instance that cleanup.md
  # lists separately for migration to authentik — there is nothing left for it to
  # front, which makes it a deletion rather than a migration.
  - ./litellm
  # PARKED — fleet-shared memory (mem0 on shared CNPG pgvector, via LiteLLM). The Database
  # CRs + pgvector bootstrap Job are safe to reconcile early; the mem0 pod fails closed if
  # the image or the vault entries are missing.
  #   [done] ghcr.io/magmamoose/mem0-server:latest is built and PUBLIC — the org package
  #          inherited this public repo's visibility, verified with an anonymous manifest
  #          GET returning 200. Now MULTI-ARCH (amd64+arm64): the image is built from
  #          upstream source instead of the arm64-only mem0/mem0-api-server, which is what
  #          lets the Deployment sit on-prem beside its Postgres.
  #   [done] LiteLLM has the text-embedding-3-small / gpt-4o-mini entries loaded — the
  #          entries have been in the ConfigMap since 2026-08-03 and both litellm pods
  #          restarted 2026-08-22, after it. (LiteLLM reads its YAML at startup only, so
  #          this was a real prerequisite; it is simply already satisfied.)
  #   [PENDING] Two OCI Vault entries, both absent today (checked: the vault holds 162
  #          secrets, none matching mem0-*). Without them the ExternalSecret never
  #          populates and the pod cannot start — deliberately, since the alternative is
  #          the fleet's memory running unauthenticated:
  #             mem0-admin-api-key   the X-API-Key every caller presents
  #             mem0-jwt-secret      required at import even though the JWT flow is unused
  #          Generate each with `openssl rand -base64 48`.
  # Then uncomment. See kubernetes/apps/mem0/README.md.
  # - ./mem0
  - ./n8n
  - ./n8n-mcp
  - ./renovate
  # magmamoose products (open-core; external-repo + image automation)
  # Dün Mir Pro. The only PRIVATE source repo in this group — its GitRepository
  # needs github-app-magmamoose for read access, not just rate-limit headroom.
  # Migrated off Cloudflare Workers (Workers Free caps CPU at 10ms; Pro's PBKDF2
  # login costs ~190ms), so the cluster is now the only place it runs.
  - ./dunmir-pro
  - ./github-contributions
  - ./github-timesheet
  - ./github-usage-dashboard
  - ./nievah
  # OpenHands V1 autonomous-coding engine; selected explicitly by Nievah's harness config.
  - ./openhands
  # Quarry — consolidates github-timesheet and github-contributions into one
  # engine with three reports (Uren, Throughput, Billing). Both of the apps it
  # supersedes are still listed above and still running; retiring them is a
  # separate decision, and their OCI Vault entries are now read by Quarry too.
  - ./quarry
  # tengen-systems products (private repo; OCI-published charts, not a GitRepository)
  #
  # janeway splits the two: the CHART comes from MagmaMoose/charts (public, same
  # org, no pull credential) while the IMAGE comes from
  # ghcr.io/tengen-systems/janeway (private, other org, needs one).
  - ./janeway
  - ./platform2
  # personal finance — FNB to YNAB sync. Replaced buxfer-sync and the Buxfer
  # subscription, both now gone. Same shape as platform2: OCI-published chart,
  # not a GitRepository.
  - ./finance
  # backup
  - ./timemachine
  # miscellaneous (dashboard)
  - ./headlamp
  # media
  - ./bazarr
  - ./flaresolverr
  - ./nzbhydra2
  - ./overseerr
  - ./plex
  - ./prowlarr
  - ./qbittorrent
  - ./radarr
  - ./recyclarr
  - ./sabnzbd
  - ./sonarr
  - ./streaming-sync
  # miscellaneous
  - ./excalidraw
  - ./nextcloud
  - ./syncthing
  - ./wordpress
  # observability
  - ./blackbox-exporter
  - ./blackbox-exporter-oci
  - ./fluent-bit
  - ./holmesgpt
  - ./krr
  - ./kube-prometheus-stack
  - ./loki
  - ./thanos-compactor
  - ./thanos-query
  - ./thanos-store
  # platform (node-level tuning)
  - ./node-tuning
  # progressive delivery
  - ./flagger
  # identity (SSO)
  - ./authentik
  # security
  - ./defectdojo
  - ./dependency-track
  - ./falco
  - ./kyverno-policies
  - ./security-integrations
  - ./sonarqube
  - ./trivy-operator
  # external-repo apps (workload manifests live in their own GitHub repos;
  # each dir holds only the in-cluster Flux plumbing — source, image
  # automation, namespace, and the Flux Kustomization that pulls the workload)
  - ./deskbird-booking
  - ./fortivpn-gateway
