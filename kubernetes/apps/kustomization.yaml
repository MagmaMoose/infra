apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # automation
  - ./browserless
  - ./github-runner
  - ./hermes
  - ./homeassistant
  - ./homebridge
  # git-pull-request-dashboard removed 2026-08-07 per cleanup.md — GitHub's own PR
  # views cover it. Its Flux Kustomization owned six objects, all in `automation`:
  # the dashboard Deployment/Service, its github-oauth ExternalSecret, AND the
  # oauth2-proxy Deployment/Service/ExternalSecret that fronted it. So this single
  # removal also retires the `automation/oauth2-proxy` instance that cleanup.md
  # lists separately for migration to authentik — there is nothing left for it to
  # front, which makes it a deletion rather than a migration.
  - ./litellm
  # Fleet-shared memory: mem0 on shared CNPG pgvector, LLM + embeddings via LiteLLM.
  # See kubernetes/apps/mem0/README.md.
  - ./mem0
  - ./n8n
  - ./n8n-mcp
  - ./renovate
  # magmamoose products (open-core; external-repo + image automation)
  # Dün Mir Pro. The only PRIVATE source repo in this group — its GitRepository
  # needs github-app-magmamoose for read access, not just rate-limit headroom.
  # Migrated off Cloudflare Workers (Workers Free caps CPU at 10ms; Pro's PBKDF2
  # login costs ~190ms), so the cluster is now the only place it runs.
  - ./dunmir
  - ./github-contributions
  - ./github-timesheet
  - ./github-usage-dashboard
  - ./nievah
  # OpenHands V1 autonomous-coding engine; selected explicitly by Nievah's harness config.
  - ./openhands
  # Quarry — consolidates github-timesheet and github-contributions into one
  # engine with three reports (Uren, Throughput, Billing). Both of the apps it
  # supersedes are still listed above and still running; retiring them is a
  # separate decision, and their OCI Vault entries are now read by Quarry too.
  - ./quarry
  # tengen-systems products (private repo; OCI-published charts, not a GitRepository)
  #
  # janeway splits the two: the CHART comes from MagmaMoose/charts (public, same
  # org, no pull credential) while the IMAGE comes from
  # ghcr.io/tengen-systems/janeway (private, other org, needs one).
  - ./janeway
  - ./platform2
  # personal finance — FNB to YNAB sync. Replaced buxfer-sync and the Buxfer
  # subscription, both now gone. Same shape as platform2: OCI-published chart,
  # not a GitRepository.
  - ./finance
  # AFAS expense claims — classifies office/home days from the calendar, asks
  # for approval in Slack over Socket Mode, and files the monthly claim in AFAS
  # InSite with a headless browser. Same shape as finance: an OCI-published
  # chart from the app's own public repo, not a GitRepository. Every
  # employer-identifying value is an OCI Vault entry rather than a HelmRelease
  # value, because this repo is public — see the app's externalsecret.yaml.
  - ./afas-declaraties
  # backup
  - ./timemachine
  # miscellaneous (dashboard)
  - ./headlamp
  # media
  - ./bazarr
  - ./flaresolverr
  - ./nzbhydra2
  - ./overseerr
  - ./plex
  - ./prowlarr
  - ./qbittorrent
  - ./radarr
  - ./recyclarr
  - ./sabnzbd
  - ./sonarr
  - ./streaming-sync
  # miscellaneous
  - ./excalidraw
  - ./nextcloud
  - ./syncthing
  - ./wordpress
  # observability
  - ./blackbox-exporter
  - ./blackbox-exporter-oci
  - ./fluent-bit
  - ./holmesgpt
  - ./krr
  - ./kube-prometheus-stack
  - ./loki
  # Daily OCI spend across BOTH tenancies (firefly + cloudworkers) in one Slack message.
  # Sits here rather than under a finops heading because it is a scheduled report in the
  # observability namespace, same as krr.
  - ./oci-cost-report
  - ./thanos-compactor
  - ./thanos-query
  - ./thanos-store
  # platform (node-level tuning)
  - ./node-tuning
  - ./system-upgrade-controller
  # progressive delivery
  - ./flagger
  # identity (SSO)
  - ./authentik
  # security
  - ./defectdojo
  - ./dependency-track
  - ./falco
  - ./kyverno-policies
  - ./security-integrations
  - ./sonarqube
  - ./trivy-operator
  # external-repo apps (workload manifests live in their own GitHub repos;
  # each dir holds only the in-cluster Flux plumbing — source, image
  # automation, namespace, and the Flux Kustomization that pulls the workload)
  - ./deskbird-booking
  - ./fortivpn-gateway
