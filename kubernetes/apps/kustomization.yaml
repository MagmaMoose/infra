apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # automation
  - ./atlantis
  - ./browserless
  - ./github-runner
  - ./hermes
  - ./homeassistant
  - ./homebridge
  - ./git-pull-request-dashboard
  - ./litellm
  # PARKED — fleet-shared memory (mem0 on shared CNPG pgvector, via LiteLLM). The Database
  # CR + pgvector bootstrap Job are safe to reconcile early; the mem0 pod ImagePullBackOffs
  # until the image exists AND is public. Uncomment ONLY after ALL of:
  #   1. docker-publish.yml has built ghcr.io/calebsargeant/mem0-server at least once
  #      (it triggers on pushes to main touching dockerfiles/mem0-server/**)
  #   2. that GHCR package has been flipped to PUBLIC — new packages are private by
  #      default and nothing in kubernetes/ uses imagePullSecrets
  #   3. `kubectl rollout restart deployment/litellm -n automation` so the new
  #      text-embedding-3-small / gpt-4o-mini entries load
  # See kubernetes/apps/mem0/README.md.
  # - ./mem0
  - ./mikrotik-minder
  - ./n8n
  - ./n8n-mcp
  - ./renovate
  # magmamoose products (open-core; external-repo + image automation)
  - ./caldrith
  - ./chargate
  - ./github-contributions
  - ./github-usage-dashboard
  - ./nievah
  # DORMANT — autonomous-coding engine (acts as you on GitHub). Reviewed scaffold parked
  # in ./openhands; uncomment to deploy ONLY after validating image/runtime in-cluster.
  # See kubernetes/apps/openhands/README.md.
  # - ./openhands
  # backup
  - ./timemachine
  # miscellaneous (dashboard)
  - ./headlamp
  # media
  - ./bazarr
  - ./flaresolverr
  - ./jackett
  - ./nzbhydra2
  - ./overseerr
  - ./plex
  - ./prowlarr
  - ./qbittorrent
  - ./radarr
  - ./recyclarr
  - ./sabnzbd
  - ./sonarr
  - ./streaming-sync
  # miscellaneous
  - ./excalidraw
  - ./nextcloud
  - ./syncthing
  - ./wordpress
  # observability
  - ./alloy
  - ./blackbox-exporter
  - ./blackbox-exporter-oci
  - ./fluent-bit
  - ./holmesgpt
  - ./krr
  - ./kube-prometheus-stack
  - ./loki
  - ./thanos-compactor
  - ./thanos-query
  - ./thanos-store
  # delivery metrics (DORA)
  - ./devlake
  # platform (node-level tuning)
  - ./node-tuning
  # progressive delivery
  - ./flagger
  # identity (SSO)
  - ./authentik
  # security
  - ./defectdojo
  - ./dependency-track
  - ./falco
  - ./gatekeeper
  - ./kubescape
  - ./kyverno-policies
  - ./security-integrations
  - ./sonarqube
  - ./trivy-operator
  # developer portal
  - ./backstage
  # external-repo apps (workload manifests live in their own GitHub repos;
  # each dir holds only the in-cluster Flux plumbing — source, image
  # automation, namespace, and the Flux Kustomization that pulls the workload)
  - ./buxfer-sync
  - ./deskbird-booking
  - ./fortivpn-gateway
