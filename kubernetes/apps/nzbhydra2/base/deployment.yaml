apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbhydra2
  namespace: media
  labels:
    app: nzbhydra2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbhydra2
  template:
    metadata:
      labels:
        app: nzbhydra2
    spec:
      containers:
      - name: nzbhydra2
        image: linuxserver/nzbhydra2:8.9.0 # {"$imagepolicy": "flux-system:nzbhydra2"}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 710Mi
          limits:
            # 1536Mi, the ceiling the c.micro profile gave this before it was removed —
            # NOT the 710Mi measured figure. A limit equal to the measured working set
            # caps the container at its steady state, and this one is a JVM: heap plus
            # metaspace routinely allocate above average, and the JVM sizes itself from
            # the cgroup limit, so a tight limit makes it both likelier to exceed and
            # less able to avoid it. The OOMKill is silent (exit 137, no logs) — the same
            # defect litellm shipped with.
            # The request stays at the measured 710Mi for honest scheduling; limits are
            # not scheduler-reserved, so this headroom costs no capacity.
            memory: 1536Mi
        ports:
        - containerPort: 5076
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/London"
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        hostPath:
          path: /mnt/nvme/nzbhydra2-config
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nzbhydra2
  namespace: media
  labels:
    app: nzbhydra2
spec:
  selector:
    app: nzbhydra2
  ports:
  - name: http
    port: 5076
    targetPort: 5076
  type: ClusterIP
