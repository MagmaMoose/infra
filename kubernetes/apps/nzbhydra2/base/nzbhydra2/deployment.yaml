apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbhydra2
  namespace: media
  labels:
    app: nzbhydra2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbhydra2
  template:
    metadata:
      labels:
        app: nzbhydra2
    spec:
      containers:
      - name: nzbhydra2
        image: linuxserver/nzbhydra2:8.9.0 # {"$imagepolicy": "flux-system:nzbhydra2"}
        imagePullPolicy: IfNotPresent
        resources:
          # KRR-sized (2026-07): cpu 10m, memory 583Mi. Was 200m/512Mi via the
          # c.micro profile component; the 200m CPU request was pure waste on the
          # 2-core OCI workers.
          requests:
            cpu: 10m
            memory: 583Mi
          limits:
            memory: 768Mi
        ports:
        - containerPort: 5076
          name: http
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/London"
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        hostPath:
          path: /mnt/nvme/nzbhydra2-config
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nzbhydra2
  namespace: media
  labels:
    app: nzbhydra2
spec:
  selector:
    app: nzbhydra2
  ports:
  - name: http
    port: 5076
    targetPort: 5076
  type: ClusterIP
