---
# TWO ExternalSecrets, deliberately. external-secrets fails an ExternalSecret as a unit:
# one missing remoteRef and the whole target Secret is never written. Keeping the
# cloudworkers credential in its own object means the report still runs, and still reports
# firefly, before anyone has uploaded `cloudworkers-oci-cli` to the vault. The CronJob
# mounts the second one `optional: true` to complete that path.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oci-cost-report
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: oci-cost-report
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # The same bot token krr posts with. Already in vault-prod; nothing to create.
    # `secretKey` is an ESO field name, not a hardcoded credential value.
    # kics-scan ignore-line
    - secretKey: slack-bot-token
      remoteRef:
        key: slack-bot-token
    # firefly's API signing credentials, REUSED from the entry atlantis already reads
    # rather than minting a second key for the same tenancy. The vault entry is a JSON
    # object whose `config` property is an oci-CLI-format config file and whose `key.pem`
    # property is the PEM — the escape on `key\.pem` is required because ESO's `property`
    # is a dotted path, so an unescaped dot would look for a nested `pem` under `key`.
    #
    # THE COUPLING IS REAL: rotating atlantis's API key rotates this job's too. That is a
    # smaller price than a second credential to keep in sync, but it is a price.
    #
    # NO EXTRA IAM POLICY IS NEEDED, verified against both tenancies 2026-08-31 rather
    # than assumed. The API users behind both credentials (caleb@sargeant.co in firefly,
    # tracey@sargeant.co in cloudworkers) are members of `Administrators`, which each
    # tenancy's "Tenant Admin Policy" grants `manage all-resources in tenancy` -- and that
    # subsumes `read usage-report`. Both were confirmed by making a real
    # RequestSummarizedUsages call, not by reading the policy. A dedicated least-privilege
    # user WOULD need `allow group <g> to read usage-report in tenancy`; that is the thing
    # to add if either credential is ever narrowed.
    # kics-scan ignore-line
    - secretKey: firefly-config
      remoteRef:
        key: atlantis-oci-cli
        property: config
    # kics-scan ignore-line
    - secretKey: firefly-key.pem
      remoteRef:
        key: atlantis-oci-cli
        property: key\.pem
---
# cloudworkers (traceysargeant) — a DIFFERENT Oracle account, same region. Its credentials
# live only in 1Password today (item 6kbpuhvcmj6bmmujjifwtmlg4q, "Magma Moose" vault) and
# must be copied into FIREFLY's vault-prod before this resolves — vault-prod, not
# vault-cloudworkers, because the `oci-vault` ClusterSecretStore only reads firefly's
# vault. Create it with:
#
#   scripts/oci-vault-secrets.py -c firefly set cloudworkers-oci-cli
#
# reading a JSON object {"config": "...", "key.pem": "..."} on stdin. Until it exists this
# ExternalSecret sits in SecretSyncedError, its Secret is absent, and the CronJob's
# `optional: true` mount means the job still runs, still reports firefly, and names
# cloudworkers as unreadable in the message.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oci-cost-report-cloudworkers
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: oci-cost-report-cloudworkers
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # Same JSON shape as atlantis-oci-cli, so the vault holds one kind of thing for
    # "an OCI API identity" rather than two.
    # kics-scan ignore-line
    - secretKey: config
      remoteRef:
        key: cloudworkers-oci-cli
        property: config
    # kics-scan ignore-line
    - secretKey: key.pem
      remoteRef:
        key: cloudworkers-oci-cli
        property: key\.pem
