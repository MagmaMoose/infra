# Cross-namespace RBAC in flux-system that lets the dunmir-namespace
# ServiceAccount `dunmir-ghcr-reader` read the SOPS-managed `ghcr-pull-secret`
# (which provably pulls ghcr.io/magmamoose/* — Flux's ImageRepositories scan the
# dunmir-backend and -frontend images with it). Paired with the SecretStore +
# ExternalSecret in the dunmir repo's k8s/base/ghcr-pull-secret.yaml, whose
# `auth.jwt.serviceAccountRef` names exactly this SA. Applied (with the rest of
# base/dunmir) by the prod-dunmir-source Flux Kustomization. Mirrors
# caldrith's and diatreme-pro's ghcr-reader-rbac.yaml.
#
# Not optional for this app. caldrith is a public repo whose GHCR
# packages inherited public visibility, so its pull secret is belt-and-braces;
# dunmir is private, so its packages are private too and both Deployments
# ImagePullBackOff without this Secret reaching the namespace.
#
# Chargate/KICS suppressions (reviewed: this Role's *purpose* is to read one
# Secret; the queries flag every RBAC rule that touches `secrets`, which is what
# we explicitly want here. The grant is scoped — `resourceNames: [ghcr-pull-secret]`
# limits it to a single Secret, and the subject is a single SA in one namespace).
# kics-scan disable=b7bca5c4-1dab-4c2c-8cbe-3050b9d59b14,056ac60e-fe07-4acc-9b34-8e1d51716ab9
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dunmir-ghcr-reader
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ghcr-pull-secret"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dunmir-ghcr-reader
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: dunmir-ghcr-reader
    namespace: dunmir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dunmir-ghcr-reader
