apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  # PORTFOLIO_MANAGEMENT key, used ONLY by the version-retention CronJob. Separate
  # from the CI upload key and the SYSTEM_CONFIGURATION key on purpose: this is the
  # one credential in the stack that can DELETE portfolio data, so it should be the
  # one with the smallest blast radius if leaked and the fewest things holding it.
  name: dependency-track-retention
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: dependency-track-retention
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DT_API_KEY # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: dependencytrack-portfolio-management-api-key
