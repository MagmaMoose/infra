apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  # API key used ONLY by the config reconciler below. It needs SYSTEM_CONFIGURATION,
  # which the other two Dependency-Track keys deliberately do not have:
  #   dependency-track-api-key                    - BOM_UPLOAD, for CI. Cannot read config.
  #   dependencytrack-portfolio-management-api-key - project delete. Cannot read config.
  #   dependencytrack-god-api-key                  - this one.
  # Keep them separate: a CI key that could rewrite the server's analyzer config is a
  # much worse thing to leak than one that can only push a BOM.
  name: dependency-track-config
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: dependency-track-config
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DT_API_KEY # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: dependencytrack-god-api-key
