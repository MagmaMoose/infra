apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:` — the app runs in `security`, but the CNPG Database
# CR lives in `database`; each resource carries its own metadata.namespace.
resources:
  - configmap-config-reconcile.yaml
  - configmap-version-retention.yaml
  - cronjob-config-reconcile.yaml
  - cronjob-version-retention.yaml
  - database.yaml
  - externalsecret-config.yaml
  - externalsecret-retention.yaml
  - externalsecret-db.yaml
  - externalsecret-oidc.yaml
  - externalsecret-secretkey.yaml
  - helmrelease.yaml
  - ingress.yaml
