---
# Migrated from secret.enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: streaming-sync-credentials — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: streaming-sync-secrets
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: streaming-sync-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: streaming-sync-credentials
        property: RADARR_API_KEY
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: streaming-sync-credentials
        property: SLACK_BOT_TOKEN
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: streaming-sync-credentials
        property: SONARR_API_KEY
    - secretKey: TMDB_API_KEY
      remoteRef:
        key: streaming-sync-credentials
        property: TMDB_API_KEY
