apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatekeeper
  namespace: security
spec:
  interval: 10m
  chart:
    spec:
      chart: gatekeeper
      version: 3.18.3
      sourceRef:
        kind: HelmRepository
        name: gatekeeper
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Enable audit and mutation features
    audit:
      replicas: 1
      # Policy engine (an app workload) — keep it off the memory-constrained
      # control-plane Pi. Applied to all three gatekeeper components.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        # KRR-sized (2026-07): cpu 10m, memory 103Mi. No CPU limit (avoid CFS throttling).
        requests:
          cpu: 10m
          memory: 103Mi
        limits:
          memory: 192Mi

    controllerManager:
      replicas: 1
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        # KRR-sized (2026-07): cpu 21m, memory 238Mi total (3-replica aggregate); 104Mi per pod. Limit raised to
        # 384Mi so there is still admission burst headroom above the new request.
        # No CPU limit (avoid CFS throttling).
        requests:
          cpu: 21m
          # ff-vm1 fit (infra#501): request = steady state, obs ~79Mi; 384Mi limit
          memory: 104Mi
        limits:
          memory: 384Mi

    # Enable violations logging
    auditInterval: 60
    constraintViolationsLimit: 20
    auditFromCache: false

    # Exempt namespaces
    exemptNamespaces:
      - kube-system
      - flux-system

    # Enable mutation webhook
    enableMutation: true

    # Webhook settings
    webhook:
      replicas: 1
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        # Admission path; 200Mi request with 256Mi burst headroom.
        # No CPU limit (avoid CFS throttling).
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          memory: 256Mi
