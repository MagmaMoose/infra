apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  # No Ingress — the MCP is served at the /mcp path on the existing
  # n8n.magmamoose.com host (DNS + cert already published by the n8n Ingress);
  # the firefly tunnel routes ^/mcp here (zero-trust/.../tunnels.tf).
# Run on the worker node (k3s agent, amd64) — co-located with n8n, off the Pi.
labels:
  # Placement tier — consumed by the Kyverno `place-worker` ClusterPolicy, which
  # adds the nodeSelector at admission. Replaces components/node-selectors/worker.
  # includeSelectors/includeTemplates false: these fields are immutable on a live
  # Deployment/StatefulSet, so touching them would make Flux's next apply fail.
  - pairs:
      placement.sargeant.co/tier: worker
      placement.sargeant.co/priority: medium
    includeSelectors: false
    includeTemplates: false
