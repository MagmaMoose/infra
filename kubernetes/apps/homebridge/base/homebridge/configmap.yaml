apiVersion: v1
kind: ConfigMap
metadata:
  name: homebridge-values
  namespace: automation
data:
  values.yaml: |
    # Updated for app-template v3.7.3 schema

    controllers:
      main:
        type: daemonset
        containers:
          main:
            image:
              repository: ghcr.io/homebridge/homebridge
              tag: beta-2025-10-03
            env:
              TZ: Europe/Amsterdam
            resources:
              # KRR-sized (2026-07): cpu 28m, memory 470Mi. These values are now
              # actually in effect — the c.pico profile component was dropped from
              # kustomization.yaml because its HelmRelease patch wrote
              # spec.values.controllers.main.containers.main.resources, which takes
              # precedence over this valuesFrom ConfigMap (so 100m/256Mi silently won).
              requests:
                cpu: 28m
                memory: 470Mi
              limits:
                memory: 768Mi

    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

    service:
      main:
        controller: main
        ports:
          http:
            port: 8581
            protocol: HTTP

    persistence:
      config:
        enabled: true
        # Migrated off ff-pi1's local hostPath to a Longhorn PVC (homebridge-config,
        # see pvc.yaml) so the pod can run on the worker. HomeKit persist/ pairing
        # state is copied into it before cutover.
        existingClaim: homebridge-config
        globalMounts:
          - path: /homebridge
