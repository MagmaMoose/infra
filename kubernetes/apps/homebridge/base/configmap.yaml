apiVersion: v1
kind: ConfigMap
metadata:
  name: homebridge-values
  namespace: automation
data:
  values.yaml: |
    # Updated for app-template v3.7.3 schema

    controllers:
      main:
        type: daemonset
        containers:
          main:
            image:
              repository: ghcr.io/homebridge/homebridge
              tag: beta-2025-10-03
            env:
              TZ: Europe/Amsterdam
            resources:
              requests:
                cpu: 14m
                memory: 553Mi
              limits:
                memory: 553Mi

    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Placement set explicitly, NOT via the Kyverno place-on-prem policy:
      # homebridge is rendered by Helm (bjw-s app-template), so the kustomize
      # `labels:` lands on the HelmRelease, not on the DaemonSet Helm produces.
      # A label-selector policy cannot see it and the workload would land UNPINNED.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
        topology.sargeant.co/tier: on-prem

    service:
      main:
        controller: main
        ports:
          http:
            port: 8581
            protocol: HTTP

    persistence:
      config:
        enabled: true
        # Migrated off ff-pi1's local hostPath to a Longhorn PVC (homebridge-config,
        # see pvc.yaml) so the pod can run on the worker. HomeKit persist/ pairing
        # state is copied into it before cutover.
        existingClaim: homebridge-config
        globalMounts:
          - path: /homebridge
