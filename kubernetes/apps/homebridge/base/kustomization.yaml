apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: automation
resources:
  - ../../../components/helm-releases/bjw-s-app-template.yaml
  - configmap.yaml
  - pvc.yaml
components:
  # c.pico removed: it was a no-op here. Resource profiles patch
  # containers/0/resources on Deployment/StatefulSet/DaemonSet, and this
  # kustomization emits a HelmRelease — the chart renders the DaemonSet, so the
  # patch matched nothing. Homebridge's resources are set in the chart's own
  # values, which is the only place that reaches them.
  # Migrated off ff-pi1: hostPath persistence replaced with the Longhorn PVC in
  # pvc.yaml (referenced from configmap values), pinned to the worker node.
  - ../../../components/ingress-standards/sargeant.co
  - ../../../components/helm-release-standards/configmap-values

patches:
  - target:
      kind: HelmRelease
    patch: |-
      - op: replace
        path: /metadata/name
        value: homebridge
      - op: replace
        path: /spec/valuesFrom/0/name
        value: homebridge-values
      - op: replace
        path: /spec/values/ingress/main/hosts/0/host
        value: homebridge.sargeant.co
      - op: replace
        path: /spec/values/ingress/main/hosts/1/host
        value: homebridge.sargeant.local
      - op: replace
        path: /spec/values/ingress/main/tls/0/hosts/0
        value: homebridge.sargeant.co
      - op: replace
        path: /spec/values/ingress/main/tls/0/secretName
        value: homebridge-tls
labels:
  # Placement tier — consumed by the Kyverno `place-on-prem` ClusterPolicy, which
  # adds the nodeSelector at admission. Replaces components/node-selectors/worker-on-prem.
  # includeSelectors/includeTemplates false: these fields are immutable on a live
  # Deployment/StatefulSet, so touching them would make Flux's next apply fail.
  - pairs:
      placement.sargeant.co/tier: on-prem
    includeSelectors: false
    includeTemplates: false
