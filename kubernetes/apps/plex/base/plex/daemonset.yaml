apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: plex
  namespace: media
spec:
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet # Required when host networking is used
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:1.43.3 # {"$imagepolicy": "flux-system:plex"}
          resources:
            requests:
              # Memory is KRR-sized (2026-07): 1178Mi.
              memory: "1178Mi"
              # CPU is a DELIBERATE DEVIATION from KRR, which recommended 1.474.
              # That figure is the P99 of transcode bursts, and as a *request* it
              # would permanently reserve ~18% of ff-vm1 (type=mini, the only node
              # this DaemonSet lands on) which already sits at ~98% CPU-requested.
              # A DaemonSet pod that can't be admitted means Plex is simply down.
              # 200m is a realistic steady-state floor; with no CPU limit set,
              # transcodes still burst to whatever the node has spare.
              cpu: "200m"
            limits:
              # Generous limit so transcoding spikes never OOM (limits don't affect scheduling).
              memory: "1536Mi"
          ports:
            - containerPort: 32400 # Plex web interface
              #            - containerPort: 1900  # Plex DLNA server
              #            - containerPort: 5353  # Bonjour/Avahi
              #            - containerPort: 8324  # Plex Roku Companion
            - containerPort: 32410 # GDM network discovery
            - containerPort: 32412 # GDM network discovery
            - containerPort: 32413 # GDM network discovery
            - containerPort: 32414 # GDM network discovery
              #            - containerPort: 32469 # DLNA server
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: VERSION
              value: docker
            - name: PLEX_CLAIM
              value: "claim-NLroaq6PN_ax3fp6JqzK" # Optional, get a claim token from https://www.plex.tv/claim
          volumeMounts:
            - mountPath: /config
              name: plex
            - mountPath: /movies
              name: movies
            - mountPath: /series
              name: series
      volumes:
        - name: plex
          persistentVolumeClaim:
            claimName: plex
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: series
          persistentVolumeClaim:
            claimName: series
