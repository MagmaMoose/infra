# kics-scan disable=b7bca5c4-1dab-4c2c-8cbe-3050b9d59b14,056ac60e-fe07-4acc-9b34-8e1d51716ab9,48a5beba-e4c0-4584-a2aa-e6894e4cf424
# Mirrors the postgres-oci `app` role password into the janeway namespace.
#
# postgres-oci runs `enableSuperuserAccess: false` and CNPG owns the `app` role's
# password, publishing it as the `postgres-oci-app` Secret in `database-oci`.
# The app is not allowed to invent that password, so it reads CNPG's — which
# also means rotating the role propagates here on the next refresh.
#
# Same shape as dunmir-pro's, which is the existing consumer of this cluster:
# a dedicated ServiceAccount, a Role in `database-oci` scoped by resourceNames
# to that ONE Secret, and a kubernetes-provider SecretStore authenticating as
# that ServiceAccount. Without the grant the ExternalSecret reports
# SecretSyncedError (Forbidden), the Secret is never written, and every pod
# plus both hook Jobs stay stuck on a missing Secret.
#
# NOT the oci-vault ClusterSecretStore used elsewhere in this repo: the value
# does not live in OCI Vault, it lives in the cluster and is owned by CNPG.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: janeway-db-reader
  namespace: janeway
automountServiceAccountToken: false
---
# Chargate/KICS suppressions (reviewed: this Role's *purpose* is to read one
# Secret; the queries flag every RBAC rule that touches `secrets`, which is
# exactly what is wanted here. The grant is scoped by resourceNames to a single
# Secret, read-only, and bound to a single ServiceAccount in a single namespace
# — the same reviewed pattern as dunmir-pro/base/db-reader-rbac.yaml).
# kics-scan disable=b7bca5c4-1dab-4c2c-8cbe-3050b9d59b14,056ac60e-fe07-4acc-9b34-8e1d51716ab9
#
# Trivy flags the same thing (a Role that can read Secrets) and is likewise
# reviewed: reading exactly one Secret is this Role's entire purpose, it is
# scoped by resourceNames rather than granting `secrets` wholesale, it is
# read-only, and it is bound to a single ServiceAccount in a single namespace
# that mounts no token. The alternative — copying CNPG's generated password into
# a second store — would be strictly worse, because rotating the role would then
# silently stop propagating.
# trivy:ignore:AVD-KSV-0113
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: janeway-db-reader
  namespace: database-oci
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-oci-app"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: janeway-db-reader
  namespace: database-oci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: janeway-db-reader
subjects:
  - kind: ServiceAccount
    name: janeway-db-reader
    namespace: janeway
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: postgres-oci-app-mirror
  namespace: janeway
spec:
  provider:
    kubernetes:
      remoteNamespace: database-oci
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: janeway
          key: ca.crt
      auth:
        serviceAccount:
          name: janeway-db-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janeway-db
  namespace: janeway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: postgres-oci-app-mirror
    kind: SecretStore
  target:
    name: janeway-db
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The chart consumes this as database.existingSecret with key
        # `password`, and injects it as DB_PASSWORD. It does NOT want a DSN:
        # Janeway's settings build the connection from the discrete
        # DB_HOST/DB_NAME/DB_USER/DB_PASSWORD variables.
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-oci-app
        property: password
