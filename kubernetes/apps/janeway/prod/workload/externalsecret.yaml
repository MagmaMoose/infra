# KICS 3e2d3b2f "hardcoded secret key" is a false positive: `secretKey` values
# are ExternalSecret field NAMES that map to OCI Vault entries — no credential
# value is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# Every secret Janeway needs, from OCI Vault via the oci-vault ClusterSecretStore.
#
# OCI Vault prerequisites (all created 2026-08-14, and the
# external-secret-vault-guard CI check fails the PR if either is missing or not
# ACTIVE):
#
#   janeway-db-password          the `janeway` Postgres role's password
#   janeway-secret-key           Django SECRET_KEY, 64 random characters
#   janeway-superuser-password   initial admin password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janeway-db
  namespace: janeway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: janeway-db
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The same OCI Vault key that postgres-oci's managed-roles block enforces
        # the role's password from, read independently rather than copied — so
        # rotating the vault entry rotates both ends on the next refresh, and
        # neither side can drift from the other.
        #
        # This replaces the cross-namespace RBAC hop that reading CNPG's own
        # `postgres-oci-app` Secret would have required (a ServiceAccount, a Role
        # granting `secrets` read in `database-oci`, a RoleBinding and a
        # kubernetes-provider SecretStore — four objects, and a Role that exists
        # to read Secrets).
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: janeway-db-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janeway-secret-key
  namespace: janeway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: janeway-secret-key
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # This is not merely "a secret that should be set". Upstream Janeway
        # HARDCODES a real SECRET_KEY in core/janeway_global_settings.py, which
        # is published in a public AGPL repository — so an installation that
        # failed to override it would boot, serve pages and accept logins while
        # signing session cookies and password-reset tokens with a key anyone
        # can read. The image refuses to start on that literal, and reads this
        # one with a bare subscript so a missing value is a hard failure.
        secret-key: "{{ .secretKey }}"
  data:
    - secretKey: secretKey
      remoteRef:
        key: janeway-secret-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janeway-superuser
  namespace: janeway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: janeway-superuser
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Consumed only by the chart's bootstrap hook, which creates the account
        # if it does not already exist. Rotating this value in the vault does
        # NOT change the password of an account that has already been created —
        # that is a password change in the application.
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: janeway-superuser-password
