# KICS 3e2d3b2f "hardcoded secret key" is a false positive: `secretKey` values
# are ExternalSecret field NAMES that map to OCI Vault entries — no secret value
# is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99,48a5beba-e4c0-4584-a2aa-e6894e4cf424
#
# The kubelet's credential for ghcr.io/tengen-systems/janeway, which is private
# and in a different GitHub org from this repo.
#
# The `platform2-ghcr-pull` vault entry is reused rather than duplicated: it is
# an org-scoped tengen-systems token with read:packages, so it already covers
# every package in that org, and a second entry would be a second thing to
# rotate for no isolation benefit. If it is ever narrowed to specific packages,
# janeway needs adding to its scope — the symptom would be ImagePullBackOff with
# a 403 on this namespace only.
#
# Note the CHART needs no credential: MagmaMoose/charts is public and in the
# same org, so base/helmrepository.yaml carries no secretRef. Chart pulls and
# image pulls are separate questions here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-tengen-pull-secret
  namespace: janeway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: ghcr-tengen-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: platform2-ghcr-pull
        property: username
    - secretKey: token
      remoteRef:
        key: platform2-ghcr-pull
        property: token
