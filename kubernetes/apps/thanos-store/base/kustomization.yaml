apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
patches:
  # Homelab runs a single Thanos Store replica (base declares 2 for HA; one is
  # enough to serve long-term blocks from MinIO on this 2-node cluster). Was 0,
  # which left Thanos Query blind to all historical data in object storage.
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: StatefulSet
      labelSelector: "app.kubernetes.io/name=thanos-store"
labels:
  # Placement tier — consumed by the Kyverno `place-on-prem` ClusterPolicy, which
  # adds the nodeSelector at admission. Replaces components/node-selectors/mini.
  # includeSelectors/includeTemplates false: these fields are immutable on a live
  # Deployment/StatefulSet, so touching them would make Flux's next apply fail.
  - pairs:
      placement.sargeant.co/tier: on-prem
      placement.sargeant.co/priority: low
    includeSelectors: false
    includeTemplates: false
