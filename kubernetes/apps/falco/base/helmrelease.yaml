apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 10m
  chart:
    spec:
      chart: falco
      version: "9.1.0"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Priority class, per the desired-state table in cleanup.md.
    # Set in chart values because the Kyverno assign-priority-class policy
    # cannot reach a chart-rendered workload — the placement label lands on
    # the HelmRelease, not the Deployment the chart renders.
    podPriorityClassName: medium
    # eBPF runtime threat detection. modern_ebpf needs no kernel headers.
    driver:
      kind: modern_ebpf
    # The DaemonSet container's request, which the chart otherwise defaults to 512Mi.
    # 14-day peak working set is 179Mi on the busiest node and 78-81Mi on the other
    # three, so the default reserved ~330Mi per node that was never used. That mattered
    # on ff-vm1, which sat at 99% of allocatable memory REQUESTED against 68% actually
    # in use — the state that left the amd64 CI runner unschedulable. 256Mi is peak plus
    # ~43%. The limit stays generous: limits are not scheduler-reserved, so they cost
    # nothing to leave high (COMMON_MISTAKES #14), and Falco's working set tracks event
    # rate rather than anything we control.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    # WORKER ONLY. The control-plane Pi runs a 16KB-page arm64 kernel where the
    # eBPF probe is unreliable — keep Falco off it (covers where apps run anyway).
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    # Route alerts to Loki (forwarded best-effort; Falco still logs to stdout +
    # exposes Prometheus metrics if this endpoint is wrong). Ships a Grafana
    # dashboard. VERIFY the Loki push endpoint/namespace for your install.
    falcosidekick:
      # Priority class, per the desired-state table in cleanup.md.
      # Set in chart values because the Kyverno assign-priority-class policy
      # cannot reach a chart-rendered workload — the placement label lands on
      # the HelmRelease, not the Deployment the chart renders.
      priorityClassName: medium
      enabled: true
      # The Falco DaemonSet is worker-pinned above, but the falcosidekick Deployment had
      # no nodeSelector and no resource request, so the scheduler placed it on the full
      # control-plane Pi, where a high Falco event rate ballooned it toward ~2Gi and the
      # node OOM-killed it repeatedly (23 restarts). Pin to worker, bound its memory, and
      # run a single replica (one alert forwarder is plenty for this cluster).
      replicaCount: 1
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 1Gi
      config:
        loki:
          hostport: "http://loki-gateway.observability.svc.cluster.local" # NOSONAR S5332 - in-cluster Loki push endpoint (east-west), not internet-facing
