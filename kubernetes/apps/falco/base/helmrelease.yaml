apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 10m
  chart:
    spec:
      chart: falco
      version: "9.1.0"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # eBPF runtime threat detection. modern_ebpf needs no kernel headers.
    driver:
      kind: modern_ebpf
    # Falco DaemonSet itself (3 pods: ff-vm1 + both OCI workers).
    # Memory is KRR-sized (2026-07): 254Mi.
    # CPU is a DELIBERATE DEVIATION from KRR, which recommended 821m/pod.
    # KRR reports ONE figure per DaemonSet — effectively the busiest pod (ff-vm1,
    # ~84 pods' worth of syscalls) — but that value is then requested on EVERY
    # node. The OCI workers are 2-core and, even after this right-sizing pass,
    # sit near ~1.4 cores requested; an 821m request does not fit there and the
    # DaemonSet pod would sit Pending, i.e. no runtime threat detection on that
    # node. 200m is a realistic floor for the quiet nodes and, with no CPU limit,
    # the busy ff-vm1 pod still bursts to whatever it needs.
    # Proper fix if the full 821m floor is wanted on ff-vm1: split into a second,
    # node-specific DaemonSet release rather than raising it fleet-wide.
    resources:
      requests:
        cpu: 200m
        # ff-vm1 fit (infra#501): request = steady state, obs ~162Mi; 1Gi limit
        memory: 208Mi
      limits:
        memory: 1Gi
    # falcoctl sidecars had no requests at all; KRR-sized (2026-07) to 10m/100Mi.
    falcoctl:
      artifact:
        follow:
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 192Mi
        install:
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 192Mi
    # WORKER ONLY. The control-plane Pi runs a 16KB-page arm64 kernel where the
    # eBPF probe is unreliable — keep Falco off it (covers where apps run anyway).
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    # Route alerts to Loki (forwarded best-effort; Falco still logs to stdout +
    # exposes Prometheus metrics if this endpoint is wrong). Ships a Grafana
    # dashboard. VERIFY the Loki push endpoint/namespace for your install.
    falcosidekick:
      enabled: true
      # The Falco DaemonSet is worker-pinned above, but the falcosidekick Deployment had
      # no nodeSelector and no resource request, so the scheduler placed it on the full
      # control-plane Pi, where a high Falco event rate ballooned it toward ~2Gi and the
      # node OOM-killed it repeatedly (23 restarts). Pin to worker, bound its memory, and
      # run a single replica (one alert forwarder is plenty for this cluster).
      replicaCount: 1
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        # KRR-sized (2026-07): cpu 10m, memory 434Mi — the event rate keeps this
        # well above the old 128Mi request (which is what drove the OOM story above).
        requests:
          cpu: 10m
          memory: 434Mi
        limits:
          memory: 1Gi
      config:
        loki:
          hostport: "http://loki-gateway.observability.svc.cluster.local" # NOSONAR S5332 - in-cluster Loki push endpoint (east-west), not internet-facing
