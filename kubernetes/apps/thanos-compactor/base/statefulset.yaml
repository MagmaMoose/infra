apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compactor
  namespace: observability
  labels:
    app.kubernetes.io/name: thanos-compactor
spec:
  serviceName: thanos-compactor
  # PAUSED (0, normally 1) while thanos-metrics is copied from MinIO to SeaweedFS
  # (kubernetes/apps/seaweedfs-migration). Compaction merges blocks and deletes the
  # originals; mid-copy, SeaweedFS would keep both and the compactor would later halt on the
  # overlap. With it paused the bucket only grows, so copying again after the cutover is
  # safe. Back to 1 in the cutover change. Nothing is lost while it is off: raw blocks keep
  # arriving from the sidecar, and compaction and downsampling catch up afterwards.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compactor
    spec:
      containers:
        - name: thanos-compactor
          image: quay.io/thanos/thanos:v0.37.2
          args:
            - compact
            - --log.level=info
            - --data-dir=/var/thanos/compact
            - --objstore.config=$(OBJSTORE_CONFIG)
            - --retention.resolution-raw=30d
            - --retention.resolution-5m=180d
            - --retention.resolution-1h=365d
            - --wait
            - --wait-interval=3h
          env:
            - name: OBJSTORE_CONFIG
              valueFrom:
                secretKeyRef:
                  name: thanos-objstore-config
                  key: objstore.yml
          ports:
            - name: http
              containerPort: 10902
          volumeMounts:
            - name: data
              mountPath: /var/thanos/compact
          # Right-sized: observed ~25Mi steady-state; request freed for scheduling
          # headroom. Compaction is memory-bursty, so keep a generous 2Gi limit
          # (limits don't affect scheduling) to avoid OOM. No CPU limit.
          resources:
            requests:
              cpu: 50m
              memory: 768Mi
            limits:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 10902
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 10902
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
