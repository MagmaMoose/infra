---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-system-upgrade-controller
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/system-upgrade-controller/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
