---
# Migrated from oci-cli-secret-enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: atlantis-oci-cli — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: atlantis-oci-cli
  namespace: automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: atlantis-oci-cli
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: config
      remoteRef:
        key: atlantis-oci-cli
        property: config
    - secretKey: key.pem
      remoteRef:
        key: atlantis-oci-cli
        property: key\.pem
