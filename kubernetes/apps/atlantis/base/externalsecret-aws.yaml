---
# AWS credentials for the terraform/aws/** leaves. Replaces the SOPS `secret-aws.yaml.template`
# that has sat unused beside it — SOPS is this repo's LAST resort (OCI Vault -> 1Password ->
# SOPS), and there is no reason for this one to be the exception.
#
# ⚠️ THIS IS THE MOST POWERFUL CREDENTIAL IN THE CLUSTER, and it should not be created without
# reading this. Terraform here creates IAM roles and policies, Lambda functions, a CloudFront
# distribution, queues and buckets — so whatever it can assume, it can also grant itself. That
# is categorically different from the narrow queue-consumer key nievah-worker holds (receive
# and delete on ONE queue, read one S3 prefix, nothing else).
#
#
# ⚠️⚠️ BEFORE MINTING THIS AT ALL: Atlantis is slated for replacement by Effusion
# (CalebSargeant/agent-personal#9), which runs in GitHub Actions — and a GitHub Actions runner
# authenticates to AWS by **OIDC**, assuming a role per run with no stored credential. That
# makes this entire Secret unnecessary, and it is the single most valuable thing the migration
# buys: the scariest artefact in this whole AWS change is a long-lived, highly-privileged AWS
# key living in the cluster, and Effusion deletes it rather than scoping it.
#
# So: if the AWS rollout is not urgent, WAIT. If it is, mint the assume-role pair below and
# treat it as temporary — the terraform/aws leaves are the first thing that should move to
# OIDC when Effusion lands, precisely because they are the ones holding this.
#
# MINT IT AS AN ASSUME-ROLE PAIR, not as a user with the permissions attached directly:
#
#   1. IAM user `atlantis-terraform` whose ONLY policy is sts:AssumeRole on
#      arn:aws:iam::<account>:role/atlantis-deploy
#   2. Role `atlantis-deploy` carrying the actual permissions, trusting that user
#   3. `role_arn` in the generated provider, or AWS_ROLE_ARN here
#
# The standing secret then buys a time-bounded session rather than standing power, every
# action lands in CloudTrail against an assumed role, and revoking is a trust-policy edit
# rather than a key rotation that has to reach the cluster.
#
# A dedicated AWS account for this stack is the stronger answer again, and cheap — free-tier
# allowances are per account, so a second one does not halve them. Worth doing before this
# grows past one service.
#
# Vault secret: atlantis-aws — a JSON object with the two properties below, one entry backing
# the whole Secret rather than one entry per field (same shape as atlantis-oci-cli).
#
# ESO resolves by NAME and fails the WHOLE ExternalSecret on a missing key, so the Vault entry
# must exist and be ACTIVE before this is added to kustomization.yaml. The deployment reads
# both keys with `optional: true`, so Atlantis keeps running without them — it just cannot
# plan an AWS leaf.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: atlantis-aws
  namespace: automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: atlantis-aws
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: access-key-id
      remoteRef:
        key: atlantis-aws
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: atlantis-aws
        property: secret-access-key
