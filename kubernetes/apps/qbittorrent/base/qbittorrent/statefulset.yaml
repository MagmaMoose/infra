apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qbittorrent
  namespace: media
spec:
  serviceName: qbittorrent
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      automountServiceAccountToken: false
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent:5.2.3 # {"$imagepolicy": "flux-system:qbittorrent"}
          resources:
            # KRR-sized (2026-07): cpu 70m, memory 588Mi — real torrent load is well
            # above the old 10m/256Mi guess. Generous limit avoids OOM.
            requests:
              # Memory held at 128Mi, not KRR's 588Mi: observed steady state is
              # ~70Mi (588Mi is a peak-torrent figure). ff-vm1 cannot reserve every
              # pod's peak (see infra#501); the 768Mi limit absorbs busy periods.
              memory: "128Mi"
              cpu: "70m"
            limits:
              memory: "768Mi"
          ports:
            - containerPort: 8080 # Web UI
            - containerPort: 55555 # BitTorrent (TCP/UDP)
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "55555"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
