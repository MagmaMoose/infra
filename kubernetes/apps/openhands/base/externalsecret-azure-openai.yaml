# Azure OpenAI endpoint and the resource's secondary key, for Caleb's manual use in the UI
# only. It lives in this namespace and nowhere else: not on the LiteLLM gateway, not in
# Nievah's secrets. The secondary key can be regenerated to revoke this copy without
# touching anything on the primary key.
#
# Separate ExternalSecret, like openhands-signing: ESO has no per-key optional, so a missing
# vault entry fails only this sync and the pod still starts without the Azure profiles (the
# Deployment references this Secret with optional: true).
#
# Vault entry: openhands-azure-openai, JSON {"base_url": "...", "api_key": "..."}
#
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openhands-azure-openai
  namespace: openhands
spec:
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: openhands-azure-openai
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: base-url
      remoteRef:
        key: openhands-azure-openai
        property: base_url
    - secretKey: api-key
      remoteRef:
        key: openhands-azure-openai
        property: api_key
