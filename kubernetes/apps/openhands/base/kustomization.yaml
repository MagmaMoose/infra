apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - pvc.yaml
  - configmap-bootstrap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
components:
  # native-cloud (ff-oci1/ff-oci2), NOT worker-on-prem. The old comment here claimed
  # OpenHands was "amd64-only in places" — that is now false: agent-canvas is
  # linux/amd64 + linux/arm64 and was verified running on the arm64 OCI tier. That tier
  # also has the CPU headroom; ff-vm1 does not.
  - ../../../components/node-selectors/native-cloud
