# A second LiteLLM gateway's URL and a virtual key on it, as JSON {"base_url","api_key"}: the key
# allows only that gateway's tier aliases and carries its own budget, for Caleb's manual use in the
# UI. A gateway key rather than a provider key, so model upgrades happen at the gateway, spend is
# metered and capped there, and revoking this copy touches nothing else.
#
# Separate ExternalSecret, like openhands-signing: ESO has no per-key optional, so a missing
# vault entry fails only this sync and the pod still starts without the tier profiles (the
# Deployment references this Secret with optional: true).
#
# Vault entry: openhands-llm-gateway, JSON {"base_url": "...", "api_key": "..."}
#
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openhands-llm-gateway
  namespace: openhands
spec:
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: openhands-llm-gateway
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: base-url
      remoteRef:
        key: openhands-llm-gateway
        property: base_url
    - secretKey: api-key
      remoteRef:
        key: openhands-llm-gateway
        property: api_key
