# Chargate/KICS suppressions (accepted risks, reviewed — genuinely actionable findings were
# FIXED in code instead: seccompProfile: RuntimeDefault added to pod securityContext,
# capabilities: drop: [ALL] added to container securityContext):
#   7c81d34c no image digest          – repo convention: tag pinning matches all other app
#                                       deployments; no digest automation is in place.
#   a9c2f49d readOnlyRootFilesystem   – OpenHands agent-canvas writes to arbitrary paths
#                                       during coding runs (pip/npm caches, /tmp, etc.).
#                                       Enumerating every writable path into emptyDirs is
#                                       fragile; accept until the write surface is fully
#                                       mapped and emptyDir mounts can be added safely.
#   3d658f8b secretKeyRef is defined  – repo-wide sanctioned pattern: ExternalSecret →
#                                       secretKeyRef env vars (same as mem0, n8n-mcp, etc.).
#   8b36775e no AppArmor annotation   – KICS wants the DEPRECATED beta annotation. The modern
#                                       securityContext.appArmorProfile is deliberately NOT set
#                                       yet: no AppArmor config exists in ansible/terraform, and
#                                       a profile request on a node without AppArmor FAILS pod
#                                       startup. Verify node support before enabling.
# kics-scan disable=7c81d34c-8e5a-402b-9798-9f442630e678,a9c2f49d-0671-4fc9-9ece-f4e261e128d0,3d658f8b-d988-41a0-a841-40043121de1e,8b36775e-183d-4d46-b0f7-96a6f34a723f
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands
  namespace: openhands
spec:
  replicas: 1
  # The state volume is ReadWriteOnce, so keep one stateful instance.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openhands
  template:
    metadata:
      annotations:
        # The key is intentionally normalised by the shell wrapper below. Bump this revision
        # through GitOps after a future Vault rotation so secret-backed env is re-read by the
        # pod; Kubernetes never updates an existing process environment in place.
        openhands.magmamoose.com/session-api-key-revision: "1"
      labels:
        app: openhands
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openhands
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # OpenHands V1 agent-canvas serves the UI and agent-server in one container.
          # The pod is the sandbox boundary; it intentionally has GitHub write access.
          image: ghcr.io/openhands/agent-canvas:1.5.2
          # A `claude setup-token` / clipboard-created Vault value can include one trailing
          # newline. Nievah strips HTTP-header values (required by HTTP), while agent-canvas
          # compares its raw environment value. Normalise the shared key before handing off to
          # the image entrypoint so both sides authenticate with the same usable value.
          command:
            - /bin/sh
            - -ec
          args:
            - |
              if [ -n "${OH_SESSION_API_KEYS_0:-}" ]; then
                OH_SESSION_API_KEYS_0="$(printf '%s' "$OH_SESSION_API_KEYS_0" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
                export OH_SESSION_API_KEYS_0
              fi
              exec tini -- /opt/agent-canvas/entrypoint.sh
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: OPENHANDS_SUPPRESS_BANNER
              value: "1"
            - name: TZ
              value: Europe/Amsterdam
            # Git identity, as ENVIRONMENT variables and deliberately NOT as a
            # `git config` file. The agent SDK's VersionControlSection prompt branches on
            # whether `git config` already shows credentials: if it does, it instructs the
            # model to "add Co-authored-by: openhands <openhands@all-hands.dev> to any
            # commits messages you make"; if it does not, it instructs the model to commit
            # as openhands@all-hands.dev instead. Both branches are wrong for this fleet.
            #
            # Env vars take the second branch (they are invisible to `git config --get`)
            # while still winning at commit time, because git reads GIT_AUTHOR_* and
            # GIT_COMMITTER_* ahead of any config file. So the model is never told to write
            # a trailer, and the identity it thinks it is using is overridden anyway.
            # Writing a gitconfig here instead would flip it to the branch that DOES ask
            # for the trailer. Do not "tidy" this into a config file.
            #
            # The address matches the one GitHub stamps on squash commits. That matters:
            # GitHub credits every distinct commit-author email in a PR as a co-author on
            # the squash commit it creates server-side, where no hook can reach it. Same
            # address in, no co-author out.
            - name: GIT_AUTHOR_NAME
              value: Caleb Sargeant
            - name: GIT_AUTHOR_EMAIL
              value: 4991715+CalebSargeant@users.noreply.github.com
            - name: GIT_COMMITTER_NAME
              value: Caleb Sargeant
            - name: GIT_COMMITTER_EMAIL
              value: 4991715+CalebSargeant@users.noreply.github.com
            # Bootstrap writes the encrypted V1 settings through /api/settings. These
            # values are not read by the agent-server directly.
            # Scoped `openhands` virtual key, not the gateway master key. It only
            # resolves the deepseek + gpt-5.6 model groups, so a prompt-injected agent
            # cannot reach the Claude entries or the proxy's admin endpoints.
            - name: BOOTSTRAP_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: litellm-key
            - name: BOOTSTRAP_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: github-token
            - name: BOOTSTRAP_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: slack-bot-token
            - name: BOOTSTRAP_CLICKUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: clickup-token
            # npx-resolved MCP servers cache here instead of in the container's ephemeral
            # HOME, so a restart does not re-download Chromium (~150MB) and the npm tree.
            - name: npm_config_cache
              value: /home/openhands/.openhands/cache/npm
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: /home/openhands/.openhands/cache/playwright
            # Nievah uses this stable key for headless REST authentication. agent-canvas
            # uses the V1 OH_SESSION_API_KEYS_0 value for its public proxy and agent server;
            # the legacy SESSION_API_KEY is ignored when that canonical key is absent and
            # would make agent-canvas generate a different, private key instead.
            #
            # When the Vault entry is intentionally absent this optional variable is unset,
            # so agent-canvas falls back to its persisted generated key for manual use.
            - name: OH_SESSION_API_KEYS_0
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: session-api-key
                  optional: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - /bootstrap/seed.sh & exit 0
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 1Gi
            limits:
              cpu: "2"
              # 3Gi, not 2Gi: the Playwright MCP server spawns Chromium in this pod and
              # wants ~1GB on its own. Not higher, because the on-prem workers this now
              # schedules on are 6.4GB (ff-pi2) and 93% memory-requested (ff-vm1), so a
              # 4Gi ceiling could take the node down rather than just the container.
              memory: 3Gi
          volumeMounts:
            - name: state
              mountPath: /workspace
              subPath: workspace
            - name: state
              mountPath: /home/openhands/.openhands
              subPath: openhands-state
            # Nested inside /workspace on purpose: the agent sees one tree, but the
            # clones live on their own 50Gi volume so they cannot crowd out the
            # conversation history, and only the state volume is backed up to S3.
            - name: repos
              mountPath: /workspace/repos
            - name: skills
              mountPath: /skills
              readOnly: true
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            # Sub-agent definitions. ~/.agents/agents is the first directory
            # load_user_agents() searches, and it sits outside the state PVC so these stay
            # declarative: every rollout replaces them, nothing drifts into the volume.
            - name: subagents
              mountPath: /home/openhands/.agents/agents
              readOnly: true
        # Keeps /workspace/repos in step with GitHub. A sidecar rather than a CronJob
        # because the repos volume is ReadWriteOnce: a separate pod would have to attach
        # it on the same node and would fight the agent for the lock. Runs its own loop
        # instead of a schedule for the same reason.
        # readOnlyRootFilesystem is not set: apk installs git/curl/jq to the root fs at
        # startup. Constrained by no SA token, dropped capabilities, and seccomp=RuntimeDefault.
        - name: repo-sync  # nosemgrep: yaml.kubernetes.security.writable-filesystem-container.writable-filesystem-container
          # Same image as the agent, deliberately. It already ships git, curl and jq, it
          # is already on the node so there is no second pull, and it runs as the same
          # uid 10001 the pod enforces. The first version used alpine and ran
          # `apk add` at startup; once the pod was hardened to runAsNonRoot the install
          # could not lock the apk database, the container exited 99 on every start, and
          # because a crashlooping container marks the whole pod NotReady, the Service
          # lost its only endpoint and the agent went down with it. Nothing here should
          # install software at runtime. Keep this tag in step with the agent above.
          image: ghcr.io/openhands/agent-canvas:1.5.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 512Mi
          env:
            - name: HOME
              value: /home/sync
            - name: SYNC_INTERVAL_SECONDS
              value: "1800"
            - name: SKIP_ARCHIVED
              value: "true"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: github-token
            # Second forge. hosts.txt maps pinkroccade.ghe.com to this variable, so a
            # missing value degrades to "skip that owner with a warning" rather than
            # failing the whole pass.
            - name: GHE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: ghe-token
          # Overrides the image entrypoint, which would otherwise start a second agent
          # server inside the sidecar.
          command: ["/bin/sh", "/scripts/sync.sh"]
          volumeMounts:
            - name: repos
              mountPath: /workspace/repos
            - name: reposync
              mountPath: /scripts
              readOnly: true
            - name: reposync
              mountPath: /config
              readOnly: true
            - name: reposync-home
              mountPath: /home/sync
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: openhands-state
        - name: repos
          persistentVolumeClaim:
            claimName: openhands-repos
        - name: skills
          configMap:
            name: openhands-skills
        - name: reposync
          configMap:
            name: openhands-reposync
            defaultMode: 0755
        - name: reposync-home
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: openhands-bootstrap
            defaultMode: 0755
        - name: subagents
          configMap:
            name: openhands-subagents
