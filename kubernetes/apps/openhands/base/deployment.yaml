apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands
  namespace: openhands
spec:
  replicas: 1
  # The state volume is ReadWriteOnce, so keep one stateful instance.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openhands
  template:
    metadata:
      labels:
        app: openhands
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: openhands
          # OpenHands V1 agent-canvas serves the UI and agent-server in one container.
          # The pod is the sandbox boundary; it intentionally has GitHub write access.
          image: ghcr.io/openhands/agent-canvas:1.5.2
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: OPENHANDS_SUPPRESS_BANNER
              value: "1"
            - name: TZ
              value: Europe/Amsterdam
            # Bootstrap writes the encrypted V1 settings through /api/settings. These
            # values are not read by the agent-server directly.
            - name: BOOTSTRAP_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: llm-api-key
            - name: BOOTSTRAP_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: github-token
            # Nievah uses this stable key for headless REST authentication. The seed script
            # falls back to the generated key when the Vault entry is intentionally absent.
            - name: SESSION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: session-api-key
                  optional: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - /bootstrap/seed.sh & exit 0
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /workspace
              subPath: workspace
            - name: state
              mountPath: /home/openhands/.openhands
              subPath: openhands-state
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: openhands
        - name: bootstrap
          configMap:
            name: openhands-bootstrap
            defaultMode: 0755
