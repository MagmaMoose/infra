# Chargate/KICS suppressions (accepted risks, reviewed — genuinely actionable findings were
# FIXED in code instead: seccompProfile: RuntimeDefault added to pod securityContext,
# capabilities: drop: [ALL] added to container securityContext):
#   7c81d34c no image digest          – repo convention: tag pinning matches all other app
#                                       deployments; no digest automation is in place.
#   a9c2f49d readOnlyRootFilesystem   – OpenHands agent-canvas writes to arbitrary paths
#                                       during coding runs (pip/npm caches, /tmp, etc.).
#                                       Enumerating every writable path into emptyDirs is
#                                       fragile; accept until the write surface is fully
#                                       mapped and emptyDir mounts can be added safely.
#   3d658f8b secretKeyRef is defined  – repo-wide sanctioned pattern: ExternalSecret →
#                                       secretKeyRef env vars (same as mem0, n8n-mcp, etc.).
# kics-scan disable=7c81d34c-8e5a-402b-9798-9f442630e678,a9c2f49d-0671-4fc9-9ece-f4e261e128d0,3d658f8b-d988-41a0-a841-40043121de1e
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands
  namespace: openhands
spec:
  replicas: 1
  # The state volume is ReadWriteOnce, so keep one stateful instance.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openhands
  template:
    metadata:
      annotations:
        # The key is intentionally normalised by the shell wrapper below. Bump this revision
        # through GitOps after a future Vault rotation so secret-backed env is re-read by the
        # pod; Kubernetes never updates an existing process environment in place.
        openhands.magmamoose.com/session-api-key-revision: "1"
      labels:
        app: openhands
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openhands
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # OpenHands V1 agent-canvas serves the UI and agent-server in one container.
          # The pod is the sandbox boundary; it intentionally has GitHub write access.
          image: ghcr.io/openhands/agent-canvas:1.5.2
          # A `claude setup-token` / clipboard-created Vault value can include one trailing
          # newline. Nievah strips HTTP-header values (required by HTTP), while agent-canvas
          # compares its raw environment value. Normalise the shared key before handing off to
          # the image entrypoint so both sides authenticate with the same usable value.
          command:
            - /bin/sh
            - -ec
          args:
            - |
              if [ -n "${OH_SESSION_API_KEYS_0:-}" ]; then
                OH_SESSION_API_KEYS_0="$(printf '%s' "$OH_SESSION_API_KEYS_0" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
                export OH_SESSION_API_KEYS_0
              fi
              exec tini -- /opt/agent-canvas/entrypoint.sh
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: OPENHANDS_SUPPRESS_BANNER
              value: "1"
            - name: TZ
              value: Europe/Amsterdam
            # Bootstrap writes the encrypted V1 settings through /api/settings. These
            # values are not read by the agent-server directly.
            - name: BOOTSTRAP_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: llm-api-key
            - name: BOOTSTRAP_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: github-token
            # Nievah uses this stable key for headless REST authentication. agent-canvas
            # uses the V1 OH_SESSION_API_KEYS_0 value for its public proxy and agent server;
            # the legacy SESSION_API_KEY is ignored when that canonical key is absent and
            # would make agent-canvas generate a different, private key instead.
            #
            # When the Vault entry is intentionally absent this optional variable is unset,
            # so agent-canvas falls back to its persisted generated key for manual use.
            - name: OH_SESSION_API_KEYS_0
              valueFrom:
                secretKeyRef:
                  name: openhands
                  key: session-api-key
                  optional: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - /bootstrap/seed.sh & exit 0
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /workspace
              subPath: workspace
            - name: state
              mountPath: /home/openhands/.openhands
              subPath: openhands-state
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: openhands
        - name: bootstrap
          configMap:
            name: openhands-bootstrap
            defaultMode: 0755
