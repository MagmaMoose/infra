# Chargate/KICS suppression: the `secretKey` fields below are Kubernetes Secret key names
# (non-sensitive labels like "session-api-key"), not credential values. The actual secrets
# live in OCI Vault and are injected at runtime by ExternalSecrets; nothing sensitive is
# committed to Git. Reviewed and accepted as false positives.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openhands
  namespace: openhands
spec:
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: openhands
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # GitHub PAT so OpenHands acts AS YOU (clone/branch/push/open-PR). Reuses Caleb's
    # existing bot PAT; mint a dedicated `openhands-github-pat` later if you want to
    # scope/rotate it independently of the (legacy) comment-commander one.
    - secretKey: github-token
      remoteRef:
        key: comment-commander-github-pat
    # Stable V1 session key shared with Nievah's ExternalSecret. Keep this in OCI Vault;
    # never commit the value to Git or put it in a ConfigMap.
    - secretKey: session-api-key
      remoteRef:
        key: openhands-session-api-key
    # Scoped LiteLLM virtual key (alias `openhands`), upserted into the gateway by the
    # litellm-keyseed Job. Limited to the deepseek + gpt-5.6 model groups. This replaces
    # litellm-master-key above for the LLM path: an agent that writes code and pushes to
    # GitHub should not also hold admin rights over the gateway every other workload uses.
    - secretKey: litellm-key
      remoteRef:
        key: openhands-litellm-api-key
    # MCP server credentials, injected into the agent's stored MCP config by the seed
    # script. Reuses existing vault entries rather than minting per-agent tokens; swap
    # to dedicated ones if you ever want to revoke OpenHands' access independently.
    - secretKey: slack-bot-token
      remoteRef:
        key: slack-bot-token
    - secretKey: clickup-token
      remoteRef:
        key: magmamoose-clickup-token
    # Enterprise PAT for the work forge, used only by the repo-sync sidecar to clone
    # from that host. Flat value, so no property path is needed. Reuses the existing
    # vault entry rather than minting another; the name reflects the app that first
    # needed it, not an exclusive owner. Scopes include repo, verified against the
    # live API. Mint a dedicated one if you ever want to revoke this independently.
    - secretKey: ghe-token
      remoteRef:
        key: github-contributions-ghes-token
