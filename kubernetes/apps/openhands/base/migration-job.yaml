# One-shot copy of the encrypted settings and conversation history off the old
# local-path volume. Only ~30MB matters: the profiles and MCP config are re-seeded from
# Git on every pod start, and /workspace is re-cloned by the repo-sync sidecar, so the
# conversation history is the single thing that cannot be rebuilt.
#
# Scheduling: the local-path source is node-local to ff-oci2, so this Job must run
# there. Longhorn attaches over the network, so the destination volume follows it — the
# copy crosses the VPN once, which is fine for 30MB and is exactly what we are removing
# from the steady state.
#
# Bump the name suffix to re-run. Jobs are immutable, so Flux cannot patch this in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: openhands-migrate-state-v1
  namespace: openhands
  annotations:
    checkov.io/skip1: CKV_K8S_11=CPU limits are unset estate-wide by decision; see .trivyignore KSV-0011 and the Kyverno default-limitrange. Memory is limited.
    checkov.io/skip2: CKV_K8S_15=IfNotPresent is the house convention; image is tagged and pulled only when absent, not on every Job run
    checkov.io/skip3: CKV_K8S_43=alpine:3.22 pinned to a specific tag; digest pinning not warranted for this home-lab one-shot Job
spec:
  ttlSecondsAfterFinished: 604800
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: ff-oci2
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -e /new/.migrated ]; then
                echo "[migrate] destination already seeded, nothing to do"
                exit 0
              fi
              echo "[migrate] copying agent state"
              cp -a /old/openhands-state/. /new/
              date -u +%FT%TZ > /new/.migrated
              echo "[migrate] done; /workspace is intentionally NOT copied (repo-sync rebuilds it)"
          volumeMounts:
            - name: old
              mountPath: /old
            - name: new
              mountPath: /new
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: openhands
        - name: new
          persistentVolumeClaim:
            claimName: openhands-state
