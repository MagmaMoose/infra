# One-shot copy of the encrypted settings and conversation history off the old
# local-path volume. Only ~30MB matters: the profiles and MCP config are re-seeded from
# Git on every pod start, and /workspace is re-cloned by the repo-sync sidecar, so the
# conversation history is the single thing that cannot be rebuilt.
#
# Scheduling: the local-path source is node-local to ff-oci2, so this Job must run
# there. Longhorn attaches over the network, so the destination volume follows it — the
# copy crosses the VPN once, which is fine for 30MB and is exactly what we are removing
# from the steady state.
#
# Bump the name suffix to re-run. Jobs are immutable, so Flux cannot patch this in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: openhands-migrate-state-v1
  namespace: openhands
spec:
  ttlSecondsAfterFinished: 604800
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: ff-oci2
      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: alpine:3.22
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache rsync >/dev/null
              if [ -e /new/.migrated ]; then
                echo "[migrate] destination already seeded, nothing to do"
                exit 0
              fi
              echo "[migrate] copying agent state"
              rsync -a --info=stats2 /old/openhands-state/ /new/
              date -u +%FT%TZ > /new/.migrated
              echo "[migrate] done; /workspace is intentionally NOT copied (repo-sync rebuilds it)"
          volumeMounts:
            - name: old
              mountPath: /old
            - name: new
              mountPath: /new
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: openhands
        - name: new
          persistentVolumeClaim:
            claimName: openhands-state
