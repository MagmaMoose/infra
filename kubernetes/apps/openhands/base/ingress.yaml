apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openhands
  namespace: openhands
  labels:
    app: openhands
  annotations:
    # LAN-only aliases (openhands.sargeant.co -> Traefik LB on a private 192.168.x IP),
    # DNS-01 issuer. These are NOT on the tunnel and NOT Access-gated — they are only
    # reachable from RFC1918 — and stay as the fallback for when the Cloudflare edge is
    # down. The primary entrypoint is now openhands.magmamoose.com below.
    cert-manager.io/cluster-issuer: letsencrypt-dns
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/service.serversscheme: http
spec:
  ingressClassName: traefik
  rules:
    - host: openhands.sargeant.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openhands
                port:
                  number: 8000
    - host: openhands.sargeant.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openhands
                port:
                  number: 8000
  tls:
    - hosts:
        - openhands.sargeant.co
      secretName: openhands-tls
---
# openhands.magmamoose.com — the primary, off-LAN entrypoint. This Ingress exists
# only so external-dns publishes the proxied CNAME (the `target` annotation) and
# cert-manager mints the cert; request routing is the firefly cloudflared tunnel
# (terraform/cloudflare/zero-trust/prod/tunnels.tf), which connects straight to the
# Service and bypasses Traefik. Same shape as n8n/sonarqube/dependency-track.
#
# This host carries real risk — OpenHands edits code and acts as Caleb on GitHub —
# so it is gated by the Caleb-only Cloudflare Access app with macOS device posture
# (access_apps.tf → openhands). Do not add path bypasses to that app, and do not
# widen it to the Friends group.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openhands-magmamoose
  namespace: openhands
  labels:
    app: openhands
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-dns
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: 7694eb38-c35e-4905-bd2b-16ab7053080a.cfargotunnel.com
    traefik.ingress.kubernetes.io/service.serversscheme: http
    traefik.ingress.kubernetes.io/entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: openhands.magmamoose.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openhands
                port:
                  number: 8000
  tls:
    - hosts:
        - openhands.magmamoose.com
      secretName: openhands-magmamoose-tls
