# Chargate/KICS suppression: the scanner flagged shell variable references like
# ${BOOTSTRAP_LLM_API_KEY:-} inside the seed script as "hardcoded secrets". These are
# environment variable lookups; the actual values are injected from the `openhands` Secret
# (OCI Vault via ExternalSecrets) at pod runtime. No secret value is hardcoded here.
# Reviewed and accepted as a false positive.
# kics-scan disable=baee238e-1921-4801-9c3f-79ae1d7b2cbc
apiVersion: v1
kind: ConfigMap
metadata:
  name: openhands-bootstrap
  namespace: openhands
data:
  # OpenHands V1 stores its LLM settings encrypted in the state volume, so configure it
  # through the authenticated settings API during startup. The script is idempotent and
  # always exits successfully so a transient bootstrap failure does not restart the pod.
  seed.sh: |
    #!/bin/bash
    set -uo pipefail

    LOG="${HOME}/.openhands/seed.log"
    if [ -w /proc/1/fd/1 ]; then exec >>/proc/1/fd/1 2>&1; else exec >>"$LOG" 2>&1; fi

    BASE="http://127.0.0.1:${PORT:-8000}"
    KEY_FILE="${HOME}/.openhands/agent-canvas/api-key.txt"

    log() { printf '[openhands-seed] %s\n' "$*"; }

    for _ in $(seq 1 60); do
      if curl -fsS -o /dev/null "${BASE}/alive" \
        && { [ -n "${OH_SESSION_API_KEYS_0:-}" ] || [ -s "$KEY_FILE" ]; }; then break; fi
      sleep 3
    done
    if ! curl -fsS -o /dev/null "${BASE}/alive"; then
      log "agent-server not alive after 180s; skipping seed"
      exit 0
    fi

    # A Vault-provided key gives Nievah stable headless authentication. For a fresh or
    # manually operated instance, retain the image-generated key as the fallback.
    SESSION_KEY="${OH_SESSION_API_KEYS_0:-}"
    # Lifecycle hooks start as a separate process, so they do not inherit the deployment
    # wrapper's exported value. Apply the same normalization before using this key as an HTTP
    # header; a pasted trailing newline is invalid in a header and otherwise causes 401.
    if [ -n "$SESSION_KEY" ]; then
      SESSION_KEY="$(printf '%s' "$SESSION_KEY" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
    fi
    if [ -z "$SESSION_KEY" ] && [ -s "$KEY_FILE" ]; then SESSION_KEY="$(cat "$KEY_FILE")"; fi
    if [ -z "$SESSION_KEY" ]; then
      log "no session API key available; skipping seed"
      exit 0
    fi

    # ---- LLM profiles ---------------------------------------------------------
    # Profiles live in ~/.openhands/profiles on the state PVC, so they cannot be mounted
    # from Git and have to be seeded through the API. POST /api/profiles/{name} is an
    # upsert, which makes this safe to re-run on every pod start.
    LLM_BASE="http://litellm.automation.svc.cluster.local:8080"
    PRIMARY_PROFILE="gpt-5.6-luna"

    put_profile() {
      _name="$1"; _model="$2"; _effort="$3"
      jq -n --arg m "litellm_proxy/${_model}" --arg b "$LLM_BASE" \
            --arg k "${BOOTSTRAP_LLM_API_KEY:-}" --arg e "$_effort" '{
        llm: {
          model: $m,
          base_url: $b,
          api_key: $k,
          reasoning_effort: $e,
          native_tool_calling: true,
          drop_params: true,
          num_retries: 5,
          timeout: 300
        }
      }' | curl -fsS -o /dev/null -X POST "${BASE}/api/profiles/${_name}" \
            -H 'Content-Type: application/json' \
            -H "X-Session-API-Key: ${SESSION_KEY}" --data @- \
        && log "profile ${_name} saved" \
        || log "WARNING: profile ${_name} failed"
    }

    # litellm_proxy/ is the provider prefix the gateway expects. Do NOT use openai/ here:
    # it reaches the same endpoint but bypasses LiteLLM's model-group routing, so per-model
    # budgets and the key's model allow-list stop being enforced.
    put_profile gpt-5.6-luna    gpt-5.6-luna    high
    put_profile gpt-5.6-sol     gpt-5.6-sol     high
    put_profile gpt-5.6-terra   gpt-5.6-terra   medium
    put_profile deepseek-v4-pro deepseek-v4-pro medium

    # ---- MCP servers ----------------------------------------------------------
    # The Slack server needs a team id alongside the bot token and there is no vault entry
    # for it; auth.test returns the one the token belongs to, so derive it rather than
    # hardcoding a value that would silently rot if the token moved workspaces.
    SLACK_TEAM_ID=""
    if [ -n "${BOOTSTRAP_SLACK_BOT_TOKEN:-}" ]; then
      SLACK_TEAM_ID="$(curl -fsS -H "Authorization: Bearer ${BOOTSTRAP_SLACK_BOT_TOKEN}" \
        https://slack.com/api/auth.test 2>/dev/null | jq -r '.team_id // empty')"
      [ -n "$SLACK_TEAM_ID" ] || log "WARNING: slack auth.test gave no team_id; slack MCP will be skipped"
    fi

    # npx-based servers resolve packages at first use. npm_config_cache and
    # PLAYWRIGHT_BROWSERS_PATH point at the state PVC (see the Deployment), so the
    # ~150MB Chromium download survives a pod restart instead of repeating.
    MCP_CONFIG="$(jq -n \
      --arg gh    "${BOOTSTRAP_GITHUB_TOKEN:-}" \
      --arg slack "${BOOTSTRAP_SLACK_BOT_TOKEN:-}" \
      --arg team  "$SLACK_TEAM_ID" \
      --arg cu    "${BOOTSTRAP_CLICKUP_TOKEN:-}" '
      {
        context7: {
          transport: "http",
          url: "https://mcp.context7.com/mcp",
          description: "Current library and framework documentation"
        },
        playwright: {
          transport: "stdio",
          command: "npx",
          args: ["-y", "@playwright/mcp@latest", "--headless", "--isolated"],
          description: "Browser automation"
        },
        mermaid: {
          transport: "stdio",
          command: "npx",
          args: ["-y", "mcp-mermaid"],
          description: "Render and validate Mermaid diagrams"
        },
        ms365: {
          transport: "stdio",
          command: "npx",
          args: ["-y", "@softeria/ms-365-mcp-server"],
          description: "Microsoft 365 mail, calendar and files (run its login tool once)"
        }
      }
      + (if $gh    != "" then { github: {
           transport: "http",
           url: "https://api.githubcopilot.com/mcp/",
           auth: { strategy: "bearer", value: $gh },
           description: "GitHub repositories, issues, pull requests and Actions"
         } } else {} end)
      + (if $slack != "" and $team != "" then { slack: {
           transport: "stdio",
           command: "npx",
           args: ["-y", "@modelcontextprotocol/server-slack"],
           env: { SLACK_BOT_TOKEN: $slack, SLACK_TEAM_ID: $team },
           description: "Slack channels and messages"
         } } else {} end)
      + (if $cu    != "" then { clickup: {
           transport: "stdio",
           command: "npx",
           args: ["-y", "@taazkareem/clickup-mcp-server"],
           env: { CLICKUP_API_KEY: $cu },
           description: "ClickUp tasks and lists"
         } } else {} end)
    ')"

    # ---- Settings -------------------------------------------------------------
    # One PATCH carries the active LLM, the sub-agent switch, the MCP map and the git
    # identity. enable_sub_agents defaults to false, so the mounted definitions in
    # ~/.agents/agents are inert until this flips it.
    jq -n \
      --arg m "litellm_proxy/${PRIMARY_PROFILE}" \
      --arg b "$LLM_BASE" \
      --arg k "${BOOTSTRAP_LLM_API_KEY:-}" \
      --arg p "$PRIMARY_PROFILE" \
      --arg gn "${GIT_AUTHOR_NAME:-}" \
      --arg ge "${GIT_AUTHOR_EMAIL:-}" \
      --argjson mcp "$MCP_CONFIG" '{
        agent_settings_diff: {
          llm: { model: $m, base_url: $b, api_key: $k },
          enable_sub_agents: true,
          mcp_config: $mcp
        },
        misc_settings_diff: {
          app_preferences: { git_user_name: $gn, git_user_email: $ge }
        },
        active_profile: $p
      }' | curl -fsS -o /dev/null -X PATCH "${BASE}/api/settings" \
          -H 'Content-Type: application/json' \
          -H "X-Session-API-Key: ${SESSION_KEY}" \
          --data @- \
      && log "settings applied (profile=${PRIMARY_PROFILE}, sub-agents on, $(echo "$MCP_CONFIG" | jq 'keys|length') MCP servers)" \
      || log "WARNING: PATCH /api/settings failed"

    # ---- Stored secrets -------------------------------------------------------
    # custom_secrets are exposed to the agent's shell, which is how it authenticates git
    # pushes. Kept separate from mcp_config: that map configures servers, this is what the
    # agent itself can read.
    put_secret() {
      [ -n "$2" ] || return 0
      jq -n --arg n "$1" --arg v "$2" '{custom_secrets: {($n): {value: $v}}}' \
        | curl -fsS -o /dev/null -X PUT "${BASE}/api/settings/secrets" \
            -H 'Content-Type: application/json' \
            -H "X-Session-API-Key: ${SESSION_KEY}" --data @- \
        && log "secret $1 stored" \
        || log "WARNING: storing $1 failed"
    }
    put_secret GITHUB_TOKEN   "${BOOTSTRAP_GITHUB_TOKEN:-}"
    put_secret SLACK_BOT_TOKEN "${BOOTSTRAP_SLACK_BOT_TOKEN:-}"
    put_secret CLICKUP_API_KEY "${BOOTSTRAP_CLICKUP_TOKEN:-}"

    # ---- Sub-agents -----------------------------------------------------------
    # Rescans ~/.agents/agents (mounted from the openhands-subagents ConfigMap) and the
    # builtin set. Without this the definitions are only picked up on a cold start.
    jq -n '{load_user: true, load_project: false, load_builtin: true}' \
      | curl -fsS -o /dev/null -X POST "${BASE}/api/sub-agents" \
          -H 'Content-Type: application/json' \
          -H "X-Session-API-Key: ${SESSION_KEY}" --data @- \
      && log "sub-agents reloaded" \
      || log "WARNING: sub-agent reload failed"

    exit 0
