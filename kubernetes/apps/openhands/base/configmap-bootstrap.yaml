# Chargate/KICS suppression: the scanner flagged shell variable references like
# ${BOOTSTRAP_LLM_API_KEY:-} inside the seed script as "hardcoded secrets". These are
# environment variable lookups; the actual values are injected from the `openhands` Secret
# (OCI Vault via ExternalSecrets) at pod runtime. No secret value is hardcoded here.
# Reviewed and accepted as a false positive.
# kics-scan disable=baee238e-1921-4801-9c3f-79ae1d7b2cbc
apiVersion: v1
kind: ConfigMap
metadata:
  name: openhands-bootstrap
  namespace: openhands
data:
  # OpenHands V1 stores its LLM settings encrypted in the state volume, so configure it
  # through the authenticated settings API during startup. The script is idempotent and
  # always exits successfully so a transient bootstrap failure does not restart the pod.
  seed.sh: |
    #!/bin/bash
    set -uo pipefail

    LOG="${HOME}/.openhands/seed.log"
    if [ -w /proc/1/fd/1 ]; then exec >>/proc/1/fd/1 2>&1; else exec >>"$LOG" 2>&1; fi

    BASE="http://127.0.0.1:${PORT:-8000}"
    KEY_FILE="${HOME}/.openhands/agent-canvas/api-key.txt"

    log() { printf '[openhands-seed] %s\n' "$*"; }

    # ---- Global git config ------------------------------------------------
    # All of this lives in ~/.gitconfig, which is on the ephemeral container
    # filesystem. Rewritten on every pod start (same pattern as all ephemeral
    # config here). Runs before the agent-server wait so it's in place the
    # instant the agent can start working.

    # Hooks path — must come before credential helpers so the first `git` operation
    # the agent runs has both auth and hooks already configured.
    git config --global core.hooksPath /git-hooks

    # SSH → HTTPS rewrites so the agent works with SSH-style remote URLs out of
    # the box. Matches the workstation's GIT_CONFIG_* wiring in settings.json.
    git config --global url."https://github.com/".insteadOf            "git@github.com:"
    git config --global url."https://pinkroccade.ghe.com/".insteadOf   "git@pinkroccade.ghe.com:"
    git config --global --add url."https://pinkroccade.ghe.com/".insteadOf "Pinkroccade@Pinkroccade.ghe.com:"

    # Credential helpers: shell functions that echo the token from the live pod
    # environment at auth time. The literal env var names are written into
    # .gitconfig; git evaluates them via `sh -c` when it runs the helper, so the
    # values come from the process environment, not from the config file itself.
    # github.com: x-access-token is the username git expects with a PAT.
    # pinkroccade.ghe.com: sargea50 is the enterprise username.
    git config --global credential."https://github.com".helper \
      '!f() { echo "username=x-access-token"; echo "password=${BOOTSTRAP_GITHUB_TOKEN:-}"; }; f'
    git config --global credential."https://pinkroccade.ghe.com".helper \
      '!f() { echo "username=sargea50"; echo "password=${BOOTSTRAP_GHE_TOKEN:-}"; }; f'

    log "git config: hooksPath, URL rewrites, credential helpers ready"

    # ---- Claude Code session config (inside-pod claude invocations) -------
    # Writes ~/.claude/settings.json so any `claude` CLI session spawned inside this
    # pod inherits the same PreToolUse + SessionStart hooks enforced on the workstation:
    #   PreToolUse/Bash  → block-hook-bypass.sh  (no --no-verify, no SKIP=)
    #   SessionStart     → agent-bootstrap.sh     (SSH signing setup if key is provisioned)
    # The env section applies HTTPS URL rewrites globally, matching the workstation's
    # GIT_CONFIG_* env wiring so SSH-style git remotes work without extra setup.
    # ~/.claude is on the ephemeral container filesystem; writing it here on every
    # start is intentional — same pattern as core.hooksPath above.
    _SSH_SOCK="/home/openhands/.openhands/ssh/agent.sock"
    mkdir -p "${HOME}/.claude"
    jq -n --arg sock "$_SSH_SOCK" '{
      env: {
        GIT_CONFIG_COUNT:   "3",
        GIT_CONFIG_KEY_0:   "url.https://github.com/.insteadOf",
        GIT_CONFIG_VALUE_0: "git@github.com:",
        GIT_CONFIG_KEY_1:   "url.https://pinkroccade.ghe.com/.insteadOf",
        GIT_CONFIG_VALUE_1: "git@pinkroccade.ghe.com:",
        GIT_CONFIG_KEY_2:   "url.https://pinkroccade.ghe.com/.insteadOf",
        GIT_CONFIG_VALUE_2: "Pinkroccade@Pinkroccade.ghe.com:",
        SSH_AUTH_SOCK:      $sock
      },
      hooks: {
        PreToolUse: [
          {
            matcher: "Bash",
            hooks: [{type: "command", command: "/git-hooks/block-hook-bypass.sh"}]
          }
        ],
        SessionStart: [
          {
            hooks: [{type: "command", command: "/git-hooks/agent-bootstrap.sh"}]
          }
        ]
      }
    }' > "${HOME}/.claude/settings.json"
    log "~/.claude/settings.json written (PreToolUse/Bash + SessionStart hooks)"
    unset _SSH_SOCK

    # ---- Chargate CLI install ---------------------------------------------
    # Install a reviewed immutable Chargate revision into a virtualenv on the state PVC.
    # The revision marker makes the venv survive pod restarts while still converging when
    # this pin is deliberately changed in Git.
    CHARGATE_VENV="${HOME}/.openhands/chargate-venv"
    CHARGATE_REVISION="e5e1ca4dfa613d1059611797955f70436f143159"  # DevSkim: ignore DS173237 - immutable public Chargate commit, not a credential
    CHARGATE_SOURCE="https://github.com/MagmaMoose/chargate/archive/${CHARGATE_REVISION}.tar.gz"
    _cg_installed_revision="$(cat "${CHARGATE_VENV}/.source-revision" 2>/dev/null || true)"

    if [ "${_cg_installed_revision}" != "${CHARGATE_REVISION}" ]; then
      log "installing chargate revision ${CHARGATE_REVISION} ..."
      if python3 -m venv "${CHARGATE_VENV}" 2>/dev/null; then
        if "${CHARGATE_VENV}/bin/pip" install --quiet --no-deps \
          "chargate @ ${CHARGATE_SOURCE}"; then
          printf '%s\n' "${CHARGATE_REVISION}" > "${CHARGATE_VENV}/.source-revision"
          log "chargate revision ${CHARGATE_REVISION} ready"
        else
          log "WARNING: chargate pip install failed"
        fi
      else
        log "WARNING: python3 -m venv failed; chargate not installed"
      fi
    else
      log "chargate revision ${CHARGATE_REVISION} already current"
    fi
    unset _cg_installed_revision

    for _ in $(seq 1 60); do
      if curl -fsS -o /dev/null "${BASE}/alive" \
        && { [ -n "${OH_SESSION_API_KEYS_0:-}" ] || [ -s "$KEY_FILE" ]; }; then break; fi
      sleep 3
    done
    if ! curl -fsS -o /dev/null "${BASE}/alive"; then
      log "agent-server not alive after 180s; skipping seed"
      exit 0
    fi

    # A Vault-provided key gives Nievah stable headless authentication. For a fresh or
    # manually operated instance, retain the image-generated key as the fallback.
    SESSION_KEY="${OH_SESSION_API_KEYS_0:-}"
    # Lifecycle hooks start as a separate process, so they do not inherit the deployment
    # wrapper's exported value. Apply the same normalization before using this key as an HTTP
    # header; a pasted trailing newline is invalid in a header and otherwise causes 401.
    if [ -n "$SESSION_KEY" ]; then
      SESSION_KEY="$(printf '%s' "$SESSION_KEY" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
    fi
    if [ -z "$SESSION_KEY" ] && [ -s "$KEY_FILE" ]; then SESSION_KEY="$(cat "$KEY_FILE")"; fi
    if [ -z "$SESSION_KEY" ]; then
      log "no session API key available; skipping seed"
      exit 0
    fi

    # ---- LLM profiles ---------------------------------------------------------
    # Profiles live in ~/.openhands/profiles on the state PVC, so they cannot be mounted
    # from Git and have to be seeded through the API. POST /api/profiles/{name} is an
    # upsert, which makes this safe to re-run on every pod start.
    LLM_BASE="http://litellm.automation.svc.cluster.local:8080"  # DevSkim: ignore DS137138 - in-cluster ClusterIP, not externally reachable
    PRIMARY_PROFILE="gpt-5.6-luna"

    # put_profile <name> <model> <base_url> <api_key> <reasoning_effort> [api_version]
    put_profile() {
      jq -n --arg m "$2" --arg b "$3" --arg k "$4" --arg e "$5" --arg v "${6:-}" '{
        llm: ({
          model: $m,
          base_url: $b,
          api_key: $k,
          reasoning_effort: $e,
          native_tool_calling: true,
          drop_params: true,
          num_retries: 5,
          timeout: 300
        } + (if $v != "" then {api_version: $v} else {} end))
      }' | curl -fsS -o /dev/null -X POST "${BASE}/api/profiles/$1" \
            -H 'Content-Type: application/json' \
            -H "X-Session-API-Key: ${SESSION_KEY}" --data @- \
        && log "profile $1 saved" \
        || log "WARNING: profile $1 failed"
    }

    # litellm_proxy/ is the provider prefix the gateway expects. Do NOT use openai/ here:
    # it reaches the same endpoint but bypasses LiteLLM's model-group routing, so per-model
    # budgets and the key's model allow-list stop being enforced.
    put_profile gpt-5.6-luna  litellm_proxy/gpt-5.6-luna  "$LLM_BASE" "${BOOTSTRAP_LLM_API_KEY:-}" high
    put_profile gpt-5.6-sol   litellm_proxy/gpt-5.6-sol   "$LLM_BASE" "${BOOTSTRAP_LLM_API_KEY:-}" high
    put_profile gpt-5.6-terra litellm_proxy/gpt-5.6-terra "$LLM_BASE" "${BOOTSTRAP_LLM_API_KEY:-}" medium

    # PinkAI, PinkRoccade's Azure OpenAI resource, for Caleb's PinkRoccade work in the UI.
    # It goes straight to Azure, NOT through the LiteLLM gateway: the key is for manual use
    # here only, and on the gateway any client with a broad enough key (Nievah, Hermes,
    # the fallback aliases) could reach it. The key is the resource's key2, which no
    # PinkRoccade workload uses, so it can be regenerated to cut this pod off without
    # touching their gateway on key1. 2025-04-01-preview is the oldest api_version at
    # which Azure serves the Responses API, which the SDK uses for the gpt-5 family; the
    # SDK's own Azure default is older. When the key is present, PinkAI is the default.
    PINKAI_API_VERSION="2025-04-01-preview"
    if [ -n "${BOOTSTRAP_PINKAI_API_KEY:-}" ] && [ -n "${BOOTSTRAP_PINKAI_BASE_URL:-}" ]; then
      put_profile pinkai-gpt-5.6-sol   azure/gpt-5.6-sol   "$BOOTSTRAP_PINKAI_BASE_URL" "$BOOTSTRAP_PINKAI_API_KEY" high   "$PINKAI_API_VERSION"
      put_profile pinkai-gpt-5.6-terra azure/gpt-5.6-terra "$BOOTSTRAP_PINKAI_BASE_URL" "$BOOTSTRAP_PINKAI_API_KEY" medium "$PINKAI_API_VERSION"
      put_profile pinkai-gpt-5.6-luna  azure/gpt-5.6-luna  "$BOOTSTRAP_PINKAI_BASE_URL" "$BOOTSTRAP_PINKAI_API_KEY" high   "$PINKAI_API_VERSION"
      PRIMARY_PROFILE="pinkai-gpt-5.6-sol"
    fi

    # ---- MCP servers ----------------------------------------------------------
    # The Slack server needs a team id alongside the bot token and there is no vault entry
    # for it; auth.test returns the one the token belongs to, so derive it rather than
    # hardcoding a value that would silently rot if the token moved workspaces.
    SLACK_TEAM_ID=""
    if [ -n "${BOOTSTRAP_SLACK_BOT_TOKEN:-}" ]; then
      SLACK_TEAM_ID="$(curl -fsS --max-time 10 -H "Authorization: Bearer ${BOOTSTRAP_SLACK_BOT_TOKEN}" \
        https://slack.com/api/auth.test 2>/dev/null | jq -r '.team_id // empty')"
      [ -n "$SLACK_TEAM_ID" ] || log "WARNING: slack auth.test gave no team_id; slack MCP will be skipped"
    fi

    # npx-based servers resolve packages at first use. npm_config_cache and
    # PLAYWRIGHT_BROWSERS_PATH point at the state PVC (see the Deployment), so the
    # ~150MB Chromium download survives a pod restart instead of repeating.
    # mcp-mermaid@0.4.1 uses mermaid-isomorphic and Playwright, not Puppeteer. Its
    # Playwright 1.52 launcher adds --no-sandbox unless chromiumSandbox is explicitly true,
    # which is the setting required by this pod's dropped-capability security context.
    # Pass the browser cache through the server environment; PUPPETEER_* variables would be
    # ignored by this renderer and could make a future configuration look effective when it is not.
    _BROWSER_CACHE="${PLAYWRIGHT_BROWSERS_PATH:-/home/openhands/.openhands/cache/playwright}"

    # No Nievah server. It used to send this pod's own session key as its bearer, which
    # Nievah never accepted (its MCP token is a separate Vault entry), so every connect
    # handed the credential that controls OpenHands to another service for a 401. Giving
    # it Nievah's real token instead would hand operator rights over Nievah to an agent
    # that reads untrusted repositories, so it is left out.
    MCP_CONFIG="$(jq -n \
      --arg gh      "${BOOTSTRAP_GITHUB_TOKEN:-}" \
      --arg slack   "${BOOTSTRAP_SLACK_BOT_TOKEN:-}" \
      --arg team    "$SLACK_TEAM_ID" \
      --arg cu      "${BOOTSTRAP_CLICKUP_TOKEN:-}" \
      --arg browser_cache "$_BROWSER_CACHE" '
      {
        context7: {
          transport: "http",
          url: "https://mcp.context7.com/mcp",
          description: "Current library and framework documentation"
        },
        playwright: {
          transport: "stdio",
          command: "npx",
          args: ["-y", "@playwright/mcp@0.0.81", "--headless", "--isolated"],
          description: "Browser automation"
        },
        mermaid: {
          transport: "stdio",
          command: "npx",
          args: ["-y", "mcp-mermaid@0.4.1"],
          env: { PLAYWRIGHT_BROWSERS_PATH: $browser_cache },
          description: "Render and validate Mermaid diagrams"
        },
        ms365: {
          transport: "stdio",
          command: "npx",
          args: ["-y", "@softeria/ms-365-mcp-server@0.154.0"],
          description: "Microsoft 365 mail, calendar and files (run its login tool once)"
        },
        "docs-magmamoose": {
          transport: "http",
          url: "https://docs.magmamoose.com/mcp",
          description: "MagmaMoose public documentation — architecture notes, runbooks and decision records. Search it before answering questions about how something is deployed."
        },
        "mcp-calebsargeant": {
          transport: "http",
          url: "https://mcp.calebsargeant.com",
          description: "Caleb Sargeant knowledge base: CV and website (roles since 2012, skills, certs) plus personal tech docs at docs.calebsargeant.com (networking, Kubernetes, cloud, automation). Call get_profile for who he is, search_docs before answering anything about his experience."
        }
      }
      + (if $gh != "" then { github: {
           transport: "http",
           url: "https://api.githubcopilot.com/mcp/",
           auth: { strategy: "bearer", value: $gh },
           description: "GitHub repositories, issues, pull requests and Actions"
         } } else {} end)
      + (if $slack != "" and $team != "" then { slack: {
           transport: "stdio",
           command: "npx",
           args: ["-y", "@modelcontextprotocol/server-slack@2025.4.25"],
           env: { SLACK_BOT_TOKEN: $slack, SLACK_TEAM_ID: $team },
           description: "Slack channels and messages"
         } } else {} end)
      + (if $cu != "" then { clickup: {
           transport: "stdio",
           command: "npx",
           args: ["-y", "@taazkareem/clickup-mcp-server@0.14.5"],
           env: { CLICKUP_API_KEY: $cu },
           description: "ClickUp tasks and lists"
         } } else {} end)
    ')"
    unset _BROWSER_CACHE

    # The settings PATCH deep-merges mcp_config, so a server dropped from the map above
    # would otherwise live on in the stored settings. A null deletes a nested key: null
    # out every stored server Git no longer declares, so the map converges to this file.
    _STORED_MCP="$(curl -fsS -H "X-Session-API-Key: ${SESSION_KEY}" "${BASE}/api/settings" \
      | jq -c '.agent_settings.mcp_config // {} | keys' 2>/dev/null)"
    _GONE="$(jq -cn --argjson want "$MCP_CONFIG" --argjson have "${_STORED_MCP:-[]}" \
      '[$have[] | select(. as $k | $want | has($k) | not)]')"
    MCP_DIFF="$(jq -cn --argjson want "$MCP_CONFIG" --argjson gone "$_GONE" \
      '$want + ($gone | map({(.): null}) | add // {})')"
    [ "$_GONE" = "[]" ] || log "MCP servers no longer in Git, removing: $(jq -r 'join(", ")' <<<"$_GONE")"
    unset _STORED_MCP _GONE

    # ---- Attribution policy -----------------------------------------------------
    # The SDK's built-in prompt tells the model to add "Co-authored-by: openhands" to
    # commits and an "AI agent (OpenHands)" disclosure line to every PR, issue, comment and
    # message it posts. Neither section can be switched off by a setting, so this suffix
    # overrides both by name. The commit-msg hook and the gh wrapper in /git-hooks stay as
    # the backstop for anything that slips through.
    ATTRIBUTION_POLICY="$(cat <<'POLICY'
    <ATTRIBUTION_POLICY>
    The user has opted out of AI attribution. This overrides the AI disclosure rule in EXTERNAL_SERVICES and the Co-authored-by and git identity rule in VERSION_CONTROL:
    * Never add Co-authored-by trailers, "Generated with" or "Generated by" lines, or any other AI or OpenHands credit to commit messages.
    * Never add an AI disclosure note, such as "This PR was created by an AI agent (OpenHands) on behalf of the user", to pull requests, issues, comments, reviews, chat messages, emails or anything else posted to an external service.
    * Do not set git user.name or user.email. The commit identity already comes from the environment.
    </ATTRIBUTION_POLICY>
    POLICY
    )"

    # ---- Skills ---------------------------------------------------------------
    # Read every file from the openhands-skills ConfigMap and inject them inline. jq -s
    # over an empty glob still yields [], so an empty ConfigMap clears skills rather
    # than failing. Filename minus .md is the skill name.
    SKILLS="$(for f in /skills/*.md; do
      [ -f "$f" ] || continue
      jq -n --arg n "$(basename "$f" .md)" --rawfile c "$f" '{name: $n, content: $c}'
    done | jq -s '.')"
    log "$(echo "$SKILLS" | jq 'length') skills loaded from /skills"

    # ---- Settings -------------------------------------------------------------
    # One PATCH carries the active LLM, the sub-agent switch, the MCP map and the git
    # identity. enable_sub_agents defaults to false, so the mounted definitions in
    # ~/.agents/agents are inert until this flips it. There is no `llm` in the diff on
    # purpose: active_profile then loads that profile's LLM whole, so switching between
    # the gateway and PinkAI leaves no stale field (an api_version, say) behind.
    jq -n \
      --arg p "$PRIMARY_PROFILE" \
      --arg gn "${GIT_AUTHOR_NAME:-}" \
      --arg ge "${GIT_AUTHOR_EMAIL:-}" \
      --arg suffix "$ATTRIBUTION_POLICY" \
      --argjson mcp "$MCP_DIFF" \
      --argjson sk "$SKILLS" '{
        agent_settings_diff: {
          enable_sub_agents: true,
          mcp_config: $mcp,
          # Serial tool calls by default. 4 is a straight win on read-heavy work like
          # exploring an unfamiliar repo, where the calls are independent reads.
          tool_concurrency_limit: 4,
          agent_context: {
            skills: $sk,
            load_user_skills: true,
            # Carried explicitly: agent_context is replaced wholesale by this diff, so
            # omitting it would drop the default marketplace path.
            marketplace_path: "marketplaces/default.json",
            system_message_suffix: $suffix
          }
        },
        misc_settings_diff: {
          app_preferences: { git_user_name: $gn, git_user_email: $ge }
        },
        active_profile: $p
      }' | curl -fsS -o /dev/null -X PATCH "${BASE}/api/settings" \
          -H 'Content-Type: application/json' \
          -H "X-Session-API-Key: ${SESSION_KEY}" \
          --data @- \
      && log "settings applied (profile=${PRIMARY_PROFILE}, sub-agents on, $(echo "$MCP_CONFIG" | jq 'keys|length') MCP servers)" \
      || log "WARNING: PATCH /api/settings failed"

    # ---- Agent profile ----------------------------------------------------------
    # The UI launches conversations from the active agent profile, not from agent
    # settings: the profile's llm_profile_ref picks the LLM and its own
    # system_message_suffix is the one that reaches the prompt. Point it at the primary
    # profile and give it the attribution policy. GET on the list seeds a default
    # profile on a fresh instance, so there is always one to update.
    AGENT_PROFILE="$(curl -fsS -H "X-Session-API-Key: ${SESSION_KEY}" "${BASE}/api/agent-profiles" \
      | jq -r '.active_agent_profile_id as $a | .profiles[] | select(.id == $a) | .name' 2>/dev/null)"
    if [ -n "$AGENT_PROFILE" ]; then
      curl -fsS -H "X-Session-API-Key: ${SESSION_KEY}" "${BASE}/api/agent-profiles/${AGENT_PROFILE}" \
        | jq --arg p "$PRIMARY_PROFILE" --arg s "$ATTRIBUTION_POLICY" \
            '.profile | .llm_profile_ref = $p | .system_message_suffix = $s' \
        | curl -fsS -o /dev/null -X POST "${BASE}/api/agent-profiles/${AGENT_PROFILE}" \
            -H 'Content-Type: application/json' \
            -H "X-Session-API-Key: ${SESSION_KEY}" --data @- \
        && log "agent profile ${AGENT_PROFILE} uses ${PRIMARY_PROFILE}, attribution policy set" \
        || log "WARNING: updating agent profile ${AGENT_PROFILE} failed"
    else
      log "WARNING: no active agent profile found; conversations keep their previous LLM"
    fi

    # ---- Stored secrets -------------------------------------------------------
    # Stored secrets are exposed to the agent's shell as environment variables, which
    # is how gh authenticates. Kept separate from mcp_config: that map configures
    # servers, this is what the agent itself can read. gh picks GH_ENTERPRISE_TOKEN for
    # repositories whose remote is pinkroccade.ghe.com and GITHUB_TOKEN for the rest.
    put_secret() {
      [ -n "$2" ] || return 0
      jq -n --arg n "$1" --arg v "$2" --arg d "$3" '{name: $n, value: $v, description: $d}' \
        | curl -fsS -o /dev/null -X PUT "${BASE}/api/settings/secrets" \
            -H 'Content-Type: application/json' \
            -H "X-Session-API-Key: ${SESSION_KEY}" --data @- \
        && log "secret $1 stored" \
        || log "WARNING: storing $1 failed"
    }
    put_secret GITHUB_TOKEN        "${BOOTSTRAP_GITHUB_TOKEN:-}"    "github.com token for git and gh"
    put_secret GH_ENTERPRISE_TOKEN "${BOOTSTRAP_GHE_TOKEN:-}"       "pinkroccade.ghe.com token for gh"
    put_secret SLACK_BOT_TOKEN     "${BOOTSTRAP_SLACK_BOT_TOKEN:-}" "Slack bot token"
    put_secret CLICKUP_API_KEY     "${BOOTSTRAP_CLICKUP_TOKEN:-}"   "ClickUp API token"

    # ---- Sub-agents -----------------------------------------------------------
    # Rescans ~/.agents/agents (mounted from the openhands-subagents ConfigMap) and the
    # builtin set. Without this the definitions are only picked up on a cold start.
    jq -n '{load_user: true, load_project: false, load_builtin: true}' \
      | curl -fsS -o /dev/null -X POST "${BASE}/api/sub-agents" \
          -H 'Content-Type: application/json' \
          -H "X-Session-API-Key: ${SESSION_KEY}" --data @- \
      && log "sub-agents reloaded" \
      || log "WARNING: sub-agent reload failed"

    # ---- Workspaces ------------------------------------------------------------
    # The repo mirror is useless in the UI until its directories are registered: the
    # workspace picker lists only what /api/workspaces knows about, and it starts empty.
    # Each owner directory is registered as a PARENT, so every repository under it is
    # selectable and repos cloned later appear with no further registration.
    #
    # Directory names are derived from repo-sync's own owners.txt rather than listed
    # here, so adding an owner is one line in one file. Reading the file instead of the
    # filesystem also matters on first boot, when the sidecar has not created them yet.
    # The line grammar is <owner>[@host] [as <dir>], and this must stay in step with
    # sync.sh's parser.
    if [ -r /reposync/owners.txt ]; then
      PARENTS="$(awk '
        /^[[:space:]]*(#|$)/ { next }
        {
          dir = $1; sub(/@.*/, "", dir)
          if ($2 == "as" && $3 != "") dir = $3
          print dir
        }' /reposync/owners.txt \
        | jq -R -s 'split("\n") | map(select(length > 0))
                    | {parents: map({id: ., name: ., path: ("/workspace/repos/" + .)})}')"
      echo "$PARENTS" \
        | curl -fsS -o /dev/null -X POST "${BASE}/api/workspaces/parents" \
            -H 'Content-Type: application/json' \
            -H "X-Session-API-Key: ${SESSION_KEY}" --data @- \
        && log "workspace parents registered: $(echo "$PARENTS" | jq -r '[.parents[].name] | join(", ")')" \
        || log "WARNING: registering workspace parents failed"
    else
      log "WARNING: /reposync/owners.txt not mounted; workspaces not registered"
    fi

    exit 0
