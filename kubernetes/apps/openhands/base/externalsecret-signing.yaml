# Separate ExternalSecret so a missing vault entry does not block the main `openhands`
# Secret: if `openhands-ssh-signing-key` is absent from OCI Vault this ExternalSecret
# will fail to sync, but the pod still starts (the Deployment references this secret with
# optional: true). Once the vault entry is provisioned the secret will appear automatically.
#
# Vault entry to create:
#   Name:  openhands-ssh-signing-key
#   Value: OpenSSH private key content (the key at op://Tech/raxfcw4kufj3yz6xh3rmp7a7zm)
#          registered with GitHub as a signing key for 4991715+CalebSargeant@users.noreply.github.com
#
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openhands-signing
  namespace: openhands
spec:
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: openhands-signing
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: key
      remoteRef:
        key: openhands-ssh-signing-key
