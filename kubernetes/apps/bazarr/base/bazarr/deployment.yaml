apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      containers:
        - name: bazarr
          image: linuxserver/bazarr:1.6.0 # {"$imagepolicy": "flux-system:bazarr"}
          resources:
            # KRR-sized (2026-07): cpu 11m, memory 329Mi. No CPU limit so indexing
            # bursts aren't throttled; memory limit keeps headroom over the request.
            requests:
              # ff-vm1 fit (infra#501): request = steady state, obs ~237Mi; 512Mi limit
              memory: "304Mi"
              cpu: "11m"
            limits:
              memory: "512Mi"
          ports:
            - containerPort: 6767 # Bazarr web interface
          env:
            - name: PUID
              value: "1000" # Replace with your user ID
            - name: PGID
              value: "1000" # Replace with your group ID
            - name: TZ
              value: "Europe/Amsterdam" # Replace with your timezone
          volumeMounts:
            - mountPath: /config
              name: bazarr
            - mountPath: /movies
              name: movies
            - mountPath: /downloads
              name: downloads
            - mountPath: /series
              name: series
      volumes:
        - name: bazarr
          persistentVolumeClaim:
            claimName: bazarr
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
        - name: series
          persistentVolumeClaim:
            claimName: series
