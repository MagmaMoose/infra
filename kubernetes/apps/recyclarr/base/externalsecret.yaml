# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
---
# Migrated from secret.enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: recyclarr-api-keys — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: recyclarr-secrets
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: recyclarr-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: RADARR_API_KEY # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: recyclarr-api-keys
        property: RADARR_API_KEY
    - secretKey: SONARR_API_KEY # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: recyclarr-api-keys
        property: SONARR_API_KEY
