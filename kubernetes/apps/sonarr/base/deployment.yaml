apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      initContainers:
        # config.xml comes from Git (the SOPS ConfigMap), but Sonarr has to be able to write
        # it: 4.0.20 persists new keys such as AllowedHosts at startup. On the old read-only
        # subPath mount it failed with "Access to the path '/config/config.xml' is denied"
        # and sat dead inside a Running pod. Copying the file onto the config volume on
        # every start keeps Git authoritative (each restart overwrites it) and lets image
        # automation keep bumping the tag. Radarr and Prowlarr do the same.
        - name: seed-config
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - rm -f /config/config.xml && cp /seed/config.xml /config/config.xml && chmod 600 /config/config.xml
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - mountPath: /config
              name: sonarr
            - mountPath: /seed
              name: sonarr-config
              readOnly: true
      containers:
        - name: sonarr
          image: linuxserver/sonarr:4.0.20 # {"$imagepolicy": "flux-system:sonarr"}
          # right-sized: observed ~213Mi usage; request frees scheduling headroom, limit stays generous to avoid OOM
          resources:
            requests:
              memory: "320Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
          ports:
            - containerPort: 8989 # sonarr web interface
          # /ping needs no API key and only answers once the app has started. With the
          # default rolling update (maxUnavailable 0 for one replica), a release that cannot
          # start never becomes Ready, so the old pod keeps serving instead of a 502.
          readinessProbe:
            httpGet:
              path: /ping
              port: 8989
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: PUID
              value: "1000" # Replace with your user ID
            - name: PGID
              value: "1000" # Replace with your group ID
            - name: TZ
              value: "Europe/Amsterdam" # Replace with your timezone
            # neondb_owner DB password from the single source of truth (ExternalSecret
            # sonarr-db ← OCI Vault neondb-owner-password, also enforced on the role by
            # CNPG). This env overrides <PostgresPassword> in config.xml, so the password
            # lives in exactly one place and can't drift.
            - name: SONARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarr-db
                  key: password
          volumeMounts:
            - mountPath: /config
              name: sonarr
            - mountPath: /series
              name: series
            - mountPath: /downloads
              name: downloads
      volumes:
        - name: sonarr
          persistentVolumeClaim:
            claimName: sonarr
        - name: sonarr-config
          configMap:
            name: sonarr-config
        - name: series
          persistentVolumeClaim:
            claimName: series
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
