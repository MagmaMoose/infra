apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 10m
  chart:
    spec:
      chart: authentik
      version: "2026.5.3"
      sourceRef:
        kind: HelmRepository
        name: goauthentik
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      env:
        # Authentik needs Redis — use the shared authless Valkey (own DB index to
        # avoid colliding with DefectDojo). NOT a bundled redis (chart has none).
        - name: AUTHENTIK_REDIS__HOST
          value: valkey.database.svc.cluster.local
        - name: AUTHENTIK_REDIS__DB
          value: "4"
        # DB coordinates MUST live here in global.env, NOT under authentik.postgresql
        # below: when `existingSecret` is set, the chart injects only that secret's
        # keys and ignores authentik.postgresql.*, so the pod never received
        # AUTHENTIK_POSTGRESQL__HOST and defaulted to 127.0.0.1 → connection refused.
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: postgres-rw.database.svc.cluster.local
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: neondb_owner
    authentik:
      # Single secret carries AUTHENTIK_SECRET_KEY + POSTGRESQL__PASSWORD +
      # BOOTSTRAP_* (env-injected into server + worker).
      existingSecret:
        secretName: authentik
      # Shared CloudNativePG, not the chart's (already-disabled) bundled Postgres.
      postgresql:
        host: postgres-rw.database.svc.cluster.local
        name: authentik
        user: neondb_owner
      error_reporting:
        enabled: false
    postgresql:
      enabled: false
    server:
      # Priority class, per the desired-state table in cleanup.md.
      # Set in chart values because the Kyverno assign-priority-class policy
      # cannot reach a chart-rendered workload — the placement label lands on
      # the HelmRelease, not the Deployment the chart renders.
      priorityClassName: high
      nodeSelector:
        node-role.kubernetes.io/worker: ""
        topology.sargeant.co/tier: on-prem
      ingress:
        enabled: false
    worker:
      # Priority class, per the desired-state table in cleanup.md.
      # Set in chart values because the Kyverno assign-priority-class policy
      # cannot reach a chart-rendered workload — the placement label lands on
      # the HelmRelease, not the Deployment the chart renders.
      priorityClassName: high
      nodeSelector:
        node-role.kubernetes.io/worker: ""
        topology.sargeant.co/tier: on-prem
