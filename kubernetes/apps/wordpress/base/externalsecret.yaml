---
# Migrated from secret.enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: wordpress-db-credentials — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: wordpress-db
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: db-password # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: wordpress-db-credentials
        property: db-password
    - secretKey: db-user # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: wordpress-db-credentials
        property: db-user
