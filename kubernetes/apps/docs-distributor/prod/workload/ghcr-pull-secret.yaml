# Mirror `ghcr-pull-secret` from flux-system into docs-distributor with the external-secrets
# Kubernetes provider, the same pattern as the other magmamoose products. RBAC is in
# base/ghcr-reader-rbac.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docs-distributor-ghcr-reader
  namespace: docs-distributor
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ghcr-pull-secret-mirror
  namespace: docs-distributor
spec:
  provider:
    kubernetes:
      remoteNamespace: flux-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: docs-distributor
          key: ca.crt
      auth:
        serviceAccount:
          name: docs-distributor-ghcr-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: docs-distributor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ghcr-pull-secret-mirror
    kind: SecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    # Re-emit the source's kubernetes.io/dockerconfigjson shape so kubelet
    # recognises it as an image-pull credential. The dot-prefixed key needs
    # index syntax in the Go template.
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ index . `.dockerconfigjson` }}"
  dataFrom:
    - extract:
        key: ghcr-pull-secret
