# KICS 3e2d3b2f "hardcoded secret key" is a false positive: the `secretKey` values are
# ExternalSecret field NAMES that map to OCI Vault entries; no secret value is present.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# The one Secret docs-distributor reads (the chart's secrets.existingSecret). Every key is
# a docs-distributor-* entry in OCI Vault, seeded by hand BEFORE this merges (an absent key
# fails the whole ExternalSecret):
#
#   mapping.yml / mapping-terms.yml  the PRIVATE mapping, split in two to stay under the
#                                    vault's per-secret size limit. It holds the source's
#                                    URL too, which is why no source is named in this repo.
#   github-app-id / -private-key     an App with contents + pull-requests write on the
#                                    docs repo and issues write on the tool's own repo
#   source-token-cloud-platform      a READ-ONLY token for the source; nothing else
#   claude-oauth-token               `claude setup-token`; the upstream bearer on the -max
#                                    models behind LiteLLM
#   litellm-api-key                  a LiteLLM virtual key scoped to the -max models
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: docs-distributor
  namespace: docs-distributor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: docs-distributor
    creationPolicy: Owner
  data:
    - secretKey: mapping.yml
      remoteRef:
        key: docs-distributor-mapping
    - secretKey: mapping-terms.yml
      remoteRef:
        key: docs-distributor-mapping-terms
    - secretKey: github-app-id
      remoteRef:
        key: docs-distributor-github-app-id
    - secretKey: github-app-private-key
      remoteRef:
        key: docs-distributor-github-app-key
    - secretKey: source-token-cloud-platform
      remoteRef:
        key: docs-distributor-source-token-cloud-platform
    - secretKey: claude-oauth-token
      remoteRef:
        key: docs-distributor-claude-oauth-token
    - secretKey: litellm-api-key
      remoteRef:
        key: docs-distributor-litellm-key
