apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# flux-system-scoped control plane (chart source, image automation, ghcr reader RBAC) plus
# the cluster-scoped Namespace; each carries its own metadata.namespace.
resources:
  - namespace.yaml
  - gitrepository.yaml
  - image-automation.yaml
  - ghcr-reader-rbac.yaml
