apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: automation
spec:
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: litellm
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # LiteLLM gateway master key (generate one, prefix `sk-`). Clients
    # authenticate to the gateway with this key (x-litellm-api-key header).
    - secretKey: master-key
      remoteRef:
        key: litellm-master-key
    # Anthropic API key — the Claude models are now on per-token API billing
    # (OAuth Max-subscription pass-through removed). Consumed as ANTHROPIC_API_KEY.
    - secretKey: anthropic-api-key
      remoteRef:
        key: litellm-anthropic-api-key
    # OpenAI + DeepSeek API keys (per-token billing for the gpt-5.x / deepseek-v4 models).
    - secretKey: openai-api-key
      remoteRef:
        key: openai-api-key
    - secretKey: deepseek-api-key
      remoteRef:
        key: litellm-deepseek-api-key
    # Admin UI: Postgres connection string + UI login password.
    - secretKey: database-url
      remoteRef:
        key: litellm-database-url
    - secretKey: ui-password
      remoteRef:
        key: litellm-ui-password
    - secretKey: ollama-lan-api-key
      remoteRef:
        key: litellm-ollama-lan-api-key
    # Scoped virtual key for OpenHands. The litellm-keyseed Job upserts this exact
    # value into the proxy DB as the `openhands` key (see keyseed-job.yaml), and the
    # OpenHands ExternalSecret reads the same vault entry, so both sides agree
    # without the value ever passing through Git. Replaces OpenHands' previous use
    # of the master key, which gave one agent unrestricted rights over the gateway.
    - secretKey: openhands-key
      remoteRef:
        key: openhands-litellm-api-key
    # The same arrangement for Hermes and HolmesGPT, which also used the master key: each
    # reads its own vault entry, and the keyseed Job upserts it with a $25/30d budget.
    - secretKey: hermes-key
      remoteRef:
        key: hermes-litellm-api-key
    - secretKey: holmes-key
      remoteRef:
        key: holmesgpt-litellm-api-key
