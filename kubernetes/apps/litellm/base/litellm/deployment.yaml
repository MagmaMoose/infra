# kics-scan disable=4ac0e2b7-d2d2-4af7-8799-e8de6721ccda
# No CPU limit is intentional repo-wide convention (avoids CFS throttling).
# LiteLLM fronts every agent call so latency spikes from CPU throttling are
# particularly harmful here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      annotations:
        checksum/config: 7f697bc74b2dbbc279870c6efab0fc1ed04a831c200bb6008502933d9ad7afa7
        checksum/auth-proxy-config: 41cbc6f2467fb10b6873fe82106f058bffdf93826ecf2fa87ffb5b6a1c8b2e05
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: Always
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          env:
            # Gateway master key (clients authenticate via x-litellm-api-key).
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: master-key
            # Per-token Anthropic API billing for the Claude models (the OAuth
            # Max-subscription pass-through has been removed).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: anthropic-api-key
            # OpenAI + DeepSeek per-token API billing.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: openai-api-key
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: deepseek-api-key
            # Admin UI (served at /ui) — needs Postgres + UI login creds.
            - name: STORE_MODEL_IN_DB
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: database-url
            - name: UI_USERNAME
              value: "admin"
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: ui-password
            - name: OLLAMA_LAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: ollama-lan-api-key
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            # KRR-sized (2026-07): cpu 406m, memory 1713Mi. Previously supplied by
            # the m.nano profile component (150m/768Mi), which materially
            # under-requested the fleet's busiest service — it fronts every agent
            # call, so it is genuinely CPU- and heap-hungry rather than bursty.
            # No CPU limit (avoids CFS throttling on request fan-out).
            requests:
              cpu: 406m
              # Memory 1360Mi, not KRR's 1713Mi: observed steady state ~1084Mi.
              # ff-vm1 cannot reserve every pod's peak (see infra#501). NB this is
              # also the surge budget for a rolling restart — replicas:1 with
              # maxUnavailable 0 means a restart must fit a SECOND pod of this size
              # alongside the first, so keeping it modest is what makes restarts work.
              memory: 1360Mi
            limits:
              memory: 2Gi
          # /health/liveliness is LiteLLM's unauthenticated liveness endpoint.
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
        - name: auth-proxy
          image: nginx:1.27-alpine
          ports:
            - name: http-proxy
              containerPort: 8080
          volumeMounts:
            - name: auth-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            # KRR-sized (2026-07): cpu 10m, memory 100Mi. CPU limit dropped.
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 192Mi
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: auth-proxy-config
          configMap:
            name: litellm-auth-proxy
