# Upserts the per-client virtual keys that LiteLLM stores in Postgres, which the
# config.yaml ConfigMap cannot express — keys are DB rows, not config. Without this
# the gateway's access model is created by hand in the UI and is not reproducible
# from Git after a database restore.
#
# Idempotent: /key/update first, /key/generate on miss. The key VALUE comes from OCI
# Vault, so re-running never rotates it and OpenHands keeps working across replays.
#
# A VAULT VALUE MUST BE ONE LINE THAT STARTS WITH `sk-`. LiteLLM refuses to create any
# other key and answers 401 to a client presenting one, and a trailing newline breaks every
# client's header. `openssl rand -hex 32 | ... set` produces neither, so store keys with
#   printf 'sk-%s' "$(openssl rand -hex 32)" | scripts/oci-vault-secrets.py -c firefly set <entry>
# The Job checks every value before sending it and names the entry it skipped.
#
# Bump the name suffix (-v1, -v2, ...) whenever the payload below changes. Jobs are
# immutable, so editing this in place would make Flux's apply fail; a new name makes
# the change a new Job. Old completed Jobs can be deleted by hand once succeeded.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-keyseed-v6
  namespace: automation
  annotations:
    checkov.io/skip1: CKV_K8S_11=CPU limits are unset estate-wide by decision; see .trivyignore KSV-0011 and the Kyverno default-limitrange. Memory is limited.
    checkov.io/skip2: CKV_K8S_15=IfNotPresent is the house convention; image is tagged and pulled only when absent, not on every Job run
    checkov.io/skip3: CKV_K8S_35=LITELLM_MASTER_KEY and the seeded client keys are consumed directly by curl in a single-use shell script; there is no file-based credential path without rewriting the script
    checkov.io/skip4: CKV_K8S_43=curlimages/curl pinned to 8.11.1; digest pinning not warranted for this home-lab one-shot Job
spec:
  ttlSecondsAfterFinished: 604800
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: litellm-keyseed
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keyseed
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: master-key
            - name: OPENHANDS_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: openhands-key
            - name: HERMES_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: hermes-key
            - name: HOLMES_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: holmes-key
            - name: NIEVAH_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: nievah-key
            - name: NIEVAH_FALLBACK_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: nievah-fallback-key
            - name: MEM0_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: mem0-key
            - name: CONTRIBUTIONS_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: contributions-key
            - name: TIMESHEET_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: timesheet-key
            - name: DOCS_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: docs-key
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              B=http://litellm.automation.svc.cluster.local:4000  # DevSkim: ignore DS137138 - in-cluster ClusterIP, not externally reachable
              # Management endpoints want the "Bearer " prefix INSIDE the custom header.
              # general_settings.litellm_key_header_name renames the header but does not
              # change the value grammar; sending the bare key returns "Malformed API Key".
              H="x-litellm-api-key: Bearer ${LITELLM_MASTER_KEY}"

              for i in $(seq 1 60); do
                curl -fsS -o /dev/null "$B/health/readiness" && break
                sleep 5
              done

              # valid_key VALUE: one line, `sk-` and then only [A-Za-z0-9_-], 16+ characters.
              valid_key() {
                case "$1" in sk-*) ;; *) return 1 ;; esac
                case "${1#sk-}" in ""|*[!A-Za-z0-9_-]*) return 1 ;; esac
                [ "${#1}" -ge 16 ]
              }

              # seed ALIAS KEY MODELS_JSON MAX_BUDGET: upsert one key. A number is its budget
              # per 30 days; `null` gives it none, and clears one it already had.
              seed() {
                if ! valid_key "$2"; then
                  echo "[keyseed] $1 SKIPPED: its vault entry does not hold one line starting with sk- (see the top of keyseed-job.yaml)"
                  return 1
                fi
                if [ "$4" = null ]; then BD=null; else BD='"30d"'; fi
                PAYLOAD=$(printf '{"key":"%s","key_alias":"%s","models":%s,"max_budget":%s,"budget_duration":%s,"metadata":{"owner":"%s","managed_by":"litellm-keyseed Job"}}' "$2" "$1" "$3" "$4" "$BD" "$1")
                CODE=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$B/key/update" \
                  -H "$H" -H 'Content-Type: application/json' -d "$PAYLOAD")
                if [ "$CODE" = "200" ]; then
                  echo "[keyseed] $1 key updated"
                  return 0
                fi
                echo "[keyseed] $1 update returned $CODE, creating"
                CODE=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$B/key/generate" \
                  -H "$H" -H 'Content-Type: application/json' -d "$PAYLOAD")
                if [ "$CODE" = "200" ]; then
                  echo "[keyseed] $1 key created"
                  return 0
                fi
                echo "[keyseed] $1 FAILED ($CODE):"
                sed 's/sk-[A-Za-z0-9_-]*/sk-REDACTED/g' /tmp/out
                return 1
              }
              FAILED=0

              # max_budget matters most in the case this key exists for: Claude quota runs
              # out, work moves to the per-token gpt-5.6 models, and the agent runs with
              # max_iterations 500 and confirmation_mode off. Without a ceiling a stuck
              # loop bills until someone notices. LiteLLM rejects requests past it.
              #
              # Nievah uses keys of its own below. OpenHands owns the `openhands-only`
              # access group, which expands to Terra and Sol; no other key is given it. Its
              # fallback aliases remain available here for direct OpenHands requests.
              # Re-pointing an alias never needs this list to change.
              seed openhands "$OPENHANDS_KEY" '["fallback-easy","fallback-medium","fallback-hard","gpt-5.6-luna","openhands-only"]' 50 || FAILED=1

              # Hermes and HolmesGPT used to call the gateway with the MASTER key, which no
              # budget applies to, so a looping cron job or a runaway investigation billed
              # without limit. Each now has its own key, capped at $25 per 30 days and allowed
              # only its ROLE names (configmap.yaml, tiers and roles), never a provider model,
              # so a provider switch never needs these lists to change either. Past the cap
              # LiteLLM answers 429 `budget_exceeded` until the window resets.
              seed hermes "$HERMES_KEY" '["agent-chat","agent-light","speech-to-text","text-to-speech"]' 25 || FAILED=1
              seed holmes "$HOLMES_KEY" '["agent-investigate","agent-light"]' 25 || FAILED=1

              # NIEVAH HOLDS TWO KEYS, and they must never be the same one.
              #
              # `nievah` is its GATEWAY key (LITELLM_API_KEY in the nievah namespace, vault
              # entry nievah-litellm-api-key), which every primary leg presents: the Claude
              # Code runs and the direct calls, each on the owner's Claude Max subscription
              # through the three -max pass-through entries. Those entries cannot bill per
              # token (configmap.yaml, the sentinel api_key), so this key can spend no money,
              # and it carries NO budget: the gateway books subscription tokens at list price,
              # and a cap would refuse Nievah's reviews for spend that was never money.
              # (litellm-keyseed-v5 scoped this key to the fallback aliases with a $25 cap,
              # which refuses every primary leg. The list below restores it, and `null` clears
              # the cap.)
              seed nievah "$NIEVAH_KEY" '["claude-haiku-4-5-max","claude-sonnet-4-6-max","claude-opus-4-8-max"]' null || FAILED=1

              # `nievah-fallback` is its FALLBACK key (LITELLM_FALLBACK_API_KEY, vault entry
              # nievah-fallback-litellm-api-key), reached only after every Claude leg failed.
              # It can call the three fallback aliases and nothing else, and all three are on
              # gpt-5.6-luna: Luna is the only fallback Nievah has. Every fallback call, direct
              # or through OpenHands' agent-server (Nievah hands it this key, not OpenHands'
              # own), draws on this one budget.
              seed nievah-fallback "$NIEVAH_FALLBACK_KEY" '["fallback-easy","fallback-medium","fallback-hard"]' 25 || FAILED=1

              # These workloads previously shared the master key. They only need Luna
              # (plus mem0's embedding model), so keep their budgets independent and
              # prevent a compromised app credential from reaching Terra, Sol, or Ollama.
              seed mem0 "$MEM0_KEY" '["gpt-5.6-luna","text-embedding-3-small"]' 10 || FAILED=1
              seed github-contributions "$CONTRIBUTIONS_KEY" '["gpt-5.6-luna"]' 10 || FAILED=1
              seed github-timesheet "$TIMESHEET_KEY" '["gpt-5.6-luna"]' 10 || FAILED=1
              seed docs-distributor "$DOCS_KEY" '["gpt-5.6-luna"]' 10 || FAILED=1
              exit "$FAILED"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
