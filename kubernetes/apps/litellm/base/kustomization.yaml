apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - configmap-auth-proxy.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - ollama-lan-service.yaml
  - ollama-lan-endpoints.yaml
  - ollama-lan-ingress.yaml
  - pdb.yaml
# Pinned to the mini node (ff-vm1, type=mini) instead of native-cloud (ff-oci1/2).
# The OCI free-tier ARM workers are 2-core and run ~95% CPU-requested (~75-90m free),
# so LiteLLM's ~200m pod-template request (150m litellm + 50m auth-proxy) no longer
# schedules there — a restart left the git-desired pod stuck Pending. ff-vm1 (8-core)
# has the headroom. Public reachability is unaffected: the ingress fronts it regardless
# of node.
# Resources set explicitly; the m.nano resource-profile component was removed.
# litellm is the case where a BARE removal would be wrong: containers[0] has no
# inline resources at all, so the profile was its only source and dropping it
# would leave the container with no requests whatsoever.
# CPU 150m -> 25m (KRR measured 16m; a little headroom kept because this is the
# gateway the whole agent fleet routes through and it is latency-sensitive).
# There is no CPU limit, so the request only governs scheduling — under
# contention litellm is protected by its `business` priority class, not by an
# inflated reservation.
#
# MEMORY: request 768Mi, limit 2Gi — deliberately NOT equal.
# An earlier revision of this comment claimed memory was "held at the profile's
# 768Mi". That was wrong and caused an outage of this Deployment: 768Mi was the
# m.nano profile's *request*; its *limit* was 2Gi. Setting the limit to 768Mi
# put a hard cap below the real working set, measured at 1134Mi from the
# running container's cgroup, so every new pod was OOMKilled (exit 137) on
# startup and only the pre-migration ReplicaSet kept the service up.
#
# Why request != limit here, against the request==limit rule used elsewhere:
# that rule is only safe when the value sits above true peak. ff-vm1 is at 99%
# memory *requested*, so raising the request to 1.2Gi+ would leave this pod
# unschedulable. Limits are not reserved by the scheduler, so a 2Gi ceiling
# costs no headroom while removing the OOM. The request stays honest-ish at
# 768Mi and should rise to ~1.25Gi once the node has room — that is gated on
# the Proxmox host, which is at 56GB of 59GB allocated.
patches:
  - target:
      kind: Deployment
      name: litellm
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 768Mi
          limits:
            memory: 2Gi
labels:
  # Placement tier — consumed by the Kyverno `place-on-prem` ClusterPolicy, which
  # adds the nodeSelector at admission. Replaces components/node-selectors/mini.
  # includeSelectors/includeTemplates false: these fields are immutable on a live
  # Deployment/StatefulSet, so touching them would make Flux's next apply fail.
  - pairs:
      # MOVED on-prem -> cloud, 2026-08-07. cleanup.md's desired-state table has
      # listed litellm under "### cloud" all along ("2 (one per node)"); it was
      # pinned on-prem by inheritance from components/node-selectors/mini, and
      # nobody re-checked when the placement tiers were introduced.
      #
      # Verified before moving, because either would have silently broken it:
      #   - the image is multi-arch (amd64 + arm64), so it runs on the OCI Ampere
      #     nodes at all. This was the real risk, not capacity.
      #   - the pod has NO storage anchor: no hostPath, no NFS, no PVC and no
      #     hostNetwork. Nothing ties it to ff-vm1.
      #
      # Not cosmetic. ff-vm1 sits at ~99% memory REQUESTED, which is what stops
      # defectdojo-django and the trivy scan jobs scheduling at all, while the
      # cloud tier has ~10GB unreserved. This pair returns ~2.6GB to the node
      # that has none.
      #
      # Also removes a cross-VPN hop: nievah runs on the cloud tier and calls
      # litellm.automation.svc, so every request was leaving the site to reach a
      # dependency that had no reason to be on-prem.
      placement.sargeant.co/tier: cloud
      placement.sargeant.co/priority: business
    includeSelectors: false
    includeTemplates: false
