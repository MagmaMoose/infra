apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: automation
data:
  config.yaml: |
    # LiteLLM proxy. Two Claude paths coexist:
    #   * `claude-*`      — per-token Anthropic API billing via ANTHROPIC_API_KEY
    #                       (OCI Vault -> ExternalSecret -> Deployment env).
    #   * `claude-*-max`  — Claude Code OAuth pass-through, billed to whichever
    #                       Max subscription the CLIENT's bearer belongs to.
    #
    # HOUSE RULE for clients: authenticate to the gateway with `x-litellm-api-key`
    # ONLY. `Authorization` is reserved for a Claude Code OAuth bearer on the
    # direct :4000 path. Never send the gateway key in `Authorization` to :4000.
    # (The nginx auth-proxy on :8080 exists precisely so OpenAI-protocol clients,
    # which can only use `Authorization`, get mapped onto x-litellm-api-key.)
    # See docs/guides/litellm-clients.md.
    #
    # PINNED PRICES on the tenant-metered entries: the pods fetch LiteLLM's price map from GitHub
    # `main` at start, so a restart could change what a tenant's call costs. These are the
    # values in LiteLLM v1.101.0's model_prices_and_context_window.json, set in model_info so the
    # map cannot move them. Change them here, on purpose, when a provider's price changes.
    #
    # ACCESS GROUP `tenant-metered`: the per-token models a tenant's virtual key or team
    # may be given, by creating it with `models: ["tenant-metered"]`. A key or team
    # created with no `models` can call EVERY model, the -max subscription entries and
    # the LAN Ollama models included, and the Ollama models book $0 so no budget ever
    # trips on them. Never create a tenant key without this group.
    #
    # OPENAI POLICY: gpt-5.6-luna is the default and the only OpenAI chat model the house
    # agents use; gpt-5.6-terra and gpt-5.6-sol are for OpenHands alone. See the OpenAI
    # section of model_list, default_key_generate_params, and keyseed-job.yaml.
    model_list:
      - model_name: claude-opus-4-8
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_key: os.environ/ANTHROPIC_API_KEY
        model_info:
          mode: chat
          access_groups: ["tenant-metered"]
          base_model: anthropic/claude-opus-4-8
          input_cost_per_token: 0.000005
          output_cost_per_token: 0.000025
          cache_read_input_token_cost: 0.0000005
          cache_creation_input_token_cost: 0.00000625
          cache_creation_input_token_cost_above_1hr: 0.00001
          auth_mode: anthropic-api-key
          billing_mode: anthropic-api
          credential_source: oci-vault:litellm-anthropic-api-key
          notes: "Per-token Anthropic API billing via ANTHROPIC_API_KEY. Always uses the operator's key; the client's Authorization is never used here (clean_headers drops any non-sk-ant-oat bearer). For subscription billing use the -max alias instead."
      - model_name: claude-sonnet-4-6
        litellm_params:
          model: anthropic/claude-sonnet-4-6
          api_key: os.environ/ANTHROPIC_API_KEY
        model_info:
          mode: chat
          access_groups: ["tenant-metered"]
          base_model: anthropic/claude-sonnet-4-6
          input_cost_per_token: 0.000003
          output_cost_per_token: 0.000015
          cache_read_input_token_cost: 0.0000003
          cache_creation_input_token_cost: 0.00000375
          cache_creation_input_token_cost_above_1hr: 0.000006
          auth_mode: anthropic-api-key
          billing_mode: anthropic-api
          credential_source: oci-vault:litellm-anthropic-api-key
          notes: "Per-token Anthropic API billing via ANTHROPIC_API_KEY. Always uses the operator's key; the client's Authorization is never used here (clean_headers drops any non-sk-ant-oat bearer). For subscription billing use the -max alias instead."
      - model_name: claude-haiku-4-5
        litellm_params:
          model: anthropic/claude-haiku-4-5
          api_key: os.environ/ANTHROPIC_API_KEY
        model_info:
          mode: chat
          access_groups: ["tenant-metered"]
          base_model: anthropic/claude-haiku-4-5
          input_cost_per_token: 0.000001
          output_cost_per_token: 0.000005
          cache_read_input_token_cost: 0.0000001
          cache_creation_input_token_cost: 0.00000125
          cache_creation_input_token_cost_above_1hr: 0.000002
          auth_mode: anthropic-api-key
          billing_mode: anthropic-api
          credential_source: oci-vault:litellm-anthropic-api-key
          notes: "Per-token Anthropic API billing via ANTHROPIC_API_KEY. Always uses the operator's key; the client's Authorization is never used here (clean_headers drops any non-sk-ant-oat bearer). For subscription billing use the -max alias instead."
      # --- Claude Code Max OAuth pass-through (subscription-billed) ---
      # Restores the pre-eeab55b pass-through as SEPARATE -max names so the API-key
      # entries above keep serving per-token billing (openclaw). Clients (Nievah's
      # headless reviews) authenticate to LiteLLM with x-litellm-api-key and carry
      # their own Claude Code OAuth bearer in Authorization, which LiteLLM forwards
      # upstream.
      #
      # api_key MUST be set to the non-secret sentinel below. Leaving it unset does
      # NOT mean "client credential required" — litellm resolves a missing api_key
      # through AnthropicModelInfo.get_api_key(None), which falls back to the
      # ANTHROPIC_API_KEY env var. A client that omitted the OAuth bearer therefore
      # billed the operator's per-token Anthropic account while the entry claimed
      # billing_mode: claude-max-subscription (verified on 1.95.0: Anthropic
      # answered such a call with an authenticated billing error + request_id).
      # The sentinel makes that case fail closed at Anthropic instead; a client
      # that DOES send `Authorization: Bearer sk-ant-oat...` still overrides it,
      # because optionally_handle_anthropic_oauth() prefers the OAuth header and
      # drops x-api-key entirely.
      - model_name: claude-opus-4-8-max
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_key: "oauth-pass-through-only-no-api-key"
        model_info:
          mode: chat
          base_model: anthropic/claude-opus-4-8
          auth_mode: claude-code-oauth-pass-through
          billing_mode: claude-max-subscription
          credential_source: client_authorization_header
          notes: "Max-subscription pass-through: LiteLLM forwards the client's Claude Code OAuth bearer upstream. REQUIRES the client to send Authorization: Bearer sk-ant-oat...; without it the request fails closed at Anthropic on the sentinel api_key rather than falling back to the operator's ANTHROPIC_API_KEY."
      - model_name: claude-sonnet-4-6-max
        litellm_params:
          model: anthropic/claude-sonnet-4-6
          api_key: "oauth-pass-through-only-no-api-key"
        model_info:
          mode: chat
          base_model: anthropic/claude-sonnet-4-6
          auth_mode: claude-code-oauth-pass-through
          billing_mode: claude-max-subscription
          credential_source: client_authorization_header
          notes: "Max-subscription pass-through: LiteLLM forwards the client's Claude Code OAuth bearer upstream. REQUIRES the client to send Authorization: Bearer sk-ant-oat...; without it the request fails closed at Anthropic on the sentinel api_key rather than falling back to the operator's ANTHROPIC_API_KEY."
      - model_name: claude-haiku-4-5-max
        litellm_params:
          model: anthropic/claude-haiku-4-5
          api_key: "oauth-pass-through-only-no-api-key"
        model_info:
          mode: chat
          base_model: anthropic/claude-haiku-4-5
          auth_mode: claude-code-oauth-pass-through
          billing_mode: claude-max-subscription
          credential_source: client_authorization_header
          notes: "Max-subscription pass-through: LiteLLM forwards the client's Claude Code OAuth bearer upstream. REQUIRES the client to send Authorization: Bearer sk-ant-oat...; without it the request fails closed at Anthropic on the sentinel api_key rather than falling back to the operator's ANTHROPIC_API_KEY."
      - model_name: qwen2.5-coder-7b-instruct-local
        litellm_params:
          model: ollama_chat/qwen2.5-coder:7b-instruct-q4_K_M
          api_base: http://ollama-lan.automation.svc.cluster.local:11434
          api_key: os.environ/OLLAMA_LAN_API_KEY
          keep_alive: 30m
        model_info:
          mode: chat
          base_model: ollama_chat/qwen2.5-coder:7b-instruct-q4_K_M
          auth_mode: bearer-token-to-ollama-lan
          billing_mode: self-hosted
          credential_source: oci-vault:litellm-ollama-lan-api-key
          supports_function_calling: false
          supports_parallel_function_calling: false
          notes: "Self-hosted Ollama qwen2.5-coder model. LiteLLM exposes it through the OpenAI-compatible chat/completions API for clients such as Warp. Live probes show tool-call-shaped JSON in message content, not structured OpenAI tool_calls."
      # Agent-capable local model for Warp Agent Mode. Qwen3 emits native
      # structured tool_calls via Ollama's tools template, so unlike
      # qwen2.5-coder it can drive Warp's tool loop. qwen3:4b at q4 (~2.5GB)
      # fits the GTX 1060 6GB with headroom for the KV cache that Warp's large
      # agent prompts need. supports_function_calling MUST be true here, or
      # LiteLLM (with the global drop_params) strips the `tools` param and the
      # model never receives them.
      - model_name: qwen3-4b
        litellm_params:
          model: ollama_chat/qwen3:4b
          api_base: http://ollama-lan.automation.svc.cluster.local:11434
          api_key: os.environ/OLLAMA_LAN_API_KEY
          keep_alive: 30m
        model_info:
          mode: chat
          base_model: ollama_chat/qwen3:4b
          auth_mode: bearer-token-to-ollama-lan
          billing_mode: self-hosted
          credential_source: oci-vault:litellm-ollama-lan-api-key
          supports_function_calling: true
          supports_parallel_function_calling: false
          notes: "Self-hosted Ollama qwen3:4b-q4_K_M. Tool-calling enabled for Warp Agent Mode (native tool_calls via Ollama's tools template). Sized for GTX 1060 6GB at q4."
      # --- OpenAI (per-token API billing via OPENAI_API_KEY) ---
      # WHO MAY CALL WHAT. gpt-5.6-luna is the only OpenAI chat model a client gets unless it
      # is given more on purpose: every role below runs on it, and a key created without a
      # model list gets it and nothing else (default_key_generate_params, litellm_settings).
      # gpt-5.6-terra and gpt-5.6-sol are for OpenHands alone. They form the `openhands-only`
      # access group, which the keyseed Job gives to the `openhands` key and to no other key,
      # and no role points at them. Apart from that key only the master key reaches them, and
      # no workload makes model calls with it.
      #
      # gpt-5.5, gpt-5.4-mini and gpt-4o-mini used to be listed here too. Any key created
      # without a model list, and every workload that held the master key, could spend on
      # them, so they were removed. Do not add an OpenAI chat model back without a key that
      # needs it: a model in this list is a model every unrestricted key can call.
      #
      # These three ids were verified against GET https://api.openai.com/v1/models on
      # 2026-09-15. There is no bare `gpt-5.6`, so the variant suffix is mandatory.
      #
      # PRICES ARE PINNED for the reason given for the tenant-metered entries above: a pod
      # restart must not change what a call costs, and a key's budget only trips if spend is
      # booked at a real price. These are LiteLLM v1.101.0's /model/info values for the gpt-5.6
      # family on 2026-09-24. The light tier below reuses Luna's through the &luna anchors.
      - model_name: gpt-5.6-luna
        litellm_params: &luna
          model: openai/gpt-5.6-luna
          api_key: os.environ/OPENAI_API_KEY
        model_info: &luna-info
          mode: chat
          base_model: openai/gpt-5.6-luna
          input_cost_per_token: 0.0000002
          output_cost_per_token: 0.0000012
          cache_read_input_token_cost: 0.00000002
          billing_mode: openai-api
          credential_source: oci-vault:openai-api-key
      - model_name: gpt-5.6-terra
        litellm_params:
          model: openai/gpt-5.6-terra
          api_key: os.environ/OPENAI_API_KEY
        model_info:
          mode: chat
          access_groups: ["openhands-only"]
          base_model: openai/gpt-5.6-terra
          input_cost_per_token: 0.000002
          output_cost_per_token: 0.000012
          cache_read_input_token_cost: 0.0000002
          billing_mode: openai-api
          credential_source: oci-vault:openai-api-key
          notes: "OpenHands only: the openhands key is the one key given the openhands-only group, and no role points here."
      - model_name: gpt-5.6-sol
        litellm_params:
          model: openai/gpt-5.6-sol
          api_key: os.environ/OPENAI_API_KEY
        model_info:
          mode: chat
          access_groups: ["openhands-only"]
          base_model: openai/gpt-5.6-sol
          input_cost_per_token: 0.000004
          output_cost_per_token: 0.00002
          cache_read_input_token_cost: 0.0000004
          billing_mode: openai-api
          credential_source: oci-vault:openai-api-key
          notes: "OpenHands only: the openhands key is the one key given the openhands-only group, and no role points here."
      # --- The tier and the roles: the ONE place the house agents' model is chosen ---
      # Nievah's fallback, Hermes and HolmesGPT never name a provider model. Each calls a ROLE
      # name below, and every role points at the one TIER, `tier-light`, whose params and
      # prices are the &light and &light-info anchors; each role copies them in with
      # `<<: *anchor`.
      #
      # So moving provider (OpenAI today, whoever is cheaper or better tomorrow) is editing
      # `tier-light` alone: point its `<<:` at another provider entry, or write `model`,
      # `api_key` and pinned prices there. Every role follows on the next reconcile, with no
      # Nievah release and no change in the Hermes or Holmes repos.
      #
      # There is ONE tier on purpose. A standard tier (gpt-5.6-terra) and a heavy tier
      # (gpt-5.6-sol) used to sit beside it, with Hermes and Holmes on standard; both were
      # moved to Luna and then removed, so that no role can reach terra or sol by swapping an
      # anchor back. Those two models are OpenHands' alone.
      #
      # Roles, and who calls them (each caller's key and budget are in keyseed-job.yaml):
      #   fallback-easy / -medium / -hard  Nievah, after every Claude leg failed (nievah-fallback key)
      #   agent-chat                       Hermes, every conversation and cron run
      #   agent-investigate                HolmesGPT, every investigation (Nievah's alerts too)
      #   agent-light                      cheap summarising work, such as Holmes' health checks
      #   speech-to-text / text-to-speech  Hermes voice on Slack
      - model_name: tier-light
        litellm_params: &light
          <<: *luna
        model_info: &light-info
          <<: *luna-info
      # Nievah's three fallback names stay separate so the gateway's spend shows which kind of
      # Nievah work fell back. All three are on light and must stay there: Luna is the only
      # fallback Nievah is allowed, and its fallback key can call these three names and nothing
      # else.
      - model_name: fallback-easy
        litellm_params:
          <<: *light
        model_info:
          <<: *light-info
          notes: "Nievah fallback alias for easy work (classify, PR descriptions). Reached only after every Claude leg failed."
      - model_name: fallback-medium
        litellm_params:
          <<: *light
        model_info:
          <<: *light-info
          notes: "Nievah fallback alias for medium work (issue plans, triage, gate reviews, planner narrative). Reached only after every Claude leg failed."
      - model_name: fallback-hard
        litellm_params:
          <<: *light
        model_info:
          <<: *light-info
          notes: "Nievah fallback alias for hard work (the planner, hard PR reviews). Reached only after every Claude leg failed."
      - model_name: agent-chat
        litellm_params:
          <<: *light
        model_info:
          <<: *light-info
          notes: "Hermes: every Slack and Telegram conversation and every cron run."
      - model_name: agent-investigate
        litellm_params:
          <<: *light
        model_info:
          <<: *light-info
          notes: "HolmesGPT: every investigation, including the ones Nievah asks for on firing alerts."
      - model_name: agent-light
        litellm_params:
          <<: *light
        model_info:
          <<: *light-info
          notes: "Cheap summarising work, such as Holmes' scheduled health checks and digests."
      # Speech is its own provider choice: the chat tier above does not transcribe or speak.
      # Priced by LiteLLM's own map rather than pinned. The hermes key is the only key given
      # these, so their spend counts against its budget.
      - model_name: speech-to-text
        litellm_params:
          model: openai/gpt-4o-mini-transcribe
          api_key: os.environ/OPENAI_API_KEY
        model_info:
          mode: audio_transcription
          base_model: openai/gpt-4o-mini-transcribe
          billing_mode: openai-api
          credential_source: oci-vault:openai-api-key
          notes: "Hermes: transcribes voice messages sent on Slack."
      - model_name: text-to-speech
        litellm_params:
          model: openai/gpt-4o-mini-tts
          api_key: os.environ/OPENAI_API_KEY
        model_info:
          mode: audio_speech
          base_model: openai/gpt-4o-mini-tts
          billing_mode: openai-api
          credential_source: oci-vault:openai-api-key
          notes: "Hermes: spoken replies on Slack, when voice replies are switched on."
      # --- Embeddings for the mem0 fleet-memory service ---
      # mem0's embedder, registered so mem0 (which talks OpenAI-protocol to this gateway)
      # resolves it. It is not a chat model, so there is no Luna to use instead. Only the
      # mem0 key is given it; mem0's extraction calls run on gpt-5.6-luna. They ran on
      # gpt-4o-mini until that entry was removed with the other non-Luna OpenAI chat models.
      - model_name: text-embedding-3-small
        litellm_params:
          model: openai/text-embedding-3-small
          api_key: os.environ/OPENAI_API_KEY
        model_info:
          mode: embedding
          base_model: openai/text-embedding-3-small
          billing_mode: openai-api
          credential_source: oci-vault:openai-api-key
          notes: "mem0's embedder. The mem0 key is the one key given this model."
      # --- DeepSeek (per-token API billing via DEEPSEEK_API_KEY) ---
      - model_name: deepseek-v4-pro
        litellm_params:
          model: deepseek/deepseek-v4-pro
          api_key: os.environ/DEEPSEEK_API_KEY
          api_base: https://api.deepseek.com
        model_info:
          mode: chat
          access_groups: ["tenant-metered"]
          base_model: deepseek/deepseek-v4-pro
          input_cost_per_token: 0.00000132
          output_cost_per_token: 0.00000396
          cache_read_input_token_cost: 0.000000044
          billing_mode: deepseek-api
          credential_source: oci-vault:litellm-deepseek-api-key
      - model_name: deepseek-v4-flash
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
          api_base: https://api.deepseek.com
        model_info:
          mode: chat
          access_groups: ["tenant-metered"]
          base_model: deepseek/deepseek-v4-flash
          input_cost_per_token: 0.00000044
          output_cost_per_token: 0.00000132
          cache_read_input_token_cost: 0.000000014
          billing_mode: deepseek-api
          credential_source: oci-vault:litellm-deepseek-api-key
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # WHO CAN GET IN. Nobody can register themselves: the UI is served on the LAN/VPN
      # host only (ingress.yaml; the public litellm-warp tunnel forwards
      # /v1/chat/completions and /v1/models and nothing else), and it signs in with
      # UI_USERNAME/UI_PASSWORD or an invite an admin created. The one self-service path
      # LiteLLM has is SSO: once a provider is configured (env, or the UI's SSO settings),
      # every first-time SSO sign-in creates a user. `admin_only` turns everyone but a proxy
      # admin away from the UI on THAT path only (LiteLLM checks it in the SSO callback,
      # verified on 1.103.0), and default_internal_user_params below leaves such a user on
      # gpt-5.6-luna with a $0 budget. An invited user with a password still signs in, so
      # do not invite anyone you would not give a key to.
      ui_access_mode: admin_only
      # Shared spend counters, budget reservations and rate limits across the 2 replicas.
      # Without it each pod keeps its own counter and only sees the other pod's spend
      # after the ~10s DB flush and its 60s key/team cache, so a budget overshoots and
      # rpm/tpm/parallel limits hold per pod (seen on 1.101.0: a key already over budget
      # was refused by one pod and served by the other). If Redis is down, each pod falls
      # back to its own counter. This is NOT `litellm_settings.cache`, which would serve
      # cached responses across callers and book the hits at $0. db 0 is another app's.
      coordination_redis:
        url: redis://valkey-oci.database.svc.cluster.local:6379/1
      # Keep request and response bodies out of LiteLLM_SpendLogs (spend, tokens and
      # model are still recorded). The default is already false; pinned here because a
      # value saved from the admin UI wins over the default but not over a YAML key.
      store_prompts_in_spend_logs: false
      # NOTE: `forward_client_headers_to_llm_api` is deliberately NOT set here.
      # As a global flag it forwarded every client `x-*` header to EVERY provider
      # (OpenAI, DeepSeek, Ollama), not just the Claude pass-through entries. It is
      # now scoped to the -max model groups under litellm_settings below.
      #
      # It was never what made the Claude OAuth pass-through work. On 1.95.0 the
      # bearer travels via add_provider_specific_headers_to_request(), which is
      # called unconditionally and is already scoped to anthropic/bedrock/vertex_ai;
      # _get_forwardable_headers() only ever forwards `x-*` and `anthropic-beta`,
      # never Authorization.
      #
      # Dedicated header for the proxy master key. The nginx auth-proxy maps
      # OpenAI-style `Authorization: Bearer` onto this header for OpenAI-protocol
      # clients (Warp, Codex, Hermes, the OpenAI SDK).
      litellm_key_header_name: x-litellm-api-key
    litellm_settings:
      # Least-privilege replacement for the old global flag: forward client headers
      # ONLY for the Claude Max pass-through groups. Anything not listed here (the
      # per-token Anthropic/OpenAI/DeepSeek entries, the local Ollama models) gets
      # no client headers forwarded upstream at all.
      model_group_settings:
        forward_client_headers_to_llm_api:
          - claude-opus-4-8-max
          - claude-sonnet-4-6-max
          - claude-haiku-4-5-max
      # NOTE: `forward_llm_provider_auth_headers` is deliberately NOT set.
      # It is not required for the Claude OAuth pass-through (verified on 1.95.0:
      # clean_headers() preserves an `sk-ant-oat*` Authorization regardless of this
      # flag). What it DOES enable is litellm_pre_call_utils.py:1405 — any client
      # may send `x-api-key: <anything>` and have it override the deployment's
      # configured key for ANY model, and have that key forwarded upstream.
      drop_params: true
      # Only a proxy admin may create a key that belongs to no team, so a signed-in non-admin
      # cannot mint themselves one. Virtual keys come from the keyseed Job and from Nievah's
      # console, both with the master key. This MUST sit under litellm_settings: LiteLLM
      # reads it from here into litellm.key_generation_settings, and a top-level
      # `key_generation_settings:` (where it was first added) is silently ignored.
      key_generation_settings:
        personal_key_generation:
          allowed_user_roles: ["proxy_admin"]
      # THE DEFAULT IS gpt-5.6-luna. A key with no model list reaches every model on this
      # gateway, gpt-5.6-terra and gpt-5.6-sol included. This gives a key generated with
      # `models: []` (what the UI sends when no model is picked) gpt-5.6-luna and nothing
      # else. Every key the keyseed Job and Nievah's console create names its models, so
      # none of them changes. Only `models` is defaulted: a default max_budget would also
      # land on the console's tenant keys, whose budget belongs to their team.
      default_key_generate_params:
        models: ["gpt-5.6-luna"]
      # A user created by a first SSO sign-in (none can happen today, see ui_access_mode):
      # view-only, gpt-5.6-luna, and a $0 budget, so it can spend nothing until an admin
      # decides otherwise.
      default_internal_user_params:
