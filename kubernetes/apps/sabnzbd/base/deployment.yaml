apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sabnzbd
          image: linuxserver/sabnzbd:4.5.5 # {"$imagepolicy": "flux-system:sabnzbd"}
          ports:
            - containerPort: 8080
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
          volumeMounts:
            - mountPath: /config
              name: sabnzbd-config
            - mountPath: /downloads
              name: downloads
          resources:
            requests:
              # right-sized: observed ~118Mi usage; 256Mi frees scheduling headroom
              memory: "256Mi"
              cpu: "200m"
              ephemeral-storage: "1Gi"
            limits:
              # Limits don't affect scheduling. SABnzbd's article cache counts against
              # this limit, and its size is app state (Config > General > Tuning > Article Cache
              # Limit, `cache_limit` in sabnzbd.ini), not Git. At 1G it OOM-killed SABnzbd
              # mid-download on 2026-09-16; it is now 256M. Keep it well under this limit.
              memory: "512Mi"
              cpu: "750m"
              ephemeral-storage: "4Gi"
      volumes:
        - name: sabnzbd-config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
