apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Intentionally only references env overlays (prod, ...). ./base/platform2 is the
# app's control-plane library (OCI chart source, GHCR credential, namespace) —
# applied by the per-env Flux Kustomization (see
# prod/platform2/flux-kustomization.yaml), not aggregated directly.
resources:
  - ./prod
