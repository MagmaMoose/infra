# KICS 3e2d3b2f "hardcoded secret key" is a false positive: `secretKey` values
# are ExternalSecret field NAMES that map to OCI Vault entries — no secret value
# is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# The backend's runtime credentials, projected into one Secret the chart consumes
# via `existingSecret` (envFrom on the Deployment and the CronJob; the migration
# hook reads DATABASE_URL straight out of it, since the release ConfigMap does
# not exist yet when that hook fires).
#
# Written here rather than left to the chart's own `externalSecret:` block —
# which values-firefly.yaml uses — for one reason that then decides both charts:
# DATABASE_URL has to be COMPOSED from the shared CNPG `neondb_owner` password
# plus the in-cluster DSN, and the chart's flat env-var -> key/property mapping
# cannot template. Keeping the driver's ExternalSecret in the same style means
# there is exactly one place in this repo that names an OCI Vault key for
# Platform2. Both HelmReleases therefore set `externalSecret.enabled: false`.
#
# OCI Vault prerequisites — a human must create these before the pods can serve:
#
#   neondb-owner-password        already exists (shared CNPG role)
#   platform2-backend            JSON object with:
#     jwt_secret                 openssl rand -hex 32
#     image_token_secret         openssl rand -hex 32
#     image_master_key           openssl rand -base64 32 — 32 bytes, base64.
#                                NO RECOVERY PATH: losing it makes every stored
#                                plate image permanently unreadable, so back it
#                                up outside this cluster AND outside the vault.
#     storage_access_key_id      S3 credentials for the bucket named in the
#     storage_secret_access_key  backend HelmRelease's STORAGE_* config
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform2-backend-env
  namespace: platform2
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: platform2-backend-env
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Presence of DATABASE_URL is what selects the Postgres adapter at
        # startup; the shared cluster's read-write endpoint, database `platform2`
        # (database.yaml).
        DATABASE_URL: "postgresql://neondb_owner:{{ .dbPassword }}@postgres-rw.database.svc.cluster.local:5432/platform2"
        JWT_SECRET: "{{ .jwtSecret }}"
        IMAGE_MASTER_KEY: "{{ .imageMasterKey }}"
        IMAGE_TOKEN_SECRET: "{{ .imageTokenSecret }}"
        STORAGE_ACCESS_KEY_ID: "{{ .storageAccessKeyId }}"
        STORAGE_SECRET_ACCESS_KEY: "{{ .storageSecretAccessKey }}"
        # SMTP_PASSWORD is deliberately absent: no relay is configured (see
        # SMTP_HOST in helmrelease-backend.yaml). Add the key here and the host
        # there together, or email alerts fail at send time rather than at boot.
  data:
    - secretKey: dbPassword
      remoteRef:
        key: neondb-owner-password
    - secretKey: jwtSecret
      remoteRef:
        key: platform2-backend
        property: jwt_secret
    - secretKey: imageMasterKey
      remoteRef:
        key: platform2-backend
        property: image_master_key
    - secretKey: imageTokenSecret
      remoteRef:
        key: platform2-backend
        property: image_token_secret
    - secretKey: storageAccessKeyId
      remoteRef:
        key: platform2-backend
        property: storage_access_key_id
    - secretKey: storageSecretAccessKey
      remoteRef:
        key: platform2-backend
        property: storage_secret_access_key
