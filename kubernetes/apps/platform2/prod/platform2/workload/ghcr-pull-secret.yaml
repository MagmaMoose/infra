# KICS 3e2d3b2f "hardcoded secret key" is a false positive: `secretKey` values
# are ExternalSecret field NAMES that map to OCI Vault entries — no secret value
# is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# The namespace-local copy of the tengen-systems GHCR credential, for the kubelet
# to pull ghcr.io/tengen-systems/platform2-{backend,driver}. Same OCI Vault entry
# as the flux-system one (base/platform2/ghcr-pull-secret.yaml, which is what
# source-controller uses for the charts) — projected twice rather than mirrored,
# because the `oci-vault` ClusterSecretStore already serves every namespace and
# the ghcr-reader SA + RBAC hop only exists for the SOPS-only `ghcr-pull-secret`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-tengen-pull-secret
  namespace: platform2
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: ghcr-tengen-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: platform2-ghcr-pull
        property: username
    - secretKey: token
      remoteRef:
        key: platform2-ghcr-pull
        property: token
