# KICS 3e2d3b2f "hardcoded secret key" is a false positive: `secretKey` values
# are ExternalSecret field NAMES that map to OCI Vault entries — no secret value
# is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# The driver's only credential. The backend stores nothing but this token's
# SHA-256 and resolves the owning tenant from it, so this one value is what binds
# this driver deployment to a tenant — which is also why camera device_ids only
# have to be unique per tenant rather than globally.
#
# OCI Vault prerequisite — a human must create this before the driver can ingest:
#
#   platform2-driver             JSON object with:
#     driver_token               minted ONCE by the backend, on the cluster:
#                                  python -m app.bootstrap --driver-name firefly
#                                The plaintext is printed once and never again;
#                                no API endpoint mints or returns one, so a
#                                hijacked console session cannot issue ingest
#                                credentials. Copy it straight into the vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform2-driver-env
  namespace: platform2
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: platform2-driver-env
    creationPolicy: Owner
  data:
    - secretKey: DRIVER_TOKEN
      remoteRef:
        key: platform2-driver
        property: driver_token
