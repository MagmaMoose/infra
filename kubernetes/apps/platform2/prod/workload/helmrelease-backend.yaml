# KICS 3e2d3b2f "hardcoded secret key" is a false positive: `existingSecret` values
# are Kubernetes Secret NAMES (references to ExternalSecret-managed objects) — no
# credential value is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# The Platform2 API, from the chart tengen-systems/platform2 publishes as an OCI
# artifact. Everything firefly-specific is in `values` here; the chart stays
# generic, the same way github-usage-dashboard splits chart from deploy config.
#
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform2-backend
  namespace: platform2
spec:
  interval: 30m
  # Pinned, not incidental: the tunnel ingress rule in the infra Terraform names
  # http://platform2-backend.platform2.svc.cluster.local:8000, and the chart
  # derives every object name from the release name.
  releaseName: platform2-backend
  chart:
    spec:
      chart: platform2-backend
      # Pinned exactly rather than ranged, because values.image.tag below is
      # pinned too and the two have to move together — see that comment. The
      # range this wants to be, once the pin is gone, is ">=0.0.9 <0.1.0":
      # inside the 0.0.x series, since pre-1.0 a minor bump is allowed to break
      # and 0.1.0 should be an explicit decision here rather than something Flux
      # picks up on its own.
      version: "0.0.9"
      sourceRef:
        kind: HelmRepository
        name: tengen-systems-charts
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Two replicas so a rolling upgrade or a node drain never drops ingest. The
    # API is stateless except for the SSE stream, where a console client is
    # pinned to the replica it connected to and may miss a live alert on the
    # other — it catches up on refresh, which is the accepted trade until there
    # is a shared publish path.
    replicaCount: 2

    # image.repository is deliberately unset: the chart already defaults to
    # ghcr.io/tengen-systems/platform2-backend. Only the credential is ours to
    # supply — tengen-systems is a different org from magmamoose and platform2 is
    # private, so the cluster's existing ghcr-pull-secret cannot read it.
    imagePullSecrets:
      - name: ghcr-tengen-pull-secret

    # TEMPORARY, AND PAIRED WITH THE PIN BELOW. Chart 0.0.9 resolves its image
    # from .Chart.AppVersion verbatim — "0.0.9" — but the release pushes the
    # image as "v0.0.9", so the chart's own default pulls a tag that does not
    # exist. tengen-systems/platform2#17 fixes the helper.
    #
    # Both the tag and the chart version are pinned exactly, together, on
    # purpose: a range here would let Flux move to a fixed chart while this line
    # silently held the image at v0.0.9. Remove both in one commit once #17 has
    # released, and let the range resume.
    image:
      tag: v0.0.9

    # Printed into this release's NOTES.txt so the tunnel rule an operator adds
    # in terraform/cloudflare/zero-trust arrives with the hostname and the
    # Service DNS name already filled in. The chart never acts on it, and
    # `ingress` stays off (chart default): the tunnel dials the ClusterIP Service
    # directly, so an Ingress would be a second door into the same room.
    publicHostname: api.platform2.magmamoose.com

    config:
      # The console is a Cloudflare Worker on platform2.magmamoose.com and this
      # API is on api.<that>, so the two are different origins and this list is
      # the only thing that lets the console call the API at all. Exact origin —
      # the code default of "*" is not permissive, it fails every call, because
      # the console sends an Authorization header and a browser refuses a
      # wildcard on a credentialed request.
      CORS_ALLOW_ORIGINS: https://platform2.magmamoose.com
      # This API's own external origin, not the console's — it is what absolute
      # links the API builds point at.
      PUBLIC_URL: https://api.platform2.magmamoose.com

      # Restated even though the bucket name matches the chart default. Where
      # plate images land is a deployment decision and belongs in the deployment
      # repo; inheriting it silently means a chart bump could move the bucket.
      #
      # Cloudflare R2, reached over its S3-compatible endpoint by the same
      # hand-rolled SigV4 client the code uses for every other provider — the
      # backend has no R2-specific path here, only a different endpoint and key
      # pair. Region is "auto" because R2 has no regions to address; the
      # locationHint given at bucket creation (weur) is a placement preference,
      # not something a request signs against.
      #
      # Not the in-cluster minio (infrastructure/services/stack/minio): that
      # StatefulSet is a single replica on the Pi's local disk, sized for
      # Thanos/Loki chunks and Postgres backups, with no replication, and it has
      # restarted 560 times in 24 days. Plate images are the product and grow
      # without bound.
      STORAGE_ENDPOINT_URL: https://6e26afa31c37dee1dc82ad2f214f9b3c.r2.cloudflarestorage.com
      STORAGE_REGION: auto
      STORAGE_BUCKET: platform2-images

      # SMTP_HOST is left at the chart's empty default on purpose: no relay is
      # provisioned for this deployment yet, and a placeholder host makes every
      # notification fail at send time with a DNS error instead of the setting
      # being visibly absent. Set it together with SMTP_USERNAME and the
      # smtp_password key in externalsecret-backend.yaml, or not at all.
      SMTP_FROM: alerts@platform2.magmamoose.com

    # The chart's own ExternalSecret templates emit external-secrets.io/v1, which
    # the external-secrets 0.11.x running on this cluster does not serve — it is
    # still on v1beta1. Ours (externalsecret-backend.yaml) is v1beta1 and, more
    # to the point, has to TEMPLATE DATABASE_URL out of the shared CNPG
    # neondb_owner password, which the chart's flat key/property mapping cannot
    # do. So the chart is pointed at the Secret we manage instead.
    externalSecret:
      enabled: false
    existingSecret: platform2-backend-env # kics-scan ignore-line - Secret name reference, not a hardcoded credential

    # cronJob and migration stay at chart defaults: the */5 sweep (camera-offline
    # detection, notification retries, audit retention) with concurrencyPolicy
    # Forbid, and `python -m app.migrate` as a pre-install/pre-upgrade hook. Both
    # want exactly one runner, and one release provides exactly one.

    # TEMPORARY, until the chart's hook ordering is fixed. The migration Job is a
    # pre-install hook and names the chart's ServiceAccount, but that
    # ServiceAccount carries no hook annotation — so Helm creates it in the main
    # phase, after the hook has already tried to run. On a first install the Job
    # never gets a pod:
    #
    #   pods "platform2-backend-migrate-" is forbidden: error looking up service
    #   account platform2/platform2-backend: serviceaccount ... not found
    #
    # create: false makes every workload fall back to the namespace's default
    # ServiceAccount, which always exists. Nothing is given up by that here: the
    # chart binds no Role or RoleBinding to its ServiceAccount, and all three pod
    # specs set automountServiceAccountToken: false, so neither identity carries
    # a token or a permission. Remove once the chart annotates the ServiceAccount
    # as a pre-install hook ahead of the Job.
    serviceAccount:
      create: false

    # nodeSelector is deliberately unset, and now safely so: v0.0.9's manifest
    # list carries linux/amd64 and linux/arm64, so a pod is schedulable on the
    # arm64 native-cloud tier (ff-oci1/ff-oci2) as well as everywhere else.
    # Pinning to that tier is still open — see AGENTS.md.
