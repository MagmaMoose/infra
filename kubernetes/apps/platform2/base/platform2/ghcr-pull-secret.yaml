# KICS 3e2d3b2f "hardcoded secret key" is a false positive: `secretKey` values
# are ExternalSecret field NAMES that map to OCI Vault entries — no secret value
# is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# The GHCR credential for the tengen-systems org, in flux-system, where
# source-controller reads it to pull the Platform2 charts (helmrepository.yaml).
#
# Why not the ghcr-reader mirror that chargate / nievah / github-usage-dashboard
# use: that pattern exists because `ghcr-pull-secret` is SOPS-managed and only
# ever materialises in flux-system, so a workload namespace needs a ServiceAccount
# + cross-namespace RBAC + a kubernetes-provider SecretStore to reach a copy.
# This credential is a NEW one and therefore goes to OCI Vault first (AGENTS.md
# §3), and the `oci-vault` ClusterSecretStore already serves every namespace —
# so the workload copy is a second ExternalSecret against the same store
# (../../prod/platform2/workload/ghcr-pull-secret.yaml) rather than an RBAC hop
# that would buy nothing here.
#
# OCI Vault secret `platform2-ghcr-pull` must be a JSON object with:
#   username  — the GitHub account or App the PAT belongs to
#   token     — a classic PAT (or App installation token) with `read:packages`
#               on tengen-systems, scoped to nothing else
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-tengen-pull-secret
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: ghcr-tengen-pull-secret
    creationPolicy: Owner
    # Assembled into a dockerconfigjson rather than stored as one, so the vault
    # holds a rotatable token instead of an opaque blob nobody can read. `auth`
    # is emitted alongside username/password because Flux's OCI client and the
    # kubelet do not agree on which of the two they prefer.
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: platform2-ghcr-pull
        property: username
    - secretKey: token
      remoteRef:
        key: platform2-ghcr-pull
        property: token
