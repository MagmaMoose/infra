apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` directive on purpose — these are flux-system-scoped
# control-plane resources (the OCI chart source and its pull credential) plus
# the cluster-scoped Namespace; each carries its own metadata.namespace.
#
# No image automation here, unlike every other app in this repo. Both Platform2
# charts leave `image.tag` empty and fall back to `.Chart.AppVersion`, and the
# release pipeline publishes chart and image from one tag — so the semver range
# on each HelmRelease already tracks the image, and an ImageRepository would only
# add an object that stays NotReady until the first release exists.
resources:
  - namespace.yaml
  - helmrepository.yaml
  - ghcr-pull-secret.yaml
