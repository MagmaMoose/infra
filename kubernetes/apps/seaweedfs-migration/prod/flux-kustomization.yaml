---
# The MinIO -> SeaweedFS copy, in a Kustomization of its own. `wait: false` because the Job
# runs for hours, and with wait: true this Kustomization would sit not-Ready until it
# finished. Nothing depends on this one. Delete the app once MinIO is gone.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-seaweedfs-migration
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/seaweedfs-migration/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: false
  # SeaweedFS and its S3 identities must be up first.
  dependsOn:
    - name: prod-seaweedfs
