apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  namespace: automation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: browserless
  template:
    metadata:
      labels:
        app: browserless
    spec:
      containers:
        - name: browserless
          # Shared headless-Chromium service (CDP/WebSocket) for any in-cluster or
          # LAN Playwright/Puppeteer client (Hermes, n8n, ...). Multi-arch image;
          # pinned to ff-vm1 (type=mini, amd64) via the node-selector component.
          image: ghcr.io/browserless/chromium:v2.52.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: browserless
                  key: token
            # Bound memory: cap concurrent + queued sessions and per-session time.
            #
            # Raised for finance-sync, which drives three FNB profiles from three
            # independent browser contexts and then downloads PDF statements over
            # the same CDP connection. At CONCURRENT=3 those three sessions used
            # the whole service, leaving nothing for n8n or Hermes; at
            # TIMEOUT=120000 a single account's scrape-then-download exceeded the
            # two-minute session cap and browserless killed it mid-download.
            #
            # 600000 is browserless's own ceiling for a session's idle window and
            # matches the 10-minute keep_alive Cloudflare uses for the same job.
            - name: CONCURRENT
              value: "8"
            - name: QUEUED
              value: "16"
            - name: TIMEOUT
              value: "600000"
            - name: TZ
              value: Europe/Amsterdam
          resources:
            # Chromium is memory-hungry; no CPU limit (CFS-throttle false alarms).
            #
            # Limit = CONCURRENT × 500Mi (peak per session) + 1Gi /dev/shm.
            # The shm emptyDir (medium: Memory) counts against this limit, so
            # 8 × 500Mi + 1Gi = 5Gi is the ceiling that survives all 8 sessions
            # fully loaded. ff-vm1 has 28Gi, so 5Gi is affordable; the request
            # stays low because the service idles near zero between jobs and
            # reserving for the peak would strand memory the rest of the day.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 5Gi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            # Chromium needs a real /dev/shm — the default 64Mi tmpfs crashes tabs.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            # Scaled with CONCURRENT: every session wants its own shared-memory
            # arena and 256Mi across 8 of them is back to the tab crashes this
            # volume exists to prevent. medium: Memory is charged against the
            # container's memory limit, so this 1Gi is part of the 4Gi above,
            # not on top of it.
            sizeLimit: 1Gi
