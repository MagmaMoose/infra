---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-github-runner
  namespace: flux-system
spec:
  interval: 10m
  # ../firefly, NOT ../base. base/ is now the cluster-NEUTRAL half (namespaces, chart
  # repo, ExternalSecret, controller) shared with franklinhouse; firefly/ includes it and
  # adds this cluster's two scale sets. Pointing this back at base/ would deploy the ARC
  # controller with no runners at all — and would look healthy while doing it.
  path: ./kubernetes/apps/github-runner/firefly
  # prune: true is what performs the cutover. This Kustomization previously owned the
  # github-runner StatefulSet, Service, ServiceAccount, ConfigMap, ExternalSecret and
  # Namespace; once base/ no longer lists them, Flux deletes all six — including the
  # `github-runner` namespace — in the same reconcile that creates arc-systems and
  # arc-runners. No manual cleanup step.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Two Helm installs, one of which lays down four CRDs and waits on a controller
  # Deployment. The old 2m was sized for a StatefulSet.
  timeout: 10m
  wait: true
  # external-secrets must be reconciling before base/externalsecret.yaml can produce
  # arc-github-app, and the scale-set listener will not start without it.
  dependsOn:
    - name: infrastructure-controllers
  # `decryption:` and the app.kubernetes.io/sops label are dropped: nothing under base/
  # is SOPS-encrypted any more (the App key comes from OCI Vault via ESO), so the
  # sops-keys reference was already vestigial.
