# Accepted Chargate/KICS findings for this privileged docker-in-docker CI runner. The
# same set the retired StatefulSet carried, minus the ones ARC made moot (no init-time
# token minting, so no `hardcoded secret` regex false positive; ephemeral pods, so no
# stale-work-dir sudo hook). A self-hosted runner that must run Docker cannot satisfy
# PodSecurity-restricted, so these are accepted by design:
#   dd29336b privileged            – required for the dind sidecar
#   5572cc5e allowPrivilegeEscalation / dbbc6705,268ca686 capabilities /
#   cf34805e,02323c00 runAsNonRoot / a9c2f49d readOnlyRootFilesystem /
#   f377b83e seccompProfile        – the runner needs root in dind + root in the SDK copy
#   4ac0e2b7 no CPU limits         – repo convention (CPU limits cause false CFS-throttle alerts)
#   583053b7,7c81d34c image tag/digest – tag-pinned + Renovate-tracked, not digest-pinned
#   a659f3b5,ade74944 probes       – a runner agent has no health endpoint; health is its
#                                    GitHub registration, which the listener reports
#   8b36775e annotations / 4a20ebac LimitRange / 48a5beba ResourceQuota / 1db3a5a5 PDB –
#                                    not this repo's per-namespace pattern
# kics-scan disable=dd29336b-fe57-445b-a26e-e6aa867ae609,5572cc5e-1e4c-4113-92a6-7a8a3bd25e6d,dbbc6705-d541-43b0-b166-dd4be8208b54,268ca686-7fb7-4ae9-b129-955a2a89064e,cf34805e-3872-4c08-bf92-6ff7bb0cfadb,02323c00-cdc3-4fdc-a310-4f2b3e7a1660,a9c2f49d-0671-4fc9-9ece-f4e261e128d0,f377b83e-bd07-4f48-a591-60c82b14a78b,4ac0e2b7-d2d2-4af7-8799-e8de6721ccda,583053b7-e632-46f0-b989-f81ff8045385,7c81d34c-8e5a-402b-9798-9f442630e678,a659f3b5-9bf0-438a-bd9a-7d3a6427f1e3,ade74944-a674-4e00-859e-c6eab5bde441,8b36775e-183d-4d46-b0f7-96a6f34a723f,4a20ebac-1060-4c81-95d1-1f7f620e983b,48a5beba-e4c0-4584-a2aa-e6894e4cf424,1db3a5a5-bf75-44e5-9e44-c56cfc8b1ac5
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-firefly
  namespace: arc-runners
spec:
  interval: 30m
  # The scale set name is the GitHub-visible runner label, and `firefly` is deliberate:
  # the org variable SELFHOSTED_GITHUB_RUNNER is already `firefly`, so the five workflows
  # that say `runs-on: ${{ vars.SELFHOSTED_GITHUB_RUNNER || 'ubuntu-latest' }}`
  # (release, security, docs, external-secrets, placement) keep working with no edit.
  #
  # NOTE — this is NOT the same as the old label set. An ARC scale set is addressed by
  # NAME, not by matching `[self-hosted, Linux, X64]`. The three terragrunt.yml jobs that
  # use the array form must be changed to the same `vars.SELFHOSTED_GITHUB_RUNNER`
  # expression or they will never be picked up. See `scaleSetLabels` note below.
  releaseName: arc-firefly
  # The controller must exist before this chart renders: without it the four
  # actions.github.com CRDs are absent, and the chart's own manager-RoleBinding wants the
  # controller's ServiceAccount.
  dependsOn:
    - name: arc
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      # Pinned to exactly the controller's version — ARC does not support skew between
      # the controller and the AutoscalingRunnerSet CRs it reconciles. Bump both in one
      # commit.
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # ORG-level scale set on MagmaMoose, matching what the StatefulSet did. One pool
    # serves every repo in the org.
    githubConfigUrl: https://github.com/magmamoose

    # STRING form = "use this pre-defined Secret", so the chart renders no Secret of its
    # own and ARC reads the one ESO writes (base/externalsecret.yaml). Passing a map here
    # instead would put the App private key in git.
    githubConfigSecret: arc-github-app # kics-scan ignore-line - Secret NAME reference, not a credential

    # magmamoose/infra is PUBLIC, and the `Default` group now has
    # allows_public_repositories=true — that is what unblocks terragrunt.yml, which had
    # been unrunnable for exactly this reason. The fork guard in each workflow
    # (`github.event.pull_request.head.repo.fork == false`) is still REQUIRED, not
    # optional: a self-hosted runner executing fork-PR code with OCI credentials is the
    # precise scenario GitHub warns about, and the group setting no longer blocks it.
    runnerGroup: default
    runnerScaleSetName: firefly

    # scaleSetLabels is intentionally NOT set. It would be the only way to keep the
    # literal `[self-hosted, Linux, X64]` array in terragrunt.yml working, but
    # self-hosted/Linux/X64 are GitHub-reserved runner labels and their acceptance on a
    # scale set is unverified here. Changing the three `runs-on:` lines is deterministic;
    # this is not.

    # Scale to ZERO when idle. This is the whole capacity argument for ARC on this
    # cluster: the retired StatefulSet held 200m CPU + 768Mi of ff-vm1's reservation
    # 24/7 for a runner that is idle almost all of it. minRunners: 0 gives that back and
    # only borrows it for the duration of a job.
    minRunners: 0
    # ONE concurrent runner — same serialisation as the StatefulSet, deliberately not an
    # increase. Arithmetic: ff-vm1 is 8000m / 28042Mi allocatable, currently 5685m (71%)
    # and 25136Mi (89%) REQUESTED; retiring the StatefulSet leaves 2515m and 3674Mi free.
    # A second runner (another 200m/768Mi) fits on paper — but the dind memory LIMIT is
    # 6Gi because MegaLinter needs it, real free memory on ff-vm1 is ~8.6Gi, and the
    # 7-day peak sum is already 144% of allocatable. Two concurrent MegaLinter jobs would
    # take the node down, and limits are not scheduler-reserved so nothing would stop it
    # (COMMON_MISTAKES #14). Raise to 2 only after ff-vm1 gains ~6Gi of real headroom.
    maxRunners: 1

    # Empty map, NOT `type: dind`, and this is load-bearing. With containerMode.type=dind
    # the chart synthesises the dind sidecar from a hardcoded helper: `image: docker:dind`
    # with no args and no resources. This cluster needs BOTH of the things that helper
    # cannot express:
    #   * `--mtu=1450`. ff-vm1's pod network is flannel VXLAN at MTU 1450 (verified:
    #     `cni0`/`flannel.1` = 1450 on ff-vm1). dockerd's docker0 bridge defaults to 1500,
    #     so nested MegaLinter/build containers put 1500-byte frames on a 1450 path and
    #     large transfers (TLS handshakes, apt/npm fetches) blackhole and HANG. That is
    #     what previously stalled the chargate scans at ~0% CPU. (ff-oci1's pod network is
    #     8950, so 1450 is merely suboptimal there, never wrong.)
    #   * resource requests/limits on the dind container, which is where the multi-GB
    #     MegaLinter working set actually lives.
    # An empty map still selects the chart's default-mode path, which passes
    # template.spec.initContainers / containers / volumes through verbatim.
    containerMode: {}

    # Named explicitly rather than left to the chart's `lookup "apps/v1" "Deployment"`
    # discovery. That lookup scans Deployments cluster-wide and `fail`s the render if it
    # finds none — which is exactly what happens on a first install if this HelmRelease is
    # attempted before the controller Deployment is Ready, and on any Flux dry-run where
    # lookup returns empty. `arc-gha-rs-controller` is the chart's fullname for release
    # `arc` (no nameOverride), and serviceAccount.name defaults to that fullname.
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-gha-rs-controller

    # The listener is created by the controller in the CONTROLLER's namespace
    # (arc-systems), so this — not anything in base/namespace.yaml — is where it gets
    # pinned. Cloud tier for the same reason as the controller: the listener image IS the
    # controller image, which is multi-arch.
    listenerTemplate:
      spec:
        nodeSelector:
          topology.sargeant.co/tier: native-cloud
        priorityClassName: medium
        containers:
          # The container MUST be named `listener` — any other name is treated as a
          # side-car and this config would not reach the listener process.
          - name: listener
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 192Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop: ["ALL"]

    template:
      spec:
        # on-prem tier, written out rather than delegated to the Kyverno `place-on-prem`
        # policy: these pods are created by ARC from a CRD, not from a Deployment/
        # StatefulSet/DaemonSet/CronJob, so no placement policy matches them at all.
        # These are the exact key/values that policy would have applied, plus an explicit
        # arch pin because `X64` is a property the workflows depend on.
        nodeSelector:
          node-role.kubernetes.io/worker: ""
          topology.sargeant.co/tier: on-prem
          kubernetes.io/arch: amd64
        # `low` = "non-essential: batch, background jobs, restartable without impact",
        # which is exactly a CI job — GitHub re-queues it. The retired StatefulSet ran at
        # priority 0, so this is a promotion, and it keeps a build from evicting anything
        # that serves traffic.
        priorityClassName: low
        restartPolicy: Never

        initContainers:
          # Copies the runner's bundled node/externals into a volume the dind daemon also
          # mounts, so job containers started by dockerd can find them. Straight from
          # ARC's own dind template — do not drop it.
          - name: init-dind-externals
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["cp"]
            args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir

          # The actions-runner image ships no `dotnet`. GitVersion — pulled in by
          # gittools/actions/gitversion/setup during Diatreme releases — is a .NET global
          # tool and dies with "Unable to locate executable file: dotnet". Stage the SDK
          # out of Microsoft's official multi-arch image (linux/amd64 + linux/arm64 +
          # linux/arm confirmed on the manifest index); the runner finds it via
          # DOTNET_ROOT + PATH below.
          #
          # COST, stated plainly: under ARC this ~1GB copy runs on EVERY job rather than
          # once per pod lifetime. If job startup latency becomes the complaint, the fix
          # is a custom runner image with the SDK baked in, published by
          # .github/workflows/docker-publish.yml — not deleting this.
          - name: install-dotnet
            image: mcr.microsoft.com/dotnet/sdk:8.0
            command: ["sh", "-c", "cp -a /usr/share/dotnet/. /opt/dotnet/"]
            # Root like ARC's own init container: the copy must write into the shared
            # emptyDir, and a non-root uid can hit an unwritable volume dir and crash-loop
            # the pod. Escalation off — a file copy never needs it.
            securityContext:
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
              - name: dotnet
                mountPath: /opt/dotnet

          # `gh` is shelled out to by Diatreme's release step (`gh release create`). The
          # runner image does not ship it. Arch is derived from `uname -m` rather than
          # hardcoded to amd64, so this survives the scale set being moved to the arm64
          # cloud tier later. Runs as the image's own `runner` user (uid 1001) — the
          # emptyDir is group/world-writable, so no root is needed here.
          - name: install-gh
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["bash", "-c"]
            args:
              - |
                set -euo pipefail
                GH_VERSION=2.96.0
                case "$(uname -m)" in
                  x86_64)  GH_ARCH=amd64 ;;
                  aarch64) GH_ARCH=arm64 ;;
                  *)       echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
                esac
                curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz" -o /tmp/gh.tar.gz
                tar -xzf /tmp/gh.tar.gz -C /tmp
                install -m 0755 "/tmp/gh_${GH_VERSION}_linux_${GH_ARCH}/bin/gh" /opt/gh/gh
                /opt/gh/gh --version
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
            volumeMounts:
              - name: gh
                mountPath: /opt/gh

          # NATIVE SIDECAR (restartPolicy: Always on an initContainer) — the shape ARC
          # itself uses on Kubernetes >= 1.29; firefly is on 1.33. It starts before the
          # runner container and keeps running for the pod's life, so the runner never
          # races dockerd. Being an initContainer, its requests ADD to the pod total
          # rather than being max()'d, which is why the pod reserves 200m/768Mi below.
          - name: dind
            image: docker:29.7.1-dind
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
              # See the containerMode comment above. Without this, chargate/MegaLinter
              # hangs on ff-vm1.
              - --mtu=1450
            env:
              # 123 is the `docker` group gid inside ghcr.io/actions/actions-runner
              # (verified: `docker:x:123:runner`), which is what lets uid 1001 use the
              # socket. ARC hardcodes the same value.
              - name: DOCKER_GROUP_GID
                value: "123"
            restartPolicy: Always
            securityContext:
              privileged: true
            startupProbe:
              exec:
                command: ["docker", "info"]
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # dind hosts the chargate/MegaLinter container, so this cap governs the
                # whole scan. MegaLinter needs several GB; 512Mi OOM-kills it. Carried
                # over unchanged from the StatefulSet, where it was arrived at the hard
                # way. No CPU limit (repo convention).
                memory: 6Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals

        containers:
          # Must be named `runner`; the chart special-cases that name.
          - name: runner
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
              - name: DOTNET_ROOT
                value: /opt/dotnet
              - name: DOTNET_CLI_TELEMETRY_OPTOUT
                value: "1"
              - name: DOTNET_NOLOGO
                value: "1"
              # k8s REPLACES the image PATH rather than appending, so this must restate
              # the image's own PATH verbatim
              # (/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin, read off
              # the image config) plus the two staged toolchains.
              - name: PATH
                value: "/opt/gh:/opt/dotnet:/opt/dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                # No CPU limit (repo convention). Headroom for the agent plus the
                # checked-out job itself; the heavy container work happens in dind.
                memory: 2Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dotnet
                mountPath: /opt/dotnet
              - name: gh
                mountPath: /opt/gh

        volumes:
          - name: work
            # Disk-backed (NOT medium: Memory) — a Memory emptyDir would count multi-GB
            # image layers and MegaLinter output against pod memory and OOM ff-vm1.
            # sizeLimit evicts a runaway build instead of filling the node root fs.
            # Fresh per job now, which is what retires the StatefulSet's root-owned-
            # leftovers problem and its sudo chown JOB_STARTED hook.
            emptyDir:
              sizeLimit: 20Gi
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
          - name: dotnet
            # Holds the ~1GB .NET SDK. Disk-backed so it does not count against pod
            # memory.
            emptyDir: {}
          - name: gh
            emptyDir: {}
