# Accepted Chargate/KICS findings for this privileged docker-in-docker CI runner. The
# same set the retired StatefulSet carried, adjusted for what ARC made moot (ephemeral
# pods replace the stale-work-dir sudo hook). A self-hosted runner that must run Docker
# cannot satisfy PodSecurity-restricted, so these are accepted by design:
#   dd29336b privileged            – required for the dind sidecar
#   5572cc5e allowPrivilegeEscalation / dbbc6705,268ca686 capabilities /
#   cf34805e,02323c00 runAsNonRoot / a9c2f49d readOnlyRootFilesystem /
#   f377b83e seccompProfile        – the runner needs root in dind + root in the SDK copy
#   4ac0e2b7 no CPU limits         – repo convention (CPU limits cause false CFS-throttle alerts)
#   583053b7,7c81d34c image tag/digest – tag-pinned + Renovate-tracked, not digest-pinned
#   a659f3b5,ade74944 probes       – a runner agent has no health endpoint; health is its
#                                    GitHub registration, which the listener reports
#   8b36775e annotations / 4a20ebac LimitRange / 48a5beba ResourceQuota / 1db3a5a5 PDB –
#                                    not this repo's per-namespace pattern
#   3e2d3b2f hardcoded secret key  – false positive: `githubConfigSecret` is a Secret
#                                    NAME reference, not a credential; the actual key
#                                    lives only in OCI Vault (nievah-github-private-key)
# kics-scan disable=dd29336b-fe57-445b-a26e-e6aa867ae609,5572cc5e-1e4c-4113-92a6-7a8a3bd25e6d,dbbc6705-d541-43b0-b166-dd4be8208b54,268ca686-7fb7-4ae9-b129-955a2a89064e,cf34805e-3872-4c08-bf92-6ff7bb0cfadb,02323c00-cdc3-4fdc-a310-4f2b3e7a1660,a9c2f49d-0671-4fc9-9ece-f4e261e128d0,f377b83e-bd07-4f48-a591-60c82b14a78b,4ac0e2b7-d2d2-4af7-8799-e8de6721ccda,583053b7-e632-46f0-b989-f81ff8045385,7c81d34c-8e5a-402b-9798-9f442630e678,a659f3b5-9bf0-438a-bd9a-7d3a6427f1e3,ade74944-a674-4e00-859e-c6eab5bde441,8b36775e-183d-4d46-b0f7-96a6f34a723f,4a20ebac-1060-4c81-95d1-1f7f620e983b,48a5beba-e4c0-4584-a2aa-e6894e4cf424,1db3a5a5-bf75-44e5-9e44-c56cfc8b1ac5,3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-firefly
  namespace: arc-runners
spec:
  interval: 30m
  # The scale set name is what GitHub matches `runs-on` against.
  #
  # THIS IS THE arm64 / OCI POOL, and it is now named `firefly-arm64` rather than the
  # bare `firefly` it carried historically. The rename exists because a second cluster
  # (franklinhouse) is gaining its own runners: with `firefly` meaning "firefly arm64"
  # implicitly while `firefly-amd64` was explicit, four pools across two clusters would
  # have been unreadable. The taxonomy is now uniformly `<cluster>-<arch>`:
  #
  #     firefly-arm64        (this set)        firefly-amd64
  #     franklinhouse-arm64                    franklinhouse-amd64
  #
  # !! COORDINATED CHANGE !! The ORG variable `SELFHOSTED_GITHUB_RUNNER` was set to
  # `firefly`. Renaming this set WITHOUT updating that variable to `firefly-arm64` leaves
  # every repo that consults it dispatching to a label no scale set answers to, and those
  # jobs queue forever rather than failing loudly. The variable and this file must change
  # together.
  #
  # WHY the OCI pair is the default and not ff-vm1:
  #   * CAPACITY — two nodes means two concurrent jobs instead of one. That is the whole
  #     point of the change: a single runner serialised the entire org behind one job.
  #   * HEADROOM — ff-vm1 is the memory-tight node (21766Mi/28715632Ki = 77% real usage,
  #     and the 7-day peak sum already exceeds allocatable). ff-oci1 sits at 34% memory /
  #     13% CPU and ff-oci2 at 73% / 68%. Moving CI off ff-vm1 relieves the node that has
  #     the actual problem.
  #   * ARCH IS FINE — every image in this pod template is multi-arch (actions-runner,
  #     docker:dind, dotnet/sdk:8.0), `install-gh` already derives its arch from
  #     `uname -m`, and Chargate v2's default `arch_strategy: auto` runs MegaLinter's
  #     per-linter `megalinter-only-*` images (multi-arch since v10.0.0) when the Docker
  #     daemon is not amd64. A job that genuinely needs amd64 sets the repo-level
  #     `SELFHOSTED_GITHUB_RUNNER` to `firefly-amd64`.
  #
  # NOTE — an ARC scale set is addressed by NAME, not by matching
  # `[self-hosted, Linux, X64]`. Any job still using the literal array form will never be
  # picked up; it must use the `vars.SELFHOSTED_GITHUB_RUNNER` expression. See the
  # `scaleSetLabels` note below.
  releaseName: arc-firefly
  # The controller must exist before this chart renders: without it the four
  # actions.github.com CRDs are absent, and the chart's own manager-RoleBinding wants the
  # controller's ServiceAccount.
  dependsOn:
    - name: arc
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      # Pinned to exactly the controller's version — ARC does not support skew between
      # the controller and the AutoscalingRunnerSet CRs it reconciles. Bump both in one
      # commit.
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: flux-system
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # ORG-level scale set on MagmaMoose, matching what the StatefulSet did. One pool
    # serves every repo in the org.
    githubConfigUrl: https://github.com/magmamoose

    # STRING form = "use this pre-defined Secret", so the chart renders no Secret of its
    # own and ARC reads the one ESO writes (base/externalsecret.yaml). Passing a map here
    # instead would put the App private key in git.
    githubConfigSecret: arc-github-app # kics-scan ignore-line - Secret NAME reference, not a credential

    # magmamoose/infra is PUBLIC, and the `Default` group now has
    # allows_public_repositories=true — that is what unblocks terragrunt.yml, which had
    # been unrunnable for exactly this reason. The fork guard in each workflow
    # (`github.event.pull_request.head.repo.fork == false`) is still REQUIRED, not
    # optional: a self-hosted runner executing fork-PR code with OCI credentials is the
    # precise scenario GitHub warns about, and the group setting no longer blocks it.
    runnerGroup: default
    runnerScaleSetName: firefly-arm64

    # Multi-label routing. ARC 0.14.0 added support for assigning MORE THAN ONE label
    # to a scale set (chart value `scaleSetLabels` -> `runnerScaleSetLabels` on the
    # AutoscalingRunnerSet); this chart is pinned to 0.14.2, so it is available. The
    # earlier note here said this was "unverified" — it is now verified and used.
    #
    # Two labels, doing two different jobs:
    #   firefly-arm64  — the unique, cluster-specific name. Use it to pin a job to THIS
    #                    cluster's arm64 pool.
    #   pool-arm64     — shared with franklinhouse's arm64 set. `runs-on: pool-arm64`
    #                    dispatches to whichever cluster has capacity, which is how you
    #                    get real parallelism across both sites from one label.
    #
    # `runs-on: [a, b]` means "runner has ALL of these", never "any of", so a unique
    # label plus a shared one is what gives both targeting AND pooling at once.
    #
    # The `pool-` prefix is deliberate: `arm64`, `x64`, `self-hosted`, `linux` are
    # GitHub-RESERVED runner labels and must not be claimed here.
    #
    # !! Labels do NOT update in place !!  Editing runnerScaleSetLabels on a live
    # AutoscalingRunnerSet does not re-register them with GitHub — the scale set has to
    # be destroyed and recreated. See actions/actions-runner-controller#4424. Expect a
    # gap in runner availability whenever these change.
    scaleSetLabels:
      - firefly-arm64
      - pool-arm64

    # Scale to ZERO when idle. This is the whole capacity argument for ARC on this
    # cluster: the retired StatefulSet held 200m CPU + 768Mi of reservation 24/7 for a
    # runner that is idle almost all of it. minRunners: 0 gives that back and only
    # borrows it for the duration of a job.
    minRunners: 0
    # TWO concurrent runners — one per OCI node, enforced by the REQUIRED pod
    # anti-affinity below, not merely hoped for. maxRunners without the anti-affinity
    # would happily stack both on ff-oci1 and leave ff-oci2 idle, which is precisely the
    # thing this change exists to fix.
    #
    # Two is the ceiling, not a starting point: there are exactly two nodes in the tier,
    # so a third runner would have nowhere to go and would sit Pending until one of the
    # first two finished. GitHub re-queues rather than fails in that case, but a job that
    # is Pending on the cluster looks identical to a stuck job on the Actions UI.
    maxRunners: 2

    # Empty map, NOT `type: dind`, and this is load-bearing. With containerMode.type=dind
    # the chart synthesises the dind sidecar from a hardcoded helper: `image: docker:dind`
    # with no args and no resources. This cluster needs BOTH of the things that helper
    # cannot express:
    #   * `--mtu=1450`. dockerd's docker0 bridge defaults to 1500, so nested
    #     MegaLinter/build containers put 1500-byte frames on a smaller path and large
    #     transfers (TLS handshakes, apt/npm fetches) blackhole and HANG — that is what
    #     previously stalled the chargate scans at ~0% CPU on ff-vm1, whose pod network is
    #     flannel VXLAN at 1450 (verified: `cni0`/`flannel.1` = 1450 there).
    #     KEPT AT 1450 ON THIS arm64/OCI POOL TOO, deliberately: ff-oci1's pod network is
    #     8950, so 1450 is merely suboptimal there and never wrong, while raising it would
    #     have to be re-verified per node. Both pools carry the same value so the two
    #     templates stay diff-able.
    #   * resource requests/limits on the dind container, which is where the multi-GB
    #     MegaLinter working set actually lives.
    # An empty map still selects the chart's default-mode path, which passes
    # template.spec.initContainers / containers / volumes through verbatim.
    containerMode: {}

    # Named explicitly rather than left to the chart's `lookup "apps/v1" "Deployment"`
    # discovery. That lookup scans Deployments cluster-wide and `fail`s the render if it
    # finds none — which is exactly what happens on a first install if this HelmRelease is
    # attempted before the controller Deployment is Ready, and on any Flux dry-run where
    # lookup returns empty. `arc-gha-rs-controller` is the chart's fullname for release
    # `arc` (no nameOverride), and serviceAccount.name defaults to that fullname.
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-gha-rs-controller

    # The listener is created by the controller in the CONTROLLER's namespace
    # (arc-systems), so this — not anything in base/namespace.yaml — is where it gets
    # pinned. Cloud tier for the same reason as the controller: the listener image IS the
    # controller image, which is multi-arch.
    listenerTemplate:
      spec:
        nodeSelector:
          topology.sargeant.co/tier: native-cloud
        priorityClassName: medium
        containers:
          # The container MUST be named `listener` — any other name is treated as a
          # side-car and this config would not reach the listener process.
          - name: listener
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 192Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop: ["ALL"]

    template:
      spec:
        # native-cloud tier, written out rather than delegated to a Kyverno placement
        # policy: these pods are created by ARC from a CRD, not from a Deployment/
        # StatefulSet/DaemonSet/CronJob, so no placement policy matches them at all.
        # The arch pin is explicit rather than implied by the tier — the tier happens to
        # be all-arm64 today, but a job landing on an unexpected arch is a confusing
        # failure and this makes it a scheduling error instead.
        nodeSelector:
          node-role.kubernetes.io/worker: ""
          topology.sargeant.co/tier: native-cloud
          kubernetes.io/arch: arm64

        # ONE RUNNER PER NODE. `requiredDuringScheduling` (not preferred) because the
        # point of maxRunners: 2 is to use BOTH OCI nodes — a soft rule would let the
        # scheduler stack both runners on ff-oci1, which has the most free memory and is
        # therefore exactly where it would put them.
        #
        # The label is ARC's own, verified on a live runner pod:
        #   actions.github.com/scale-set-name=firefly-arm64
        # It matches only this scale set, so a `firefly-amd64` runner on ff-vm1 is not
        # repelled by it (different value) and the two pools never interfere.
        #
        # Consequence to be aware of: if one OCI node is full or cordoned, the second
        # runner stays Pending rather than doubling up. That is the intended trade —
        # GitHub re-queues the job — but it is why maxRunners is 2 and not higher.
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    actions.github.com/scale-set-name: firefly-arm64
        # `low` = "non-essential: batch, background jobs, restartable without impact",
        # which is exactly a CI job — GitHub re-queues it. The retired StatefulSet ran at
        # priority 0, so this is a promotion, and it keeps a build from evicting anything
        # that serves traffic.
        priorityClassName: low
        restartPolicy: Never

        initContainers:
          # Copies the runner's bundled node/externals into a volume the dind daemon also
          # mounts, so job containers started by dockerd can find them. Straight from
          # ARC's own dind template — do not drop it.
          - name: init-dind-externals
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["cp"]
            args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir

          # The actions-runner image ships no `dotnet`. GitVersion — pulled in by
          # gittools/actions/gitversion/setup during Diatreme releases — is a .NET global
          # tool and dies with "Unable to locate executable file: dotnet". Stage the SDK
          # out of Microsoft's official multi-arch image (linux/amd64 + linux/arm64 +
          # linux/arm confirmed on the manifest index); the runner finds it via
          # DOTNET_ROOT + PATH below.
          #
          # COST, stated plainly: under ARC this ~1GB copy runs on EVERY job rather than
          # once per pod lifetime. If job startup latency becomes the complaint, the fix
          # is a custom runner image with the SDK baked in, published by
          # .github/workflows/docker-publish.yml — not deleting this.
          - name: install-dotnet
            image: mcr.microsoft.com/dotnet/sdk:8.0
            command: ["sh", "-c", "cp -a /usr/share/dotnet/. /opt/dotnet/"]
            # Root like ARC's own init container: the copy must write into the shared
            # emptyDir, and a non-root uid can hit an unwritable volume dir and crash-loop
            # the pod. Escalation off — a file copy never needs it.
            securityContext:
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
              - name: dotnet
                mountPath: /opt/dotnet

          # `gh` is shelled out to by Diatreme's release step (`gh release create`). The
          # runner image does not ship it. Arch is derived from `uname -m` rather than
          # hardcoded — which is what let this scale set move to the arm64 cloud tier
          # without touching a line of it, and is why the amd64 pool can share the block
          # verbatim. Runs as the image's own `runner` user (uid 1001) — the emptyDir is
          # group/world-writable, so no root is needed here.
          - name: install-gh
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["bash", "-c"]
            args:
              - |
                set -euo pipefail
                GH_VERSION=2.96.0
                case "$(uname -m)" in
                  x86_64)  GH_ARCH=amd64 ;;
                  aarch64) GH_ARCH=arm64 ;;
                  *)       echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
                esac
                curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${GH_ARCH}.tar.gz" -o /tmp/gh.tar.gz
                tar -xzf /tmp/gh.tar.gz -C /tmp
                install -m 0755 "/tmp/gh_${GH_VERSION}_linux_${GH_ARCH}/bin/gh" /opt/gh/gh
                /opt/gh/gh --version
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
            volumeMounts:
              - name: gh
                mountPath: /opt/gh

          # NATIVE SIDECAR (restartPolicy: Always on an initContainer) — the shape ARC
          # itself uses on Kubernetes >= 1.29; firefly is on 1.33. It starts before the
          # runner container and keeps running for the pod's life, so the runner never
          # races dockerd. Being an initContainer, its requests ADD to the pod total
          # rather than being max()'d, which is why the pod reserves 200m/768Mi below.
          - name: dind
            image: docker:29.7.1-dind
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
              # See the containerMode comment above. Suboptimal but never wrong on this
              # tier (OCI pod network is 8950); on ff-vm1 it is load-bearing, and both
              # pools carry the same value so the templates stay diff-able.
              - --mtu=1450
            env:
              # 123 is the `docker` group gid inside ghcr.io/actions/actions-runner
              # (verified: `docker:x:123:runner`), which is what lets uid 1001 use the
              # socket. ARC hardcodes the same value.
              - name: DOCKER_GROUP_GID
                value: "123"
            restartPolicy: Always
            securityContext:
              privileged: true
            startupProbe:
              exec:
                command: ["docker", "info"]
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            resources:
              requests:
                # 50m, HALF what the amd64 pool reserves, because CPU requests are the
                # binding constraint on this tier: ff-oci1 and ff-oci2 are both ~88% of
                # 2000m ALREADY REQUESTED (measured: ~235m and ~244m free, and that
                # excludes kube-system/kyverno, which this account could not read — so
                # true free is lower still). At 100m + 100m the pod might simply never
                # schedule, which would look like a permanently queued GitHub job.
                #
                # Costs nothing in throughput: there is no CPU limit here (repo
                # convention), so a request is a scheduling floor and a contention share,
                # not a cap. Real CPU use on these nodes is 13% and 68% against those 88%
                # reservations, so a runner that bursts well past 50m will get it.
                cpu: 50m
                memory: 512Mi
              limits:
                # dind hosts the chargate/MegaLinter container, so this cap governs the
                # whole scan. MegaLinter needs several GB; 512Mi OOM-kills it.
                #
                # 4Gi here, NOT the 6Gi the amd64 pool carries, and this is a real
                # trade-off rather than a rounding-down. The OCI nodes are ~11.6Gi
                # allocatable each and ff-oci2 already sits at 8757Mi (73%) real usage, so
                # a 6Gi dind + 2Gi runner ceiling on that node could push it into OOM —
                # and limits are NOT scheduler-reserved, so nothing would stop it
                # (COMMON_MISTAKES #14). 4Gi + 1Gi keeps the worst case under what ff-oci2
                # actually has free.
                #
                # This is also less of a squeeze than it looks: on arm64 Chargate's
                # `arch_strategy: auto` runs MegaLinter's per-linter `megalinter-only-*`
                # images sequentially instead of the one monolithic flavor image, so the
                # peak working set is lower than the amd64 path it is being compared to.
                # IF A SCAN OOMs, this number is the first thing to raise — and ff-oci1
                # (34% used) can take it long before ff-oci2 can. No CPU limit (repo
                # convention).
                memory: 4Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals

        containers:
          # Must be named `runner`; the chart special-cases that name.
          - name: runner
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
              - name: DOTNET_ROOT
                value: /opt/dotnet
              - name: DOTNET_CLI_TELEMETRY_OPTOUT
                value: "1"
              - name: DOTNET_NOLOGO
                value: "1"
              # k8s REPLACES the image PATH rather than appending, so this must restate
              # the image's own PATH verbatim
              # (/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin, read off
              # the image config) plus the two staged toolchains.
              - name: PATH
                value: "/opt/gh:/opt/dotnet:/opt/dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            resources:
              requests:
                # 50m for the same reason as dind above — the pod's total CPU request is
                # what has to fit in ~235m of free reservation, and 50m + 50m = 100m does
                # with room to spare where 200m would not.
                cpu: 50m
                memory: 256Mi
              limits:
                # No CPU limit (repo convention). Headroom for the agent plus the
                # checked-out job itself; the heavy container work happens in dind.
                # 1Gi rather than the amd64 pool's 2Gi — same reasoning as the dind limit
                # above: the pod's worst case has to fit what ff-oci2 actually has free.
                memory: 1Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dotnet
                mountPath: /opt/dotnet
              - name: gh
                mountPath: /opt/gh

        volumes:
          - name: work
            # Disk-backed (NOT medium: Memory) — a Memory emptyDir would count multi-GB
            # image layers and MegaLinter output against pod memory and OOM the node.
            # sizeLimit evicts a runaway build instead of filling the node root fs.
            # Fresh per job now, which is what retires the StatefulSet's root-owned-
            # leftovers problem and its sudo chown JOB_STARTED hook.
            #
            # 10Gi, half the amd64 pool's 20Gi: the OCI nodes have ~41.9Gi of allocatable
            # ephemeral storage each (vs ff-vm1's ~277Gi), and they must ALSO hold dind's
            # /var/lib/docker — which is the container's own writable layer, not a volume,
            # so it is not covered by this limit. On arm64 that layer holds MegaLinter's
            # per-linter images (many small ones rather than one flavor image), so leaving
            # the node the larger share of 42Gi is the right split.
            emptyDir:
              sizeLimit: 10Gi
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
          - name: dotnet
            # Holds the ~1GB .NET SDK. Disk-backed so it does not count against pod
            # memory.
            emptyDir: {}
          - name: gh
            emptyDir: {}
