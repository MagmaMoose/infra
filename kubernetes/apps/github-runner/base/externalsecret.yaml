# Nievah GitHub App credential -> ARC's `githubConfigSecret`.
#
# ARC's pre-defined-secret variation expects EXACTLY these three keys (see the
# gha-runner-scale-set chart's githubsecret.yaml, which fails the render if
# github_app_id is present without github_app_installation_id + github_app_private_key):
#   github_app_id, github_app_installation_id, github_app_private_key
#
# Only the private key is secret. The App id (4050687) and the MagmaMoose-org
# installation id (145262351) are public identifiers — they lived in a ConfigMap under
# the old StatefulSet — so they are templated in as literals rather than round-tripped
# through the vault. That also means ONE vault key is enough, and it is the one that
# already exists: `nievah-github-private-key`, confirmed ACTIVE via `oci vault secret
# list`. Verified in-cluster that the stored value is a real PKCS#1 PEM with genuine
# newlines (starts `-----BEGIN RSA PRIVATE KEY-----`, 26 line breaks, no escaped `\n`,
# not base64) — which is why ARC can consume it directly and the old StatefulSet's
# four-attempt PEM-normalisation shell dance is deleted rather than ported.
#
# PREREQUISITE (already satisfied — the old runner registers with this same App): the
# Nievah App must hold the ORGANIZATION permission `Self-hosted runners: Read & write`
# on magmamoose. ARC needs nothing more than that for an org-level scale set.
#
# Filename is `externalsecret.yaml` on purpose: `.gitignore` has `*secret.yaml` with a
# `!externalsecret.yaml` negation, so any other name would be silently untracked.
#
# False positive: `remoteRef.key` / `secretKey` are the OCI Vault secret NAME and the ESO
# field name — no secret material is in this file.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
    template:
      # v2 is required for the `{{ .privateKey }}` form. The cluster runs
      # external-secrets v0.11.0, whose stored CRD version is v1beta1 — v1 is NOT
      # served here, so do not "modernise" the apiVersion above.
      engineVersion: v2
      data:
        github_app_id: "4050687"
        github_app_installation_id: "145262351"
        github_app_private_key: "{{ .privateKey }}"
  data:
    - secretKey: privateKey
      remoteRef:
        key: nievah-github-private-key
