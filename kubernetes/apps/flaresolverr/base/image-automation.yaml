---
# Image automation for this app, folded out of
# kubernetes/infrastructure/configs/flux/image-automation.yaml so the policy lives with
# the workload it bumps. Objects stay in the flux-system namespace, which is what
# the `{"$imagepolicy": "flux-system:flaresolverr"}` markers in the deployment resolve against.
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: flaresolverr
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: flaresolverr
  filterTags:
    pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
    extract: $0
  policy:
    semver:
      range: '>=3.0.0 <4.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: flaresolverr
  namespace: flux-system
spec:
  image: ghcr.io/flaresolverr/flaresolverr
  interval: 1h
  provider: generic
  secretRef:
    name: ghcr-pull-secret
