apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0 # {"$imagepolicy": "flux-system:flaresolverr"}
          ports:
            - containerPort: 8191
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_HTML
              value: "false"
            - name: CAPTCHA_SOLVER
              value: "none"
          resources:
            # KRR: cpu 10m, memory 552Mi. Memory request 160Mi instead — 552Mi is a
            # solve-in-progress peak and observed steady state is ~127Mi; ff-vm1
            # cannot reserve every pod's peak (see infra#501). Headless Chrome still
            # bursts into the 768Mi limit.
            requests:
              memory: "160Mi"
              cpu: "10m"
            limits:
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8191
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8191
            initialDelaySeconds: 60
            periodSeconds: 30
