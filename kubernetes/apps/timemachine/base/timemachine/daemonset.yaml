apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: timemachine
  namespace: backup
spec:
  selector:
    matchLabels:
      app: timemachine
  template:
    metadata:
      labels:
        app: timemachine
    spec:
      hostNetwork: true # Needed to expose port 445 directly to LAN
      hostname: firefly
      containers:
        - name: timemachine
          image: mbentley/timemachine
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    sleep 5
                    sed -i 's/<name replace-wildcards="yes">%h<\/name>/<name replace-wildcards="yes">firefly<\/name>/' /etc/avahi/services/smbd.service
                    pkill -HUP avahi-daemon
          resources:
            # KRR-sized (2026-07): cpu 130m, memory 838Mi. These inline values are now
            # actually in effect — the t.small profile component was dropped from
            # kustomization.yaml because its `op: add` on containers/0/resources was
            # silently overriding them with 250m/256Mi.
            requests:
              # Memory held at 128Mi, not KRR's 838Mi: that is a mid-backup figure
              # and observed idle is ~75Mi. ff-vm1 cannot reserve every pod's peak
              # (see infra#501); a running backup bursts into the 1157Mi limit.
              memory: "128Mi"
              cpu: "130m"
            limits:
              # Headroom above the request: smbd buffers hard during a backup run.
              memory: "1157Mi"
          env:
            - name: AVAHI_NAME
              value: "firefly"
            - name: CUSTOM_SMB_CONF
              value: "false"
            - name: CUSTOM_USER
              value: "false"
            - name: DEBUG_LEVEL
              value: "1"
            - name: MIMIC_MODEL
              value: "TimeCapsule8,119"
            - name: EXTERNAL_CONF
              value: "/users"
            - name: HIDE_SHARES
              value: "no"
            - name: TM_USERNAME
              value: "timemachine"
            - name: TM_GROUPNAME
              value: "timemachine"
            - name: TM_UID
              value: "1000" # Replace with real UID
            - name: TM_GID
              value: "1000" # Replace with real GID
            - name: PASSWORD
              value: "timemachine"
            - name: SET_PERMISSIONS
              value: "false"
            - name: SHARE_NAME
              value: "TimeMachine"
            - name: SMB_INHERIT_PERMISSIONS
              value: "no"
            - name: SMB_NFS_ACES
              value: "yes"
            - name: SMB_METADATA
              value: "stream"
            - name: SMB_PORT
              value: "445"
            - name: SMB_VFS_OBJECTS
              value: "fruit streams_xattr"
            - name: VOLUME_SIZE_LIMIT
              value: "0"
            - name: WORKGROUP
              value: "WORKGROUP"
          volumeMounts:
            - mountPath: /opt
              name: share
            - mountPath: /users
              name: users
#            - mountPath: /var/lib/samba
#              name: var-lib-samba
#            - mountPath: /var/cache/samba
#              name: var-cache-samba
#            - mountPath: /run/samba
#              name: run-samba
      volumes:
        - name: share
          persistentVolumeClaim:
            claimName: timemachine-share
        - name: users
          persistentVolumeClaim:
            claimName: timemachine-users
#        - name: var-lib-samba
#          persistentVolumeClaim:
#            claimName: timemachine-var-lib-samba
#        - name: var-cache-samba
#          persistentVolumeClaim:
#            claimName: timemachine-var-cache-samba
#        - name: run-samba
#          persistentVolumeClaim:
#            claimName: timemachine-run-samba