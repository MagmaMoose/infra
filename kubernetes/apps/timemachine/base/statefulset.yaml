apiVersion: apps/v1
# StatefulSet, not DaemonSet — cleanup.md calls for the change and the reason is
# concrete: this workload's two PersistentVolumes are hostPath directories on a
# single node, and a DaemonSet runs one pod per MATCHING node. It happens to
# produce exactly one pod today only because the on-prem tier resolves to ff-vm1
# alone. Widen that tier and the DaemonSet would schedule a second Samba server
# pointing at volumes it cannot reach — or, worse, at the same data.
#
# replicas: 1 makes the single instance explicit rather than incidental, and the
# stable pod identity suits a Time Machine target that clients discover by name.
#
# The PVCs are standalone objects (pvc.yaml), NOT volumeClaimTemplates, so they
# and their bound PVs are untouched by this change — no data moves.
kind: StatefulSet
metadata:
  name: timemachine
  namespace: backup
spec:
  replicas: 1
  # Governing headless Service. hostNetwork means clients reach this on the LAN
  # rather than through the Service, so it exists to satisfy the StatefulSet API
  # and to give the pod a stable DNS name in-cluster.
  serviceName: timemachine
  selector:
    matchLabels:
      app: timemachine
  template:
    metadata:
      labels:
        app: timemachine
    spec:
      hostNetwork: true # Needed to expose port 445 directly to LAN
      hostname: firefly
      containers:
        - name: timemachine
          image: mbentley/timemachine
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    sleep 5
                    sed -i 's/<name replace-wildcards="yes">%h<\/name>/<name replace-wildcards="yes">firefly<\/name>/' /etc/avahi/services/smbd.service
                    pkill -HUP avahi-daemon
          resources:
            requests:
              memory: "1157Mi"
              cpu: "103m"
            limits:
              memory: "1157Mi"
          env:
            - name: AVAHI_NAME
              value: "firefly"
            - name: CUSTOM_SMB_CONF
              value: "false"
            - name: CUSTOM_USER
              value: "false"
            - name: DEBUG_LEVEL
              value: "1"
            - name: MIMIC_MODEL
              value: "TimeCapsule8,119"
            - name: EXTERNAL_CONF
              value: "/users"
            - name: HIDE_SHARES
              value: "no"
            - name: TM_USERNAME
              value: "timemachine"
            - name: TM_GROUPNAME
              value: "timemachine"
            - name: TM_UID
              value: "1000" # Replace with real UID
            - name: TM_GID
              value: "1000" # Replace with real GID
            - name: PASSWORD
              value: "timemachine"
            - name: SET_PERMISSIONS
              value: "false"
            - name: SHARE_NAME
              value: "TimeMachine"
            - name: SMB_INHERIT_PERMISSIONS
              value: "no"
            - name: SMB_NFS_ACES
              value: "yes"
            - name: SMB_METADATA
              value: "stream"
            - name: SMB_PORT
              value: "445"
            - name: SMB_VFS_OBJECTS
              value: "fruit streams_xattr"
            - name: VOLUME_SIZE_LIMIT
              value: "0"
            - name: WORKGROUP
              value: "WORKGROUP"
          volumeMounts:
            - mountPath: /opt
              name: share
            - mountPath: /users
              name: users
#            - mountPath: /var/lib/samba
#              name: var-lib-samba
#            - mountPath: /var/cache/samba
#              name: var-cache-samba
#            - mountPath: /run/samba
#              name: run-samba
      volumes:
        - name: share
          persistentVolumeClaim:
            claimName: timemachine-share
        - name: users
          persistentVolumeClaim:
            claimName: timemachine-users
#        - name: var-lib-samba
#          persistentVolumeClaim:
#            claimName: timemachine-var-lib-samba
#        - name: var-cache-samba
#          persistentVolumeClaim:
#            claimName: timemachine-var-cache-samba
#        - name: run-samba
#          persistentVolumeClaim:
#            claimName: timemachine-run-samba