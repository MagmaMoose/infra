apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
  - pv.yaml
  - configmap.yaml
  - externalsecret.yaml
components:
  - ../../../../components/pod-gateway-client
  # No resource-profile component: KRR-derived values live inline in deployment.yaml.
  # (A profile component would `op: add` over containers/0/resources and silently
  # override them.)
  - ../../../../components/node-selectors/native-cloud
