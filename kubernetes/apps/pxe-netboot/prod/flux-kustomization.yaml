---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-pxe-netboot
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/pxe-netboot/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The init container pulls ~1GB of Fedora CoreOS on every pod start, so the
  # Deployment takes minutes to go Ready. 2m would report a healthy rollout as failed.
  timeout: 15m
  wait: true
