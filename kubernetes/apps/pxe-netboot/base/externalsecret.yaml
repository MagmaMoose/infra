# Agent-only join credential for PXE workers. k3s accepts kubeadm-style bootstrap
# tokens for agents and refuses them for servers (k3s docs/adrs/agent-join-token.md),
# so this token can add a worker but never a control-plane node. The server
# `k3s-firefly-node-token` stays where it is.
#
# The token ID (ub1wdh) is public by design; only the 16-character secret half
# lives in OCI Vault as `k3s-firefly-pxe-bootstrap-token`. Revoke by deleting that
# vault entry: deletionPolicy Delete then removes the bootstrap Secret.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bootstrap-token-ub1wdh
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    # The apiserver's bootstrap authenticator only reads Secrets named
    # bootstrap-token-<token-id> of this type.
    name: bootstrap-token-ub1wdh
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: bootstrap.kubernetes.io/token
      # Same fields `k3s token create` writes, with no expiration.
      data:
        token-id: ub1wdh
        token-secret: "{{ .tokenSecret }}"
        description: PXE netboot workers (kubernetes/apps/pxe-netboot)
        usage-bootstrap-authentication: "true"
        usage-bootstrap-signing: "true"
        auth-extra-groups: system:bootstrappers:k3s:default-node-token
  data:
    - secretKey: tokenSecret
      remoteRef:
        key: k3s-firefly-pxe-bootstrap-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pxe-netboot-join-token
  namespace: networking
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: pxe-netboot-join-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Secure format K10<CA hash>::<id>.<secret>, so the agent pins the cluster CA
        # instead of trusting whatever answers on :6443. The hash is the sha256 of
        # https://192.168.19.10:6443/cacerts (one certificate, so k3s hashes the raw
        # PEM bytes). It changes only if the cluster CA is rotated.
        token: "K104248de1bc8a6e65a497d460c0adaf48d3791741efe6e744abc14bd54c0f97d48::ub1wdh.{{ .tokenSecret }}"
  data:
    - secretKey: tokenSecret
      remoteRef:
        key: k3s-firefly-pxe-bootstrap-token
