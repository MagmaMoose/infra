apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxe-netboot
  namespace: networking
spec:
  replicas: 1
  # hostNetwork binds 69/udp and HTTP_PORT on the node: a second pod could not
  # start until the first one has released them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pxe-netboot
  template:
    metadata:
      labels:
        app: pxe-netboot
      annotations:
        checkov.io/skip1: "CKV_K8S_11=CPU limits unset estate-wide by design; see .trivyignore KSV-0011 and the Kyverno default-limitrange. Memory is limited."
        checkov.io/skip2: "CKV_K8S_19=hostNetwork required: TFTP is a two-channel protocol and the data transfer uses client-selected ephemeral ports; any NAT or Service layer breaks the data channel."
        checkov.io/skip3: "CKV_K8S_8=tftp runs dnsmasq in TFTP-only mode (--enable-tftp --port=0); it is a UDP-only server with no HTTP endpoint to probe."
        checkov.io/skip4: "CKV_K8S_9=same as skip3: no HTTP endpoint."
        checkov.io/skip5: "CKV_K8S_22=prepare initContainer writes temp files to /tmp for dnf5 metadata and rpm extraction; its outputs go to emptyDir mounts, not the root fs."
        checkov.io/skip6: "CKV_K8S_23=prepare runs as UID 0 to import the Fedora RPM signing key and verify package signatures with rpmkeys; rpmkeys --import writes to the RPM database which requires root."
        checkov.io/skip7: "CKV_K8S_25=tftp needs NET_BIND_SERVICE to bind 69/udp and SETUID/SETGID to drop to the dnsmasq system account; these are the minimum capabilities for a privilege-dropping daemon."
        checkov.io/skip8: "CKV_K8S_28=NET_RAW is not added; this rule fires on any non-empty capabilities set. The three capabilities on tftp (NET_BIND_SERVICE, SETUID, SETGID) are necessary — see skip7."
        checkov.io/skip9: "CKV_K8S_37=same as skip7: tftp's capabilities are the minimum required."
        checkov.io/skip10: "CKV_K8S_40=dnsmasq drops to its own system account after binding; that UID is below 10000 by the upstream package. Changing it would require rebuilding the image."
    spec:
      # TFTP through a Service/NAT breaks (the data transfer runs on a fresh
      # ephemeral port), so the pod lives in the node's network namespace.
      hostNetwork: true  # nosemgrep: yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod
      dnsPolicy: ClusterFirstWithHostNet
      # Pinned by hostname, not by placement tier: ff-crs1 hands out this node's IP
      # (192.168.19.11) as DHCP next-server. Moving the pod means changing that too.
      nodeSelector:
        kubernetes.io/hostname: ff-pi2
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Downloads and verifies everything a booting machine fetches. Fedora 44
        # userland with coreos-installer, dnf5 and rpmkeys, multi-arch.
        - name: prepare
          image: quay.io/coreos/coreos-installer:release@sha256:6f48c735dd84156672d756a9a43434e75ceea5114f128c07d680fdc3e2d6ed79
          command: ["/bin/sh", "/pxe/prepare.sh"]
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          envFrom:
            - configMapRef:
                name: pxe-netboot-settings
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              # dnf5 loads the Fedora repo metadata to resolve two packages.
              memory: 1536Mi
          volumeMounts:
            - name: files
              mountPath: /pxe
              readOnly: true
            - name: join-token
              mountPath: /run/pxe-join
              readOnly: true
            - name: boot
              mountPath: /srv/boot
            - name: ignition
              mountPath: /srv/ignition
            - name: nginx-conf
              mountPath: /srv/nginx
      containers:
        - name: tftp
          image: docker.io/dockurr/dnsmasq:2.93@sha256:b40fbaa3a9c3742d5943a4bec789dabc6c5c932b2db76a4e052c84f0b8d173a2
          # Bypasses the image's entrypoint, which writes its own DNS config.
          # --conf-file=/dev/null keeps any packaged config (and with it any
          # dhcp-range) out: ff-crs1 is the LAN's only DHCP server. --port=0 turns DNS off.
          command:
            - dnsmasq
            - --keep-in-foreground
            - --conf-file=/dev/null
            - --pid-file=
            - --log-facility=-
            - --port=0
            - --enable-tftp
            - --tftp-root=/srv/boot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # Bind 69/udp, then drop to the dnsmasq user.
              add: ["NET_BIND_SERVICE", "SETUID", "SETGID"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: boot
              mountPath: /srv/boot
              readOnly: true
        - name: http
          image: docker.io/nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
          ports:
            - name: http
              containerPort: 8069
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8069
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8069
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: boot
              mountPath: /srv/boot
              readOnly: true
            - name: ignition
              mountPath: /srv/ignition
              readOnly: true
      volumes:
        - name: files
          configMap:
            name: pxe-netboot-files
        - name: join-token
          secret:
            secretName: pxe-netboot-join-token
        # ~1.1GB: FCOS kernel/initramfs/rootfs, shim/GRUB, the k3s binary.
        - name: boot
          emptyDir:
            sizeLimit: 3Gi
        # The rendered Ignition config holds the join token: keep it in RAM.
        - name: ignition
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: nginx-conf
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
