apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxe-netboot
  namespace: networking
  annotations:
    # Checkov skips, per resource. Every container is non-root with a read-only root
    # filesystem and drops ALL capabilities except tftp, which is what the rest are about.
    checkov.io/skip1: "CKV_K8S_11=CPU limits unset estate-wide by design; see .trivyignore.yaml KSV-0011 and the Kyverno default-limitrange. Memory is limited."
    checkov.io/skip2: "CKV_K8S_19=hostNetwork required: a TFTP transfer runs on a fresh ephemeral port the server picks, which no Service or NAT layer can follow."
    checkov.io/skip3: "CKV_K8S_8=tftp has no probe: dnsmasq serves UDP only, the image has no TFTP client to probe with, and as PID 1 a dead dnsmasq restarts the container anyway."
    checkov.io/skip4: "CKV_K8S_9=tftp: same as skip3. Nothing routes to it through a Service, so readiness gates nothing."
    checkov.io/skip5: "CKV_K8S_23=tftp starts as root to bind 69/udp, then dnsmasq setuid()s to its own account. The other containers run as non-root."
    checkov.io/skip6: "CKV_K8S_25=tftp adds NET_BIND_SERVICE (bind 69/udp) and SETUID/SETGID (drop to the dnsmasq user) after dropping ALL; nothing else."
    checkov.io/skip7: "CKV_K8S_37=tftp: same as skip6."
    checkov.io/skip8: "CKV_K8S_40=tftp starts as UID 0 (skip5) and dnsmasq then runs as the image's UID 100. The other containers run above 10000."
spec:
  replicas: 1
  # hostNetwork binds 69/udp and HTTP_PORT on the node: a second pod could not
  # start until the first one has released them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pxe-netboot
  template:
    metadata:
      labels:
        app: pxe-netboot
    spec:
      # TFTP through a Service/NAT breaks (the data transfer runs on a fresh
      # ephemeral port), so the pod lives in the node's network namespace.
      hostNetwork: true  # nosemgrep: yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod
      dnsPolicy: ClusterFirstWithHostNet
      # Pinned by hostname, not by placement tier: ff-crs1 hands out this node's IP
      # (192.168.19.11) as DHCP next-server. Moving the pod means changing that too.
      nodeSelector:
        kubernetes.io/hostname: ff-pi2
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Downloads and verifies everything a booting machine fetches. Fedora 44
        # userland with coreos-installer, dnf5 and rpmkeys, multi-arch.
        - name: prepare
          image: quay.io/coreos/coreos-installer:release@sha256:6f48c735dd84156672d756a9a43434e75ceea5114f128c07d680fdc3e2d6ed79
          command: ["/bin/sh", "/pxe/prepare.sh"]
          envFrom:
            - configMapRef:
                name: pxe-netboot-settings
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # dnf5 keeps its repo cache under $HOME.
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              # dnf5 loads the Fedora repo metadata to resolve two packages.
              memory: 1536Mi
          volumeMounts:
            - name: files
              mountPath: /pxe
              readOnly: true
            - name: join-token
              mountPath: /run/pxe-join
              readOnly: true
            - name: boot
              mountPath: /srv/boot
            - name: ignition
              mountPath: /srv/ignition
            - name: nginx-conf
              mountPath: /srv/nginx
            - name: prepare-tmp
              mountPath: /tmp
      containers:
        - name: tftp
          image: docker.io/dockurr/dnsmasq:2.93@sha256:b40fbaa3a9c3742d5943a4bec789dabc6c5c932b2db76a4e052c84f0b8d173a2
          # Bypasses the image's entrypoint, which writes its own DNS config.
          # --conf-file=/dev/null keeps any packaged config (and with it any
          # dhcp-range) out: ff-crs1 is the LAN's only DHCP server. --port=0 turns DNS off.
          command:
            - dnsmasq
            - --keep-in-foreground
            - --conf-file=/dev/null
            - --pid-file=
            - --log-facility=-
            - --port=0
            - --enable-tftp
            - --tftp-root=/srv/boot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # Bind 69/udp, then drop to the dnsmasq user.
              add: ["NET_BIND_SERVICE", "SETUID", "SETGID"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: boot
              mountPath: /srv/boot
              readOnly: true
        - name: http
          image: docker.io/nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
          ports:
            - name: http
              containerPort: 8069
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8069
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8069
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: boot
              mountPath: /srv/boot
              readOnly: true
            - name: ignition
              mountPath: /srv/ignition
              readOnly: true
            # nginx writes its pid and temp files under /tmp; without this it
            # exits at start on the read-only root filesystem.
            - name: http-tmp
              mountPath: /tmp
      volumes:
        - name: files
          configMap:
            name: pxe-netboot-files
        - name: join-token
          secret:
            secretName: pxe-netboot-join-token
        # ~1.1GB: FCOS kernel/initramfs/rootfs, shim/GRUB, the k3s binary.
        - name: boot
          emptyDir:
            sizeLimit: 3Gi
        # The rendered Ignition config holds the join token: keep it in RAM.
        - name: ignition
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: nginx-conf
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # dnf5's repo cache. The FCOS download lands straight in `boot`.
        - name: prepare-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: http-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
