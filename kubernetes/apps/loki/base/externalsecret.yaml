# Loki's S3 secret key, for SeaweedFS's `loki` identity (the same user and vault entry it had
# on MinIO). Read by the StatefulSet as LOKI_S3_SECRET_ACCESS_KEY and expanded into
# configmap.yaml at start, so the config itself holds no secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: loki-s3
    creationPolicy: Owner
  data:
    - secretKey: secret-access-key
      remoteRef:
        key: minio-loki-password
