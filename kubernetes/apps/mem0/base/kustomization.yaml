apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The manifest library, applied by the per-env Flux Kustomization
# (prod/mem0/flux-kustomization.yaml). Resources span two namespaces — the CNPG
# Databases + bootstrap Job live in `database` (with the shared cluster), the mem0
# server + secret + ingress + NetworkPolicy in `automation` (with litellm/hermes) — so no
# namespace is set here; each resource carries its own metadata.namespace.
resources:
  # Two files rather than one two-document file: the repo's file-quality hook parses
  # each YAML with a single-document loader and rejects a multi-doc manifest outright.
  - database.yaml       # agent_memory — the pgvector store
  - database-app.yaml   # mem0_app     — the server's auth/user/api-key schema
  - extension-job.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Placement: CLOUD, although all three CNPG `postgres` instances run on ff-vm1.
#
# The multi-arch image (dockerfiles/mem0-server) made on-prem possible, and it was the
# design: beside the database, no tunnel round trip. It did not survive first deploy on
# 2026-09-16. ff-vm1, the only node `place-on-prem` selects, had 99% of its memory
# requested; mem0 carried no priority label, so at priority 0 it was preempted within
# minutes and could not reschedule. Raising its priority there would have made the scheduler
# evict the lowest-priority pods on ff-vm1 first, and that includes the CNPG operator
# (priority 0). The cloud tier was at 35-44% memory requested. The cost is a Postgres round
# trip over the site-to-site mesh, about 2 ms.
#
# Move it back to `on-prem`, keeping the priority, once ff-vm1 has memory headroom.
labels:
  # Consumed at admission by the Kyverno `place-cloud` (nodeSelector) and
  # `assign-priority-class` (priorityClassName) ClusterPolicies. `medium` matches hermes,
  # mem0's main caller.
  # includeSelectors/includeTemplates false: these fields are immutable on a live
  # Deployment/StatefulSet, so touching them would make Flux's next apply fail.
  - pairs:
      placement.sargeant.co/tier: cloud
      placement.sargeant.co/priority: medium
    includeSelectors: false
    includeTemplates: false
