apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The manifest library, applied by the per-env Flux Kustomization
# (prod/mem0/flux-kustomization.yaml). Resources span two namespaces — the CNPG
# Database + bootstrap Job live in `database` (with the shared cluster), the mem0
# server + secret + ingress in `automation` (with litellm/hermes) — so no namespace
# is set here; each resource carries its own metadata.namespace.
resources:
  - database.yaml
  - extension-job.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# REQUIRED, not a preference: the upstream mem0/mem0-api-server image (digest-pinned in
# dockerfiles/mem0-server/Dockerfile, and therefore ghcr.io/magmamoose/mem0-server
# too) publishes a manifest index containing linux/arm64 ONLY — no amd64. ff-vm1 is the
# single amd64 node, so an unpinned mem0 that lands there fails the pull outright ("no
# matching manifest for linux/amd64"). native-cloud = ff-oci1/ff-oci2, both arm64, and
# keeps this always-on service off the CPU-request-saturated ff-vm1 as a bonus.
# If mem0 ever ships amd64, this can widen — but it must never be simply deleted.
labels:
  # Placement tier — consumed by the Kyverno `place-cloud` ClusterPolicy, which
  # adds the nodeSelector at admission. Replaces components/node-selectors/native-cloud.
  # includeSelectors/includeTemplates false: these fields are immutable on a live
  # Deployment/StatefulSet, so touching them would make Flux's next apply fail.
  - pairs:
      placement.sargeant.co/tier: cloud
    includeSelectors: false
    includeTemplates: false
