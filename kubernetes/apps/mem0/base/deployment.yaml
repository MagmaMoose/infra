# Chargate/KICS suppressions (accepted risks, reviewed — genuinely actionable findings were
# FIXED in code instead: the base image is digest-pinned in ./Dockerfile and the mem0 container
# now runs with a READ-ONLY root filesystem + emptyDir scratch, matching every other workload):
#   4ac0e2b7 no CPU limits            – repo convention (CPU limits cause false CFS-throttle
#                                       alerts); see hermes deployment.yaml. The short-lived
#                                       utility containers below DO set one — that's deliberate.
#   caa3479d IfNotPresent w/ tag      – house convention for stock utility images
#   7c81d34c no image digest            (postgres:16-alpine); same as cronjob-sonarqube-sync.
#                                       NOTE: the sibling extension-job runs with the CNPG
#                                       SUPERUSER credential — digest-pin that one first if we
#                                       ever tighten this.
#   8b36775e no AppArmor annotation   – KICS wants the DEPRECATED beta annotation. The modern
#                                       securityContext.appArmorProfile is deliberately NOT set
#                                       yet: no AppArmor config exists in ansible/terraform, and
#                                       a profile request on a node without AppArmor FAILS pod
#                                       startup. Verify node support before enabling (README).
#   4a20ebac no LimitRange            – namespace-scoped policy for the SHARED `automation` ns,
#   48a5beba no ResourceQuota           owned elsewhere; an app PR must not impose it (house
#                                       convention, same as cronjob-sonarqube-sync).
#   3d658f8b secretKeyRef is defined  – the query prefers file-mounted secrets over env (CIS
#                                       5.4.1). ExternalSecret -> secretKeyRef env is the
#                                       repo-wide sanctioned pattern (41 apps) and mem0 reads
#                                       config only from env.
# kics-scan disable=4ac0e2b7-d2d2-4af7-8799-e8de6721ccda,caa3479d-885d-4882-9aac-95e5e78ef5c2,7c81d34c-8e5a-402b-9798-9f442630e678,8b36775e-183d-4d46-b0f7-96a6f34a723f,4a20ebac-1060-4c81-95d1-1f7f620e983b,48a5beba-e4c0-4584-a2aa-e6894e4cf424,3d658f8b-d988-41a0-a841-40043121de1e
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mem0
  namespace: automation
  labels:
    app: mem0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mem0
  template:
    metadata:
      labels:
        app: mem0
    spec:
      automountServiceAccountToken: false
      initContainers:
        # Gate 1 — the databases exist and agent_memory has pgvector, so mem0's
        # first-boot table creation doesn't race the bootstrap Job. Both databases are
        # checked: agent_memory holds the vectors, mem0_app holds the auth schema that
        # gate 2 migrates. A missing mem0_app would otherwise surface as an alembic
        # stack trace on a loop.
        - name: wait-for-databases
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until psql "host=postgres-rw.database.svc.cluster.local port=5432 user=neondb_owner dbname=agent_memory sslmode=require" -tAc "SELECT 1 FROM pg_extension WHERE extname='vector'" | grep -q 1; do
                echo "waiting for agent_memory + vector extension..."; sleep 3;
              done
              until psql "host=postgres-rw.database.svc.cluster.local port=5432 user=neondb_owner dbname=mem0_app sslmode=require" -tAc "SELECT 1" | grep -q 1; do
                echo "waiting for mem0_app database..."; sleep 3;
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mem0
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # Gate 2 — the auth schema. mem0's server ships alembic migrations for its
        # users/api-keys/refresh-tokens/request-logs tables and does NOT run them at
        # startup; upstream's compose runs `alembic upgrade head` ahead of uvicorn. Run
        # as an initContainer rather than an entrypoint so a failing migration shows up
        # as its own container status instead of as an app that mysteriously restarts.
        # Same image as the app: alembic/env.py imports server/db.py, so it derives the
        # URL from exactly the env below (POSTGRES_* + APP_DB_NAME), ignoring the
        # hardcoded sqlalchemy.url in alembic.ini.
        - name: migrate
          image: ghcr.io/magmamoose/mem0-server:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_HOST
              value: postgres-rw.database.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: neondb_owner
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mem0
                  key: POSTGRES_PASSWORD
            - name: APP_DB_NAME
              value: mem0_app
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
              readOnly: false
      containers:
        - name: mem0
          # Built from dockerfiles/mem0-server by .github/workflows/docker-publish.yml.
          # That Dockerfile builds mem0's `server/` from UPSTREAM SOURCE at a pinned
          # commit rather than layering on the published mem0/mem0-api-server image,
          # which has one tag, is ~11 months stale, and is arm64-only. Multi-arch as a
          # result, which is what lets this pod sit on-prem beside its Postgres.
          # Pin a released `mem0-server-v*` tag here once one is cut; `:latest` +
          # Always is the bootstrap state.
          image: ghcr.io/magmamoose/mem0-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            # --- Vector store: pgvector on the shared CNPG cluster ---
            - name: POSTGRES_HOST
              value: postgres-rw.database.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: agent_memory
            - name: POSTGRES_USER
              value: neondb_owner
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mem0
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_COLLECTION_NAME
              value: memories
            # --- Auth/user schema: a SEPARATE database on the same cluster (see
            # database.yaml). Migrated by the `migrate` initContainer above. ---
            - name: APP_DB_NAME
              value: mem0_app
            # --- LLM + embeddings: routed through the in-cluster LiteLLM gateway
            # (OpenAI-compatible :8080 auth-proxy). OPENAI_API_KEY is the LiteLLM key. ---
            - name: OPENAI_BASE_URL
              value: http://litellm.automation.svc.cluster.local:8080/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mem0
                  key: OPENAI_API_KEY
            # Both models are set EXPLICITLY because the server's own defaults moved:
            # it now defaults to `gpt-5-mini`, which this gateway does not register, so
            # relying on the default would fail every extraction call with "model not
            # found". These two ARE registered (kubernetes/apps/litellm/base/configmap.yaml).
            - name: MEM0_DEFAULT_LLM_MODEL
              value: gpt-4o-mini
            - name: MEM0_DEFAULT_EMBEDDER_MODEL
              value: text-embedding-3-small
            - name: MEM0_TELEMETRY
              value: "false"
            # --- Authentication ---
            # Was AUTH_DISABLED=true. The server now ships an auth layer, so the fleet
            # authenticates with a static admin key presented as `X-API-Key`. Stated as
            # "false" rather than omitted so the posture is legible in the manifest;
            # the server treats absent and "false" identically.
            - name: AUTH_DISABLED
              value: "false"
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mem0
                  key: ADMIN_API_KEY
            # Required even though the browser JWT flow is unused here — the server
            # raises at import when auth is on and this is empty.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mem0
                  key: JWT_SECRET
            # Sole CORS origin. The Next.js dashboard is not deployed (and is stripped
            # from the image), so this only needs to not be `http://localhost:3000`.
            - name: DASHBOARD_URL
              value: https://mem0.sargeant.co
            - name: PYTHONUNBUFFERED
              value: "1"
            # --- Read-only root filesystem support (see securityContext below) ---
            # The image installs deps as root then drops to UID 65534 without creating a
            # home, so the process could never write to / or $HOME anyway; these point the
            # few things that DO write at the emptyDir scratch mounts.
            - name: PYTHONDONTWRITEBYTECODE  # don't try to write .pyc onto a RO root
              value: "1"
            # HOME points at the /tmp scratch rather than a /home/... mount on purpose: a
            # writable volumeMount over an OS directory (/home, /etc, /var, ...) trips KICS
            # b7652612 (high) whatever readOnly says — the rule is about mounting over an OS
            # dir, not about the flag. One emptyDir serves both.
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            # mem0 keeps a SQLite audit trail of memory ADD/UPDATE/DELETE events and
            # opens it with a bare sqlite3.connect() — it does NOT create the parent
            # directory, so the default /app/history/history.db is an immediate crash on
            # a read-only root. Pointed at the scratch mount, which makes it EPHEMERAL:
            # accepted, because nothing in the fleet reads /memories/{id}/history and the
            # durable state (the vectors, and the auth schema) is in Postgres. If that
            # audit trail ever matters, it needs a PVC, not a different path.
            - name: HISTORY_DB_PATH
              value: /tmp/history.db
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              # ESTIMATE, not a measurement — the from-source image imports a much larger
              # graph than the old one (sqlalchemy, alembic, cryptography, bcrypt, the
              # anthropic and google-generativeai clients) and has never run here. Sized
              # generously on purpose: per COMMON_MISTAKES #14 a limit is not
              # scheduler-reserved, so headroom is free, whereas a limit near the real
              # working set is a deferred OOMKill (#13). Measure on first boot with
              # `kubectl exec deploy/mem0 -n automation -- cat /sys/fs/cgroup/memory.current`
              # and tighten the REQUEST, not this.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            # RO root + emptyDir scratch (mirrors cronjob-sonarqube-sync, and the sibling
            # initContainers above). The container mounts no persistent volume — all runtime
            # writes were already ephemeral on the container overlay — so this costs no
            # durability. If first boot fails on an unwritable path, add another emptyDir for
            # that path; do NOT flip this back to false.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # /auth/setup-status, NOT /docs. /docs is the FastAPI Swagger page: it renders
          # from the in-process OpenAPI schema and stays 200 while Postgres is face down,
          # so the old probes reported Ready on a pod that could not serve a single
          # memory. /auth/setup-status runs `SELECT count(*) FROM users` against mem0_app
          # and is deliberately unauthenticated (it is what the setup wizard polls), so it
          # is the one endpoint that both proves the database round-trips and needs no
          # credential — probes cannot read a Secret for an httpGet header.
          readinessProbe:
            httpGet:
              path: /auth/setup-status
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /auth/setup-status
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
          volumeMounts:
            # The ONLY writable path. readOnly is stated explicitly (not left to default) —
            # the scanner flags an undefined readOnly on a mount.
            - name: tmp
              mountPath: /tmp
              readOnly: false
      volumes:
        # Ephemeral by design: mem0's durable state is the agent_memory + mem0_app
        # databases on the shared CNPG cluster, not the pod filesystem. ONE scratch
        # mount — HOME, TMPDIR and the SQLite history file all point at it (see env).
        - name: tmp
          emptyDir: {}
