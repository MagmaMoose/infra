---
# Control plane: GitRepository (source for the external MagmaMoose/dunmir-pro
# repo), image automation, ghcr-reader RBAC, the dunmir-pro namespace, and the
# two `database-oci`-scoped resources — the CNPG `Database` on postgres-oci and
# the RBAC letting dunmir-pro read that cluster's credential Secret. These live
# in THIS repo under base/dunmir-pro and are applied from the flux-system source.
# Must reconcile before the workload below, which references the GitRepository it
# creates and cannot migrate a database that does not exist yet.
#
# Note `wait: false` below: this Kustomization being Ready does NOT mean the
# `dunmir` database has converged, so the workload's migrate Job blocks on it
# itself, in a `wait-for-postgres` initContainer that opens a real connection on
# the target DSN. Do not "fix" that by flipping wait to true — see the note.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-dunmir-pro-source
  namespace: flux-system
  # Inherited from chargate/caldrith for consistency: nothing under
  # base/dunmir-pro is SOPS-encrypted today (every Dün Mir Pro secret comes from
  # OCI Vault via External Secrets, and the database credential is generated by
  # CNPG and mirrored across namespaces by a third — no password is committed
  # anywhere), so the decryption block below is currently a no-op. It is kept so
  # that dropping a `.enc.yaml` into that directory later Just Works rather than
  # failing with an opaque "cannot decrypt" on first reconcile.
  labels:
    app.kubernetes.io/sops: enabled
spec:
  interval: 10m
  path: ./kubernetes/apps/dunmir-pro/base/dunmir-pro
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  # wait: false on purpose. This bundle includes TWO ImageRepositories, which stay
  # NotReady until the first ghcr.io/magmamoose/dunmir-pro-{backend,frontend}
  # images are published — and as of writing neither exists yet. dunmir-pro now
  # carries a root docker-bake.hcl with `backend` and `frontend` targets (added
  # for exactly this reason: the release workflow only sets image_name when a
  # ROOT Dockerfile or docker-bake.hcl is present, and Pro's Dockerfiles live
  # under backend/ and frontend/), but no release has RUN against it. Until one
  # does, expect both to sit at `scan failed: … NAME_UNKNOWN: repository name not
  # known to registry`, exactly like mikrotik-minder-agent does today.
  # With wait: true those two NotReady ImageRepositories would hang
  # this Kustomization and — via the dependsOn below — block the workload's Ingress
  # from ever applying, so external-dns would never publish dunmir.magmamoose.com.
  # We only need these control-plane resources APPLIED (namespace + GitRepository
  # must exist before the workload); their health must not gate DNS.
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-keys
---
# Workload: Dün Mir Pro — the FastAPI backend, the nginx SPA frontend, the
# schema-migration Job and the dead-man sweep CronJob — pulled from the EXTERNAL
# MagmaMoose/dunmir-pro repo
# (./k8s/overlays/prod) via the GitRepository created above. The two image tags
# in that overlay are bumped by the ImageUpdateAutomation.
#
# DNS for dunmir.magmamoose.com is published by external-dns from the app's
# Ingress; the firefly tunnel ingress_rules (tunnels.tf) terminate that hostname
# at the in-cluster Services — /api and /v1 straight to dunmir-backend:8000, the
# catch-all to dunmir-frontend:80. NOT Access-gated: this is a public product
# surface. Operators sign in with password + TOTP and agents authenticate with
# Bearer dunmir_ tokens, both handled in-app.
#
# ┌─ CUTOVER, NOT A DEPLOY ──────────────────────────────────────────────────┐
# │ dunmir.magmamoose.com is STILL served by the `dunmir-pro` Cloudflare      │
# │ Worker. A Worker route beats a DNS record at the edge, so reconciling     │
# │ this changes nothing user-visible until the Worker is detached — and      │
# │ detaching it before the tunnel ingress_rules are applied is an outage.    │
# │ Order: (1) apply the tunnel rules in tunnels.tf, (2) remove the Worker's  │
# │ apex route, (3) let external-dns publish the CNAME. Full note lives in    │
# │ the dunmir-pro repo's k8s/base/ingress.yaml.                              │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Pro runs here rather than on Cloudflare Workers because its auth path does
# PBKDF2 at 600k iterations (~190ms of CPU) and Workers Free caps an invocation
# at 10ms — every login/signup/reset died with Error 1102. The Worker build is
# kept green in CI (deploy-cf.yml, build-only) but no longer publishes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-dunmir-pro
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: dunmir-pro
  timeout: 5m
  wait: true
  dependsOn:
    - name: prod-dunmir-pro-source
    - name: infrastructure-services
  # Pin the externally-sourced workload to the cloud-worker tier (ff-oci*).
  #
  # Three targets here, where chargate/caldrith need two. The tier is not just a
  # reliability preference for this app: ff-oci1/ff-oci2 sit in OCI
  # eu-amsterdam-1 while ff-pi1/ff-vm1 sit on the home LAN, so an unpinned pod
  # and a pinned one talk to each other across the home↔OCI link. Every piece of
  # Dün Mir Pro that touches Postgres therefore has to land on the same side of
  # that link as `postgres-oci`, which is itself pinned to this tier. (The tier
  # is also uniformly arm64 — ff-vm1 is the only amd64 node in the cluster — so
  # both images must be arm64 or multi-arch regardless.)
  patches:
    # Deployments: dunmir-backend, dunmir-frontend.
    - target:
        kind: Deployment
      patch: |
        - op: add
          path: /spec/template/spec/nodeSelector
          value:
            topology.sargeant.co/tier: native-cloud
    # CronJob: dunmir-sweep, which replaced the Worker's [triggers] cron and
    # POSTs the admin-gated /internal/sweep every minute.
    - target:
        kind: CronJob
      patch: |
        - op: add
          path: /spec/jobTemplate/spec/template/spec/nodeSelector
          value:
            topology.sargeant.co/tier: native-cloud
    # Job: dunmir-migrate. Not in the chargate/caldrith template because neither
    # ships a Job — Pro does, and it is the one pod that MUST NOT stray. It
    # applies backend/schema/postgres.sql, and the backend Deployment blocks on a
    # wait-for-schema initContainer until it has; scheduled on the wrong side of
    # the home↔OCI link it runs its DDL over the WAN and, if that link is down,
    # never completes and stalls the entire rollout behind it.
    - target:
        kind: Job
      patch: |
        - op: add
          path: /spec/template/spec/nodeSelector
          value:
            topology.sargeant.co/tier: native-cloud
    # NO CNPG Cluster patch, because there is no CNPG Cluster to patch. The app
    # repo used to ship its own `dunmir-db` Cluster and this list carried a
    # fourth target pinning it to the tier; both are gone. Dün Mir Pro now uses
    # the SHARED `postgres-oci` cluster (ns `database-oci`) via a `Database` CR —
    # see base/dunmir-pro/database.yaml — which is the convention in AGENTS.md
    # ("do not create additional CNPG `Cluster` objects"), with postgres-oci as
    # the named exception for public-facing apps on this tier.
    #
    # Co-location is therefore by construction rather than by patch: postgres-oci
    # pins itself to `topology.sargeant.co/tier: native-cloud` in its own
    # spec.affinity (a CNPG Cluster synthesises its instance pods from that
    # field, so no kustomize component or Deployment patch can reach them), and
    # the three patches above put every Dün Mir Pro pod on the same tier. Both
    # ends of every query sit on ff-oci1/ff-oci2 in OCI eu-amsterdam-1, so the
    # home↔OCI link is never in the path. Nothing here has to arrange that, and
    # nothing here can un-arrange it.
