# Cross-namespace RBAC in `database-oci` that lets the dunmir-pro-namespace
# ServiceAccount `dunmir-pro-db-reader` read the ONE Secret `postgres-oci-app` —
# the credential CloudNativePG generated for the postgres-oci cluster's `app`
# owner role. Paired with the SecretStore + ExternalSecret in the dunmir-pro
# repo's k8s/base/db-credentials.yaml, whose `auth.serviceAccount` names exactly
# this SA. Same shape as ghcr-reader-rbac.yaml next door, pointed at a different
# namespace and a different Secret.
#
# This is what replaces an app-owned CNPG Cluster. The app needs a password it is
# not allowed to invent: CNPG owns it, publishes it in `database-oci`, and
# rotating the role there propagates to `dunmir-pro` on the ExternalSecret's next
# refresh. Without this grant the mirror reports SecretSyncedError (Forbidden),
# the `dunmir-postgres` Secret is never written, and both Deployments plus the
# migrate Job stay Pending on a missing Secret.
#
# Deliberately narrower than it looks: `resourceNames: [postgres-oci-app]` scopes
# the grant to a single Secret, read-only, and the subject is a single SA in a
# single namespace. It confers nothing on the postgres-oci Cluster itself, no
# superuser credential (postgres-oci runs `enableSuperuserAccess: false`), and no
# access to any other database's secrets.
#
# Chargate/KICS suppressions (reviewed: this Role's *purpose* is to read one
# Secret; the queries flag every RBAC rule that touches `secrets`, which is what
# we explicitly want here. The grant is scoped by resourceNames and bound to one
# SA — the same reviewed pattern as ghcr-reader-rbac.yaml).
# kics-scan disable=b7bca5c4-1dab-4c2c-8cbe-3050b9d59b14,056ac60e-fe07-4acc-9b34-8e1d51716ab9
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dunmir-pro-db-reader
  namespace: database-oci
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgres-oci-app"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dunmir-pro-db-reader
  namespace: database-oci
subjects:
  - kind: ServiceAccount
    name: dunmir-pro-db-reader
    namespace: dunmir-pro
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dunmir-pro-db-reader
