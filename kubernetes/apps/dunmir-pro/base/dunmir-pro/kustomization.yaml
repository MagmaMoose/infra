apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` directive on purpose — these are flux-system-scoped
# control-plane resources (GitRepository, image automation, ghcr-reader RBAC),
# the cluster-scoped Namespace, and two `database-oci`-scoped resources (the
# CNPG Database + the RBAC that lets dunmir-pro read its credential); each
# carries its own metadata.namespace. Adding a `namespace:` here would rewrite
# the Database into `dunmir-pro`, where postgres-oci does not exist — the same
# reason those two files live here and not in the app repo (whose overlay does
# set `namespace: dunmir-pro`). Matches sonarqube/dependency-track.
resources:
  - namespace.yaml
  - gitrepository.yaml
  - image-automation.yaml
  - ghcr-reader-rbac.yaml
  - database.yaml
  - db-reader-rbac.yaml
