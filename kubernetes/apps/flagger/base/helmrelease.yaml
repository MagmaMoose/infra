apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 10m
  chart:
    spec:
      chart: flagger
      version: "1.43.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
      interval: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Progressive-delivery controller. Traefik (the k3s ingress) is the
    # traffic-shifting provider for canaries.
    meshProvider: traefik
    # Reuse the existing kube-prometheus-stack for canary metric analysis (don't
    # install Flagger's bundled Prometheus). `prometheus-operated` is the
    # prometheus-operator's always-present Service in the observability namespace.
    metricsServer: "http://prometheus-operated.observability.svc.cluster.local:9090" # NOSONAR S5332 - in-cluster metrics endpoint (east-west), not internet-facing
    prometheus:
      install: false
    # Controller on the amd64 worker.
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    # KRR-sized (2026-07): cpu 10m, memory 100Mi. The chart's default 1-core CPU
    # LIMIT is dropped (repo convention: CPU limits only buy false CFS-throttle
    # alerts) and the 32Mi request was too tight for the controller's caches.
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 192Mi
