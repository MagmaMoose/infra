apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "68.2.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    crds: CreateReplace
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    # Skip helm's wait — 3 nodes are NotReady so prometheus pods can't all schedule,
    # and `helm upgrade` waits on them until the 15m deadline. Flux's Kustomization
    # health check on the HelmRelease itself is enough.
    disableWait: true
    # Without this, a failed upgrade leaves the release "pending-upgrade" and blocks
    # all subsequent reconciles (see history: v7–v10 all stuck since 2026-02-15).
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Global settings
    fullnameOverride: prometheus
    
    # Prometheus configuration
    prometheus:
      prometheusSpec:
        # Priority class, per the desired-state table in cleanup.md.
        # Set in chart values because the Kyverno assign-priority-class policy
        # cannot reach a chart-rendered workload — the placement label lands on
        # the HelmRelease, not the Deployment the chart renders.
        priorityClassName: medium
        # Pin to the on-prem worker (ff-vm1) — holds the Longhorn-backed storage,
        # must not drift onto the cloud nodes.
        nodeSelector:
          node-role.kubernetes.io/worker: ""
          topology.sargeant.co/tier: on-prem

        # External labels for Thanos
        externalLabels:
          cluster: firefly
          replica: $(POD_NAME)
        
        # Retention settings (short-term, Thanos handles long-term)
        retention: 7d
        retentionSize: "45GB"
        
        # Storage
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        
        # Resource requests/limits — sized from the KRR report (Prometheus uses
        # ~1.7Gi / ~150m here, was over-provisioned at 8Gi/2 cores). No CPU limit
        # (KRR rec: cpu limit -> unset) to avoid CFS throttling on the 16-core
        # ff-vm1 node; memory limit keeps headroom above observed usage.
        #
        # Limit raised 3Gi -> 4Gi for the Longhorn scrape (additionalServiceMonitors
        # below). The working set was already 2.46Gi on 2026-09-24, and Prometheus
        # keeps every series it drops at scrape time in a per-target cache so it can
        # skip relabelling them next time. The Longhorn managers serve ~800k series
        # that get dropped (~280MB of cache), and that grows while they stay up.
        # Request unchanged: a limit is not reserved by the scheduler
        # (COMMON_MISTAKES #14).
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            memory: 4Gi
        
        # Thanos sidecar configuration
        thanos:
          image: quay.io/thanos/thanos:v0.37.2
          version: v0.37.2
          # Chart 68.2.2 expects the `existingSecret` form here; the flat name/key
          # form is silently dropped by the chart, leaving the Prometheus CR with no
          # objectStorageConfig and the sidecar logging "uploads will be disabled".
          # SeaweedFS since the MinIO cutover. thanos-objstore-config is MinIO's, kept for
          # rollback (see externalsecret-thanos-objstore-seaweedfs.yaml).
          objectStorageConfig:
            existingSecret:
              name: thanos-objstore-seaweedfs
              key: objstore.yml
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 256Mi
        
        # Selectors — discover ServiceMonitors/PodMonitors/Rules/Probes across all
        # namespaces without requiring a release label (lets the blackbox Probe work).
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        
      # Thanos service for sidecar
      thanosService:
        enabled: true
        type: ClusterIP
        port: 10901

      # Scrape targets for two controllers in the infrastructure-controllers tier.
      # They live here, not next to their controllers, because of ordering. The
      # ServiceMonitor/PrometheusRule CRDs come from THIS chart (apps tier), and a
      # Flux Kustomization whose dry-run meets an unknown kind applies none of its
      # objects. On a rebuild the controllers tier would wait for these CRDs, this
      # chart would wait for external-secrets (its ExternalSecrets), and
      # external-secrets is in the controllers tier: nothing would ever apply.
      # Helm installs a chart's CRDs before its templates, so there is no ordering
      # to get wrong here. Their rules are in additionalPrometheusRulesMap for the
      # same reason.
      additionalServiceMonitors:
        # Longhorn's documented ServiceMonitor: longhorn-backend, port manager (9500).
        #
        # The drop is load-bearing. longhorn-manager 1.11 labels its client-go
        # histograms with the full request URL, and client-go puts a random 5-10m
        # watch timeout into that URL, so a manager keeps adding series for weeks
        # after it starts: the four up for 3-12 weeks served 48-76MB per scrape, up
        # to ~250k series each, of which only ~2k are Longhorn's own. Fixed in Longhorn
        # 1.12, which strips the query string. sampleLimit fails the scrape
        # (TargetDown) instead of filling Prometheus if another family like it
        # appears.
        - name: longhorn-manager
          selector:
            matchLabels:
              app: longhorn-manager
          namespaceSelector:
            matchNames:
              - longhorn-system
          sampleLimit: 20000
          endpoints:
            - port: manager
              # Each scrape is tens of MB until 1.12. 1m halves that cost against the
              # 30s default and is still well inside the Longhorn rules' `for:`.
              interval: 1m
              metricRelabelings:
                - sourceLabels: [__name__]
                  regex: longhorn_rest_client_.+
                  action: drop
        # cert-manager's controller: certificate expiry and readiness.
        - name: cert-manager
          selector:
            matchLabels:
              app.kubernetes.io/name: cert-manager
              app.kubernetes.io/component: controller
          namespaceSelector:
            matchNames:
              - cert-manager
          endpoints:
            - port: tcp-prometheus-servicemonitor

      # Ingress for Prometheus (optional)
      ingress:
        enabled: false
    
    # Grafana configuration
    grafana:
      # Priority class, per the desired-state table in cleanup.md.
      # Set in chart values because the Kyverno assign-priority-class policy
      # cannot reach a chart-rendered workload — the placement label lands on
      # the HelmRelease, not the Deployment the chart renders.
      priorityClassName: low
      enabled: true

      # Pin the Grafana image to 11.6.16 (chart 68.2.2 ships 11.4.0). Required by
      # the Logs Drilldown app below, which needs Grafana >= 11.6.0. Grafana
      # migrates grafana.db forward on upgrade — rolling back the tag is not clean.
      image:
        tag: "11.6.16"

      # Grafana Logs Drilldown (grafana-lokiexplore-app) — queryless Loki log
      # exploration: pick a namespace/app, auto log-level detection, error
      # highlighting, volume history. Installed from the grafana.com catalog on
      # pod start (needs egress). Pairs with the version-controlled
      # "App Logs — Loki" dashboard (dashboard-app-logs.yaml). Loki 3.3.2 already
      # satisfies its backend needs; the Patterns tab additionally wants
      # `pattern_ingester.enabled: true` in the Loki config (optional).
      plugins:
        - grafana-lokiexplore-app

      # Admin credentials from OCI Vault via ExternalSecret grafana-admin-credentials.
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      
      # Run Grafana on the OCI cloud tier (native-cloud). Stateless aside from
      # its Longhorn PVC, so it no longer needs to sit beside the on-prem worker.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.sargeant.co/tier
                operator: In
                values:
                - native-cloud
      # Recreate so the old pod releases the RWO PVC before the new one starts.
      deploymentStrategy:
        type: Recreate

      # Persistence — Longhorn (replicated, node-independent) so Grafana runs on
      # the worker. Dashboards (29 cm) + datasources (2 cm) are sidecar-provisioned
      # and admin is from OCI Vault, so only grafana.db (users/annotations/API keys)
      # is node-local; migrated by restoring the db after the storageClass cutover.
      persistence:
        enabled: true
        size: 10Gi
        storageClassName: longhorn
      
      # Resources — no CPU limit (avoid CFS throttling); modest memory footprint.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      
      # Datasources
      additionalDataSources:
        - name: Thanos
          type: prometheus
          url: http://thanos-query:9090
          access: proxy
          isDefault: true
          jsonData:
            timeInterval: 30s
        - name: Loki
          type: loki
          url: http://loki-gateway
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 1000
      
      # Dashboard providers
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      
      # Ingress for grafana.magmamoose.com — exposed via the firefly cloudflared
      # tunnel and gated by a Caleb-only Cloudflare Access app (ZTNA), mirroring the
      # n8n pattern. external-dns-cloudflare publishes a PROXIED CNAME to the tunnel
      # (the `target` annotation) instead of the private LAN A record that dangled
      # here before — that raw 192.168.x A record made the site hang from anywhere
      # off-LAN. The tunnel route + Access policy live in
      # terraform/cloudflare/zero-trust/prod (tunnels.tf + access_apps.tf). The LAN
      # alias grafana.sargeant.local is a SEPARATE Ingress (ingress-grafana-lan.yaml)
      # so this tunnel `target` annotation never lands on the .local record.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-dns
          traefik.ingress.kubernetes.io/service.serversscheme: http
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          external-dns.alpha.kubernetes.io/target: 7694eb38-c35e-4905-bd2b-16ab7053080a.cfargotunnel.com
        hosts:
          - grafana.magmamoose.com
        tls:
          - hosts:
              - grafana.magmamoose.com
            secretName: grafana-tls

      # Sidecar for loading dashboards
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          resources:
            requests:
              cpu: 10m
              memory: 124Mi
            limits:
              memory: 192Mi
        datasources:
          enabled: true
          # Suppress the chart's built-in Prometheus datasource entirely (this knob
          # gates its emission) so the additionalDataSources "Thanos" (isDefault: true)
          # is the only datasource AND the sole org default. Two defaults crashloop
          # Grafana: "Only one datasource per organization can be marked as default".
          defaultDatasourceEnabled: false
          searchNamespace: ALL
          resources:
            requests:
              cpu: 10m
              memory: 121Mi
            limits:
              memory: 192Mi

    # AlertManager configuration
    alertmanager:
      enabled: true
      # Route critical alerts (incl. CNPG backup failures) to Slack #engineering-alerts.
      # Uses the bot token mounted from the slack-bot-token secret (alertmanagerSpec.secrets)
      # via credentials_file, posting through chat.postMessage to channel C0A9FT7355Z.
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: "null"
          group_by: ["namespace", "alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            # No `continue` here. With it, a critical CNPG backup alert went on to
            # match the CNPGBackup route below too and was posted to the same
            # channel twice.
            - receiver: slack-critical
              matchers:
                - 'severity="critical"'
            # Now only sees the CNPG backup alerts that are not critical
            # (CNPGBackupMetricMissing), which still belong in slack-critical.
            - receiver: slack-critical
              matchers:
                - 'alertname=~"CNPGBackup.*"'
            # WARNING alerts used to fall through to "null". Everything that actually
            # breaks this cluster is severity=warning in kube-prometheus-stack —
            # KubePodCrashLooping, KubeJobFailed, KubePodNotReady,
            # KubeDeploymentReplicasMismatch — so nothing was ever delivered.
            #
            # Measured 2026-08-31: 63 alerts firing, 59 of them routed to "null",
            # including KubePodCrashLooping (multiple OOMKills) and dozens of
            # KubeJobFailed. Several workloads had been failing for days,
            # others rolling hundreds of times or down for hours —
            # all alerting the whole time, none of it visible.
            #
            # Deliberately its own receiver with a slow cadence, so this informs
            # without becoming noise that gets muted.
            - receiver: slack-warning
              matchers:
                - 'severity="warning"'
              group_by: ["namespace", "alertname"]
              group_wait: 2m
              group_interval: 30m
              repeat_interval: 24h
        receivers:
          - name: "null"
          - name: slack-critical
            slack_configs:
              - api_url: https://slack.com/api/chat.postMessage
                channel: "C0A9FT7355Z"
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/slack-bot-token/token
                title: '{{ if eq .Status "firing" }}:red_circle:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}'
                text: |-
                  {{ range .Alerts }}*{{ .Annotations.summary }}*
                  {{ .Annotations.description }}
                  {{ end }}
          - name: slack-warning
            slack_configs:
              - api_url: https://slack.com/api/chat.postMessage
                channel: "C0A9FT7355Z"
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/slack-bot-token/token
                title: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}'
                text: |-
                  {{ range .Alerts }}*{{ .Annotations.summary }}*
                  {{ .Annotations.description }}
                  {{ end }}
      alertmanagerSpec:
        # Priority class, per the desired-state table in cleanup.md.
        # Set in chart values because the Kyverno assign-priority-class policy
        # cannot reach a chart-rendered workload — the placement label lands on
        # the HelmRelease, not the Deployment the chart renders.
        priorityClassName: high
        # Slack bot token (from OCI Vault via ExternalSecret) mounted at
        # /etc/alertmanager/secrets/slack-bot-token/token
        secrets:
          - slack-bot-token
        # Run Alertmanager on the OCI cloud tier (native-cloud).
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: topology.sargeant.co/tier
                  operator: In
                  values:
                  - native-cloud

        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
        
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 100Mi

      ingress:
        enabled: false
    
    # Prometheus Operator
    prometheusOperator:
      # Priority class, per the desired-state table in cleanup.md.
      # Set in chart values because the Kyverno assign-priority-class policy
      # cannot reach a chart-rendered workload — the placement label lands on
      # the HelmRelease, not the Deployment the chart renders.
      priorityClassName: medium
      # Stateless observability controller — schedule on the on-prem worker, not the Pi
      # (the node-selectors/mini kustomize component can't reach Helm-rendered pods).
      nodeSelector:
        node-role.kubernetes.io/worker: ""
        topology.sargeant.co/tier: on-prem
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
        limits:
          memory: 100Mi

    # Node Exporter
    nodeExporter:
      enabled: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/unreachable
                operator: DoesNotExist
    
    # Node Exporter resources
    prometheus-node-exporter:
      # Priority class, per the desired-state table in cleanup.md.
      # Set in chart values because the Kyverno assign-priority-class policy
      # cannot reach a chart-rendered workload — the placement label lands on
      # the HelmRelease, not the Deployment the chart renders.
      priorityClassName: low
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
        limits:
          memory: 100Mi

    # Kube State Metrics
    kubeStateMetrics:
      enabled: true
    
    # Kube State Metrics resources
    kube-state-metrics:
      # Priority class, per the desired-state table in cleanup.md.
      # Set in chart values because the Kyverno assign-priority-class policy
      # cannot reach a chart-rendered workload — the placement label lands on
      # the HelmRelease, not the Deployment the chart renders.
      priorityClassName: medium
      # Stateless observability component — schedule on the on-prem worker, not the Pi.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
        topology.sargeant.co/tier: on-prem
      # 100Mi was not enough and had not been for a long time: the pod was OOMKilled 31
      # times, quietly, because the thing that would have alerted on it is the thing
      # being killed — kube-state-metrics IS the source of the KubePodCrashLooping
      # series, so while it is down it cannot report that it is down.
      #
      # Memory here scales with the number of objects watched, not with traffic, and
      # this cluster holds ~335 pods, ~664 replicasets, ~379 secrets and ~163
      # configmaps across 30 watched resource types. The replicaset count is the
      # driver and it only grows.
      resources:
        requests:
          cpu: 10m
          memory: 384Mi
        limits:
          memory: 384Mi
      # Holmes's scheduled health checks (kubernetes/apps/holmesgpt/checks) keep their
      # result in a ScheduledHealthCheck's status and nowhere else: the operator has no
      # metrics endpoint. These three series are what the holmes-health-checks rules
      # below alert on. The chart adds the CRD list/watch this needs on its own; the
      # extra rule is for the objects themselves.
      #
      # finding_info carries Holmes's findings as a label, so the alert can quote them.
      # It is one series per check, replaced when a run's findings change, and the
      # alert only reads it in an annotation, so new findings never make a new alert.
      rbac:
        extraRules:
          - apiGroups: ["holmesgpt.dev"]
            resources: ["scheduledhealthchecks"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: holmesgpt.dev
                  kind: ScheduledHealthCheck
                  version: v1alpha1
                metricNamePrefix: holmes_healthcheck
                labelsFromPath:
                  check: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  - name: last_result
                    help: "Result of the check's last run: pass, fail or error."
                    each:
                      type: StateSet
                      stateSet:
                        labelName: result
                        path: [status, lastResult]
                        list: [pass, fail, error]
                  - name: last_run_timestamp_seconds
                    help: "When the check last ran."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastScheduleTime]
                  - name: finding_info
                    help: "Holmes's findings from the check's last run."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          message: [status, message]

    # kube-prometheus-stack ships no OOMKilled alert. Three separate OOM bugs surfaced
    # on 2026-08-31 (one container OOMKilled mid-scan at 256Mi, another running against
    # a large cache at the same limit, a third with a volume filled by a media cache)
    # and not one of them named itself — each presented as a permissions error, a crash
    # loop, or a library that was quietly incomplete. This is the cheapest possible
    # signal for a whole class of "sized from a settled instance" mistakes.
    additionalPrometheusRulesMap:
      oomkilled:
        groups:
          - name: container-oom
            rules:
              - alert: KubeContainerOOMKilled
                expr: |
                  increase(kube_pod_container_status_restarts_total[10m]) > 0
                  and on (namespace, pod, container)
                  kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOMKilled'
                  description: >-
                    It restarted in the last 10 minutes with reason OOMKilled. Check what
                    the container was DOING when it died before raising the limit — a
                    scan, rebuild or repair needs far more than steady state.

      # ---- CronJobs ------------------------------------------------------------------
      # One alert per CronJob that has stopped succeeding, replacing KubeJobFailed's one
      # per failed Job object (see defaultRules.disabled). "Stopped succeeding" means no
      # successful run within two of its own intervals, counted from creation if it has
      # never succeeded. That covers runs that fail, runs that hang (concurrencyPolicy
      # Forbid then skips every later one) and runs that are never scheduled.
      #
      # The interval is NOT kube-state-metrics' next-run time minus its last-run time.
      # kube-state-metrics 2.14 works a schedule out in UTC and ignores spec.timeZone,
      # while k3s runs a CronJob with no timeZone in the control-plane node's local time
      # (UTC+2 in summer). For "0 4 * * *" it puts the next run 2h after the last one,
      # not 24h. Built that way, this rule flagged 26 CronJobs on 2026-09-24 instead of
      # 11, two healthy Longhorn backup jobs among them at critical. Only a schedule
      # whose hour field is "*" is safe from a whole-hour offset, so kube-state-metrics
      # is used for those. Every other schedule gets the longest gap its fields allow
      # (every N hours, daily, weekly, monthly), which can make an alert late but never
      # early.
      cronjobs:
        groups:
          - name: cronjobs
            rules:
              - record: cronjob:schedule_interval:seconds
                expr: |
                  # Hour field "*": kube-state-metrics is right. Measured from
                  # creation until the first run.
                  (
                    max by (namespace, cronjob) (kube_cronjob_next_schedule_time)
                    - (
                      max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time)
                      or max by (namespace, cronjob) (kube_cronjob_created)
                    )
                  )
                  and on (namespace, cronjob) kube_cronjob_info{schedule=~`\S+ \* \* \* \*|@hourly|@every .+`}
                  # Every N hours.
                  or max by (namespace, cronjob) (kube_cronjob_info{schedule=~`\S+ \*/2 \* \* \*`}) * 2 * 3600
                  or max by (namespace, cronjob) (kube_cronjob_info{schedule=~`\S+ \*/3 \* \* \*`}) * 3 * 3600
                  or max by (namespace, cronjob) (kube_cronjob_info{schedule=~`\S+ \*/4 \* \* \*`}) * 4 * 3600
                  or max by (namespace, cronjob) (kube_cronjob_info{schedule=~`\S+ \*/6 \* \* \*`}) * 6 * 3600
                  or max by (namespace, cronjob) (kube_cronjob_info{schedule=~`\S+ \*/8 \* \* \*`}) * 8 * 3600
                  or max by (namespace, cronjob) (kube_cronjob_info{schedule=~`\S+ \*/12 \* \* \*`}) * 12 * 3600
                  # Set hours, every day. This pattern also matches everything above it,
                  # and the next one matches this; "or" keeps the first match, so the
                  # order is load-bearing.
                  or max by (namespace, cronjob) (kube_cronjob_info{schedule=~`\S+ \S+ \* \* \*|@daily|@midnight`}) * 86400
                  # Set days of the week.
                  or max by (namespace, cronjob) (kube_cronjob_info{schedule=~`\S+ \S+ \* \* \S+|@weekly`}) * 7 * 86400
                  # Anything else sets a day of the month. Catch-all: uses 31-day
                  # interval, giving a 62-day alert threshold. Conservative by design —
                  # monthly schedules span 28–31 days, and 2× is the smallest safe window.
                  or max by (namespace, cronjob) (kube_cronjob_info) * 31 * 86400
              # Seconds since each non-suspended CronJob last succeeded, or since it was
              # created if it never has.
              - record: cronjob:since_last_success:seconds
                expr: |
                  (
                    time() - (
                      max by (namespace, cronjob) (kube_cronjob_status_last_successful_time)
                      or max by (namespace, cronjob) (kube_cronjob_created)
                    )
                  )
                  and on (namespace, cronjob) max by (namespace, cronjob) (kube_cronjob_spec_suspend) == 0
              # Backups get their own alert name, not KubeCronJobNotSucceeding at
              # critical: the default inhibit rule mutes a warning while a critical with
              # the same alertname fires in the same namespace, which would hide every
              # other CronJob there.
              - alert: BackupCronJobNotSucceeding
                expr: |
                  cronjob:since_last_success:seconds{cronjob=~".*(backup|snapshot).*"}
                    > 2 * cronjob:schedule_interval:seconds
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: 'Backup CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded for {{ $value | humanizeDuration }}'
                  description: >-
                    No run has succeeded within two of its scheduled intervals (or since
                    it was created), so there is no fresh backup. Check `kubectl -n
                    {{ $labels.namespace }} describe cronjob {{ $labels.cronjob }}` and
                    the logs of its most recent Job.
              - alert: KubeCronJobNotSucceeding
                expr: |
                  cronjob:since_last_success:seconds{cronjob!~".*(backup|snapshot).*"}
                    > 2 * cronjob:schedule_interval:seconds
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded for {{ $value | humanizeDuration }}'
                  description: >-
                    No run has succeeded within two of its scheduled intervals (or since
                    it was created): its runs fail, hang or are not being scheduled.
                    Check `kubectl -n {{ $labels.namespace }} describe cronjob
                    {{ $labels.cronjob }}` and the logs of its most recent Job.
              # The chart's KubeJobFailed minus the Jobs a CronJob owns, which the two
              # rules above cover. A one-off Job (a migration, a bootstrap) that fails
              # still needs a human.
              - alert: KubeJobFailed
                expr: |
                  # kube_job_failed is the Job's Failed condition (boolean), not
                  # kube_job_status_failed (pod retry counter). Fires once, not on each retry.
                  kube_job_failed{job="kube-state-metrics"} > 0
                  unless on (namespace, job_name) kube_job_owner{owner_kind="CronJob"}
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'Job {{ $labels.namespace }}/{{ $labels.job_name }} failed'
                  description: >-
                    A Job that no CronJob owns failed to complete. Deleting the Job
                    after investigating clears this alert.

      # ---- Longhorn (scraped by additionalServiceMonitors: longhorn-manager) ----------
      longhorn:
        groups:
          - name: longhorn
            rules:
              # One series per state, 1 on the current one (Longhorn 1.11; older releases
              # had one series valued 0-3). A detached volume reports "unknown".
              - alert: LonghornVolumeFaulted
                expr: longhorn_volume_robustness{state="faulted"} == 1
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'Longhorn volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is faulted'
                  description: >-
                    It has no usable replica left, so its workload cannot read or write
                    it. Check `kubectl -n longhorn-system get replicas.longhorn.io -l
                    longhornvolume={{ $labels.volume }}`.
              - alert: LonghornVolumeDegraded
                expr: longhorn_volume_robustness{state="degraded"} == 1
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: 'Longhorn volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) has been degraded for 30m'
                  description: >-
                    It runs on fewer healthy replicas than it asks for and has not
                    rebuilt. One more replica failure faults it.
              # 0 New, 1 Pending, 2 InProgress, 3 Completed, 4 Error, 5 Unknown
              # (metrics_collector/backup_collector.go, v1.11.3). Longhorn deletes a
              # failed backup after failed-backup-ttl (1440 minutes here), so this
              # resolving means the record is gone, not that a later backup worked.
              - alert: LonghornBackupFailed
                expr: longhorn_backup_state == 4
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'Longhorn backup of volume {{ $labels.volume }} failed'
                  description: >-
                    Backup {{ $labels.backup }} (recurring job
                    "{{ $labels.recurring_job }}") is in Error state. The error is in
                    `kubectl -n longhorn-system get backups.longhorn.io
                    {{ $labels.backup }} -o yaml`.
              # 85% is where Longhorn stops placing replicas on a disk
              # (storageMinimalAvailablePercentage: 15 in its HelmRelease).
              - alert: LonghornNodeStorageHigh
                expr: longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes > 0.85
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'Longhorn storage on {{ $labels.node }} is {{ $value | humanizePercentage }} used'
                  description: >-
                    Past 85%, new and rebuilding replicas no longer fit on this node.
                    Usage counts everything on the disk's filesystem, not only
                    Longhorn's data.

      # ---- cert-manager (scraped by additionalServiceMonitors: cert-manager) ----------
      # A certificate's own namespace arrives as exported_namespace: with honorLabels
      # off, the scrape's namespace label (cert-manager) wins the clash.
      cert-manager:
        groups:
          - name: cert-manager
            rules:
              # Stops at 3 days, where the critical below takes over. The names differ,
              # so the default inhibit rule would not drop the duplicate.
              - alert: CertManagerCertExpirySoon
                expr: |
                  certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
                  and certmanager_certificate_expiration_timestamp_seconds - time() >= 3 * 86400
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: 'Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}'
                  description: >-
                    cert-manager renews these at least 30 days before expiry, so this one
                    has been failing to renew for over two weeks. Check `kubectl -n
                    {{ $labels.exported_namespace }} describe certificate
                    {{ $labels.name }}` and its latest CertificateRequest.
              - alert: CertManagerCertExpiryCritical
                expr: certmanager_certificate_expiration_timestamp_seconds - time() < 3 * 86400
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: 'Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}'
                  description: >-
                    Renewal has been failing for almost four weeks, and TLS for every
                    host on it breaks when it expires. Check `kubectl -n
                    {{ $labels.exported_namespace }} describe certificate
                    {{ $labels.name }}` and its latest CertificateRequest.
              - alert: CertManagerCertNotReady
                expr: certmanager_certificate_ready_status{condition!="True"} == 1
                for: 1h
                labels:
                  severity: critical
                annotations:
                  summary: 'Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} has not been Ready for 1h'
                  description: >-
                    cert-manager cannot issue it. Check `kubectl -n
                    {{ $labels.exported_namespace }} describe certificate
                    {{ $labels.name }}` and its latest CertificateRequest and Order.

      # ---- Holmes scheduled health checks (kubernetes/apps/holmesgpt/checks) ---------
      # From kube-state-metrics' customResourceState above. The checks look only for
      # things that need someone to act and that no other rule here catches, so a failed
      # one is critical: that is what puts it in Nievah's alert lane, which asks Holmes
      # about it, files the fix and tells the owner.
      holmes-health-checks:
        groups:
          - name: holmes-health-checks
            rules:
              # The findings are read into the description, never into a label. So a
              # check that keeps failing is ONE alert, investigated once, not a new one
              # every run. The price: a new problem that turns up while an older one is
              # still unfixed raises no new alert. The description always shows the
              # latest run, and so does the daily brief.
              - alert: HolmesHealthCheckFailed
                expr: holmes_healthcheck_last_result{result="fail"} == 1
                labels:
                  severity: critical
                annotations:
                  summary: 'Holmes health check {{ $labels.check }} found a problem'
                  description: >-
                    {{ with printf `holmes_healthcheck_finding_info{namespace="%s", check="%s"}` $labels.namespace $labels.check | query }}{{ . | first | label "message" }}{{ end }}
                    The check's question: `kubectl -n {{ $labels.namespace }} get
                    scheduledhealthcheck {{ $labels.check }} -o yaml`.
              # Holmes could not answer at all (LiteLLM down or Holmes's budget spent,
              # Holmes restarting). That says nothing about the cluster, so a warning.
              - alert: HolmesHealthCheckErrored
                expr: holmes_healthcheck_last_result{result="error"} == 1
                labels:
                  severity: warning
                annotations:
                  summary: 'Holmes health check {{ $labels.check }} could not run'
                  description: >-
                    {{ with printf `holmes_healthcheck_finding_info{namespace="%s", check="%s"}` $labels.namespace $labels.check | query }}{{ . | first | label "message" }}{{ end }}
                    Check `kubectl -n holmesgpt logs deploy/holmesgpt-holmes`.
              # The longest schedule is daily, so 26h is one missed run plus slack.
              - alert: HolmesHealthCheckNotRunning
                expr: time() - holmes_healthcheck_last_run_timestamp_seconds > 26 * 3600
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'Holmes health check {{ $labels.check }} has not run for {{ $value | humanizeDuration }}'
                  description: >-
                    The Holmes operator starts each run. Check `kubectl -n holmesgpt logs
                    deploy/holmesgpt-operator`, and that the check's spec.enabled is not
                    false.

    # ---- k3s control-plane scrape targets -------------------------------------------
    # k3s does not run the scheduler, controller-manager and kube-proxy as separate
    # labelled pods — they live INSIDE the k3s process, and their metrics bind to
    # 127.0.0.1 by default. The chart still creates a headless Service + ServiceMonitor
    # for each, selecting on `component=kube-scheduler` etc., which matches nothing here.
    # The Services therefore resolve to ZERO endpoints, no target is ever discovered, and
    # `absent(up{job="kube-scheduler"} == 1)` is true forever: KubeSchedulerDown,
    # KubeControllerManagerDown and KubeProxyDown fired continuously from the moment this
    # stack was installed (2026-08-17 20:06, ~40s after the Watchdog) and stayed critical
    # for 17 days. They were never a cluster fault — they were three alerts about
    # themselves, and their noise is what made the one REAL critical in the same channel
    # (CNPGBackupTooOld, 27 days without a backup) easy to scroll past.
    #
    # Fix is to scrape the real thing rather than silence the rule: the components are
    # pointed at explicit node endpoints, which only returns data once k3s is told to bind
    # those ports outward. ORDER MATTERS — ansible/firefly-k3s-metrics-bind.yaml must be
    # applied to the nodes FIRST. Until it is, these targets are DOWN rather than ABSENT,
    # so the same three alerts keep firing (no worse than today, but not yet fixed).
    #
    # Endpoints are static node IPs because there is nothing to select on. Adding or
    # removing a node means editing kubeProxy.endpoints below — every node runs kube-proxy,
    # while the scheduler and controller-manager exist only on the control-plane Pi.
    kubeControllerManager:
      enabled: true
      endpoints:
        - 192.168.19.10 # ff-pi1 — the only control-plane node
      service:
        enabled: true
        port: 10257
        targetPort: 10257
      serviceMonitor:
        https: true
        # k3s serves these over TLS with a self-signed cert that does not carry the node
        # IP as a SAN, so verification cannot succeed against an IP endpoint.
        insecureSkipVerify: true

    kubeScheduler:
      enabled: true
      endpoints:
        - 192.168.19.10 # ff-pi1
      service:
        enabled: true
        port: 10259
        targetPort: 10259
      serviceMonitor:
        https: true
        insecureSkipVerify: true

    kubeProxy:
      enabled: true
      # Every node runs kube-proxy, so every node is an endpoint. Keep in step with
      # ansible/hosts.yaml.
      endpoints:
        - 192.168.19.10 # ff-pi1
        - 192.168.19.11 # ff-pi2
        - 192.168.19.13 # ff-vm1
        - 192.168.223.71 # ff-oci1
        - 192.168.223.72 # ff-oci2
        - 192.168.240.71 # ff-oci3
        - 192.168.240.72 # ff-oci4
      service:
        enabled: true
        port: 10249
        targetPort: 10249
      serviceMonitor:
        # kube-proxy's metrics port is plain HTTP, unlike the other two.
        https: false

    # Default rules and alerts
    defaultRules:
      create: true
      # KubeJobFailed fires once per failed Job object, and a failed Job stays until
      # something deletes it: 33 of 41 CronJobs set no ttlSecondsAfterFinished and most
      # keep 3 failed Jobs (some 5). So one broken CronJob was up to five alerts that
      # outlived its recovery, and on 2026-09-24 KubeJobFailed was 53 of the 66 alerts
      # firing.
      # Replaced by the per-CronJob rules in additionalPrometheusRulesMap.cronjobs,
      # plus a KubeJobFailed there for Jobs no CronJob owns.
      disabled:
        KubeJobFailed: true
      rules:
        alertmanager: true
        etcd: true
        configReloaders: true
        general: true
        k8s: true
        kubeApiserver: true
        kubeApiserverAvailability: true
        kubeApiserverSlos: true
        kubelet: true
        kubeProxy: true
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeScheduler: true
        kubeStateMetrics: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: true
        prometheusOperator: true
