# Thanos's bucket on SeaweedFS (kubernetes/apps/seaweedfs), which replaced MinIO.
#
# A NEW SECRET, not an edit of thanos-objstore-config, because nothing restarts the three
# readers (the Prometheus sidecar, thanos-store, thanos-compactor) when a Secret changes. Had
# the old Secret been edited, a pod that restarted before External Secrets rewrote it would
# have come back on MinIO and stayed there. With a new name, a pod that starts first waits
# for the Secret to exist, and so can only ever start on SeaweedFS. thanos-objstore-config
# (MinIO) stays until MinIO is removed, so switching back is one line in each reader.
#
# Same user and vault entry as on MinIO: SeaweedFS's `thanos` identity reuses them.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: thanos-objstore-seaweedfs
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: thanos-objstore-seaweedfs
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        objstore.yml: |
          type: s3
          config:
            bucket: thanos-metrics
            endpoint: seaweedfs.general-system.svc.cluster.local:8333
            access_key: thanos
            secret_key: {{ .thanosPassword | quote }}
            insecure: true
  data:
    - secretKey: thanosPassword
      remoteRef:
        key: minio-thanos-password
