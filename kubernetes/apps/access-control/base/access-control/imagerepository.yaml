---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: access-control-backend-imagerepository
  namespace: flux-system
spec:
  image: ghcr.io/calebsargeant/access-control-backend
  interval: 5m
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: access-control-frontend-imagerepository
  namespace: flux-system
spec:
  image: ghcr.io/calebsargeant/access-control-frontend
  interval: 5m
  secretRef:
    name: ghcr-pull-secret
