---
# Workload: the access-control frontend/backend, pulled from the EXTERNAL
# CalebSargeant/franklinhouse repo (./access-control/k8s/overlays/staging) via the
# `access-control` GitRepository created by base/access-control.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-access-control
  namespace: flux-system
spec:
  interval: 5m
  path: ./access-control/k8s/overlays/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: access-control
    namespace: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: infrastructure-services
