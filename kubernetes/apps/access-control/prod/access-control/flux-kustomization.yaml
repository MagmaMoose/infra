---
# Workload: the access-control frontend/backend, pulled from the EXTERNAL
# CalebSargeant/franklinhouse repo (./access-control/k8s/overlays/prod) via the
# `access-control` GitRepository created by base/access-control. Image tags in
# that overlay are bumped by the ImageUpdateAutomation alongside this file.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-access-control
  namespace: flux-system
spec:
  interval: 5m
  path: ./access-control/k8s/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: access-control
    namespace: flux-system
  timeout: 5m
  wait: true
  # The workload's Deployments block on Postgres, which the infrastructure-services
  # tier creates (clusters/franklinhouse/infrastructure/services/stack/postgres).
  dependsOn:
    - name: infrastructure-services
