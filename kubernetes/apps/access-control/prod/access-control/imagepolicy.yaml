---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: prod-access-control-backend-imagepolicy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: access-control-backend-imagerepository
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
  policy:
    semver:
      range: '>=0.1.0-0'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: prod-access-control-frontend-imagepolicy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: access-control-frontend-imagerepository
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
  policy:
    semver:
      range: '>=0.1.0-0'
