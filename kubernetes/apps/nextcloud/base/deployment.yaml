apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  # Single replica on a ReadWriteOnce config volume — Recreate so the old pod
  # releases the PVC before the new one starts (RollingUpdate would surge a second
  # pod that can't attach the RWO volume and stay Pending).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          image: linuxserver/nextcloud:version-31.0.1
          resources:
            # KRR: nextcloud's working set is ~123Mi; 759Mi was a ~6x over-reservation
            # that dominated ff-pi1's memory-request pressure. The REQUEST stays at
            # 256Mi for that reason — requests are what the scheduler reserves, so
            # that pressure is unchanged.
            #
            # The LIMIT is 1Gi because serving pages is not the peak. Bootstrapping
            # the share manager through occ needs more than 256Mi and was OOM-killed
            # twice trying to put a password on an existing public link, leaving no
            # way to close it from the CLI at all — the fix had to go straight to the
            # database. Upgrades and occ:files:scan have the same shape: rare, short,
            # and several times the steady state.
            #
            # This makes the pod Burstable rather than Guaranteed, so it is evicted
            # earlier under node memory pressure. That is the right trade for a
            # single-user file server: a restart costs a few seconds, an OOM kill
            # mid-occ costs a half-finished operation.
            #
            # CPU request only, no CPU limit (avoid CFS throttling).
            requests:
              memory: "256Mi"
              cpu: "10m"
            limits:
              memory: "1Gi"
          ports:
            - containerPort: 80
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
          volumeMounts:
            - name: nextcloud-config
              mountPath: /config
            - name: nextcloud-data
              mountPath: /data
      volumes:
        - name: nextcloud-config
          persistentVolumeClaim:
            claimName: nextcloud-config
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-data
      restartPolicy: Always
