apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
  - pv.yaml
  - namespace.yaml
  - externalsecret.yaml
# Migrated off ff-pi1: /config (was Pi-local hostPath) now Longhorn, /data now a
# proper NFS PV, pinned to the worker node instead of the Pi (system node).
labels:
  # Placement tier — consumed by the Kyverno `place-worker` ClusterPolicy, which
  # adds the nodeSelector at admission. Replaces components/node-selectors/worker.
  # includeSelectors/includeTemplates false: these fields are immutable on a live
  # Deployment/StatefulSet, so touching them would make Flux's next apply fail.
  - pairs:
      placement.sargeant.co/tier: worker
      placement.sargeant.co/priority: high
    includeSelectors: false
    includeTemplates: false
