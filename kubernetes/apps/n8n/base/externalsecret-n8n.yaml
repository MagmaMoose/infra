# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
---
# Migrated from secret.enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: n8n-credentials — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: n8n
  namespace: automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: n8n
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: encryption-key # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: n8n-credentials
        property: encryption-key
    - secretKey: postgres-password # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: n8n-credentials
        property: postgres-password
    - secretKey: postgres-username # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: n8n-credentials
        property: postgres-username
