apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      initContainers:
        # config.xml must be writable, because the *arr apps persist new keys at startup.
        # Sonarr 4.0.20 died on the read-only subPath mount; see its deployment.yaml.
        - name: seed-config
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - rm -f /config/config.xml && cp /seed/config.xml /config/config.xml && chmod 600 /config/config.xml
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - mountPath: /config
              name: radarr
            - mountPath: /seed
              name: radarr-config
              readOnly: true
      containers:
        - name: radarr
          image: linuxserver/radarr:6.4.4 # {"$imagepolicy": "flux-system:radarr"}
          resources:
            requests:
              # Right-sized: observed usage ~349Mi, request frees scheduling headroom.
              memory: "384Mi"
              cpu: "200m"
            limits:
              # Generous on purpose so we never OOM (limits don't affect scheduling).
              memory: "512Mi"
              cpu: "750m"
          ports:
            - containerPort: 7878 # Radarr web interface
          # Keeps a release that cannot start from replacing the working pod; see Sonarr.
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: PUID
              value: "1000" # Replace with your user ID
            - name: PGID
              value: "1000" # Replace with your group ID
            - name: TZ
              value: "Europe/Amsterdam" # Replace with your timezone
            # neondb_owner DB password from the single source of truth (ExternalSecret
            # radarr-db ← OCI Vault neondb-owner-password, also enforced on the role by
            # CNPG). This env overrides <PostgresPassword> in config.xml, so the password
            # lives in exactly one place and can't drift.
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-db
                  key: password
          volumeMounts:
            - mountPath: /config
              name: radarr
            - mountPath: /movies
              name: movies
            - mountPath: /downloads
              name: downloads
      volumes:
        - name: radarr
          persistentVolumeClaim:
            claimName: radarr
        - name: radarr-config
          configMap:
            name: radarr-config
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
