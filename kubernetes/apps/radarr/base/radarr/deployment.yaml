apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: linuxserver/radarr:5.28.0 # {"$imagepolicy": "flux-system:radarr"}
          resources:
            requests:
              # KRR-sized (2026-07): cpu 15m, memory 573Mi.
              # ff-vm1 fit (infra#501): request = steady state, obs ~268Mi; 768Mi limit
              memory: "336Mi"
              cpu: "15m"
            limits:
              # Generous on purpose so we never OOM (limits don't affect scheduling).
              # CPU limit dropped: it only bought CFS throttling on import scans.
              memory: "768Mi"
          ports:
            - containerPort: 7878 # Radarr web interface
          env:
            - name: PUID
              value: "1000" # Replace with your user ID
            - name: PGID
              value: "1000" # Replace with your group ID
            - name: TZ
              value: "Europe/Amsterdam" # Replace with your timezone
            # neondb_owner DB password from the single source of truth (ExternalSecret
            # radarr-db ← OCI Vault neondb-owner-password, also enforced on the role by
            # CNPG). This env overrides <PostgresPassword> in config.xml, so the password
            # lives in exactly one place and can't drift.
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-db
                  key: password
          volumeMounts:
            - mountPath: /config
              name: radarr
            - mountPath: /config/config.xml
              name: radarr-config
              subPath: config.xml
            - mountPath: /movies
              name: movies
            - mountPath: /downloads
              name: downloads
      volumes:
        - name: radarr
          persistentVolumeClaim:
            claimName: radarr
        - name: radarr-config
          configMap:
            name: radarr-config
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
