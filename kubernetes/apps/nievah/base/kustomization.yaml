apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` directive on purpose — these are flux-system-scoped
# control-plane resources (GitRepository, image automation) plus the
# cluster-scoped Namespace; each carries its own metadata.namespace.
resources:
  - namespace.yaml
  - gitrepository.yaml
  - image-automation.yaml
  - ghcr-reader-rbac.yaml
  # The control plane's database and the grant that lets nievah read its credential. Both carry
  # metadata.namespace database-oci, which is why this kustomization sets no namespace.
  - database.yaml
  - db-reader-rbac.yaml
