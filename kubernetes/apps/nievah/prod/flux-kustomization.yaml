---
# Control plane: GitRepository (source for the external MagmaMoose/nievah repo),
# image automation, and the nievah namespace. These live in THIS repo under
# base/nievah and are applied from the flux-system source. Must reconcile before
# the workload below, which references the GitRepository it creates.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-nievah-source
  namespace: flux-system
  labels:
    app.kubernetes.io/sops: enabled
spec:
  interval: 10m
  path: ./kubernetes/apps/nievah/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  # wait: false on purpose. This bundle includes the ImageRepository, which stays
  # NotReady until the first ghcr.io/magmamoose/nievah image is published. With
  # wait: true a NotReady ImageRepository would hang this Kustomization and — via
  # the dependsOn below — block the workload's Ingress from ever applying, so
  # external-dns would never publish nievah.magmamoose.com. We only need these
  # control-plane resources APPLIED (namespace + GitRepository must exist before
  # the workload); their health must not gate DNS.
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-keys
---
# Workload: the Nievah PR-review webhook service, pulled from the EXTERNAL
# MagmaMoose/nievah repo (./k8s/overlays/prod) via the GitRepository created
# above. The image tag in that overlay is bumped by the ImageUpdateAutomation.
# DNS for nievah.magmamoose.com is published by external-dns from the app's
# Ingress; the firefly tunnel ingress_rule (tunnels.tf) terminates that hostname
# at the in-cluster Service. NOT Access-gated — GitHub posts webhooks directly and
# the app authenticates them via the webhook secret + HMAC signature.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-nievah
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: nievah
  timeout: 5m
  wait: true
  dependsOn:
    - name: prod-nievah-source
    - name: infrastructure-services
  # Pin the externally-sourced workload to the cloud-worker tier (ff-oci*).
  patches:
    - target:
        kind: Deployment
      patch: |
        - op: add
          path: /spec/template/spec/nodeSelector
          value:
            topology.sargeant.co/tier: native-cloud
    - target:
        kind: CronJob
      patch: |
        - op: add
          path: /spec/jobTemplate/spec/template/spec/nodeSelector
          value:
            topology.sargeant.co/tier: native-cloud
  # Priority class, set HERE as a patch rather than by the
  # placement.sargeant.co/priority label the in-repo apps use: these workloads come
  # from their OWN GitRepository, so no kustomization in this repo has a `labels:`
  # block that could reach them.
  #
  # `business` because these are the revenue-bearing apps. Without it they sit at
  # priority 0 while everything they DEPEND on was promoted — litellm and the valkey
  # instances to business, postgres-oci/minio/mariadb to critical — and while ~30
  # supporting media and automation workloads carry medium (1000) or higher. That
  # inverts the rule the scale is built on, that nothing may outrank its own
  # dependencies: left at 0 these are the FIRST pods preempted on a contended node,
  # which is exactly backwards for the apps the cluster exists to run.
  #
  # business (50000) sits below critical (100000) deliberately — these apps run ON
  # the secrets, TLS, admission and data planes, so one that outranked those would
  # win the scheduling race and then fail for want of a secret.
    - target:
        kind: Deployment
      patch: |
        - op: add
          path: /spec/template/spec/priorityClassName
          value: business
    - target:
        kind: CronJob
      patch: |
        - op: add
          path: /spec/jobTemplate/spec/template/spec/priorityClassName
          value: business
  # Cloud-tier apps must use the CLOUD-tier cache. The app repos hardcode
  # REDIS_URL=valkey.database.svc, which is the valkey instance pinned to ff-vm1
  # (on-prem) — so these OCI pods reach back across the site-to-site VPN for every
  # cache op. caldrith crash-looped 813 times on
  # "redis.exceptions.TimeoutError: Timeout connecting to server" doing exactly
  # that, and it makes the one tier that CAN survive a node failure depend on the
  # node most likely to have one. valkey-oci already exists on this tier.
  # Overridden here rather than in the app repos because which backing instance a
  # workload talks to is a placement decision, same as the nodeSelector patch above.
  #
  # `name:` below is the DEPLOYMENT name, not the container name — they differ here
  # (Deployment/nievah-backend runs container `nievah`). A target that matches nothing
  # is a SILENT no-op in kustomize, so when nievah#113 renamed Deployment/nievah ->
  # Deployment/nievah-backend, this patch simply stopped applying: the ingest fell back
  # to the on-prem valkey while the worker stayed on valkey-oci, and every review/triage
  # job was enqueued into a queue nothing was polling. Both must always resolve to the
  # SAME instance; check `kubectl get deploy -n nievah` before editing a name here.
    - target:
        kind: Deployment
        name: nievah-backend
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: nievah-backend
        spec:
          template:
            spec:
              containers:
                - name: nievah
                  env:
                    - name: REDIS_URL
                      value: redis://valkey-oci.database.svc.cluster.local:6379
    - target:
        kind: Deployment
        name: nievah-worker
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: nievah-worker
        spec:
          template:
            spec:
              containers:
                - name: nievah-worker
                  env:
                    - name: REDIS_URL
                      value: redis://valkey-oci.database.svc.cluster.local:6379
  # Same override for the scheduled-tick CronJobs (nievah-planner-tick /
  # nievah-standup-tick), which ENQUEUE the planner and standup jobs the worker then runs.
  # These must land on the same instance as the worker for a sharper reason than the
  # Deployments: a tick enqueued onto the wrong valkey does not error, it reports SUCCESS.
  # The Job exits 0, `kubectl get jobs` is green, and the planner simply never runs — the
  # #20 failure mode, but self-congratulating.
  #
  # Deliberately targeted by KIND ALONE, with no `name:`, unlike the two Deployment patches
  # above — which is the lesson of #20 applied rather than repeated. An unnamed target cannot
  # be orphaned by an app-repo rename, and it covers any tick CronJob added later for free.
  # Verified by rendering the app overlay and re-applying these patches to it: both CronJobs
  # come out on valkey-oci. The container name (`tick`) is the one cross-repo coupling left,
  # and the pod now checks itself for that — it looks for arq's worker health key on the
  # valkey it just wrote to and raises a Slack error naming this exact split if it is absent.
    - target:
        kind: CronJob
      patch: |
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: not-used-the-target-selector-above-decides
        spec:
          jobTemplate:
            spec:
              template:
                spec:
                  containers:
                    - name: tick
                      env:
                        - name: REDIS_URL
                          value: redis://valkey-oci.database.svc.cluster.local:6379
