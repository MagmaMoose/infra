apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: general-system
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  type: ClusterIP
  ports:
    # The S3 API: what Thanos, Loki and the backup Job use.
    - port: 8333
      targetPort: 8333
      protocol: TCP
      name: s3
    # Prometheus metrics (-metricsPort).
    - port: 9327
      targetPort: 9327
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: seaweedfs
