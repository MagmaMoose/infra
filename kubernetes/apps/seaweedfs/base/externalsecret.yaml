# KICS 3e2d3b2f "hardcoded secret key" is a false positive: the secretKey values are
# template references resolved by External Secrets from OCI Vault, not literals.
#
# The S3 identities SeaweedFS accepts (-s3.config). THE SAME KEYS AS MINIO, on purpose: each
# user keeps its access key and its vault entry, so a client moves to SeaweedFS by changing
# its endpoint and nothing else, and there is no new secret to create or rotate. The entries
# keep their minio- names for that reason; rename them once MinIO is gone.
#
# Each identity is limited to its own buckets, as MinIO's policies were. `backup` only reads
# (the nightly offsite copy), and `admin` is for the copy from MinIO and for operators.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: general-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        s3.json: |
          {
            "identities": [
              {
                "name": "admin",
                "credentials": [{"accessKey": "admin", "secretKey": {{ .rootPassword | toJson }}}],
                "actions": ["Admin", "Read", "List", "Tagging", "Write"]
              },
              {
                "name": "thanos",
                "credentials": [{"accessKey": "thanos", "secretKey": {{ .thanosPassword | toJson }}}],
                "actions": ["Read:thanos-metrics", "Write:thanos-metrics", "List:thanos-metrics", "Tagging:thanos-metrics"]
              },
              {
                "name": "loki",
                "credentials": [{"accessKey": "loki", "secretKey": {{ .lokiPassword | toJson }}}],
                "actions": ["Read:loki-chunks", "Write:loki-chunks", "List:loki-chunks", "Tagging:loki-chunks",
                            "Read:loki-ruler", "Write:loki-ruler", "List:loki-ruler", "Tagging:loki-ruler"]
              },
              {
                "name": "backup",
                "credentials": [{"accessKey": "backup", "secretKey": {{ .backupPassword | toJson }}}],
                "actions": ["Read:thanos-metrics", "List:thanos-metrics", "Read:loki-chunks", "List:loki-chunks",
                            "Read:loki-ruler", "List:loki-ruler"]
              }
            ]
          }
  data:
    - secretKey: rootPassword
      remoteRef:
        key: minio-root-password
    - secretKey: thanosPassword
      remoteRef:
        key: minio-thanos-password
    - secretKey: lokiPassword
      remoteRef:
        key: minio-loki-password
    - secretKey: backupPassword
      remoteRef:
        key: minio-backup-password
