apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: automation
spec:
  replicas: 1
  # Single stateful instance on an RWO Longhorn volume — never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      annotations:
        # Rolls the pod (→ re-seed) whenever the git-managed config.yaml changes.
        # sha256 of kubernetes/apps/hermes/base/configmap.yaml (there is no nested
        # hermes/ dir; the old path in this comment pointed at nothing).
        checksum/config: aa1299944925820c7c45ef9e7fd1666455b2537dde76495ddae2155caad4be4b
        # Same idea for the nievah-relay plugin, which the initContainer copies in at
        # boot: sha256 of kubernetes/apps/hermes/base/plugin-nievah-relay.yaml.
        checksum/plugin-nievah-relay: 81a8994c7838f879dfa60c8f4348faf86a1ee1ce89dbce4f0071ed3ac38b4d4d
      labels:
        app: hermes
    spec:
      initContainers:
        # OVERWRITE config.yaml from the ConfigMap on every boot — this file is
        # git-managed (Hermes keeps non-secret behaviour in config.yaml; sessions/
        # memories/skills/logs live in sibling dirs under /opt/data). Same image as
        # the app so it runs as the same user and the seeded file is owned correctly.
        # The nievah-relay plugin is replaced whole on every boot the same way, so the
        # live copy can never drift from plugin-nievah-relay.yaml.
        - name: seed-config
          image: ghcr.io/magmamoose/hermes:2026.6.19-1@sha256:3c734701c8e6afb9a2d7570c718fb16776ab7937b3749cf822131d5c680c39a6
          command:
            - sh
            - -c
            - |
              set -e
              cp -f /seed/config.yaml "$HERMES_HOME/config.yaml"
              mkdir -p "$HERMES_HOME/plugins/nievah-relay"
              cp -f /seed-plugins/nievah-relay/plugin.yaml /seed-plugins/nievah-relay/__init__.py "$HERMES_HOME/plugins/nievah-relay/"
              mkdir -p "$HERMES_HOME/mcp"
              cp -f /seed-files/mem0_mcp.py "$HERMES_HOME/mcp/mem0_mcp.py"
              # Last, and allowed to fail: a broken cron seed must not keep Hermes down.
              cd /opt/hermes && /opt/hermes/.venv/bin/python /seed-files/seed_cron.py || echo "[seed-cron] failed; Hermes starts without the git-managed cron jobs"
              # This container runs as root, and Hermes writes jobs.json 0600 to its
              # owner, while the gateway reads it as the hermes user (UID 10000). Left
              # root-owned, every scheduler tick failed with "Permission denied" and no
              # job ever ran. Hand the cron store back, seeded or not.
              chown -R 10000:10000 "$HERMES_HOME/cron" 2>/dev/null || true
          env:
            - name: HERMES_HOME
              value: /opt/data
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
            - name: seed-plugin-nievah-relay
              mountPath: /seed-plugins/nievah-relay
              readOnly: true
            # files/ (the mem0 MCP server, the cron seed and its prompts), generated by the
            # kustomization with a content hash, so any change rolls the pod by itself.
            - name: seed-files
              mountPath: /seed-files
              readOnly: true
            - name: state
              mountPath: /opt/data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # 256Mi, up from 64Mi: the cron seed imports Hermes's cron module, which peaks
            # at about 62Mi on its own.
            limits:
              memory: 256Mi
      containers:
        - name: hermes
          # Upstream hermes-agent v2026.6.19 plus the `ddgs` package for DuckDuckGo web
          # search, built from dockerfiles/hermes. The initContainer runs the same image.
          # Pinned by tag and digest; a new build is a new `hermes-v<upstream>-<n>` tag.
          image: ghcr.io/magmamoose/hermes:2026.6.19-1@sha256:3c734701c8e6afb9a2d7570c718fb16776ab7937b3749cf822131d5c680c39a6
          # `gateway run` is the container's main process: it connects the enabled
          # channels (Telegram/Slack) and serves the OpenAI-compatible API + health
          # endpoint on :8642. The dashboard (Control UI) runs on :9119 because
          # HERMES_DASHBOARD=1.
          # MUST be `args:` (not `command:`) — the image ENTRYPOINT is the `hermes`
          # binary and `gateway run` are its sub-args (mirrors `docker run … hermes-agent
          # gateway run`). Using `command:` overrides the entrypoint and fails with
          # exec: "gateway": executable file not found in $PATH.
          args:
            - gateway
            - run
          ports:
            - name: api
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
            # Nievah's signed events (config.yaml platforms.webhook), ClusterIP only.
            - name: webhook
              containerPort: 8644
          env:
            # All persistent state (config.yaml, .env, sessions, memories, skills,
            # logs) lives under HERMES_HOME on the Longhorn PVC.
            - name: HERMES_HOME
              value: /opt/data
            - name: TZ
              value: Europe/Amsterdam
            # --- Model: in-cluster LiteLLM gateway (OpenAI-compatible). Mirrors the
            # config.yaml model block; OPENAI_API_KEY is Hermes's own LiteLLM key, capped
            # at $25 per 30 days (externalsecret.yaml). ---
            - name: HERMES_INFERENCE_MODEL
              value: agent-chat
            - name: OPENAI_BASE_URL
              value: http://litellm.automation.svc.cluster.local:8080/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: litellm-api-key
            # --- Web dashboard (LAN Control UI). Basic auth on a trusted LAN; the
            # password + HMAC session secret reuse the gateway-token vault entry. ---
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: caleb
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: gateway-token
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: gateway-token
            # --- OpenAI-compatible API server + health endpoint (:8642). ---
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: gateway-token
            # --- Telegram (@NievahBot), allowlisted to the owner's TG id. ---
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: telegram-bot-token
            - name: TELEGRAM_ALLOWED_USERS
              value: "8489671466"
            # --- Slack Socket Mode (bot xoxb + app-level xapp tokens). Who may talk to
            # Hermes: with no SLACK_ALLOWED_USERS set, Hermes denies everyone it has not
            # paired, answering a DM with a pairing code that `hermes pairing approve`
            # accepts. The approvals live in /opt/data/pairing on the PVC. Setting
            # SLACK_ALLOWED_USERS would pin access in git and ignore strangers instead. ---
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: slack-bot-token
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: slack-app-token
            # Slack home channel: where Hermes posts cron results, cross-platform
            # messages and its online/shutdown notices — the primary DM channel where
            # Hermes is used day-to-day. Set here rather than with `/hermes sethome`,
            # which writes it to /opt/data/.env on the PVC, outside git.
            - name: SLACK_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: slack-home-channel
            # --- Home Assistant MCP bearer (substituted into ${HA_MCP_TOKEN}). ---
            - name: HA_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: ha-mcp-token
            # --- In-cluster n8n MCP bearer (substituted into ${N8N_MCP_AUTH_TOKEN}). ---
            - name: N8N_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: n8n-mcp-auth-token
            # --- Nievah MCP bearer (substituted into ${NIEVAH_MCP_TOKEN}). ---
            - name: NIEVAH_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: nievah-mcp-token
            # --- nievah-relay plugin: signs the button clicks it hands to Nievah. ---
            - name: NIEVAH_SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: nievah-slack-signing-secret
            # --- Nievah events: the HMAC key of the `nievah` webhook route. ---
            - name: NIEVAH_EVENTS_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: nievah-events-secret
            # --- Browser: drive the in-cluster Browserless (chromium v2) over CDP instead
            # of launching Chromium inside this pod, on the CPU-tight ff-vm1. Hermes passes
            # a ws URL carrying ?token= through unchanged; $(BROWSERLESS_TOKEN) is expanded
            # by Kubernetes from the entry above it. ---
            - name: BROWSERLESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: browserless-token
            # --- mem0 shared memory: the key the mem0 MCP server sends as X-API-Key. ---
            - name: MEM0_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: mem0-api-key
            - name: BROWSER_CDP_URL
              value: ws://browserless.automation.svc.cluster.local:3000?token=$(BROWSERLESS_TOKEN)  # DevSkim: ignore DS137138 - in-cluster ClusterIP, no external exposure
          resources:
            # Python agent — heavier than the old Node assistant. No CPU limit
            # (CFS-throttle false alarms). CPU REQUEST dropped 200m -> 50m: ff-vm1
            # (the only amd64 on-prem worker this amd64-only image can run on) is
            # CPU-REQUEST-saturated (~63% real use but requests fully reserved), and
            # a Recreate roll couldn't reschedule at 200m. 50m fits and, with no CPU
            # limit, the agent still bursts freely.
            #
            # MEMORY request 512Mi -> 384Mi. This is the "revisit from KRR / relieve
            # ff-vm1 request pressure" the CPU note above asked for, done with a
            # real measurement instead of a spot reading:
            # max_over_time(working_set[7d]) = 292Mi, current 284Mi. The workload is
            # flat — it is an LLM gateway, so its bytes are on the wire, not in the
            # heap — so 384Mi is 1.3x a peak that does not move, not 1.3x an average
            # that might.
            #
            # Why bother with 128Mi: ff-vm1 is 91% memory-REQUESTED while only 73%
            # memory-USED, and the on-prem tier flip needs ~1.4GiB of request it
            # does not have. This is over-reservation, not usage — exactly the kind
            # that should be given back rather than solved by moving work to the
            # cloud tier.
            #
            # LIMIT stays 2Gi (6.8x peak). Not tightened to match: COMMON_MISTAKES
            # #13/#14 — a limit near measured use is a deferred OOM, and equal
            # request/limit is Guaranteed QoS, i.e. a hard cap. hermes is exactly
            # the workload that would trip that, since a long tool-calling
            # conversation can briefly hold a large context in memory.
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 45
            periodSeconds: 30
          volumeMounts:
            # State + config + sessions + memories + skills + logs (writable).
            - name: state
              mountPath: /opt/data
      volumes:
        - name: seed
          configMap:
            name: hermes-config
        - name: seed-plugin-nievah-relay
          configMap:
            name: hermes-plugin-nievah-relay
        - name: seed-files
          configMap:
            name: hermes-seed-files
        - name: state
          persistentVolumeClaim:
            claimName: hermes
