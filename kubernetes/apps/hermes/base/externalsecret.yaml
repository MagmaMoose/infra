apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hermes
  namespace: automation
spec:
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: hermes
    creationPolicy: Owner
    template:
      type: Opaque
  # NOTE: remoteRef keys keep their original `openclaw-*` names — the OCI Vault
  # entries hold the same still-valid bots/tokens (Telegram, Slack, HA) and reused
  # secrets (LiteLLM master key). Renaming the vault entries themselves is a
  # separate manual step and is intentionally out of scope for this app swap.
  data:
    # Reused as the API server bearer (API_SERVER_KEY) AND the dashboard basic-auth
    # password + HMAC session secret. Single-user LAN, so one value is fine.
    - secretKey: gateway-token
      remoteRef:
        key: openclaw-gateway-token
    # Hermes's own LiteLLM virtual key, its OpenAI-compatible credential (OPENAI_API_KEY).
    # The litellm-keyseed Job upserts the same vault entry as the `hermes` key, capped at
    # $25 per 30 days and allowed only the agent-chat, agent-light and speech roles. It
    # used to be the master key, which no budget applies to.
    - secretKey: litellm-api-key
      remoteRef:
        key: hermes-litellm-api-key
    # Telegram bot token (@NievahBot) — consumed as env TELEGRAM_BOT_TOKEN.
    - secretKey: telegram-bot-token
      remoteRef:
        key: openclaw-telegram-bot-token
    # Home Assistant MCP long-lived access token — consumed as env HA_MCP_TOKEN.
    - secretKey: ha-mcp-token
      remoteRef:
        key: openclaw-homeassistant-mcp-token
    # In-cluster n8n MCP app-layer bearer (shared with the n8n-mcp app) — consumed
    # as env N8N_MCP_AUTH_TOKEN.
    - secretKey: n8n-mcp-auth-token
      remoteRef:
        key: n8n-mcp-auth-token
    # Nievah's MCP bearer — consumed as env NIEVAH_MCP_TOKEN. This is the SAME
    # vault entry the nievah namespace reads for MCP_AUTH_TOKEN, deliberately: the
    # endpoint compares one shared bearer, so a second entry here would be a second
    # value to rotate and a silent 401 the day only one of them was.
    - secretKey: nievah-mcp-token
      remoteRef:
        key: nievah-mcp-token
    # Slack Socket Mode — bot token (xoxb) + app-level token (xapp).
    - secretKey: slack-bot-token
      remoteRef:
        key: openclaw-slack-bot-token
    - secretKey: slack-app-token
      remoteRef:
        key: slack-nievah-app-token
    # The key the nievah-relay plugin signs forwarded button clicks with, consumed as
    # env NIEVAH_SLACK_SIGNING_SECRET. The SAME vault entry the nievah namespace verifies
    # /slack/interactions against (SLACK_SIGNING_SECRET), for the reason given for
    # nievah-mcp-token above. While Socket Mode is on, Slack never calls the Request URL,
    # so this plugin and Nievah are the only two parties that use it.
    - secretKey: nievah-slack-signing-secret
      remoteRef:
        key: zoey-slack-signing-secret
    # Hermes Slack home channel ID — consumed as env SLACK_HOME_CHANNEL. Stored in
    # the Secret so the channel ID does not appear in world-visible git history.
    - secretKey: slack-home-channel
      remoteRef:
        key: hermes-slack-home-channel
    # Browserless's token, consumed as env BROWSERLESS_TOKEN inside BROWSER_CDP_URL. The
    # SAME vault entry the browserless app itself reads, so the two cannot drift apart.
    - secretKey: browserless-token
      remoteRef:
        key: browserless-token
    # mem0's admin API key, for the mem0 MCP server (env MEM0_API_KEY). The SAME vault
    # entry the mem0 app reads, so the two cannot drift apart.
    - secretKey: mem0-api-key
      remoteRef:
        key: mem0-admin-api-key
