apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: automation
spec:
  selector:
    app: hermes
  ports:
    # Web dashboard (Control UI) — fronted by the ingress.
    - name: dashboard
      protocol: TCP
      port: 9119
      targetPort: 9119
    # OpenAI-compatible API server + health endpoint.
    - name: api
      protocol: TCP
      port: 8642
      targetPort: 8642
    # Nievah's signed events (the `nievah` webhook route). In-cluster only: the
    # ingress fronts the dashboard and nothing else.
    - name: webhook
      protocol: TCP
      port: 8644
      targetPort: 8644
  type: ClusterIP
