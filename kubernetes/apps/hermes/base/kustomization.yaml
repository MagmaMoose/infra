apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - plugin-nievah-relay.yaml
  - externalsecret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - ingress.yaml
# files/ ships as one ConfigMap with a content-hash suffix, so a change to the mem0 MCP
# server, the cron seed or a cron prompt rolls the pod without a checksum annotation.
configMapGenerator:
  - name: hermes-seed-files
    namespace: automation
    files:
      - files/mem0_mcp.py
      - files/seed_cron.py
      - files/daily-brief.md
# Pin to the ON-PREM worker (ff-vm1, amd64), not native-cloud: the upstream
# nousresearch/hermes-agent image is amd64-only, so on the arm64 OCI nodes it
# CrashLoops with an OCI-runtime exec error. State is on Longhorn, so it's not
# pinned to ff-pi1 either.
labels:
  # Placement tier — consumed by the Kyverno `place-on-prem` ClusterPolicy, which
  # adds the nodeSelector at admission. Replaces components/node-selectors/worker-on-prem.
  # includeSelectors/includeTemplates false: these fields are immutable on a live
  # Deployment/StatefulSet, so touching them would make Flux's next apply fail.
  - pairs:
      placement.sargeant.co/tier: on-prem
      placement.sargeant.co/priority: medium
    includeSelectors: false
    includeTemplates: false
