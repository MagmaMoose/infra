apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: automation
data:
  # GIT-MANAGED config for the Hermes Agent gateway (source of truth). An
  # initContainer OVERWRITES $HERMES_HOME/config.yaml from this ConfigMap on every
  # pod start, and the Deployment's checksum/config annotation rolls the pod
  # whenever this file changes — so edits here apply on the next Flux reconcile.
  # Hermes keeps non-secret behaviour here (config.yaml) and secrets in env /
  # ~/.hermes/.env; we inject all secrets as Deployment env, so no .env is seeded.
  # Sessions/memories/skills/logs persist in sibling dirs under /opt/data, so
  # re-seeding config.yaml is safe. Do NOT hand-edit the live file — change it here.
  #
  #   - model: route ALL chat through the in-cluster LiteLLM gateway. provider=
  #     custom + base_url points at the nginx auth-proxy (:8080 maps OpenAI-style
  #     `Authorization: Bearer` -> x-litellm-api-key). The credential is the
  #     LiteLLM master key, supplied via the OPENAI_API_KEY env. `default` must
  #     match a LiteLLM model_name (per-token API billing inside LiteLLM); switch
  #     models at runtime with `hermes model`.
  #   - mcp_servers.home-assistant: HA's MCP server (read + control Assist-exposed
  #     entities); bearer substituted from the HA_MCP_TOKEN env at load.
  #   - memory: markdown-file memory (MEMORY.md / USER.md under /opt/data) — no
  #     external embedding service required. cron: scheduled routines
  #     (`hermes cron ...`), times use the container TZ.
  #   - dashboard: the LAN Control UI at hermes.sargeant.co (enabled via
  #     HERMES_DASHBOARD=1, basic-auth creds via env). api: OpenAI-compatible API
  #     server + health endpoint on :8642 (bearer via API_SERVER_KEY env).
  #   - Channels (Telegram @NievahBot, Slack Socket Mode) are configured entirely
  #     via env (TELEGRAM_*/SLACK_* — see the Deployment).
  #   - NOT carried over from OpenClaw (no clean Hermes-native equivalent wired
  #     yet): browser automation (Browserless CDP), keyless web search (DuckDuckGo),
  #     and voice TTS/STT. Hermes ships its own equivalents — Firecrawl/SearXNG for
  #     web, Mistral for audio — but they need API keys/a SearXNG URL, so they are
  #     intentionally left out of this swap and can be added later. The HA MCP
  #     server, Telegram/Slack channels, memory, and cron all carry over.
  config.yaml: |
    model:
      provider: custom
      # A ROLE, NOT A PROVIDER MODEL. `agent-chat` is defined in the LiteLLM config's
      # tiers-and-roles section (kubernetes/apps/litellm/base/configmap.yaml), which is the
      # one place the provider is chosen; moving provider never touches this file. It was
      # claude-sonnet-4-6 until that Anthropic API key ran out of credit, then
      # gpt-5.6-terra by name. The Claude -max aliases are not an option: they pass a
      # Claude subscription OAuth token through, and Anthropic only permits those in
      # Claude Code and claude.ai, not in another agent. Keep HERMES_INFERENCE_MODEL in the
      # Deployment equal to this.
      default: agent-chat
      base_url: http://litellm.automation.svc.cluster.local:8080/v1
      api_mode: chat_completions
      # MUST be stated here. The OPENAI_API_KEY env is NOT a fallback for a
      # custom provider: upstream gates that fallback on the base_url being an
      # authoritative OpenAI host, deliberately, so a key meant for OpenAI is
      # never posted to an arbitrary one. Ours points at the in-cluster LiteLLM,
      # so the gate correctly refuses and the resolver falls through to its
      # placeholder literal `no-key-required` — which LiteLLM rejects with
      # "Virtual Key expected ... expected to start with 'sk-'".
      #
      # That failure surfaced only once Slack could actually deliver a message:
      # the model call is the first thing past the gateway, and nothing before
      # it had ever reached one. `${VAR}` is expanded recursively across the
      # whole config at load, so this resolves the same way the MCP headers do.
      api_key: ${OPENAI_API_KEY}

    memory:
      memory_enabled: true
      user_profile_enabled: true

    cron:
      enabled: true

    # Cron schedules (the daily brief is seeded by files/seed_cron.py) run in this zone.
    timezone: Europe/Amsterdam

    # Voice on Slack: an audio message is transcribed, and replies are spoken once
    # `/voice on` is set in a chat. Both go through LiteLLM's speech roles, so the provider
    # is chosen there like the chat model's. The image lacks the local defaults
    # (faster-whisper, edge-tts), so the provider must be `openai`. STT only honours
    # base_url when api_key is also set here; TTS takes its key from OPENAI_API_KEY.
    stt:
      enabled: true
      provider: openai
      openai:
        model: speech-to-text
        base_url: http://litellm.automation.svc.cluster.local:8080/v1  # DevSkim: ignore DS137138 - in-cluster ClusterIP, no external exposure
        api_key: ${OPENAI_API_KEY}
    tts:
      provider: openai
      openai:
        model: text-to-speech
        voice: alloy
        base_url: http://litellm.automation.svc.cluster.local:8080/v1  # DevSkim: ignore DS137138 - in-cluster ClusterIP, no external exposure

    # Web search through DuckDuckGo: no key and no account. The `ddgs` package it needs is
    # not in upstream's image, which is why this Deployment runs ghcr.io/magmamoose/hermes
    # (dockerfiles/hermes). ddgs searches but cannot read pages; the browser does that.
    web:
      search_backend: ddgs

    mcp_servers:
      home-assistant:
        url: http://homeassistant.automation.svc.cluster.local:8123/api/mcp
        transport: streamable-http
        headers:
          Authorization: "Bearer ${HA_MCP_TOKEN}"
      # In-cluster n8n MCP (czlonkowski/n8n-mcp, MCP_MODE=http) — full workflow
      # CRUD over n8n via its Public API. Reached east-west on the ClusterIP (the
      # public edge route n8n.magmamoose.com/mcp is gated by Cloudflare Access and
      # not used from in-cluster). Bearer = the app-layer AUTH_TOKEN (OCI Vault
      # n8n-mcp-auth-token), substituted from the N8N_MCP_AUTH_TOKEN env at load.
      n8n:
        url: http://n8n-mcp.automation.svc.cluster.local:3000/mcp
        transport: streamable-http
        headers:
          Authorization: "Bearer ${N8N_MCP_AUTH_TOKEN}"
      # Do NOT add HolmesGPT as a direct mcp_servers entry. holmesgpt's
      # NetworkPolicy blocks inbound connections from the automation namespace, so a
      # direct entry produces a confusing refused connection rather than a useful
      # error. HolmesGPT investigations reach Hermes through the nievah MCP below.
      #
      # Nievah's own MCP: the documentation index across every indexed repo, the
      # read verbs (repo policy, work status, pending questions), the write verbs
      # (review a pull request, plan an issue, approve a plan, answer a
      # clarification), and a cluster investigation that reaches HolmesGPT. This is
      # what makes "Nievah, open a PR for X" in Slack reach the agent rather than
      # just the model.
      #
      # Reached east-west on the ClusterIP. The public hostname for that service is
      # the GitHub webhook receiver and is deliberately NOT used from in-cluster.
      #
      # Asking here grants nothing extra: every write verb goes onto the same queue
      # a webhook would and is re-gated by the worker against the deny-by-default
      # allowlist, so a request made in Slack cannot reach a repository that
      # assigning an issue could not.
      #
      # The bearer is the SAME vault entry the nievah namespace reads, on purpose —
      # the endpoint compares one shared token, so a second copy would be a second
      # thing to rotate and a silent 401 the day only one of them was.
      nievah:
        url: http://nievah.nievah.svc.cluster.local:8000/mcp  # DevSkim: ignore DS137138 - in-cluster ClusterIP, no external exposure
        transport: streamable-http
        headers:
          Authorization: "Bearer ${NIEVAH_MCP_TOKEN}"
      # Public, read-only and unauthenticated, so there is no secret to wire: the
      # Magma Moose product docs (the MagmaMoose/mcp Worker; an anonymous token would
      # only raise its rate limit) and Context7's current library and framework docs.
      magmamoose-docs:
        url: https://mcp.magmamoose.com/mcp
        transport: streamable-http
      context7:
        url: https://mcp.context7.com/mcp
        transport: streamable-http
      # The owner's public profile and docs, the same server calebsargeant.com's chat
      # reads. Open, and served at the root of that host, not at /mcp.
      #
      # The Accept header is load-bearing. Before connecting, Hermes probes the URL
      # with a plain HEAD and refuses anything that answers 200 with a non-MCP content
      # type. This Worker answers a plain HEAD or GET with its markdown landing page
      # (200 text/markdown), so without the header the server was skipped as "a web
      # page". With it, the probe gets 405 and steps aside for the real handshake.
      calebsargeant:
        url: https://mcp.calebsargeant.com/
        transport: streamable-http
        headers:
          Accept: "application/json, text/event-stream"
      # ClickUp's hosted MCP. OAuth only (it refuses API tokens), with dynamic client
      # registration, so there is no secret to wire: sign in once with
      #   kubectl -n automation exec -it deploy/hermes -- hermes mcp login clickup
      # and paste the redirect URL back. The token lands in $HERMES_HOME/mcp-tokens on the
      # PVC. Until then this server fails to connect and Hermes carries on without it;
      # servers connect independently.
      clickup:
        url: https://mcp.clickup.com/mcp
        transport: streamable-http
        auth: oauth
      # Shared memory with the other agents (Claude Code, and later Holmes and OpenHands),
      # over the in-cluster mem0 API. files/mem0_mcp.py, copied to $HERMES_HOME/mcp by the
      # initContainer. A stdio server only sees the env it is given here, so the key is
      # passed through explicitly. mem0's NetworkPolicy admits pods labelled app=hermes.
      mem0:
        command: /opt/hermes/.venv/bin/python
        args: ["/opt/data/mcp/mem0_mcp.py"]
        env:
          MEM0_BASE_URL: http://mem0.automation.svc.cluster.local:8000  # DevSkim: ignore DS137138 - in-cluster ClusterIP, no external exposure
          MEM0_API_KEY: ${MEM0_API_KEY}
          MEM0_USER_ID: owner
          MEM0_AGENT_ID: hermes

    # Hermes plugins are opt-in: nothing under $HERMES_HOME/plugins loads unless it is
    # named here. nievah-relay hands Nievah's Slack button clicks to Nievah, because this
    # gateway holds Socket Mode on the app both post with (plugin-nievah-relay.yaml).
    plugins:
      enabled:
        - nievah-relay

    # Nievah's events to the owner. Nievah POSTs a signed JSON event to
    # /webhooks/nievah on :8644 (ClusterIP only, never behind the ingress) when
    # something needs the owner or closes a loop they started: a critical alert it
    # filed a fix for, a plan waiting for approval, a PR opened, merged or failed.
    # deliver_only means no model runs: Nievah writes the whole message, and `{text}`
    # is posted verbatim to the Slack home channel (the owner's DM), so it arrives at
    # once and costs nothing. Every message names its exact reference (owner/repo#n),
    # because a delivered message is not part of the DM's conversation: a reply like
    # "approve owner/repo#n" works from the reference alone. HMAC-SHA256 of the raw body
    # in X-Webhook-Signature, keyed with the vault entry Nievah signs with; X-Request-ID
    # makes a retried event a no-op.
    #
    # NO `secret:` HERE, ON PURPOSE. The route takes its key from the WEBHOOK_SECRET env
    # (the Deployment), which the gateway applies as the webhook platform's global secret.
    # `${VAR}` does NOT work in this block: the gateway reads `platforms` with a plain
    # yaml.safe_load, and only the agent's own config loader (model, mcp_servers) expands
    # env vars. Written as `secret: ${NIEVAH_EVENTS_SECRET}`, the key was that literal
    # string, public in this repo: Nievah's real signature got a 401, and anything in the
    # cluster could have signed a message into the owner's DM. A `secret:` on the route
    # would also override the env one, so none belongs here.
    platforms:
      webhook:
        enabled: true
        extra:
          port: 8644
          routes:
            nievah:
              deliver: slack
              deliver_only: true
              prompt: "{text}"

    dashboard:
      host: 0.0.0.0
      port: 9119

    api:
      enabled: true
      host: 0.0.0.0
      port: 8642
