---
# Control plane: the OCI chart source and the namespace. Must reconcile before
# the workload, which references the HelmRepository it creates.
#
# wait: false on purpose, the same reason finance's and janeway's source bundles
# set it: the HelmRepository stays NotReady until the first chart is published
# to ghcr.io/calebsargeant/charts/afas-declaraties. With wait: true a NotReady
# source would hang this Kustomization and, through the dependsOn below, block
# the namespace and the CNPG Database from ever being applied — so nothing an
# operator could pre-provision would land either.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-afas-declaraties-source
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/afas-declaraties/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: false
---
# Workload: the HelmRelease plus everything firefly has to hand it — the CNPG
# Database on the shared postgres-oci cluster and the OCI-Vault ExternalSecret
# that projects every credential and every employer-identifying value. Deploy
# config is firefly-specific, so it lives in this infra repo; only the chart
# comes from the app repo's OCI artifact.
#
# NOT REACHABLE YET. CalebSargeant/afas-declaraties has cut no release tag, so
# neither ghcr.io/calebsargeant/charts/afas-declaraties nor the matching image
# exists. The HelmRelease will report `no chart version found` until the first
# release is published; this Kustomization is expected to be NotReady until
# then, and nothing else depends on it.
#
# timeout 15m, which must stay LONGER than the HelmRelease's own install/upgrade
# timeout (10m) or Flux gives up on a release that is still legitimately working.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-afas-declaraties
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/afas-declaraties/prod/workload
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  wait: true
  dependsOn:
    - name: prod-afas-declaraties-source
    # infrastructure-services brings up the postgres-oci cluster the Database CR
    # attaches to, and reconciles the managed-role + password ExternalSecret in
    # database-oci that this app's DATABASE_URL depends on.
    - name: infrastructure-services
