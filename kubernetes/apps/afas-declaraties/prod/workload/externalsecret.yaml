# KICS 3e2d3b2f "hardcoded secret key" is a false positive: the `secretKey`
# values are ExternalSecret field NAMES that map to OCI Vault entries — no
# secret value is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# Every value the app needs that must not appear in a public Git repository,
# projected from OCI Vault into one Secret the chart consumes by name
# (values.existingSecret -> envFrom.secretRef on the slackd Deployment and all
# three CronJobs).
#
# TWO CLASSES OF VALUE LIVE HERE, and the second is the reason this file is
# longer than a credentials list:
#
#   credentials    DATABASE_URL, OP_SERVICE_ACCOUNT_TOKEN, SLACK_BOT_TOKEN,
#                  SLACK_APP_TOKEN
#   identifying    INSITE_HOST, OP_VAULT, OP_ITEM_NAME, SLACK_CHANNEL_ID,
#                  SLACK_APPROVER_IDS
#
# THIS REPO IS PUBLIC (COMMON_MISTAKES #7 and #29). The AFAS InSite hostname
# names the employer, the 1Password vault and item names name the tenant, and a
# Slack channel/member id maps the workspace. None of them is a secret in the
# cryptographic sense and all of them are disclosures, so they are vault entries
# rather than HelmRelease values. Nothing in this file is employer-identifying:
# only the vault KEY names appear, which is exactly what the rest of the repo
# already publishes.
#
# ESO resolves `data` ALL-OR-NOTHING: one key that is absent or not ACTIVE
# leaves the whole Secret unwritten, and then slackd CrashLoops and every
# CronJob fails to start behind a single opaque SecretSyncedError. Create every
# entry below before merging — .github/workflows/external-secrets.yml fails the
# PR otherwise, which is the guard working, not a flake.
#
# OCI Vault prerequisites:
#   afas-declaraties-db-password                  NEW — also enforced onto the
#                                                 Postgres role by postgres-oci's
#                                                 managed-roles block, read
#                                                 independently at both ends
#   afas-declaraties-insite-host                  NEW — AFAS InSite hostname only
#                                                 (no scheme, no path)
#   afas-declaraties-op-service-account-token     NEW — 1Password `ops_...`
#   afas-declaraties-op-vault                     NEW — 1Password vault name
#   afas-declaraties-commute-page-path            NEW — InSite page slug for the
#                                                 commute declaration (leading /)
#   afas-declaraties-home-page-path               NEW — InSite page slug for the
#                                                 working-from-home declaration
#   afas-declaraties-slack-channel-id             NEW — `C...`
#   afas-declaraties-slack-approver-ids           NEW — comma-separated `U...`,
#                                                 CASE-SENSITIVE, no spaces
#   slack-bot-token                               EXISTS — shared estate bot
#                                                 token (alertmanager, krr,
#                                                 defectdojo, oci-cost-report,
#                                                 Flux notifications)
#   m0-05e-slack-socket-token                     EXISTS — `xapp-...` app-level
#                                                 token, scope connections:write
#
# READ THIS BEFORE THE FIRST LIVE APPROVAL: Slack delivers an interaction
# payload to the app that POSTED the blocks, and a Socket Mode connection only
# receives interactions for its OWN app. So SLACK_BOT_TOKEN and SLACK_APP_TOKEN
# must belong to the SAME Slack app or the Approve/Reject buttons will render
# and then do nothing at all — no error, no log line, the click simply lands
# nowhere. Verify once with `auth.test` (bot token) and `apps.connections.open`
# (app token) and compare `app_id`. See the app repo's docs/runbook.md.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: afas-declaraties-env
  namespace: afas-declaraties
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: afas-declaraties-env
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        # Composed here rather than stored whole, so the password has exactly
        # one source of truth: the same OCI Vault entry postgres-oci's
        # managed-roles block enforces onto the `afas_declaraties` role. Rotate
        # the vault entry and both ends follow on the next refresh; neither
        # copies the other, so they cannot drift.
        #
        # The password must be URL-safe. It goes into a DSN unencoded, so a
        # value containing @ : / ? # or % silently produces a malformed or
        # WRONG connection string rather than an auth error. Generate it from an
        # alphanumeric alphabet: `openssl rand -hex 32`.
        DATABASE_URL: "postgresql://afas_declaraties:{{ .dbPassword }}@postgres-oci-rw.database-oci.svc.cluster.local:5432/afas_declaraties"
        INSITE_HOST: "{{ .insiteHost }}"
        COMMUTE_PAGE_PATH: "{{ .commutePagePath }}"
        HOME_PAGE_PATH: "{{ .homePagePath }}"
        OP_SERVICE_ACCOUNT_TOKEN: "{{ .opServiceAccountToken }}"
        OP_VAULT: "{{ .opVault }}"
        SLACK_BOT_TOKEN: "{{ .slackBotToken }}"
        SLACK_APP_TOKEN: "{{ .slackAppToken }}"
        SLACK_CHANNEL_ID: "{{ .slackChannelId }}"
        SLACK_APPROVER_IDS: "{{ .slackApproverIds }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: afas-declaraties-db-password
    - secretKey: insiteHost
      remoteRef:
        key: afas-declaraties-insite-host
    # Page slugs are employer-chosen publication names, so they live in the
    # vault beside the hostname rather than in the public chart. config.py
    # requires both for every subcommand.
    - secretKey: commutePagePath
      remoteRef:
        key: afas-declaraties-commute-page-path
    - secretKey: homePagePath
      remoteRef:
        key: afas-declaraties-home-page-path
    - secretKey: opServiceAccountToken
      remoteRef:
        key: afas-declaraties-op-service-account-token
    - secretKey: opVault
      remoteRef:
        key: afas-declaraties-op-vault
    # Reuses the estate-wide bot token rather than minting a new one. Note the
    # consequence: every message this app posts appears as that same bot, and
    # the bot must be a member of the target channel or chat.postMessage returns
    # not_in_channel.
    - secretKey: slackBotToken
      remoteRef:
        key: slack-bot-token
    - secretKey: slackAppToken
      remoteRef:
        key: m0-05e-slack-socket-token
    - secretKey: slackChannelId
      remoteRef:
        key: afas-declaraties-slack-channel-id
    - secretKey: slackApproverIds
      remoteRef:
        key: afas-declaraties-slack-approver-ids
