apiVersion: v1
kind: Namespace
metadata:
  name: afas-declaraties
  labels:
    # Clones the flux-system ghcr-pull-secret into this namespace (Kyverno
    # ClusterPolicy sync-ghcr-pull-secret). The image lives at
    # ghcr.io/calebsargeant/afas-declaraties, which is the same registry
    # namespace deskbird-booking already pulls from with this exact secret
    # (CalebSargeant/deskbird-booking k8s/base/cronjob.yaml), so it is known to
    # work. If the GHCR package is published PUBLIC, this label and the
    # imagePullSecrets entry in the HelmRelease are both redundant — harmless,
    # but drop them together rather than one of them.
    ghcr-pull-secret: sync
