apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` directive on purpose — the HelmRepository is a flux-system
# scoped control-plane resource and the Namespace is cluster-scoped; each
# carries its own metadata.namespace.
#
# No kustomize `labels:` block either, deliberately. A placement.sargeant.co
# label here would land on the HelmRelease, which none of the Kyverno placement
# policies match (they match Deployment/StatefulSet/DaemonSet/CronJob), so it
# would be silently inert while looking correct. Placement is set inside the
# chart's spec.values and priority through a postRenderer — which is what
# .github/actions/placement-label-guard checks for.
#
# No image automation. The chart leaves image.tag empty and falls back to
# .Chart.AppVersion, and the app repo's release pipeline publishes chart and
# image from one tag — so the semver range on the HelmRelease already tracks the
# image, and an ImageRepository would add an object that stays NotReady until
# the first release exists.
resources:
  - namespace.yaml
  - helmrepository.yaml
