apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Intentionally only references the env overlay (prod). ./base is the app's
# control-plane library (OCI chart source, namespace) — applied by the per-env
# Flux Kustomization (see prod/flux-kustomization.yaml), not aggregated directly.
resources:
  - ./prod
