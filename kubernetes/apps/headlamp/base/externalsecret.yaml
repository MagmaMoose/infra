---
# Migrated from oauth2-proxy-secret.enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: headlamp-oauth2-proxy — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: client-id # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: headlamp-oauth2-proxy
        property: client-id
    - secretKey: client-secret # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: headlamp-oauth2-proxy
        property: client-secret
    - secretKey: cookie-secret # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: headlamp-oauth2-proxy
        property: cookie-secret
