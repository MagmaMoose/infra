---
# Migrated from oauth2-proxy-emails.enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: headlamp-oauth2-emails — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
# Note: emails.txt uses dotted-key escaping (emails\.txt) — ESO treats property as a dotted path.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-emails
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-emails
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: emails.txt # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: headlamp-oauth2-emails
        property: emails\.txt
