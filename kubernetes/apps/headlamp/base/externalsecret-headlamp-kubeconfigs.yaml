---
# Migrated from headlamp-kubeconfigs.enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: headlamp-kubeconfigs — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: headlamp-kubeconfigs
  namespace: misc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: headlamp-kubeconfigs
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: config # kics-scan ignore-line - ESO secretKey is a field name, not a hardcoded value
      remoteRef:
        key: headlamp-kubeconfigs
        property: config
