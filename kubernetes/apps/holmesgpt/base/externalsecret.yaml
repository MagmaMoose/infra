apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: holmesgpt-litellm
  namespace: holmesgpt
spec:
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: holmesgpt-litellm
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # HolmesGPT's own LiteLLM virtual key — it sends it as `Authorization: Bearer` to the
    # in-cluster LiteLLM OpenAI-compat proxy (:8080), which maps it to x-litellm-api-key.
    # Referenced from the HelmRelease modelList via `{{ env.LITELLM_API_KEY }}` and
    # injected as env via additional_env_froms. The litellm-keyseed Job upserts the same
    # vault entry as the `holmes` key, capped at $25 per 30 days and allowed only the
    # agent-investigate and agent-light roles. It used to be the master key, which no
    # budget applies to.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: holmesgpt-litellm-api-key
