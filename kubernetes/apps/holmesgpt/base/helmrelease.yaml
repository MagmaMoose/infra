apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holmesgpt
  namespace: holmesgpt
spec:
  interval: 10m
  chart:
    spec:
      chart: holmes
      version: "0.33.0"
      sourceRef:
        kind: HelmRepository
        name: robusta
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Priority class, per the desired-state table in cleanup.md.
    # Set in chart values because the Kyverno assign-priority-class policy
    # cannot reach a chart-rendered workload — the placement label lands on
    # the HelmRelease, not the Deployment the chart renders.
    priorityClassName: low
    # HolmesGPT — the OPS / incident-investigation engine. It reads k8s state, logs, and
    # Prometheus to root-cause problems; it is read-only and does NOT touch GitHub/PRs
    # (that's Nievah/OpenHands).

    # Pin to worker nodes: HolmesGPT is an app workload, not a system controller, so keep
    # it off the memory-constrained control-plane Pi. The robusta `holmes` chart honors a
    # top-level nodeSelector — it has NO defaultPodOptions, so the repo's
    # components/node-selectors/worker patch would be a silent no-op here.
    nodeSelector:
      node-role.kubernetes.io/worker: ""

    # All inference goes through the in-cluster LiteLLM gateway (single entry point for
    # billing/keys). modelList is a litellm model registry: `openai/<name>` + the :8080
    # OpenAI-compat proxy + the master key (Bearer -> x-litellm-api-key inside the proxy).
    # DEEPSEEK, NOT CLAUDE. Holmes reaches LiteLLM with a KEY in the header, which is the
    # per-token path: per docs/guides/litellm-clients.md the Claude Max subscription is
    # reachable only by forwarding Claude Code's OAuth bearer, so Holmes can never ride it.
    # That leaves it on whichever provider account has credit, and measured against the
    # gateway on 2026-08-25 that is DeepSeek alone:
    #
    #   deepseek-v4-flash  200 OK
    #   deepseek-v4-pro    200 OK
    #   gpt-5.4-mini       RateLimitError: You have no credits remaining
    #   claude-haiku-4-5   BadRequestError: credit balance is too low
    #   claude-sonnet-4-6  BadRequestError: credit balance is too low
    #
    # The Claude entries are removed rather than kept as a fallback. Holmes only knows the
    # names in THIS map; an unknown name silently falls back to the first entry, so leaving a
    # dead model here means a typo lands on a route that 500s with a billing error rather than
    # failing loudly. Restore them when the Anthropic account has credit, not before.
    modelList:
      deepseek-v4-pro:
        model: openai/deepseek-v4-pro
        api_base: http://litellm.automation.svc.cluster.local:8080/v1
        api_key: "{{ env.LITELLM_MASTER_KEY }}"
      deepseek-v4-flash:
        model: openai/deepseek-v4-flash
        api_base: http://litellm.automation.svc.cluster.local:8080/v1
        api_key: "{{ env.LITELLM_MASTER_KEY }}"

    # PROMETHEUS_URL points the prometheus/metrics toolset at the kube-prometheus-stack
    # Prometheus (observability ns). LITELLM_MASTER_KEY is injected from the ExternalSecret.
    additionalEnvVars:
      - name: PROMETHEUS_URL
        value: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
    additional_env_froms:
      - secretRef:
          name: holmesgpt-litellm

    # Investigation toolsets. robusta (the Robusta SaaS platform) is disabled — we run the
    # standalone agent. kubernetes + prometheus + bash give it what it needs to diagnose.
    toolsets:
      kubernetes/core:
        enabled: true
      kubernetes/logs:
        enabled: true
      prometheus/metrics:
        enabled: true
      bash:
        enabled: true
        config:
          builtin_allowlist: "extended"
      robusta:
        enabled: false

    # Read access to the cluster for the kubernetes toolset (chart creates the SA + RBAC).
    createServiceAccount: true

    # Operator (HealthCheck/ScheduledHealthCheck CRDs for 24/7 detection) OFF for now —
    # this deploys Holmes as an on-demand investigation API (reachable in-cluster, e.g. by
    # Hermes). Enable later for scheduled health checks.
    operator:
      enabled: false

    # CPU request, no CPU limit (CFS-throttle false alarms); memory bounded.
    resources:
      requests:
        cpu: 10m
        # 640Mi, down from 1Gi. 14-day peak working set is 516Mi across all three
        # replicas (516/487/470), so 1Gi reserved ~384Mi that was never used while
        # ff-vm1 sat at 99% of allocatable memory REQUESTED against 68% in use — which
        # is what kept the amd64 CI runner Pending. Request is what the scheduler
        # reserves; the limit below is untouched and is not scheduler-reserved
        # (COMMON_MISTAKES #14), so headroom for a spike is unchanged.
        memory: 640Mi
      limits:
        memory: 2Gi
