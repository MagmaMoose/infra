apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holmesgpt
  namespace: holmesgpt
spec:
  interval: 10m
  chart:
    spec:
      chart: holmes
      version: "0.33.0"
      sourceRef:
        kind: HelmRepository
        name: robusta
        namespace: flux-system
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The chart's operator Deployment has no priorityClassName value (only the Holmes one
  # does, below), so the operator gets `low` the way defectdojo's workloads do: by patching
  # the rendered output.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: holmesgpt-operator
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: low
  values:
    # Priority class, per the desired-state table in cleanup.md.
    # Set in chart values because the Kyverno assign-priority-class policy
    # cannot reach a chart-rendered workload — the placement label lands on
    # the HelmRelease, not the Deployment the chart renders.
    priorityClassName: low
    # HolmesGPT — the OPS / incident-investigation engine. It reads k8s state, logs, and
    # Prometheus to root-cause problems; it is read-only and does NOT touch GitHub/PRs
    # (that's Nievah/OpenHands).

    # Pin to worker nodes: HolmesGPT is an app workload, not a system controller, so keep
    # it off the memory-constrained control-plane Pi. The robusta `holmes` chart honors a
    # top-level nodeSelector — it has NO defaultPodOptions, so the repo's
    # components/node-selectors/worker patch would be a silent no-op here.
    nodeSelector:
      node-role.kubernetes.io/worker: ""

    # All inference goes through the in-cluster LiteLLM gateway (single entry point for
    # billing/keys). modelList is a litellm model registry: `openai/<name>` + the :8080
    # OpenAI-compat proxy + Holmes's own capped key (Bearer -> x-litellm-api-key inside the proxy).
    # A ROLE NAME, NOT A PROVIDER MODEL. Holmes asks LiteLLM for `agent-investigate`, and the
    # LiteLLM config decides which provider and model that is (the tiers-and-roles section of
    # kubernetes/apps/litellm/base/configmap.yaml). Switching provider is an edit there, not
    # here. This used to name deepseek-v4-pro directly; when that balance ran out every
    # investigation came back as HTTP 500 and Nievah posted alerts with "HolmesGPT did not
    # answer" until this file was changed too.
    #
    # Holmes reaches LiteLLM with a KEY in the header, which is the per-token path: per
    # docs/guides/litellm-clients.md the Claude Max subscription is reachable only by
    # forwarding Claude Code's OAuth bearer, so Holmes can never ride it.
    #
    # Nievah leaves HOLMES_MODEL empty, so the FIRST entry is what every investigation uses.
    # `agent-light` is the cheap role, by name only. Holmes only knows the names in THIS map
    # and an unknown name silently falls back to the first entry.
    modelList:
      agent-investigate:
        model: openai/agent-investigate
        api_base: http://litellm.automation.svc.cluster.local:8080/v1
        api_key: "{{ env.LITELLM_API_KEY }}"
      agent-light:
        model: openai/agent-light
        api_base: http://litellm.automation.svc.cluster.local:8080/v1
        api_key: "{{ env.LITELLM_API_KEY }}"

    # PROMETHEUS_URL points the prometheus/metrics toolset at the kube-prometheus-stack
    # Prometheus (observability ns). LITELLM_API_KEY is injected from the ExternalSecret.
    #
    # The service is `prometheus-prometheus`: the stack sets fullnameOverride, so there is
    # no `kube-prometheus-stack-prometheus`. With the wrong name the toolset cannot resolve
    # Prometheus and Holmes falls back to the API server's services/proxy, which its
    # read-only role forbids, so every alert question failed.
    additionalEnvVars:
      - name: PROMETHEUS_URL
        value: http://prometheus-prometheus.observability.svc.cluster.local:9090  # DevSkim: ignore DS137138 - in-cluster ClusterIP, no external exposure
    additional_env_froms:
      - secretRef:
          name: holmesgpt-litellm

    # Investigation toolsets. robusta (the Robusta SaaS platform) is disabled — we run the
    # standalone agent. kubernetes + prometheus + bash give it what it needs to diagnose.
    toolsets:
      kubernetes/core:
        enabled: true
      kubernetes/logs:
        enabled: true
      prometheus/metrics:
        enabled: true
      bash:
        enabled: true
        config:
          builtin_allowlist: "extended"
      robusta:
        enabled: false

    # Read access to the cluster for the kubernetes toolset (chart creates the SA + RBAC).
    createServiceAccount: true

    # The operator runs the ScheduledHealthChecks in ../checks: on each schedule it creates
    # a HealthCheck, which it runs by POSTing the question to this Holmes's
    # /api/checks/execute, and it records pass/fail and Holmes's findings in the
    # ScheduledHealthCheck's status. That is Holmes looking without waiting for an alert.
    #
    # It sends nothing itself. The checks run in `monitor` mode, with no Slack token here:
    # kube-state-metrics exports each check's last result, and a failed check becomes the
    # critical alert HolmesHealthCheckFailed (kube-prometheus-stack), which reaches the
    # owner the way every critical does, through Nievah's alert lane.
    operator:
      enabled: true
      # Pinned by digest: the index for 0.33.0 (arm64 and amd64).
      image: holmes-operator:0.33.0@sha256:810fe4193b21e9d50570403b73b5e0159d10f125878f6a8ae3c45673806a63c5
      # The operator only waits on Holmes, so a small python process. The chart's defaults
      # (256Mi request, 100m CPU) would reserve more than Holmes's own CPU request.
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
      # Every run creates a HealthCheck object. The findings are kept in the
      # ScheduledHealthCheck's own history, so the per-run objects can go after two days
      # rather than pile up at several a day forever.
      cleanupCompletedChecks: true
      completedCheckTTLHours: 48
      # Same reason as Holmes's own nodeSelector above: off the control-plane Pi.
      nodeSelector:
        node-role.kubernetes.io/worker: ""

    # CPU request, no CPU limit (CFS-throttle false alarms); memory bounded.
    resources:
      requests:
        cpu: 10m
        # 640Mi, down from 1Gi. 14-day peak working set is 516Mi across all three
        # replicas (516/487/470), so 1Gi reserved ~384Mi that was never used while
        # ff-vm1 sat at 99% of allocatable memory REQUESTED against 68% in use — which
        # is what kept the amd64 CI runner Pending. Request is what the scheduler
        # reserves; the limit below is untouched and is not scheduler-reserved
        # (COMMON_MISTAKES #14), so headroom for a spike is unchanged.
        memory: 640Mi
      limits:
        memory: 2Gi
