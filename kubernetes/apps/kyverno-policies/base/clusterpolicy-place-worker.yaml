---
# Placement tier: `worker` — ANY k3s agent (ff-vm1, ff-oci1, ff-oci2).
#
# Replaces `kubernetes/components/node-selectors/worker`.
#
# `node-role.kubernetes.io/worker` spans BOTH the on-prem and native-cloud tiers
# AND both CPU architectures (ff-vm1 is amd64, the OCI pair is arm64). It is a
# ROLE, not a tier. Only use it for workloads that are genuinely
# architecture-agnostic and have no node-local state; otherwise pick `on-prem`
# or `cloud`.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: place-worker
  annotations:
    policies.kyverno.io/title: Pin `tier=worker` workloads to any k3s agent
    policies.kyverno.io/category: Scheduling / Placement
    policies.kyverno.io/subject: Deployment,StatefulSet,DaemonSet,CronJob
    policies.kyverno.io/description: >-
      Adds nodeSelector `node-role.kubernetes.io/worker: ""` to the pod template
      of any controller labelled `placement.sargeant.co/tier: worker`. Spans
      architectures — verify the image is multi-arch before using this tier.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  admission: true
  background: false
  mutateExistingOnPolicyUpdate: false
  # Ignore, not Fail. Fail was the original choice, on the reasoning that an
  # unpinned workload is worse than a blocked apply. That reasoning was wrong
  # about the blast radius: with Fail, a Kyverno admission outage makes EVERY
  # Deployment/StatefulSet/DaemonSet write fail cluster-wide — including Flux's
  # reconciliation, and including any attempt to repair Kyverno itself. It is
  # the one failure mode this repo cannot GitOps its way out of, and it was
  # reached in practice: the admission controller went 0/1 on a control plane
  # already short of memory and every rollout returned 502 from the webhook.
  #
  # Fail is only defensible behind a genuinely highly-available webhook. This
  # cluster has a single 4-core control-plane node where Kyverno restarts often,
  # so Ignore is the honest setting. The cost is bounded and visible: a workload
  # admitted during a Kyverno outage lands unpinned, which the placement
  # validate policies still report, and a rollout restart re-applies it.
  failurePolicy: Ignore
  webhookTimeoutSeconds: 10
  rules:
    - name: pod-template
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
              selector:
                matchLabels:
                  placement.sargeant.co/tier: worker
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                nodeSelector:
                  node-role.kubernetes.io/worker: ""
    - name: cronjob-template
      match:
        any:
          - resources:
              kinds:
                - CronJob
              selector:
                matchLabels:
                  placement.sargeant.co/tier: worker
      mutate:
        patchStrategicMerge:
          spec:
            jobTemplate:
              spec:
                template:
                  spec:
                    nodeSelector:
                      node-role.kubernetes.io/worker: ""
