---
# Control plane: the chart GitRepository source, ghcr-reader RBAC, and the
# namespace. These live in this repo under quarry/base and are applied from the
# flux-system source. Must reconcile before the workload, which references the
# GitRepository it creates. wait: false so this bundle never gates the workload
# on a slow/NotReady control-plane resource.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-quarry-source
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/quarry/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: false
---
# Workload: the HelmRelease (chart from the GitRepository above) plus the CNPG
# Database, the OCI-Vault ExternalSecret, the ghcr pull-secret mirror, and the
# DNS-only Ingress. Lives in THIS infra repo (deploy config is firefly-specific),
# so it's pulled from the flux-system source, not the app repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-quarry
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/quarry/prod/workload
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: prod-quarry-source
    - name: infrastructure-services
