# KICS 3e2d3b2f "hardcoded secret key" is a false positive: the `secretKey`
# values are ExternalSecret field NAMES that map to OCI Vault entries -- no secret
# value is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99,KSV-0040
#
# Projects the app's env secret `quarry-env` from OCI Vault (the chart's
# Deployment consumes it via envFrom -> secrets.existingSecretName). The template
# re-emits the fetched values as the final env-var names Settings reads
# (backend/app/config.py):
#   DATABASE_URL         -- built from the shared CNPG `neondb_owner` password
#                           (vault: neondb-owner-password) + the quarry DB. Quarry
#                           is Postgres-only; absent, it has nowhere to write.
#   GH_TOKEN             -- github.com PAT covering the magmamoose org +
#                           CalebSargeant user sources. REUSED from
#                           github-contributions (vault: github-contributions-gh-token).
#   GHES_TOKEN           -- pinkroccade.ghe.com enterprise PAT, likewise reused
#                           (vault: github-contributions-ghes-token) -- the same
#                           token github-timesheet reads as GHE_TOKEN.
#   M365_ICS_URL         -- the secret published-calendar ICS link, reused from
#                           github-timesheet (vault: github-timesheet-m365-ics-url).
#                           This is the Mode 1 anchor feed; a bearer URL, hence a
#                           secret rather than config.
#   GRAPH_CLIENT_SECRET  -- Microsoft Graph app registration secret; the richer
#                           calendar/mail/Teams transport (vault: quarry-graph-client-secret).
#   SLACK_TOKEN          -- Slack user/bot token (vault: quarry-slack-token).
#   TEAMS_TOKEN          -- optional. Teams rides on Graph when this is empty, so
#                           an empty vault value is a legitimate configuration,
#                           not a broken one (vault: quarry-teams-token).
#   CLICKUP_TOKEN        -- ClickUp personal API token (vault: quarry-clickup-token).
#   LITELLM_API_KEY      -- LiteLLM proxy master key for the Dutch block-summary
#                           labels (vault: litellm-master-key, shared with the
#                           automation-namespace LiteLLM deployment). Absent, the
#                           summariser is off and labels fall back to the
#                           deterministic rules: a readability degradation only,
#                           never a change to the numbers.
#
# EVERY key below must exist in OCI Vault before this reconciles. external-secrets
# fails the WHOLE ExternalSecret on one missing remoteRef, so a forgotten
# connector credential leaves `quarry-env` absent and the pod without a
# DATABASE_URL. That is the failure mode we want: total and loud. A
# partially-populated secret would start the app with a connector that looks
# configured and reports nothing, and Report 1 is an employment record while
# Report 3 becomes client invoices -- a quietly smaller number there is worse
# than an outage.
#
# The NON-secret half of each connector (Graph tenant/client/user ids, the Slack
# user id, the ClickUp team id) lives in the HelmRelease values, not here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quarry-env
  namespace: quarry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: quarry-env
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # gitleaks:allow -- `{{ .dbPassword }}` is an ExternalSecret template
        # variable resolved from OCI Vault at apply time, not a literal credential.
        DATABASE_URL: "postgresql://neondb_owner:{{ .dbPassword }}@postgres-rw.database.svc.cluster.local:5432/quarry"  # gitleaks:allow
        GH_TOKEN: "{{ .GH_TOKEN }}"
        GHES_TOKEN: "{{ .GHES_TOKEN }}"
        M365_ICS_URL: "{{ .M365_ICS_URL }}"
        GRAPH_CLIENT_SECRET: "{{ .GRAPH_CLIENT_SECRET }}"
        SLACK_TOKEN: "{{ .SLACK_TOKEN }}"
        TEAMS_TOKEN: "{{ .TEAMS_TOKEN }}"
        CLICKUP_TOKEN: "{{ .CLICKUP_TOKEN }}"
        LITELLM_API_KEY: "{{ .LITELLM_API_KEY }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: neondb-owner-password
    - secretKey: GH_TOKEN
      remoteRef:
        key: github-contributions-gh-token
    - secretKey: GHES_TOKEN
      remoteRef:
        key: github-contributions-ghes-token
    - secretKey: M365_ICS_URL
      remoteRef:
        key: github-timesheet-m365-ics-url
    - secretKey: GRAPH_CLIENT_SECRET
      remoteRef:
        key: quarry-graph-client-secret
    - secretKey: SLACK_TOKEN
      remoteRef:
        key: quarry-slack-token
    - secretKey: TEAMS_TOKEN
      remoteRef:
        key: quarry-teams-token
    - secretKey: CLICKUP_TOKEN
      remoteRef:
        key: quarry-clickup-token
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm-master-key
