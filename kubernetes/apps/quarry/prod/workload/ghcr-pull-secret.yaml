# Mirror `ghcr-pull-secret` from the `flux-system` namespace into `quarry` using
# external-secrets' Kubernetes provider -- the same pattern
# github-contributions / github-timesheet / nievah / caldrith use. The
# flux-system Secret is the SOPS-managed token that provably pulls
# ghcr.io/magmamoose/* (Flux's ImageRepository scans the image with it).
# Cross-namespace RBAC lives in base/ghcr-reader-rbac.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quarry-ghcr-reader
  namespace: quarry
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ghcr-pull-secret-mirror
  namespace: quarry
spec:
  provider:
    kubernetes:
      remoteNamespace: flux-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: quarry
          key: ca.crt
      auth:
        serviceAccount:
          name: quarry-ghcr-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: quarry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ghcr-pull-secret-mirror
    kind: SecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    # Re-emit the source's kubernetes.io/dockerconfigjson shape so kubelet
    # recognises it as an image-pull credential. The dot-prefixed key needs
    # index syntax in the Go template.
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ index . `.dockerconfigjson` }}"
  dataFrom:
    - extract:
        key: ghcr-pull-secret
