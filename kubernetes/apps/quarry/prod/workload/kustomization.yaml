apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The workload for prod, applied by the `prod-quarry` Flux Kustomization (see
# ../flux-kustomization.yaml). Each resource carries its own metadata.namespace
# (the CNPG Database lives in `database`, the rest in `quarry`).
resources:
  - database.yaml
  - ghcr-pull-secret.yaml
  - externalsecret.yaml
  - helmrelease.yaml
  - ingress.yaml
