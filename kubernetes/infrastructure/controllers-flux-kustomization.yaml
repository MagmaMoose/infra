---
# Operators / controllers: cert-manager, external-secrets,
# 1password-connect, cloudnative-pg. Gates the app + services tiers —
# every ExternalSecret-backed workload needs external-secrets +
# 1password-connect healthy first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
  labels:
    app.kubernetes.io/sops: enabled
spec:
  interval: 10m
  path: ./kubernetes/infrastructure/controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: infrastructure-configs
    # The PriorityClasses must exist before anything that names one is applied. The
    # data-plane workloads under infrastructure/services set priorityClassName:
    # critical directly (postgres, postgres-oci, mariadb, valkey-oci, minio), and a
    # pod naming a class that does not exist is REJECTED at admission — not
    # defaulted, not warned about.
    #
    # infrastructure-priority-classes is its own Kustomization with no dependents, so
    # nothing ordered it against this tree. The ordering held only because the pull
    # requests happened to merge in sequence; a cluster rebuild had no such guarantee.
    # Declared here rather than on services because services depends on controllers,
    # so this covers both.
    - name: infrastructure-priority-classes
  decryption:
    provider: sops
    secretRef:
      name: sops-keys
  # Carried over from the legacy `cloudnative-pg` Kustomization — the
  # operator Deployment must be Ready before infrastructure-services
  # (which contains the Postgres cluster) reconciles.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudnative-pg-controller-manager
      namespace: cloudnative-pg
