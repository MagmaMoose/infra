apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - deployment.yaml
labels:
  # Priority tier — consumed by the Kyverno `assign-priority-class` policy.
  # `critical`, matching the `cloudflared` DaemonSet: this is the same kind of
  # component, the only ingress path for everything it fronts, and nothing may
  # outrank its dependencies — janeway is `high` and is reachable only through
  # this connector.
  #
  # includeSelectors/includeTemplates false: those fields are immutable on a
  # live controller, so writing to them would break Flux's next apply.
  - pairs:
      placement.sargeant.co/priority: critical
    includeSelectors: false
    includeTemplates: false
