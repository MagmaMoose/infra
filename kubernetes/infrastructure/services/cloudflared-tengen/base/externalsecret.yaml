---
# Credential for the `firefly-tengen` Cloudflare Tunnel.
#
# A SECOND tunnel, in a second Cloudflare account. The `cloudflared` DaemonSet
# next door runs the `firefly` tunnel, which lives in the Magma Moose account
# (6e26afa3…). Tunnel routes are account-scoped — the edge resolves a hostname
# to a tunnel using the ingress config of the tunnel's OWN account — so the
# firefly tunnel cannot serve a hostname in a zone belonging to the tengen
# account (d2bd0f93…), no matter how the DNS record is written. Hence a tunnel
# per account rather than a shared one.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-tengen-token
  namespace: general-system
spec:
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: cloudflared-tengen-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: cloudflared-tunnel-token-tengen
