apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
  - externalsecret.yaml
  - setup-job.yaml
# No offsite copy job. The `minio-backup` CronJob (and its OCI credential) were removed
# in October 2026: an additive `rclone copy` with no expiry grew the OCI `minio-backups`
# bucket to ~547 GiB, and re-enabling this directory must not restart that.
