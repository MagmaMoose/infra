# KICS 3e2d3b2f "hardcoded secret key" is a false positive: `secretKey` values
# are ExternalSecret field NAMES that map to OCI Vault entries — no credential
# value is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# Password for the `janeway` LOGIN role, consumed by the managed-roles block in
# cluster.yaml. Same shape as the `postgres` cluster's neondb-owner secret:
# CNPG reconciles the role's password from here, so it cannot drift, and
# rotating the OCI Vault entry rotates the database credential.
#
# The application reads the SAME vault key from its own namespace
# (kubernetes/apps/janeway/prod/workload/externalsecret.yaml), so both ends
# follow one source of truth rather than one copying the other.
#
# basic-auth rather than Opaque because that is the shape CNPG's
# `passwordSecret` expects — it reads the `password` key and ignores the rest.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: janeway-db
  namespace: database-oci
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: janeway-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: janeway
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: janeway-db-password
