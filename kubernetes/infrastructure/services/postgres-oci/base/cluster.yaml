---
# postgres-oci — a SECOND CloudNativePG cluster, pinned to the OCI native-cloud
# worker tier (ff-oci1, ff-oci2). Deliberate, documented exception to the
# "one shared postgres" rule (COMMON_MISTAKES #3): this is a separate failure
# domain for always-online, public-facing workloads (e.g. GitHub-App backends),
# with its own credentials and backup namespace. The shared `postgres` cluster
# in the `database` ns is unchanged. See the ADR
# .claude/decisions/2026-06-25-native-cloud-worker-tier.md.
#
# Managed by the SAME existing cloudnative-pg operator — no new controller.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-oci
  namespace: database-oci
spec:
  # Two instances, one per OCI node (see affinity below). A primary + 1 hot
  # standby with Postgres streaming replication — node-local storage is fine
  # because CNPG replicates at the database layer.
  instances: 2

  # `critical` (100000), set here for the same reason the affinity below is: a CNPG
  # Cluster is not a Deployment/StatefulSet, so the Kyverno assign-priority-class
  # policy cannot reach it and a placement label on this object would be inert.
  # Left unset, this database sits at priority 0 while the cloud-tier apps that
  # depend on it carry medium through business — so the scheduler would evict the
  # database to make room for its own consumers.
  priorityClassName: critical

  # Pin to the OCI tier. CRITICAL: a CNPG Cluster is NOT a Deployment/StatefulSet,
  # so the kustomize node-selectors component does NOT reach it — placement MUST
  # be set here in spec.affinity. nodeSelector keeps every instance on an OCI
  # node; required pod anti-affinity on hostname spreads the two instances across
  # ff-oci1 and ff-oci2 (no two replicas on the same node).
  affinity:
    nodeSelector:
      topology.sargeant.co/tier: native-cloud
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  # CNPG's default operand image is multi-arch (incl. arm64), so no imageName
  # pin is needed for the arm64 OCI nodes.

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "1310kB"
      huge_pages: "off"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  storage:
    size: 10Gi
    storageClass: local-path

  # CNPG auto-generates the `app` owner credentials into the secret
  # `postgres-oci-app`. Apps on this tier add a postgresql.cnpg.io `Database` CR
  # (spec.cluster.name: postgres-oci, metadata.namespace: database-oci) — NOT a
  # Cluster of their own.
  #
  # First consumer: Dün Mir Pro (kubernetes/apps/dunmir/base/dunmir/
  # database.yaml — database `dunmir`, owner `app`). It reuses `app` rather than
  # taking a dedicated role, which is the reverse of what this comment used to
  # recommend, for two reasons worth recording: this operator ships no
  # `users`/`roles` CRD (only databases/publications/subscriptions), so a role
  # cannot be declared per-app the way a database can; and the shared `postgres`
  # cluster's apps (sonarqube, defectdojo, dependency-track) already
  # standardise on reusing that cluster's single owner role, `neondb_owner`.
  # Per-app role isolation on this cluster is still possible — a
  # `spec.managed.roles` entry HERE with a passwordSecret from OCI Vault, plus
  # `owner:` on the app's Database CR — but it is a change to this shared Cluster
  # and a second source of truth for a credential CNPG already owns, so it should
  # be a deliberate decision rather than the default for the next app.
  bootstrap:
    initdb:
      database: app
      owner: app

  managed:
    # CNPG reconciles ONLY the roles declared here; every other role (postgres,
    # app, ...) is left untouched.
    #
    # IMPORTANT: a managed role's attributes are reconciled to EXACTLY what is
    # declared — any attribute omitted is reset to the CNPG default. So each
    # role below lists its full attribute set verbatim.
    roles:
      # `janeway` — owns the `janeway` database and nothing else.
      #
      # A dedicated role rather than reusing `app` (which dunmir does) for two
      # reasons. It is the isolation the shared role does not give: `app` owns
      # dunmir's database too, so sharing it would let either application's
      # credentials read the other's data. And it means the password can live in
      # OCI Vault and be enforced from there, exactly as neondb-owner is on the
      # `postgres` cluster — rather than the application having to read the
      # CNPG-generated `postgres-oci-app` Secret out of this namespace, which
      # needs a cross-namespace RBAC grant to read Secrets.
      #
      # No createdb/createrole/superuser: Janeway migrates a database it has
      # already been given. It does need to create EXTENSIONS (citext, in the
      # very first migration), but citext and btree_gin are TRUSTED extensions
      # in PG13+, so the database owner can create them without superuser.
      - name: janeway
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        connectionLimit: -1
        passwordSecret:
          name: janeway-db

      # `afas_declaraties` — owns the `afas_declaraties` database and nothing
      # else. Consumed by kubernetes/apps/afas-declaraties.
      #
      # Dedicated rather than reusing `app`, for the same reasons as `janeway`
      # above: `app` owns dunmir's database too, so sharing it would let either
      # application's credentials read the other's data — and this one holds an
      # expense ledger, including which days a person was in an office. It also
      # lets the password live in OCI Vault and be enforced from there, rather
      # than the application needing a cross-namespace RBAC grant to read the
      # CNPG-generated `postgres-oci-app` Secret out of this namespace.
      #
      # No createdb/createrole/superuser: the app migrates a database it has
      # already been given, with plain numbered SQL. It creates no extensions.
      #
      # Underscored, unlike the hyphenated Kubernetes objects around it: this is
      # a PostgreSQL identifier, and a hyphen would need quoting everywhere it
      # appears — including in the DSN the app builds.
      - name: afas_declaraties
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        connectionLimit: -1
        passwordSecret:
          name: afas-declaraties-db

  monitoring:
    enablePodMonitor: true

  backup:
    barmanObjectStore:
      # Same OCI Object Storage bucket as the shared cluster, but a distinct
      # serverName so the two clusters' base backups + WAL never collide
      # (objects land under s3://postgres-backups/postgres-oci/).
      destinationPath: s3://postgres-backups/
      serverName: postgres-oci
      endpointURL: https://axn3gwpaabzc.compat.objectstorage.eu-amsterdam-1.oraclecloud.com
      s3Credentials:
        accessKeyId:
          name: postgres-backup-oci
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-backup-oci
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
    # 2-day recovery window. WAL archives ~1.2 GiB/day, so retention is the
    # dominant driver of Object Storage size; kept short to stay inside OCI's
    # 10 GiB Always Free tier. PITR within the window; primary data is on-cluster.
    retentionPolicy: "2d"
