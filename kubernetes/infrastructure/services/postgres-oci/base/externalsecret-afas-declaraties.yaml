# KICS 3e2d3b2f "hardcoded secret key" is a false positive: `secretKey` values
# are ExternalSecret field NAMES that map to OCI Vault entries — no credential
# value is present in source.
# kics-scan disable=3e2d3b2f-c22a-4df1-9cc6-a7a0aebb0c99
#
# Password for the `afas_declaraties` LOGIN role, consumed by the managed-roles
# block in cluster.yaml. Same shape as the `janeway` secret beside it: CNPG
# reconciles the role's password from here, so it cannot drift, and rotating the
# OCI Vault entry rotates the database credential.
#
# The application reads the SAME vault key from its own namespace
# (kubernetes/apps/afas-declaraties/prod/workload/externalsecret.yaml, which
# composes it into DATABASE_URL), so both ends follow one source of truth rather
# than one copying the other.
#
# The value must be URL-safe — the app end interpolates it into a DSN unencoded.
# Generate with `openssl rand -hex 32`.
#
# basic-auth rather than Opaque because that is the shape CNPG's
# `passwordSecret` expects — it reads the `password` key and ignores the rest.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: afas-declaraties-db
  namespace: database-oci
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: afas-declaraties-db
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: afas_declaraties
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: afas-declaraties-db-password
