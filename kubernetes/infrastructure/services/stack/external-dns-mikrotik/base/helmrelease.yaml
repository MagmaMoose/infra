apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: external-dns-mikrotik
  namespace: core
  labels:
    app.kubernetes.io/name: external-dns-mikrotik
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "8.0.*"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # Use kubernetes-sigs image for better ARM64 support
    image:
      registry: registry.k8s.io
      repository: external-dns/external-dns
      tag: v0.20.0

    # Provider configuration - use webhook for MikroTik
    provider: webhook

    # ServiceAccount configuration
    serviceAccount:
      create: false
      name: external-dns-mikrotik

    # Extra arguments for webhook provider
    extraArgs:
      webhook-provider-url: http://external-dns-mikrotik-webhook.core.svc.cluster.local:8888

    # Domain filter - configure for your local domain
    domainFilters:
      - local  # Replace with your actual local domain managed by MikroTik
      # Ember's Cloudflare-registered zone is split-horizon: records are
      # created only in the LAN resolver, never in the public Cloudflare zone.
      - whyf.uk

    # Source configuration - watch both Ingress and Service resources
    sources:
      - ingress
      - service

    # Only explicitly private Ingresses may create records in the LAN resolver.
    # Do not use external-dns's `target` annotation as a selector: it overrides
    # the record RDATA and would turn the private hostname into a CNAME.
    annotationFilter: "dns.sargeant.co/visibility=private"

    # Policy configuration - sync creates, updates, and deletes DNS records
    policy: sync

    # Registry configuration - use TXT records to track ownership
    registry: txt
    txtOwnerId: firefly-mikrotik
    txtPrefix: externaldns-

    # Resource configuration
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    # Node selector
    nodeSelector:
      type: pi

    # Log configuration
    logLevel: info
    logFormat: json
