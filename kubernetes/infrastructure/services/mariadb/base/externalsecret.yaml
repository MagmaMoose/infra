---
# Migrated from secret.enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: mariadb-credentials — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mariadb
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: mariadb
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: mariadb-root-password
      remoteRef:
        key: mariadb-credentials
        property: mariadb-root-password
    - secretKey: wordpress-password
      remoteRef:
        key: mariadb-credentials
        property: wordpress-password
    - secretKey: wordpress-user
      remoteRef:
        key: mariadb-credentials
        property: wordpress-user
