apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cloudflared
  # Second tunnel, for hostnames in the `tengen` Cloudflare account. Tunnel
  # routes are account-scoped, so the tunnel above (Magma Moose account) cannot
  # serve them; see its externalsecret.yaml.
  - cloudflared-tengen
  - minio
  - external-dns-cloudflare
  - external-dns-mikrotik
  # Adopted from an unmanaged hand-installed Helm release, then renamed off its
  # original `external-dns-ember-private`; see its helmrelease.yaml.
  - external-dns-mikrotik-internal
  - postgres
  # Second CNPG cluster pinned to the OCI native-cloud tier (ff-oci1/ff-oci2).
  - postgres-oci
  - mariadb
  - valkey
  # Second Valkey (Redis-compatible cache) pinned to the OCI native-cloud tier
  # (ff-oci1/ff-oci2) — the Redis-side mirror of postgres-oci.
  - valkey-oci
  # Shared Privado VPN gateway (pod-gateway). Restored: creds now in a SOPS secret
  # (1Password Tech) and disableWait:true so a VPN-connect failure can't stall the tier.
  - pod-gateway
