apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-oci
  namespace: database
spec:
  serviceName: valkey-oci
  replicas: 1
  selector:
    matchLabels:
      app: valkey-oci
  template:
    metadata:
      labels:
        app: valkey-oci
    spec:
      # The valkey image runs as the non-root `valkey` user (uid/gid 999) from
      # the start (it can't chown a fresh Longhorn PV itself), so fsGroup makes
      # /data group-writable — without it valkey CrashLoops on EACCES.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # `critical` (100000). Set DIRECTLY rather than via the placement label:
      # this is the data plane, and it must not depend on the Kyverno admission
      # webhook being healthy in order to avoid being preempted. The label
      # mechanism is admission-time only, so a pod admitted while Kyverno is down
      # (failurePolicy is Ignore) would land at priority 0 — which is precisely
      # the state that makes a datastore the scheduler's first eviction victim.
      # The CNPG Clusters set it directly for a related reason (their kind is not
      # matchable at all), so the whole data plane is consistent.
      priorityClassName: critical
      # TEMPORARY, until the CHR WireGuard tunnels between the two OCI environments
      # exist. `topology.sargeant.co/tier: native-cloud` used to mean {ff-oci1, ff-oci2};
      # ff-oci3/ff-oci4 joined as a SECOND OCI environment on 2026-08-31 carrying the same
      # label, and the tier silently became "any of four, across a path that does not
      # exist". That is COMMON_MISTAKES #22, and the comment below still says
      # "(ff-oci1/ff-oci2)" because it was true when it was written.
      #
      # It cost an outage the same day. Measured 2026-09-01: a pod on ff-oci1 or ff-oci2
      # cannot open a TCP connection to a pod on ff-oci4 (TimeoutError) — on-prem can
      # reach both environments, but the two OCI environments have no route to each
      # other. valkey-oci was rescheduled onto ff-oci4 at 06:58Z, and both nievah-backend
      # replicas then CrashLoopBackOff'd on `redis.exceptions.TimeoutError: Timeout
      # connecting to server`, taking the GitHub webhook ingest down for ~12 hours.
      #
      # nodeAffinity rather than a narrower nodeSelector because the tier selector is
      # injected by Kyverno at admission: the two AND together, so this can only narrow
      # the choice, never fight it.
      #
      # REMOVE THIS once ff-chr1/ff-chr2 <-> ff-chr3/ff-chr4 are tunnelled and the intended
      # topology — valkey-oci and postgres-oci spanning both OCI environments, one per
      # node — is actually reachable. Deleting it before then re-strands the data plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - ff-oci3
                      - ff-oci4
      containers:
        - name: valkey
          # Redis-compatible cache pinned to the OCI native-cloud tier
          # (ff-oci1/ff-oci2), for OCI-resident workloads that need a
          # low-latency cache co-located with their nodes — the mirror of
          # postgres-oci for the Redis side. Internal ClusterIP only (headless
          # svc, database ns) — no auth, matching the shared valkey/CNPG tiers.
          image: valkey/valkey:8.1-alpine
          args:
            # AOF persistence so queued Celery tasks survive a restart; never
            # evict (a broker dropping keys = lost tasks).
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "200mb"
            - "--maxmemory-policy"
            - "noeviction"
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: valkey-oci
