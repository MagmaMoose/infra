apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: database
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      # The valkey image runs as the non-root `valkey` user (uid/gid 999) from
      # the start (it can't chown a fresh Longhorn PV itself), so fsGroup makes
      # /data group-writable — without it valkey CrashLoops on EACCES.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # `critical`, matching valkey-oci. #565 gave every other datastore an inline
      # class (postgres, postgres-oci, mariadb, minio, valkey-oci) and missed this
      # one, leaving the pair split: its twin critical, this one relying on a label.
      #
      # This diverges from cleanup.md's "after the repoint, drop valkey back to
      # high". That line predates #565's data-plane rule and the repoint only moved
      # nievah and caldrith off this instance — authentik still consumes it, and
      # authentik is `high`. A cache at `high` serving a consumer at `high` breaks
      # the rule the scale is built on, that nothing may outrank its dependencies.
      # critical keeps it above every consumer, consistent with the rest of the
      # data plane.
      #
      # Inline rather than by label for the same reason as the rest of the data
      # plane: the label mechanism is admission-time only, so with failurePolicy
      # Ignore a pod admitted during a Kyverno outage would land at priority 0 —
      # exactly the state that makes a datastore the first eviction victim.
      priorityClassName: critical
      containers:
        - name: valkey
          # Shared in-cluster cache / Celery broker (Redis-compatible). Internal
          # ClusterIP only (headless svc, database ns) — no auth, matching how the
          # shared CNPG/MariaDB tiers are reachable in-cluster.
          image: valkey/valkey:8.1-alpine
          args:
            # AOF persistence so queued Celery tasks survive a restart; never
            # evict (a broker dropping keys = lost tasks).
            - "--appendonly"
            - "yes"
            # Raised 200mb -> 1gb when Janeway started using this instance as a
            # Django cache (db index 6) alongside DefectDojo's Celery broker on
            # db0.
            #
            # The size is insurance against the eviction policy, not against
            # demand. `noeviction` is correct for a broker — a queue that drops
            # keys loses tasks — but it means that once the instance is full,
            # writes ERROR rather than evicting. A cache filling this up would
            # therefore take DefectDojo down with it. Measured before the
            # change: 1.75 MB used of 200 MB, 1110 keys, all with TTLs. So the
            # headroom was never the binding constraint; the cost of hitting the
            # ceiling was.
            #
            # Janeway's cache keys all carry a TTL (its function_cache decorator
            # always passes one), so its footprint is bounded and self-expiring.
            # If a third consumer ever arrives without TTLs, revisit
            # `volatile-lru` rather than raising this again: it would evict only
            # keys that have an expiry, leaving the broker's queues — which have
            # none — untouched.
            - "--maxmemory"
            - "1gb"
            - "--maxmemory-policy"
            - "noeviction"
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              # Must exceed --maxmemory, or the kubelet OOM-kills the container
              # before Valkey ever applies its own policy — which would be a
              # hard restart of the broker instead of a controlled write error.
              # 1.25Gi against a 1gb ceiling leaves room for the AOF rewrite
              # buffer, client output buffers and allocator fragmentation
              # (measured at ratio 4.79 on a near-empty dataset).
              memory: 1280Mi
            limits:
              memory: 1280Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: valkey
