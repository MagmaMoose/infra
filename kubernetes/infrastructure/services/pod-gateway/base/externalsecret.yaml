---
# Migrated from privado-credentials.enc.yaml (SOPS) to external-secrets + OCI Vault, 2026-08-07.
# Vault secret: privado-vpn-credentials — a JSON object whose properties are the keys below, so one
# vault entry backs the whole Secret rather than one entry per field.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: privado-vpn-credentials
  namespace: vpn-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: privado-vpn-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: privado-vpn-credentials
        property: password
    - secretKey: username
      remoteRef:
        key: privado-vpn-credentials
        property: username
