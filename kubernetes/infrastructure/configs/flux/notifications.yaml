# Flux notification wiring. NO ciphertext lives here any more — the only encrypted
# value in this stack is the Slack bot token, now in slack-bot-token.enc.yaml.
#
# Split out 2026-08-07, because this file was undecryptable by the sops CLI while
# still working perfectly under flux. Two separate causes, both worth knowing:
#
#   1. The Provider and Alert documents below carried `sops:` blocks that encrypted
#      NOTHING — `encrypted_regex: ^(data|stringData)$` matches no field on those
#      kinds — and all five sops blocks shared one MAC covering the whole file. So
#      no single document could be extracted and rekeyed on its own.
#   2. `github-webhook-token` below holds a PLAINTEXT `stringData.token`. The sops
#      CLI walks every document, sees a field matching encrypted_regex that is not
#      ciphertext, and aborts the whole file: `Input string ... does not match sops'
#      data format`. flux's kustomize-controller instead decrypts per-document and
#      skips documents with no sops metadata, which is why production never noticed.
#
# That divergence is how the 2026-08 rotation nearly lost the Slack token: a
# `sops updatekeys` pass silently mangled this file rather than rekeying it, and
# phase 2 (dropping the old recipient) would then have orphaned it permanently.
# Ciphertext now lives in single-document files, where the CLI and flux agree.
#
# NOTE: github-webhook-token is a non-functional placeholder
# (`ghp_YOUR_GITHUB_TOKEN_HERE`), confirmed against the live Secret — the
# github-deployment-notifications Alert has never been able to authenticate. Left
# as-is here rather than fixed silently inside a key-rotation change.
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
    name: slack-success
    namespace: flux-system
spec:
    type: slack
    channel: engineering-info
    secretRef:
        name: slack-bot-token

---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
    name: slack-errors
    namespace: flux-system
spec:
    type: slack
    channel: engineering-alerts
    secretRef:
        name: slack-bot-token

---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
    name: success-notifications
    namespace: flux-system
spec:
    summary: "🚀 Firefly Cluster Deployment"
    providerRef:
        name: slack-success
    eventSeverity: info
    eventSources:
        - kind: Kustomization
          name: '*'
        - kind: HelmRelease
          name: '*'
    inclusionList:
        - ^Reconciliation finished.*
        - ^Helm install succeeded.*
        - ^Helm upgrade succeeded.*
    suspend: false

---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
    name: error-notifications
    namespace: flux-system
spec:
    providerRef:
        name: slack-errors
    eventSeverity: error
    eventSources:
        - kind: Kustomization
          name: '*'
        - kind: HelmRelease
          name: '*'
    suspend: false

---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
    name: github-webhook
    namespace: flux-system
spec:
    type: githubdispatch
    address: https://github.com/CalebSargeant/infra
    secretRef:
        name: github-webhook-token

---
apiVersion: v1
kind: Secret
metadata:
    name: github-webhook-token
    namespace: flux-system
stringData:
    token: ghp_YOUR_GITHUB_TOKEN_HERE  # needs repo scope

---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
    name: github-deployment-notifications
    namespace: flux-system
spec:
    providerRef:
        name: github-webhook
    eventSeverity: info
    eventSources:
        - kind: Kustomization
          name: '*'
    inclusionList:
        - ^Reconciliation finished.*
