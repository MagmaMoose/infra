---
# Cluster-level image automation: the GitRepository Flux writes bumps back to,
# and the ImageUpdateAutomation that drives it. PER-APP ImageRepository/ImagePolicy
# pairs now live with their apps (kubernetes/apps/<app>/base/image-automation.yaml).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infra-image-automation
  namespace: flux-system
spec:
  interval: 10m
  provider: github
  ref:
    branch: main
  secretRef:
    name: github-app-magmamoose
  timeout: 60s
  url: https://github.com/MagmaMoose/infra
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: media
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: infra-image-automation
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: 'chore(media): bump image tags

        {{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}


        [ci skip]'
    push:
      branch: main
  update:
    path: ./kubernetes/apps
    strategy: Setters
