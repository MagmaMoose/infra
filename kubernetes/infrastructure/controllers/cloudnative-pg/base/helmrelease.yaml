apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cloudnative-pg
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.23.*"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: false
  driftDetection:
    mode: enabled
  values:
    # The operator itself (not the postgres Cluster CR it manages, which has its own
    # affinity pinning it to the worker).
    #
    # MOVED OFF ff-pi1 (was node-role.kubernetes.io/system) to relieve the control-plane
    # node's memory exhaustion — see the note in the kyverno HelmRelease for the full
    # reasoning. The operator only needs API access, and every Cluster it reconciles
    # already runs on ff-vm1 or the OCI pair, so co-locating it with its workload is if
    # anything the more natural placement.
    #
    # on-prem tier = the pair clusterpolicy-place-on-prem injects, resolving to exactly
    # ff-vm1 (ff-pi1 carries tier=on-prem too, but is not labelled worker).
    nodeSelector:
      node-role.kubernetes.io/worker: ""
      topology.sargeant.co/tier: on-prem
    crds:
      create: true
