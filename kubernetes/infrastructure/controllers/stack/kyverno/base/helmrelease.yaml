apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  test:
    enable: false
  driftDetection:
    mode: enabled
  values:
    # The admission & cleanup controllers expose a fail-closed webhook server on :9443 that
    # is slow to bind while loading policies/CRDs — slower still on the memory-pressured Pi
    # node (ff-pi1 ~86% mem). The stock startup probe (timeoutSeconds 1, ~120s window) and
    # liveness probe (timeoutSeconds 5, failureThreshold 2, per kyverno chart 3.8+) SIGTERM
    # the pod before it is healthy ("connection refused" on :9443 → exit 0), crashlooping it.
    # With a single admission replica that flap 502s admission for the whole cluster (the
    # webhook is fail-closed). Fix: run the admission controller HA (2 replicas → redundant
    # webhook endpoints + an auto-generated PDB) and loosen the startup/liveness probes on
    # both the admission and cleanup controllers so a slow start no longer kills them.
    #
    # background & reports controllers have no :9443 probes (kyverno chart 3.8+ defaults) and
    # are not affected; keep them at one replica. The slow start is node-level, not
    # pod-resource-driven, so the PROBES above are the fix — but the chart's default 100m
    # CPU request on all four controllers is still pure over-reservation (KRR: ~10m each),
    # and on a 2-core OCI worker that mattered. Requests are KRR-sized (2026-07) below;
    # memory limits keep headroom for policy-load spikes.
    admissionController:
      replicas: 2
      container:
        # KRR: cpu 10m, memory 120Mi (2 replicas).
        resources:
          requests:
            cpu: 10m
            memory: 120Mi
          limits:
            memory: 384Mi
      startupProbe:
        httpGet:
          path: /health/liveness
          port: 9443
          scheme: HTTPS
        initialDelaySeconds: 5
        periodSeconds: 6
        timeoutSeconds: 5
        failureThreshold: 60 # ~6 min to come up (kyverno 3.8+ chart default 20 ≈ 2 min)
      livenessProbe:
        httpGet:
          path: /health/liveness
          port: 9443
          scheme: HTTPS
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10 # kyverno 3.8+ chart default 5
        failureThreshold: 6 # ~3 min sustained failure before kill (kyverno 3.8+ chart default 2)
        successThreshold: 1
      readinessProbe:
        httpGet:
          path: /health/readiness
          port: 9443
          scheme: HTTPS
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 10 # kyverno 3.8+ chart default 5
        failureThreshold: 6
        successThreshold: 1
    backgroundController:
      replicas: 1
      # KRR: cpu 10m, memory 104Mi.
      resources:
        requests:
          cpu: 10m
          memory: 104Mi
        limits:
          memory: 192Mi
    # cleanup-controller exposes the same :9443 webhook server and crashloops identically;
    # loosen its probes too. Keep one replica — its webhook only gates CleanupPolicy, not
    # cluster-wide admission, so a single-pod flap is not cluster-impacting.
    cleanupController:
      replicas: 1
      startupProbe:
        httpGet:
          path: /health/liveness
          port: 9443
          scheme: HTTPS
        initialDelaySeconds: 5
        periodSeconds: 6
        timeoutSeconds: 5
        failureThreshold: 60
      livenessProbe:
        httpGet:
          path: /health/liveness
          port: 9443
          scheme: HTTPS
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 6
        successThreshold: 1
      readinessProbe:
        httpGet:
          path: /health/readiness
          port: 9443
          scheme: HTTPS
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 6
        successThreshold: 1
      # KRR: cpu 10m, memory 100Mi.
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
        limits:
          memory: 192Mi
    reportsController:
      replicas: 1
      # KRR: cpu 10m, memory 134Mi.
      resources:
        requests:
          cpu: 10m
          memory: 134Mi
        limits:
          memory: 256Mi
    # Disable PolicyReports cleanup — not needed for our use case.
    policyReportsCleanup:
      enabled: false
