apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cloudnative-pg
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.23.*"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: false
  driftDetection:
    mode: enabled
  values:
    crds:
      create: true
    # The chart ships `resources: {}`, leaving the operator BestEffort — first to be
    # evicted under node memory pressure, which for a DB operator means no failover
    # handling exactly when the node is unhealthy.
    # KRR-sized (2026-07): cpu 10m, memory 107Mi.
    resources:
      requests:
        cpu: 10m
        memory: 107Mi
      limits:
        memory: 192Mi
