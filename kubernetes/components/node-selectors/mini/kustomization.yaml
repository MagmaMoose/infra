apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # Deployments
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          type: mini

  # StatefulSets
  - target:
      kind: StatefulSet
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          type: mini

  # DaemonSets
  - target:
      kind: DaemonSet
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          type: mini

  # CronJobs (nodeSelector lives under the jobTemplate)
  - target:
      kind: CronJob
    patch: |
      - op: add
        path: /spec/jobTemplate/spec/template/spec/nodeSelector
        value:
          type: mini
