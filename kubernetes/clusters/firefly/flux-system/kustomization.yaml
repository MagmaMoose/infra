apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  # Cluster orchestration + shared Flux config now live OUTSIDE flux-system/
  # (keeping this directory bootstrap-only: gotk-components + gotk-sync + this
  # file). They are still applied by THIS bootstrap Kustomization via relative
  # refs — the same out-of-tree pattern as the node-selectors component below —
  # so nothing re-parents: the exact same objects, applied by the exact same
  # Kustomization, just sourced from their new locations.
  - ../apps.yaml                  # meta `apps` Kustomization (builds clusters/firefly/)
  - ../../../infrastructure/flux  # HelmRepositories, registry/Git auth secrets, notifications
# Note: Removed t.nano resource profile - flux controllers need more resources
# source-controller needs ~300Mi, kustomize-controller needs ~250Mi
# Using default flux resources from gotk-components.yaml
# Flux controller placement, inlined rather than via a Kyverno policy: this is the
# BOOTSTRAP Kustomization and Flux installs Kyverno, so on a cold rebuild these
# controllers are admitted before any ClusterPolicy exists.
# Replaces components/node-selectors/pi, with two deliberate differences:
#   - `node-role.kubernetes.io/system` instead of legacy `type: pi` (both select
#     exactly ff-pi1, so node-set-neutral)
#   - patchStrategicMerge instead of the component's JSON6902 `op: add`, which
#     REPLACED the whole nodeSelector and silently dropped `kubernetes.io/os: linux`
patches:
  - target:
      kind: Deployment
      namespace: flux-system
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored  # name is irrelevant; target: selector above drives matching
      spec:
        template:
          spec:
            nodeSelector:
              node-role.kubernetes.io/system: ""
