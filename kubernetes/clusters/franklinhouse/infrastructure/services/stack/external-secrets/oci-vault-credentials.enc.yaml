# OCI API signing credentials for franklinhouse OWN OCI tenancy
# (af-johannesburg-1), consumed by secret-store.yaml.
#
# base64 `data:`, NOT a `stringData:` block scalar. Two reasons, both real:
#   1. The copy in 1Password is stored FLATTENED - its PEM newlines are
#      spaces. It has to be re-wrapped to 64-char lines before use or the
#      OCI SDK fails with "PEM data was not found in buffer". Regenerate
#      this file with scripts/rebuild-oci-credentials.sh, not by hand.
#   2. base64 cannot be reflowed by a YAML round-trip, so whatever is
#      stored here reaches the operator byte-for-byte.
#
# The key is a 2048-bit RSA key whose public fingerprint matches the
# `fingerprint` field below - verify with:
#   openssl rsa -in key.pem -pubout -outform DER | openssl md5 -c
#
# SOPS-encrypted: this repo is public.
