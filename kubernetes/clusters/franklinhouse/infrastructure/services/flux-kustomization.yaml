---
# Platform services for franklinhouse: the prod and staging CNPG Postgres
# clusters. Depends on infrastructure-controllers so the CNPG operator and its
# CRDs exist first. The access-control workloads depend on this Kustomization in
# turn (see kubernetes/apps/access-control/*/access-control/flux-kustomization.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-services
  namespace: flux-system
  labels:
    app.kubernetes.io/sops: enabled
spec:
  interval: 10m
  path: ./kubernetes/clusters/franklinhouse/infrastructure/services/stack
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
  dependsOn:
    - name: infrastructure-controllers
  decryption:
    provider: sops
    secretRef:
      name: sops-keys
