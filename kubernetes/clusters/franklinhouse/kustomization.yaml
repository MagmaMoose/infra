apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Build target of the meta `apps` Kustomization (see ./apps.yaml). Renders the
# per-app and per-tier Flux Kustomization CRs for franklinhouse; no app or tier
# manifests cross this Kustomization itself — those are applied by the emitted CRs.
#
# Deliberately references ../../apps/access-control DIRECTLY rather than
# ../../apps: kubernetes/apps/kustomization.yaml is firefly's app set (~50 apps),
# and aggregating it here would deploy all of firefly to franklinhouse.
#
# ./infrastructure is franklinhouse-local rather than ../../infrastructure for the
# same reason -- AGENTS.md defines kubernetes/infrastructure/ as cluster-agnostic
# and its tier Kustomizations point at firefly's shared stack/ paths, whereas
# franklinhouse runs its own CNPG clusters and Traefik config.
resources:
  - ../../apps/access-control
  - ./infrastructure
  - ./system
