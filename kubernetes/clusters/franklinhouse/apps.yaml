# Cluster-root orchestration — the meta `apps` Kustomization, mirroring
# clusters/firefly/apps.yaml. Applied by the bootstrap `flux-system`
# Kustomization (referenced from flux-system/kustomization.yaml as ../apps.yaml)
# and intentionally NOT listed in clusters/franklinhouse/kustomization.yaml —
# that file is this Kustomization's build target, so listing it would make it
# manage itself.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/clusters/franklinhouse
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
