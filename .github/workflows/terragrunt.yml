---
# Atlantis replacement, per cleanup.md's appendix.
#
# Differences from the appendix sketch, all deliberate:
#   - runs-on is GitHub-hosted `ubuntu-latest` for `discover` and for every `plan`
#     except the leaves in LAN_STACKS (scripts/terragrunt-pipeline.sh). This repo is
#     PUBLIC, so hosted minutes are free, while the self-hosted amd64 pool is one node
#     shared with every repo in the org: on 2026-09-29 the weekday replan's plans sat
#     queued there for 8-10 hours behind a hung runner. A LAN_STACKS leaf has a
#     provider that connects to a device only the home network can reach, so it plans
#     on `firefly-amd64`. Every `apply` still runs there too.
#
#     `firefly-amd64` is an ARC runner scale set NAME. This is not a label
#     array and cannot be one: actions-runner-controller matches a job to a scale
#     set by name only, so `[self-hosted, Linux, X64]` would never be picked up
#     even though those labels describe the runner accurately. The appendix
#     sketch's `samenlevingszaken` label belongs to a different organisation and
#     matches nothing here either.
#
#     It says `firefly-amd64` rather than plain `firefly` for two reasons. `firefly`
#     now names the two-node arm64 OCI pool, and (a) the terraform provider binaries
#     this pulls are not all published for linux/arm64 — a provider that is not would
#     fail at `init`, per stack, with an error that reads like a network problem; and
#     (b) this repo is PUBLIC, and the arm64 pool is deliberately reserved for the
#     private repos whose GitHub-hosted minutes are metered. `firefly-amd64` is ff-vm1,
#     the on-prem node, which is what a LAN_STACKS plan needs. The shared `pool-amd64`
#     label would not do: it also matches the franklinhouse cluster, a different site.
#   - the OCI provider is configured from OCI_* environment variables (see
#     terraform/root.hcl), so those are passed explicitly rather than relying on a
#     ~/.oci/config that a runner will not have.
#
# The `Default` runner group now has allows_public_repositories=true (enabled by
# the repo owner 2026-08-07), so self-hosted runners will pick these jobs up.
# That is the scenario GitHub warns about, which is why the fork guard on the
# `discover` job below is load-bearing rather than decorative: it stops a pull
# request from a fork ever executing on a runner holding private-cloud
# credentials. Do not weaken it.
name: Terragrunt

on:
  pull_request:
    paths: ['terraform/**', 'scripts/terragrunt-pipeline.sh', '.github/workflows/terragrunt.yml']
  push:
    branches: [main]
    paths: ['terraform/**', 'scripts/terragrunt-pipeline.sh', '.github/workflows/terragrunt.yml']
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terragrunt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
  OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
  OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
  OCI_REGION: eu-amsterdam-1
  # Pinned so a plan and the apply that follows it run the same toolchain. `plan`
  # always installs exactly these; `apply` installs them only when its runner does
  # not already provide them, and the firefly-amd64 image does not.
  TERRAGRUNT_VERSION: 1.1.4
  TOFU_VERSION: 1.12.6

jobs:
  discover:
    # A self-hosted runner must never execute untrusted fork code with private
    # cloud credentials. Same-repository pull requests still receive plan output.
    # This job is hosted, but the guard is still load-bearing here: every job after
    # it needs it, including the LAN_STACKS plans and every apply on `firefly-amd64`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.stacks.outputs.matrix }}
      plan_matrix: ${{ steps.stacks.outputs.plan_matrix }}
      lan_stacks: ${{ steps.stacks.outputs.lan_stacks }}
      has_stacks: ${{ steps.stacks.outputs.has_stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}

      - name: Discover affected stacks
        id: stacks
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed.txt"
          scope=changed
          case "${{ github.event_name }}" in
            pull_request) git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$changed" ;;
            push)         git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$changed" ;;
            # A scheduled or manual run has no reliable event range, so plan
            # everything rather than silently omitting a stack.
            *)            scope=all ;;
          esac
          if [[ "$scope" == all ]]; then
            bash scripts/terragrunt-pipeline.sh discover all > "$RUNNER_TEMP/stacks.txt"
          else
            bash scripts/terragrunt-pipeline.sh discover changed "$changed" > "$RUNNER_TEMP/stacks.txt"
          fi
          matrix=$(jq -Rsc '{include: (split("\n") | map(select(length > 0) | {stack: ., id: (gsub("[^A-Za-z0-9]+"; "-") | sub("-$"; ""))}))}' "$RUNNER_TEMP/stacks.txt")
          # `plan` gets the same entries with the LAN_STACKS leaves moved LAST. It runs
          # max-parallel: 1, so a LAN plan waiting on a busy or hung self-hosted runner
          # would otherwise hold up every hosted plan after it. `apply` keeps `matrix`.
          bash scripts/terragrunt-pipeline.sh lan-stacks > "$RUNNER_TEMP/lan.txt"
          lan=$(jq -Rsc 'split("\n") | map(select(length > 0))' "$RUNNER_TEMP/lan.txt")
          plan_matrix=$(jq -c --argjson lan "$lan" '.include |= sort_by(.stack | IN($lan[]))' <<<"$matrix")
          {
            echo "matrix=$matrix"
            echo "plan_matrix=$plan_matrix"
            echo "lan_stacks=$lan"
            echo "has_stacks=$([[ $(jq '.include|length' <<<"$matrix") -gt 0 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  plan:
    needs: discover
    if: needs.discover.outputs.has_stacks == 'true'
    # Hosted unless the leaf is in LAN_STACKS; see the header. Chosen per entry by
    # expression rather than by a `runner` key in the matrix, because every matrix
    # value is appended to the job's check name and those names must not change.
    runs-on: ${{ contains(fromJSON(needs.discover.outputs.lan_stacks), matrix.stack) && 'firefly-amd64' || 'ubuntu-latest' }}
    # Whether a plan actually RAN, as opposed to whether the job ended green. Every
    # matrix entry computes the same value from the same repository secrets, so the
    # usual last-writer-wins caveat on a matrix job output does not bite here.
    outputs:
      planned: ${{ steps.creds.outputs.present }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.plan_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A job that finds the pinned pair in the Actions cache makes no release
      # download at all. On 2026-10-02 two of 33 plans failed on HTTP 500s from the
      # terragrunt release download, four attempts each. The key carries both
      # versions, so a bump can never restore an old binary.
      - name: Restore the terragrunt toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terragrunt-toolchain
          key: terragrunt-toolchain-${{ runner.os }}-${{ runner.arch }}-tofu-${{ env.TOFU_VERSION }}-tg-${{ env.TERRAGRUNT_VERSION }}

      # Always exactly TOFU_VERSION and TERRAGRUNT_VERSION, whatever the runner image
      # carries. Plans run on two images now (neither ships these today), and using
      # whatever binary one of them picks up later would let a plan and the apply
      # after it run different toolchains.
      #
      # Checksummed, because an unverified binary fetched over the network is handed
      # every credential this job has. Only a verified binary is moved into the
      # cached directory, and actions/cache saves it only when the job succeeds.
      - name: Install the terragrunt toolchain
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/terragrunt-toolchain"
          mkdir -p "$bin"
          # $GITHUB_PATH only reaches LATER steps, so this step has to put the
          # directory on its own PATH too or the verification below cannot see what
          # it just installed.
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"

          if [[ ! -x "$bin/tofu" ]]; then
            base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
            archive="tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "$base/$archive"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/tofu.sums" "$base/tofu_${TOFU_VERSION}_SHA256SUMS"
            (cd "$RUNNER_TEMP" && grep " $archive\$" tofu.sums | sha256sum -c -)
            tar -xzf "$RUNNER_TEMP/$archive" -C "$bin" tofu
          fi

          if [[ ! -x "$bin/terragrunt" ]]; then
            base="https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/terragrunt_linux_amd64" "$base/terragrunt_linux_amd64"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/tg.sums" "$base/SHA256SUMS"
            (cd "$RUNNER_TEMP" && grep " terragrunt_linux_amd64\$" tg.sums | sha256sum -c -)
            install -m 755 "$RUNNER_TEMP/terragrunt_linux_amd64" "$bin/terragrunt"
          fi

          terragrunt --version
          tofu version

      # Are the OCI credentials configured at all? Every leaf's provider block reads
      # them from the environment (terraform/root.hcl), so without them terragrunt
      # fails at provider init on EVERY stack — which, since this workflow is a
      # required check, would block every pull request that touches terraform/**
      # rather than just reporting that it could not plan.
      #
      # Skipping loudly is the right failure mode for a missing SETTING, as opposed
      # to a missing plan. A broken plan should fail; an unconfigured pipeline should
      # say so and get out of the way.
      - name: Check for OCI credentials
        id: creds
        shell: bash
        run: |
          if [[ -n "${{ secrets.OCI_PRIVATE_KEY }}" && -n "$OCI_TENANCY_OCID" \
                && -n "$OCI_USER_OCID" && -n "$OCI_FINGERPRINT" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Terragrunt plan skipped"
              echo
              echo 'The OCI credentials are not configured for this repository, so no'
              echo 'stack can reach its provider. Add these four repository secrets to'
              echo 'enable planning:'
              echo
              echo '- `OCI_TENANCY_OCID`, `OCI_USER_OCID`, `OCI_FINGERPRINT`, `OCI_PRIVATE_KEY`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write the OCI private key
        if: steps.creds.outputs.present == 'true'
        shell: bash
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci_api_key.pem"
          echo "OCI_PRIVATE_KEY_PATH=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"

      - name: Plan
        id: plan
        if: steps.creds.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          bash scripts/terragrunt-pipeline.sh plan "${{ matrix.stack }}" "$RUNNER_TEMP/out"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          status=failed; [[ -f "$RUNNER_TEMP/out/status" ]] && status=$(<"$RUNNER_TEMP/out/status")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf '## `%s`\n\nStatus: `%s`\n' "${{ matrix.stack }}" "$status" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish plan to the pull request
        if: steps.creds.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- terragrunt-plan-${{ matrix.id }} -->"
          # Redaction is applied before anything reaches a PR comment — this repo
          # is public and plan output echoes variable values.
          if [[ -f "$RUNNER_TEMP/out/plan.txt" ]]; then
            text=$(bash scripts/terragrunt-pipeline.sh redact "$RUNNER_TEMP/out/plan.txt" | tail -c 58000)
          else
            text='No plan output was produced; see the workflow logs.'
          fi
          body=$(printf '%s\n## Terragrunt plan: `%s`\n\nStatus: **%s**. Sensitive-looking lines are redacted.\n\n```text\n%s\n```\n' \
            "$marker" "${{ matrix.stack }}" "${{ steps.plan.outputs.status }}" "$text")
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
            | jq -r --arg m "$marker" '.[] | select(.body | contains($m)) | .id' | tail -n1)
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" -f body="$body" >/dev/null
          fi

      - name: Fail on planning error
        if: steps.creds.outputs.present == 'true' && steps.plan.outputs.exit_code != '0'
        run: exit 1

  apply:
    needs: [discover, plan]
    # Applies run only from main, only when every plan succeeded, and only inside
    # a protected environment — which is where the human approval lives. The
    # appendix's bespoke "was this PR approved" job is not reimplemented: GitHub
    # environments already do that, and hand-rolled approval checks are easy to
    # get subtly wrong.
    #
    # `needs.plan.result == 'success'` is NOT enough on its own: when the OCI
    # credentials are absent the plan job skips every step and still reports
    # success, so apply used to run behind a plan that never happened -- the one
    # thing the protected environment and the human approval exist to prevent.
    # `planned` is the plan job saying it really planned.
    if: >-
      github.event_name == 'push' && needs.discover.outputs.has_stacks == 'true'
      && needs.plan.result == 'success' && needs.plan.outputs.planned == 'true'
    runs-on: firefly-amd64
    environment: all/deploy
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image is expected to carry these, and does not: every apply since
      # this pipeline landed has died on `terragrunt: command not found` (exit 127) --
      # run 33958691272 on the Cloudflare leaf, run 34212061664 on an AWS one. The
      # `command -v` guard makes this a no-op the moment the `firefly-amd64` image
      # does ship them, so fixing the image later needs no change here.
      #
      # Checksummed, because an unverified binary fetched over the network is handed
      # every credential this job has.
      - name: Install the terragrunt toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          # $GITHUB_PATH only reaches LATER steps, so this step has to put the
          # directory on its own PATH too or the verification below cannot see what
          # it just installed.
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          if ! command -v tofu >/dev/null 2>&1; then
            base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
            archive="tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "$base/$archive"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/tofu.sums" "$base/tofu_${TOFU_VERSION}_SHA256SUMS"
            (cd "$RUNNER_TEMP" && grep " $archive\$" tofu.sums | sha256sum -c -)
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" tofu
          fi

          if ! command -v terragrunt >/dev/null 2>&1; then
            base="https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/terragrunt" "$base/terragrunt_linux_amd64"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/tg.sums" "$base/SHA256SUMS"
            (cd "$RUNNER_TEMP/bin" && grep " terragrunt_linux_amd64\$" "$RUNNER_TEMP/tg.sums" \
              | sed 's/terragrunt_linux_amd64/terragrunt/' | sha256sum -c -)
            chmod +x "$RUNNER_TEMP/bin/terragrunt"
          fi

          terragrunt --version
          tofu version

      - name: Write the OCI private key
        shell: bash
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci_api_key.pem"
          echo "OCI_PRIVATE_KEY_PATH=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"

      - name: Replan and apply the reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/terragrunt-pipeline.sh apply "${{ matrix.stack }}" "$RUNNER_TEMP/out"
          printf '## apply `%s`\n\nStatus: `%s`\n' "${{ matrix.stack }}" "$(<"$RUNNER_TEMP/out/status")" >> "$GITHUB_STEP_SUMMARY"
