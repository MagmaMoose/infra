  # Monthly spend backstop. autoplan enabled, matching its firefly siblings: Atlantis already
  # carries this tenancy's OCI credentials, and the leaf's one parse-time `run_cmd "oci"` vault
  # fetch is the same call ../network makes on every autoplan.
