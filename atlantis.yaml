    workspace: default
    terraform_version: v1.11.3
    workflow: terragrunt
    autoplan:
      when_modified: ["**/*.tf", "**/*.tfvars", "**/*.hcl"]
      enabled: false
    apply_requirements: [mergeable]

  - name: oci-cloudworkers-prod-eu-amsterdam-1-edge
    dir: terraform/oci/cloudworkers/prod/eu-amsterdam-1/edge
    workspace: default
    terraform_version: v1.11.3
    workflow: terragrunt
    autoplan:
      when_modified: ["**/*.tf", "**/*.tfvars", "**/*.hcl"]
      enabled: false
    apply_requirements: [mergeable]

  - name: oci-cloudworkers-prod-eu-amsterdam-1-vpn
    dir: terraform/oci/cloudworkers/prod/eu-amsterdam-1/vpn
    workspace: default
    terraform_version: v1.11.3
    workflow: terragrunt
    autoplan:
      when_modified: ["**/*.tf", "**/*.tfvars", "**/*.hcl"]
      enabled: false
    apply_requirements: [mergeable]

  - name: oci-cloudworkers-prod-eu-amsterdam-1-server
    dir: terraform/oci/cloudworkers/prod/eu-amsterdam-1/server
    workspace: default
    terraform_version: v1.11.3
