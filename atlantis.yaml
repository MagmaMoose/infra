  # Monthly spend backstop. autoplan disabled for the same reason as the four above: it asserts
  # OCI_CW_TENANCY_OCID / OCI_CW_COMPARTMENT_OCID with regex() at parse time and Atlantis has
  # no OCI_CW_* at all, so an autoplan hard-fails. It also does a parse-time `run_cmd "oci"`
  # vault fetch for the alert recipient.
  - name: oci-cloudworkers-prod-eu-amsterdam-1-budget
    dir: terraform/oci/cloudworkers/prod/eu-amsterdam-1/budget
    workspace: default
